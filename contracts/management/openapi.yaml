# Canonical editable management wire contract. Regenerate Go and TS models after changes.
openapi: 3.0.3
info:
  title: UAP Management API
  version: 1.0.0
  description: One process captures one immutable host context. All endpoints require the private bootstrap
    bearer capability and the exact bootstrap Origin. Arrays in responses are never null. Prepared authority
    and installation effects remain in Go; DTOs are diagnostic. New optional response fields may be added
    within v1.
security:
- sessionCapability: []
paths:
  /api/v1/session:
    get:
      operationId: getSession
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/catalog:
    get:
      operationId: getCatalog
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: query
        in: query
        schema:
          type: string
          maxLength: 256
  /api/v1/catalog/{id}:
    get:
      operationId: getCatalogEntry
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntry'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 256
          minLength: 1
  /api/v1/skills/catalog:
    post:
      operationId: discoverSkills
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillCatalog'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceRequest'
  /api/v1/environment:
    get:
      operationId: getEnvironment
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/plans:
    post:
      operationId: preparePlan
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequest'
  /api/v1/plans/{id}/apply:
    post:
      operationId: applyPlan
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 256
          minLength: 1
      description: Accept the retained plan. Deduplicate a previously accepted request before checking
        whether its plan still exists. Same request and plan return its existing operation; different
        input conflicts.
  /api/v1/operations/{id}:
    get:
      operationId: getOperation
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 256
          minLength: 1
  /api/v1/operations/{id}/cancel:
    post:
      operationId: cancelOperation
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 256
          minLength: 1
      description: Request cooperative cancellation. Completion may win the race. This does not promise
        rollback; observe the returned operation and poll for its terminal outcome.
  /api/v1/skills/catalog/{catalogId}/candidates/{candidateId}/preview:
    get:
      operationId: getSkillPreview
      parameters:
      - name: catalogId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: candidateId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      responses:
        '200':
          description: Read-only preview of a retained Skill candidate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillPreview'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCapability:
      type: http
      scheme: bearer
      description: Private 256-bit capability from the stdout bootstrap. Never put in URLs, command arguments,
        renderer state or logs.
  responses:
    Error:
      description: Request refused or observation failed. No assumption about effects of an earlier accepted
        request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
  schemas:
    ProtocolVersion:
      type: integer
      enum:
      - 1
    ChangeAction:
      type: string
      enum:
      - install
      - install_skills
      - update
      - sync
      - repair
      - remove
      - recover
    Scope:
      type: string
      enum:
      - user
      - project
      - local
    StartupTarget:
      type: object
      additionalProperties: false
      required:
      - id
      - client
      - configRoot
      properties:
        id:
          type: string
          maxLength: 256
          minLength: 1
        client:
          type: string
          maxLength: 128
          minLength: 1
        configRoot:
          type: string
          maxLength: 4096
          minLength: 1
        executable:
          type: string
          maxLength: 4096
          x-go-type-skip-optional-pointer: true
    Startup:
      type: object
      additionalProperties: false
      required:
      - stateRoot
      - dependenciesRoot
      - scope
      - targets
      properties:
        contextId:
          type: string
          maxLength: 256
          minLength: 1
          x-go-type-skip-optional-pointer: true
          description: Optional host label. The authoritative contextId returned by the engine is derived
            from captured roots and targets, not from this label.
        stateRoot:
          type: string
          maxLength: 4096
          minLength: 1
        dependenciesRoot:
          type: string
          maxLength: 4096
          minLength: 1
        scope:
          $ref: '#/components/schemas/Scope'
        projectRoot:
          type: string
          maxLength: 4096
          x-go-type-skip-optional-pointer: true
        targets:
          type: array
          items:
            $ref: '#/components/schemas/StartupTarget'
          minItems: 1
          maxItems: 128
      description: Trusted host configuration, sent as one bounded JSON line on stdin before bootstrap.
        Roots and executable paths are absolute. Targets are captured for this process; one target per
        client in v1. Unsupported scopes fail explicitly. This is not an HTTP request.
    Bootstrap:
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - url
      - origin
      - token
      - engineVersion
      - contextId
      properties:
        apiVersion:
          $ref: '#/components/schemas/ProtocolVersion'
        url:
          type: string
          maxLength: 256
        origin:
          type: string
          maxLength: 256
        token:
          type: string
          maxLength: 128
          minLength: 32
        engineVersion:
          type: string
          maxLength: 128
          minLength: 1
        contextId:
          type: string
          maxLength: 256
          minLength: 1
      description: Exactly one private JSON line on stdout. URL and Origin are the same IPv4 loopback
        origin with an ephemeral port. No token in the URL. The owning host keeps stdin open; EOF requests
        graceful shutdown. Never forward this document to a renderer or logs.
    Capability:
      type: object
      additionalProperties: false
      required:
      - action
      - supported
      properties:
        action:
          type: string
          maxLength: 128
          minLength: 1
        supported:
          type: boolean
        reason:
          type: string
          maxLength: 4096
          x-go-type-skip-optional-pointer: true
    Target:
      type: object
      additionalProperties: false
      required:
      - id
      - client
      - label
      - scope
      - displayPath
      - available
      properties:
        id:
          type: string
          maxLength: 256
          minLength: 1
        client:
          type: string
          maxLength: 128
        label:
          type: string
          maxLength: 256
        scope:
          $ref: '#/components/schemas/Scope'
        displayPath:
          type: string
          maxLength: 4096
        available:
          type: boolean
        reason:
          type: string
          maxLength: 4096
          x-go-type-skip-optional-pointer: true
    Session:
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - engineVersion
      - contextId
      - scope
      - targets
      - capabilities
      properties:
        apiVersion:
          $ref: '#/components/schemas/ProtocolVersion'
        engineVersion:
          type: string
          maxLength: 128
        contextId:
          type: string
          maxLength: 256
          minLength: 1
        scope:
          $ref: '#/components/schemas/Scope'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Target'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
    Diagnostic:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - severity
      properties:
        code:
          type: string
          maxLength: 128
        message:
          type: string
          maxLength: 4096
        severity:
          type: string
          enum:
          - info
          - warning
          - error
        alias:
          type: string
          maxLength: 256
          x-go-type-skip-optional-pointer: true
        targetId:
          type: string
          maxLength: 256
          minLength: 1
          x-go-type-skip-optional-pointer: true
    CatalogEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - kind
      - source
      - targets
      - available
      properties:
        id:
          type: string
          maxLength: 256
          minLength: 1
        name:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 4096
        kind:
          type: string
          enum:
          - plugin
          - skill
        source:
          type: string
          maxLength: 2048
        version:
          type: string
          maxLength: 256
          x-go-type-skip-optional-pointer: true
        distributionId:
          type: string
          maxLength: 256
          x-go-type-skip-optional-pointer: true
        targets:
          type: array
          items:
            type: string
            maxLength: 128
        available:
          type: boolean
        reason:
          type: string
          maxLength: 4096
          x-go-type-skip-optional-pointer: true
        readmeMarkdown:
          type: string
          maxLength: 1048576
          x-go-type-skip-optional-pointer: true
        homepage:
          type: string
          maxLength: 2048
          x-go-type-skip-optional-pointer: true
    Catalog:
      type: object
      additionalProperties: false
      required:
      - items
      - freshness
      - diagnostics
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEntry'
        freshness:
          type: string
          enum:
          - current
          - cached
          - unavailable
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
      description: Verified directory results; unavailable freshness is never reported as current. Policy
        refusals stay attached to entries.
    SourceRequest:
      type: object
      additionalProperties: false
      required:
      - source
      properties:
        source:
          type: string
          maxLength: 2048
          minLength: 1
        ref:
          type: string
          maxLength: 256
          x-go-type-skip-optional-pointer: true
        path:
          type: string
          maxLength: 4096
          x-go-type-skip-optional-pointer: true
      description: A supported source reference, optional revision and relative Skill scope. No arbitrary
        command execution.
    SkillCandidate:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - path
      - available
      properties:
        id:
          type: string
          maxLength: 256
          minLength: 1
        name:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 4096
        path:
          type: string
          maxLength: 4096
        available:
          type: boolean
        reason:
          type: string
          maxLength: 4096
          x-go-type-skip-optional-pointer: true
    SkillCatalog:
      type: object
      additionalProperties: false
      required:
      - catalogId
      - source
      - candidates
      - diagnostics
      properties:
        catalogId:
          type: string
          maxLength: 256
          minLength: 1
        source:
          type: string
          maxLength: 2048
        sourceRevision:
          type: string
          maxLength: 256
          x-go-type-skip-optional-pointer: true
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/SkillCandidate'
          maxItems: 2000
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
    Readiness:
      type: object
      additionalProperties: false
      required:
      - materialization
      - activation
      - authentication
      - policy
      - verification
      properties:
        materialization:
          type: string
          maxLength: 128
        activation:
          type: string
          maxLength: 128
        authentication:
          type: string
          maxLength: 128
        policy:
          type: string
          maxLength: 128
        verification:
          type: string
          maxLength: 128
    Binding:
      type: object
      additionalProperties: false
      required:
      - targetId
      - client
      - scope
      - status
      - managedPaths
      properties:
        targetId:
          type: string
          maxLength: 256
          minLength: 1
        client:
          type: string
          maxLength: 128
        scope:
          $ref: '#/components/schemas/Scope'
        status:
          type: string
          maxLength: 128
        managedPaths:
          type: array
          items:
            type: string
            maxLength: 4096
        readiness:
          $ref: '#/components/schemas/Readiness'
      description: Managed paths come from authoritative installer ownership inspection. Hosts must not
        infer ownership from a directory name.
    EnvironmentEntry:
      type: object
      additionalProperties: false
      required:
      - alias
      - kind
      - source
      - updateStatus
      - bindings
      properties:
        alias:
          type: string
          maxLength: 256
        kind:
          type: string
          enum:
          - plugin
          - skill
        source:
          type: string
          maxLength: 2048
        version:
          type: string
          maxLength: 256
          x-go-type-skip-optional-pointer: true
        updateStatus:
          type: string
          enum:
          - current
          - available
          - pinned
          - blocked
          - check_unavailable
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/Binding'
    Environment:
      type: object
      additionalProperties: false
      required:
      - contextId
      - entries
      - diagnostics
      properties:
        contextId:
          type: string
          maxLength: 256
          minLength: 1
        entries:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentEntry'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        pendingOperations:
          type: array
          description: Unresolved accepted work from the durable ledger, including interrupted or partially
            failed work after restart; completed and explicitly reconciled history is omitted.
          items:
            $ref: '#/components/schemas/Operation'
          x-go-type-skip-optional-pointer: true
    ChangeRequest:
      type: object
      additionalProperties: false
      required:
      - action
      properties:
        action:
          $ref: '#/components/schemas/ChangeAction'
        source:
          type: string
          maxLength: 2048
          x-go-type-skip-optional-pointer: true
        ref:
          type: string
          maxLength: 256
          x-go-type-skip-optional-pointer: true
        alias:
          type: string
          maxLength: 256
          x-go-type-skip-optional-pointer: true
        aliases:
          type: array
          items:
            type: string
            maxLength: 256
          maxItems: 2000
          uniqueItems: true
          x-go-type-skip-optional-pointer: true
        all:
          type: boolean
          x-go-type-skip-optional-pointer: true
        targetIds:
          type: array
          items:
            type: string
            maxLength: 256
            minLength: 1
          maxItems: 128
          uniqueItems: true
          x-go-type-skip-optional-pointer: true
        catalogId:
          type: string
          maxLength: 256
          minLength: 1
          x-go-type-skip-optional-pointer: true
        candidateIds:
          type: array
          items:
            type: string
            maxLength: 256
            minLength: 1
          maxItems: 2000
          uniqueItems: true
          x-go-type-skip-optional-pointer: true
        operationId:
          type: string
          maxLength: 256
          minLength: 1
          x-go-type-skip-optional-pointer: true
        externalUninstalled:
          type: boolean
          x-go-type-skip-optional-pointer: true
      description: Typed intent; action-specific combinations are validated by Go. install uses source/alias;
        install_skills uses the retained catalogId and candidateIds; update uses aliases or all; sync
        restores locked intent; repair/remove select aliases; recover uses an interrupted operationId
        as a lookup hint, never as executable authority. targetIds refer only to captured startup targets.
        externalUninstalled is an explicit host attestation, never an SDK default. Preparation has no
        persistent installer effects.
    PlanAction:
      type: object
      additionalProperties: false
      required:
      - action
      - alias
      - targetId
      - description
      properties:
        action:
          type: string
          maxLength: 128
        alias:
          type: string
          maxLength: 256
        targetId:
          type: string
          maxLength: 256
          minLength: 1
        description:
          type: string
          maxLength: 4096
        destinationPath:
          type: string
          maxLength: 4096
          x-go-type-skip-optional-pointer: true
        fromVersion:
          type: string
          maxLength: 256
          x-go-type-skip-optional-pointer: true
        toVersion:
          type: string
          maxLength: 256
          x-go-type-skip-optional-pointer: true
    Plan:
      type: object
      additionalProperties: false
      required:
      - planId
      - contextId
      - expiresAt
      - action
      - confirmable
      - actions
      - warnings
      - conflicts
      properties:
        planId:
          type: string
          maxLength: 256
          minLength: 1
        contextId:
          type: string
          maxLength: 256
          minLength: 1
        expiresAt:
          type: string
          format: date-time
        action:
          $ref: '#/components/schemas/ChangeAction'
        confirmable:
          type: boolean
        actions:
          type: array
          items:
            $ref: '#/components/schemas/PlanAction'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
      description: Diagnostic review of a retained Go prepared object. Cannot be replayed as authority.
        An unaccepted handle expires and is invalid after restart. Apply rechecks current facts.
    ApplyRequest:
      type: object
      additionalProperties: false
      required:
      - requestId
      properties:
        requestId:
          type: string
          maxLength: 128
          minLength: 16
          pattern: ^[A-Za-z0-9_-]+$
      description: Caller-generated stable ID, e.g. a UUID. Retain it before apply. Repeat the same accepted
        request to recover a lost response; never generate another ID automatically. Deduplication precedes
        plan lookup/expiry checks. Different accepted input conflicts.
    NextAction:
      type: object
      additionalProperties: false
      required:
      - kind
      - reason
      properties:
        kind:
          type: string
          maxLength: 128
        reason:
          type: string
          maxLength: 4096
        targetId:
          type: string
          maxLength: 256
          minLength: 1
          x-go-type-skip-optional-pointer: true
        alias:
          type: string
          maxLength: 256
          x-go-type-skip-optional-pointer: true
    OperationItem:
      type: object
      additionalProperties: false
      required:
      - alias
      - targetId
      - status
      properties:
        alias:
          type: string
          maxLength: 256
        targetId:
          type: string
          maxLength: 256
          minLength: 1
        status:
          type: string
          maxLength: 128
        message:
          type: string
          maxLength: 4096
          x-go-type-skip-optional-pointer: true
        destinationPath:
          type: string
          maxLength: 4096
          x-go-type-skip-optional-pointer: true
    OperationResult:
      type: object
      additionalProperties: false
      required:
      - outcome
      - mutated
      - items
      - nextActions
      - message
      properties:
        outcome:
          type: string
          maxLength: 128
        mutated:
          type: boolean
        dataRetained:
          type: boolean
          x-go-type-skip-optional-pointer: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationItem'
        nextActions:
          type: array
          items:
            $ref: '#/components/schemas/NextAction'
        message:
          type: string
          maxLength: 4096
      description: Authoritative result when effects are known. An interrupted operation with uncertain
        effects omits result until inspected; mutated=false must never stand for unknown. Partial outcomes
        do not imply global rollback.
    Progress:
      type: object
      additionalProperties: false
      required:
      - phase
      - message
      - completed
      - total
      properties:
        phase:
          type: string
          maxLength: 128
        message:
          type: string
          maxLength: 4096
        completed:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationItem'
          x-go-type-skip-optional-pointer: true
    OperationState:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - partial
      - failed
      - cancelled
      - interrupted
    Operation:
      type: object
      additionalProperties: false
      required:
      - operationId
      - planId
      - requestId
      - contextId
      - state
      - phase
      - completed
      - total
      - items
      - diagnostics
      - createdAt
      - updatedAt
      properties:
        operationId:
          type: string
          maxLength: 256
          minLength: 1
        planId:
          type: string
          maxLength: 256
          minLength: 1
        requestId:
          type: string
          maxLength: 256
          minLength: 1
        contextId:
          type: string
          maxLength: 256
          minLength: 1
        state:
          $ref: '#/components/schemas/OperationState'
        phase:
          type: string
          maxLength: 128
        completed:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationItem'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/OperationResult'
        resolvedBy:
          type: string
          maxLength: 256
          x-go-type-skip-optional-pointer: true
          description: Operation ID of a later completed recovery that reconciles this historical unresolved
            operation. Its original outcome is not rewritten.
      description: Authoritative operation snapshot. Accepted work outlives its HTTP request. Waiting
        cancellation does not cancel effects. interrupted requires fresh inspection/recovery, not automatic
        replay. Records are retained at least 30 days; a full retained-record budget refuses new work
        rather than dropping live identity.
    APIError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - retryable
      properties:
        code:
          type: string
          maxLength: 128
        message:
          type: string
          maxLength: 4096
        retryable:
          type: boolean
      description: Structured failure before acceptance or while observing. retryable never authorizes
        generating a fresh ID for an uncertain mutation.
    SkillPreview:
      type: object
      additionalProperties: false
      required:
      - catalogId
      - candidateId
      - markdown
      - diagnostics
      properties:
        catalogId:
          type: string
          minLength: 1
          maxLength: 256
        candidateId:
          type: string
