components:
  securitySchemes:
    sessionCapability:
      type: http
      scheme: bearer
      description: 256-bit session capability supplied by the CLI in the initial URL
        fragment; never put it in an API URL.
  schemas:
    Source:
      type: object
      additionalProperties: false
      required:
      - repository
      - scope
      properties:
        repository:
          type: string
          maxLength: 2048
        sourceRevision:
          type: string
          maxLength: 64
        scope: &id003
          type: string
          maxLength: 4096
    ScanProgress:
      type: object
      additionalProperties: false
      required:
      - discovered
      - validated
      - bytes
      properties:
        discovered: &id002
          type: integer
          minimum: 0
        validated: *id002
        bytes: *id002
    Session:
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - sessionId
      - state
      - source
      - scan
      - expiresAt
      properties:
        apiVersion:
          type: integer
          enum:
          - 1
        sessionId: *id001
        state:
          type: string
          enum:
          - resolving
          - scanning
          - ready
          - installing
          - done
          - failed
        source:
          $ref: '#/components/schemas/Source'
        scan:
          $ref: '#/components/schemas/ScanProgress'
        catalogId: *id001
        operationId: *id001
        expiresAt:
          type: string
          format: date-time
    Diagnostic:
      type: object
      additionalProperties: false
      required:
      - code
      - severity
      - message
      properties:
        code:
          type: string
          maxLength: 128
        severity:
          type: string
          enum:
          - info
          - warning
          - error
        message:
          type: string
          maxLength: 4096
        path: *id003
        candidateId: *id001
        targetId: *id001
    Candidate:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - path
      - status
      - diagnosticCodes
      properties:
        id: *id001
        name:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 4096
        path: *id003
        status:
          type: string
          enum:
          - available
          - invalid
          - unavailable
        diagnosticCodes:
          type: array
          items:
            type: string
            maxLength: 128
    CatalogCounts:
      type: object
      additionalProperties: false
      required:
      - total
      - available
      - invalid
      - unavailable
      properties:
        total: *id002
        available: *id002
        invalid: *id002
        unavailable: *id002
    Catalog:
      type: object
      additionalProperties: false
      required:
      - catalogId
      - catalogDigest
      - repository
      - sourceRevision
      - scope
      - complete
      - counts
      - candidates
      - diagnostics
      properties:
        catalogId: *id001
        catalogDigest: *id001
        repository:
          type: string
          maxLength: 2048
        sourceRevision:
          type: string
          maxLength: 64
        scope: *id003
        complete:
          type: boolean
        counts:
          $ref: '#/components/schemas/CatalogCounts'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
          maxItems: 2000
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
    ScanRequest:
      type: object
      additionalProperties: false
      required:
      - scopePath
      properties:
        scopePath: *id003
    Resource:
      type: object
      additionalProperties: false
      required:
      - path
      - executable
      properties:
        path: *id003
        size:
          type: integer
          minimum: 0
          description: Known resource size in bytes. Omitted when the blob is not cached; preview does not download resource bodies to determine their sizes.
        executable:
          type: boolean
    Preview:
      type: object
      additionalProperties: false
      required:
      - catalogId
      - candidateId
      - path
      - content
      - format
      - truncated
      - resources
      - diagnostics
      properties:
        catalogId: *id001
        candidateId: *id001
        path: *id003
        content:
          type: string
          maxLength: 1048576
        format:
          type: string
          enum:
          - markdown
          - text
        truncated:
          type: boolean
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        rawContent:
          type: string
          maxLength: 1048576
          description: Exact original SKILL.md for the raw view. content is the parsed
            Markdown body.
    Target:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - scope
      - displayPath
      - available
      properties:
        id: *id001
        label:
          type: string
          maxLength: 256
        scope:
          type: string
          maxLength: 256
        displayPath: *id003
        available:
          type: boolean
        reason:
          type: string
          maxLength: 4096
    Targets:
      type: object
      additionalProperties: false
      required:
      - targets
      properties:
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Target'
    PlanRequest:
      type: object
      additionalProperties: false
      required:
      - catalogId
      - catalogDigest
      - selectedIds
      - targetIds
      properties:
        catalogId: *id001
        catalogDigest: *id001
        selectedIds:
          type: array
          items: *id001
          minItems: 1
          maxItems: 2000
          uniqueItems: true
        targetIds:
          type: array
          items: *id001
          minItems: 1
          maxItems: 128
          uniqueItems: true
    SourceMoved:
      type: object
      additionalProperties: false
      required:
      - from
      - to
      properties:
        from: *id003
        to: *id003
    Action:
      type: object
      additionalProperties: false
      required:
      - candidateId
      - targetId
      - alias
      - action
      - destinationPath
      - reasonCodes
      properties:
        candidateId: *id001
        targetId: *id001
        alias:
          type: string
          maxLength: 256
        action:
          type: string
          enum:
          - install
          - update
          - unchanged
        destinationPath: *id003
        sourceMoved:
          $ref: '#/components/schemas/SourceMoved'
        reasonCodes:
          type: array
          items:
            type: string
            maxLength: 128
    Plan:
      type: object
      additionalProperties: false
      required:
      - planId
      - expiresAt
      - actions
      - conflicts
      - warnings
      - confirmable
      properties:
        planId: *id001
        expiresAt:
          type: string
          format: date-time
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        confirmable:
          type: boolean
    ApplyResponse:
      type: object
      additionalProperties: false
      required:
      - operationId
      properties:
        operationId: *id001
    OperationItem:
      type: object
      additionalProperties: false
      required:
      - candidateId
      - targetId
      - status
      properties:
        candidateId: *id001
        targetId: *id001
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - unchanged
          - failed
          - skipped
        alias:
          type: string
          maxLength: 256
        destinationPath: *id003
        message:
          type: string
          maxLength: 4096
    OperationResult:
      type: object
      additionalProperties: false
      required:
      - message
      - repairInstructions
      properties:
        message:
          type: string
          maxLength: 4096
        repairInstructions:
          type: array
          items:
            type: string
            maxLength: 4096
    Operation:
      type: object
      additionalProperties: false
      required:
      - operationId
      - planId
      - state
      - phase
      - completed
      - total
      - items
      - diagnostics
      properties:
        operationId: *id001
        planId: *id001
        state:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - partial
        phase:
          type: string
          maxLength: 128
        completed: *id002
        total: *id002
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationItem'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        result:
          $ref: '#/components/schemas/OperationResult'
    APIError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - retryable
      properties:
        code:
          type: string
          maxLength: 128
        message:
          type: string
          maxLength: 4096
        retryable:
          type: boolean
