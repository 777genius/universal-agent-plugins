name: Published npm public cold bootstrap and lifecycle (six OS)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/agentplugins-published-platform-acceptance.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Exact publicly published stable npm version
        type: string
        required: true
        default: '0.1.102'
      commit:
        description: Exact 40-character immutable release source commit
        type: string
        required: true
        default: '1717381d88cea9eef2cbf3ecf481dbe37188cde2'

permissions:
  contents: read

concurrency:
  group: published-public-platform-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-bootstrap:
    # Forks cannot enlarge the public binary-download test budget.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Public npm bootstrap + lifecycle (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-amd64, runner: ubuntu-24.04}
          - {target: linux-arm64, runner: ubuntu-24.04-arm}
          - {target: windows-amd64, runner: windows-2025}
          - {target: windows-arm64, runner: windows-11-arm}
          - {target: darwin-amd64, runner: macos-15-intel}
          - {target: darwin-arm64, runner: macos-15}
    env:
      UAP_VERSION: ${{ inputs.version || '0.1.102' }}
      UAP_COMMIT: ${{ inputs.commit || '1717381d88cea9eef2cbf3ecf481dbe37188cde2' }}
      UAP_TARGET: ${{ matrix.target }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Check out exact immutable release proof harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.UAP_COMMIT }}
          path: release-source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.1'
          package-manager-cache: false
      - name: Cold-fetch published npm tarball and real public GitHub binary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UAP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$UAP_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C release-source rev-parse HEAD)" = "$UAP_COMMIT"
          test "$(npm view "universal-agent-plugins@$UAP_VERSION" version)" = "$UAP_VERSION"
          archive="$(npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP" "universal-agent-plugins@$UAP_VERSION")"
          test -n "$archive"
          # No frozen local binary, internal proof flag, auth token, model key,
          # or fabricated client runtime: the npm shim must fetch the public
          # GitHub release asset and verify its signed-in-manifest SHA-256.
          node release-source/npm/agentplugins/scripts/platform-proof.js \
            "$RUNNER_TEMP/$archive" "$UAP_VERSION" "$UAP_TARGET" true \
            "$RUNNER_TEMP/public-platform-$UAP_TARGET.json" "$UAP_COMMIT" \
            public_release_download -
      - name: Cross-OS cache tampering, retry, lock and cancellation regressions
        shell: bash
        run: |
          set -euo pipefail
          pattern='cold, warm, corrupted|published immutable npm binary retries|npm binary gateway retry obeys cancellation|lock roots are isolated|lock root rejects symlinks|a non-regular binary cache target is preserved|canonical verifier retries transient gateway|canonical verifier exhausts transient|pre-response timeout|timeout after response|request-side error mimicking a gateway'
          if [[ "$RUNNER_OS" == Windows ]]; then
            # Frozen Linux-mode test asserts POSIX 0700 under NTFS; on Windows
            # prove actual native per-user LOCALAPPDATA separation instead.
            pattern="${pattern/lock roots are isolated|/}"
          fi
          node --test --test-reporter=tap \
            --test-name-pattern="$pattern" \
            release-source/npm/agentplugins/test/bootstrap.test.js \
            release-source/npm/agentplugins/test/verifier.test.js \
            | tee "$RUNNER_TEMP/public-platform-$UAP_TARGET-security.tap"
      - name: Verify actual Windows two-profile cache lock isolation
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs/promises');
          const os = require('node:os');
          const path = require('node:path');
          const { acquireLock } = require('./release-source/npm/agentplugins/lib/bootstrap');
          
          async function check() {
            assert.equal(process.platform, 'win32', 'real Windows runner required');
            const base = await fs.mkdtemp(path.join(os.tmpdir(), 'uap-win-lock-users-'));
            const a = path.join(base, 'user-a');
            const b = path.join(base, 'user-b');
            const target = path.join(base, 'same-binary-target');
            const hash = crypto.createHash('sha256').update(target).digest('hex') + '.lock';
            const lockPath = local => path.join(local, 'agentplugins', 'Cache', '.locks', hash);
            const sentinel = path.join(base, 'foreign-neighbor.txt');
            let releaseA, releaseB;
            try {
              await fs.writeFile(sentinel, 'foreign content must survive\n');
              releaseA = await acquireLock(target, {
                environment: { LOCALAPPDATA: a }, platform: 'win32', home: a, timeoutMs: 2500
              });
              releaseB = await acquireLock(target, {
                environment: { LOCALAPPDATA: b }, platform: 'win32', home: b, timeoutMs: 2500
              });
              assert.notEqual(lockPath(a), lockPath(b));
              assert.equal((await fs.lstat(lockPath(a))).isFile(), true);
              assert.equal((await fs.lstat(lockPath(b))).isFile(), true);
              const other = await fs.readFile(lockPath(b), 'utf8');
              assert.match(other, /"nonce":"[a-f0-9]{32}"/);
              await releaseA(); releaseA = undefined;
              await assert.rejects(fs.lstat(lockPath(a)), { code: 'ENOENT' });
              assert.equal(await fs.readFile(lockPath(b), 'utf8'), other);
              await releaseB(); releaseB = undefined;
              await assert.rejects(fs.lstat(lockPath(b)), { code: 'ENOENT' });
              assert.equal(await fs.readFile(sentinel, 'utf8'), 'foreign content must survive\n');
              const receipt = {
                schema_version: 1, platform: process.platform, target: process.env.UAP_TARGET,
                release_version: process.env.UAP_VERSION, code_sha: process.env.UAP_COMMIT,
                actual_native_windows: true, isolated_local_app_data_roots: true,
                simultaneous_same_target_locks: true, releasing_one_does_not_steal_other: true,
                exact_lock_removal: true, unmanaged_sentinel_preserved: true
              };
              await fs.writeFile(path.join(process.env.RUNNER_TEMP,
                'public-platform-' + process.env.UAP_TARGET + '-winlock.json'),
                JSON.stringify(receipt, null, 2) + '\n');
              process.stdout.write('Windows two-user LOCALAPPDATA lock isolation PASS\n');
            } finally {
              if (releaseA) await releaseA();
              if (releaseB) await releaseB();
              await fs.rm(base, { recursive: true, force: true });
            }
          }
          check().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Retain original public-source evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: published-public-platform-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/public-platform-${{ matrix.target }}.json
            ${{ runner.temp }}/public-platform-${{ matrix.target }}-security.tap
            ${{ runner.temp }}/public-platform-${{ matrix.target }}-winlock.json
          if-no-files-found: warn
          retention-days: 14
