          packed = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(packed)
          result = packed.public_workflow('attest')
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.evidence.outputs.subjects }}
      - name: Re-admit original custody and compare every post-sign byte
        shell: python -I -B {0}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_SIGNED_ROOT: ${{ steps.evidence.outputs.root }}
        run: |
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('packed', 'scripts/check-packed-ci.py')
          packed = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(packed)
          checked = packed.public_workflow('attest')
          def closure(root):
              root = Path(root)
              result = {}
              for p in sorted(root.rglob('*')):
                  assert not p.is_symlink()
                  if p.is_file():
                      result[str(p.relative_to(root))] = packed.provision_bytes(p, 16 * 1024 * 1024)
                  else:
