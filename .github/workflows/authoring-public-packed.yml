          path: ${{ steps.evidence.outputs.root }}
          if-no-files-found: error
          retention-days: 7
  public_check:
    if: ${{ inputs.mode == 'check' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Bind canonical dispatch before checkout
        shell: python -I -B {0}
        run: |
          import json, os, re
          mode = os.environ['PUBLIC_MODE']
          names = {'selected': 'PUBLIC_SELECTED', 'input': 'PUBLIC_INPUT', 'stage': 'PUBLIC_STAGE', 'journeys': 'PUBLIC_JOURNEYS', 'bridge': 'PUBLIC_BRIDGE', 'assembly': 'PUBLIC_ASSEMBLY', 'acceptance': 'PUBLIC_ACCEPTANCE'}
          required = {'selected', 'input', 'stage'} | {'produce': set(), 'assemble': {'journeys', 'bridge'}, 'attest': {'assembly'}, 'check': {'assembly', 'acceptance'}}[mode]
          raw = {name: os.environ.get(env, '') for name, env in names.items()}
          assert all(bool(body) == (name in required) for name, body in raw.items())
          def unique(pairs):
              value = {}
              for key, item in pairs:
                  assert key not in value
                  value[key] = item
              return value
          def value(name):
              assert 0 < len(raw[name].encode()) <= 1024 * 1024
              parsed = json.loads(raw[name], object_pairs_hook=unique,
                  parse_constant=lambda token: (_ for _ in ()).throw(ValueError(token)))
              assert raw[name] == json.dumps(parsed, ensure_ascii=False, indent=2, separators=(',', ': ')) + '\n'
              return parsed
          def locator(v):
              assert set(v) == {'sha256', 'artifact'} and re.fullmatch('[0-9a-f]{64}', v['sha256'])
              a = v['artifact']; assert set(a) == {'run_id', 'run_attempt', 'artifact_id', 'artifact_sha256'} and re.fullmatch('[0-9a-f]{64}', a['artifact_sha256'])
              assert all(type(a[k]) is int and a[k] > 0 for k in ('run_id', 'run_attempt', 'artifact_id')) and a['run_attempt'] <= 1000
          s = value('selected'); locator(value('input')); locator(value('stage'))
          if mode == 'assemble':
              journeys = value('journeys'); cells = [f'{target}/{"kit" if node == 18 else "pair"}-node{node}' for target in ('linux-amd64', 'linux-arm64', 'darwin-amd64', 'darwin-arm64', 'windows-amd64', 'windows-arm64') for node in (18, 22, 24)]
              assert type(journeys) is list and len(journeys) == 18 and [journey.get('cell') for journey in journeys] == cells
              for journey in journeys: assert set(journey) == {'cell', 'sha256', 'artifact'}; locator({'sha256': journey['sha256'], 'artifact': journey['artifact']})
              locator(value('bridge'))
          if mode in ('attest', 'check'): locator(value('assembly'))
          if mode == 'check': locator(value('acceptance'))
          assert set(s) == {'tag', 'ref', 'source', 'versions'} and type(s['versions']) is dict
          assert set(s['versions']) == {'agentplugins', 'plugin-kit-ai'}
          assert all(type(version) is str and len(version) <= 32 and re.fullmatch('(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)', version) for version in s['versions'].values())
          assert s['versions']['plugin-kit-ai'] == '2.0.0' and s['versions']['agentplugins'] != s['versions']['plugin-kit-ai']
          assert os.environ['GITHUB_REPOSITORY'] == '777genius/universal-agent-plugins'
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert re.fullmatch('[0-9a-f]{40}', s['source']) and s['source'] != '0' * 40
          assert s['source'] == os.environ['GITHUB_SHA'] == os.environ['GITHUB_WORKFLOW_SHA']
          assert s['tag'] == 'agentplugins-v' + s['versions']['agentplugins']
          assert s['ref'] == 'refs/tags/' + s['tag'] == os.environ['GITHUB_REF']
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(inputs.selected).source }}
          persist-credentials: false
      - name: Independently bootstrap and admit read
        id: evidence
        shell: python -I -B {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import importlib.util, os
          spec = importlib.util.spec_from_file_location('packed', 'scripts/check-packed-ci.py')
          packed = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(packed)
          result = packed.public_workflow('read')
