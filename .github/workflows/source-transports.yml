name: Source transports

on:
  pull_request:
    paths:
      - 'install/integrationctl/agentplugins/**'
      - 'cli/internal/agentpluginscli/**'
      - 'go.work*'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/source-transports.yml'
  push:
    branches: [main, 'feat/source-transports-e2e']
    paths:
      - 'install/integrationctl/agentplugins/**'
      - 'cli/internal/agentpluginscli/**'
      - 'go.work*'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/source-transports.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-transports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ssh:
    name: native-ssh-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UAP_REQUIRE_NATIVE_SSH: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Require real OpenSSH tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo install -d -m 0755 /run/sshd
          for executable in sshd ssh ssh-keygen git jq; do
            command -v "$executable"
          done
      - name: Verify native Git SSH and host authentication
        working-directory: install/integrationctl/agentplugins
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout=3m -json ./adapters/sourceacquisition -run '^TestNativeSSHGitWithIsolatedKeysAndHostVerification$' | tee native-ssh.json
          jq -s -e 'any(.[]; .Action == "pass" and .Test == "TestNativeSSHGitWithIsolatedKeysAndHostVerification") and all(.[]; .Action != "skip")' native-ssh.json
      - name: Verify saved CLI SSH URL and SCP lifecycle
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout=3m -json ./internal/agentpluginscli -run '^TestDirectSourceSavedLifecycleRealSSH$' | tee cli-ssh.json
          jq -s -e 'any(.[]; .Action == "pass" and .Test == "TestDirectSourceSavedLifecycleRealSSH/ssh-url") and any(.[]; .Action == "pass" and .Test == "TestDirectSourceSavedLifecycleRealSSH/scp") and all(.[]; .Action != "skip")' cli-ssh.json
