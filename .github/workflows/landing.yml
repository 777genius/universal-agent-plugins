name: Landing

on:
  pull_request:
    paths:
      - "landing/**"
      - "website/**"
      - ".github/workflows/docs-pages.yml"
      - ".github/workflows/registry-compatibility-mirror.yml"
      - "cmd/agentplugins-registry-mirror/**"
      - ".github/workflows/landing.yml"
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "website/**"
      - ".github/workflows/docs-pages.yml"
      - ".github/workflows/registry-compatibility-mirror.yml"
      - "cmd/agentplugins-registry-mirror/**"
      - ".github/workflows/landing.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.13"
          cache: false

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          package_json_file: landing/package.json
          dest: ${{ runner.temp }}/pnpm-landing

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Verify and stage signed registry feeds
        run: |
          go run ./cmd/agentplugins-registry-mirror \
            --registry-repository 777genius/universal-agent-plugins-registry \
            --pages-origin https://777genius.github.io/universal-agent-plugins-registry/ \
            --output "${RUNNER_TEMP}/uap-registry-mirror"
          mkdir -p landing/public
          cp -a "${RUNNER_TEMP}/uap-registry-mirror/." landing/public/
          echo "UAP_VERIFIED_MIRROR=${RUNNER_TEMP}/uap-registry-mirror" >> "$GITHUB_ENV"

      - name: Install landing dependencies
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt tooling
        working-directory: landing
        run: |
          pnpm exec nuxt prepare
          pnpm exec vue-tsc --noEmit

      - name: Check registry, lint, and generate
        env:
          NUXT_APP_BASE_URL: /universal-agent-plugins/
          NUXT_PUBLIC_SITE_URL: https://777genius.github.io/universal-agent-plugins
        working-directory: landing
        run: |
          pnpm run test:registry
          pnpm run lint
          pnpm run check:i18n
          pnpm run generate

      - name: Stage the GitHub Pages base path
        working-directory: landing
        run: |
          mkdir -p .e2e-pages/universal-agent-plugins
          cp -a .output/public/. .e2e-pages/universal-agent-plugins/

      - name: Install browser
        working-directory: landing
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E
        env:
          UAP_E2E_REPOSITORY_BASE: universal-agent-plugins
          UAP_E2E_WEB_ROOT: .e2e-pages
        working-directory: landing
        run: pnpm run test:browser

  combined-pages-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        base: ["/", "/universal-agent-plugins/"]
    env:
      NUXT_APP_BASE_URL: ${{ matrix.base }}
      NUXT_PUBLIC_SITE_URL: https://777genius.github.io${{ matrix.base }}
      NUXT_PUBLIC_DOCS_URL: https://777genius.github.io${{ matrix.base }}docs/en/
      NUXT_PUBLIC_QUICKSTART_URL: https://777genius.github.io${{ matrix.base }}docs/en/guide/quickstart.html
      NUXT_PUBLIC_DOCS_SITEMAP_URL: https://777genius.github.io${{ matrix.base }}docs/sitemap.xml
      DOCS_BASE_PATH: ${{ matrix.base }}docs/
      DOCS_HOSTNAME: https://777genius.github.io
      GOTOOLCHAIN: local
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.13"
          cache: false

      # Keep docs on its own packageManager; landing uses a newer lockfile format.
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        id: pnpm-docs
        with:
          package_json_file: website/package.json
          dest: ${{ runner.temp }}/pnpm-docs

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          package_json_file: landing/package.json
          dest: ${{ runner.temp }}/pnpm-landing

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"

      - name: Verify and stage signed registry feeds
        run: |
          go run ./cmd/agentplugins-registry-mirror \
            --registry-repository 777genius/universal-agent-plugins-registry \
            --pages-origin https://777genius.github.io/universal-agent-plugins-registry/ \
            --output "${RUNNER_TEMP}/uap-registry-mirror"
          mkdir -p landing/public
          cp -a "${RUNNER_TEMP}/uap-registry-mirror/." landing/public/
          echo "UAP_VERIFIED_MIRROR=${RUNNER_TEMP}/uap-registry-mirror" >> "$GITHUB_ENV"

      - name: Install landing dependencies
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Install docs dependencies
        working-directory: website
        run: |
          export PATH="${{ steps.pnpm-docs.outputs.bin_dest }}:$PATH"
          pnpm install --frozen-lockfile

      - name: Install pinned docs generators
        run: |
          python -m venv "${RUNNER_TEMP}/docs-tools-root/python-venv"
          "${RUNNER_TEMP}/docs-tools-root/python-venv/bin/pip" install pydoc-markdown==4.8.2
          mkdir -p "${RUNNER_TEMP}/docs-tools-root/bin"
          GOBIN="${RUNNER_TEMP}/docs-tools-root/bin" go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v1.1.0

      - name: Prepare and validate landing
        working-directory: landing
        run: |
          pnpm exec nuxt prepare
          pnpm exec vue-tsc --noEmit
          pnpm run test:artifact
          pnpm run test:registry
          pnpm run lint
          pnpm run generate

      - name: Prepare immutable authoring source
        run: |
          source_sha=$(node --input-type=module -e 'import { acceptedAuthoringSHA } from "./website/tools/lib/source-contract.mjs"; process.stdout.write(acceptedAuthoringSHA)')
          git clone --no-local --no-checkout . "${RUNNER_TEMP}/docs-authoring-source"
          git -C "${RUNNER_TEMP}/docs-authoring-source" checkout --quiet --detach "$source_sha"
          chmod -R a-w "${RUNNER_TEMP}/docs-authoring-source"
          echo "DOCS_AUTHORING_CHECKOUT=${RUNNER_TEMP}/docs-authoring-source" >> "$GITHUB_ENV"

      - name: Warm Go module cache for offline docs consumer integration
        env:
          GOCACHE: ${{ runner.temp }}/docs-consumer-gocache
          GOMODCACHE: ${{ runner.temp }}/docs-consumer-gomodcache
        run: |
          cd "$DOCS_AUTHORING_CHECKOUT"
          GOWORK="$DOCS_AUTHORING_CHECKOUT/go.work" go build -p 2 -o "$RUNNER_TEMP/docs-authoring-preflight" ./cli/plugin-kit-ai/tools/authoring-docs

      - name: Validate and build public docs
        working-directory: website
        env:
          GOCACHE: ${{ runner.temp }}/docs-consumer-gocache
          GOMODCACHE: ${{ runner.temp }}/docs-consumer-gomodcache
          DOCS_TOOLS_ROOT: ${{ runner.temp }}/docs-tools-root
          DOCS_GOMARKDOC: ${{ runner.temp }}/docs-tools-root/bin/gomarkdoc
          TMPDIR: ${{ runner.temp }}
          GOWORK: ${{ github.workspace }}/go.work
          GOPROXY: "off"
          GOSUMDB: "off"
          GOENV: "off"
        run: |
          export PATH="${{ steps.pnpm-docs.outputs.bin_dest }}:$PATH"
          pnpm run docs:check

      - name: Assemble and validate exact final Pages artifact
        working-directory: landing
        run: pnpm run build:pages

      - name: Install browser
        working-directory: landing
        run: pnpm exec playwright install --with-deps chromium

      - name: Serve assembled artifact at deployment base
        run: |
          mkdir -p .combined-browser${{ matrix.base }}
          cp -a .pages-dist/. .combined-browser${{ matrix.base }}/

      - name: Representative final static integration
        working-directory: landing
        env:
          UAP_E2E_WEB_ROOT: ../.combined-browser
          UAP_E2E_REPOSITORY_BASE: ${{ matrix.base }}
        run: pnpm exec playwright test tests/browser/i18n-integration.spec.ts tests/browser/payload-scoping.spec.ts tests/browser/i18n-state.spec.ts tests/browser/locale-install-navigation.spec.ts tests/browser/release-base.spec.ts
