name: Landing

on:
  pull_request:
    paths:
      - "README.md"
      - "landing/**"
      - "website/**"
      - ".github/workflows/docs-pages.yml"
      - ".github/workflows/registry-compatibility-mirror.yml"
      - "cmd/agentplugins-registry-mirror/**"
      - ".github/workflows/landing.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "landing/**"
      - "website/**"
      - ".github/workflows/docs-pages.yml"
      - ".github/workflows/registry-compatibility-mirror.yml"
      - "cmd/agentplugins-registry-mirror/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # Full nightly browser matrix

# Replace ordinary CI for the same PR/ref; keep manual runs independent.
concurrency:
  group: landing-${{ github.event_name }}-${{ github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  test:
    # The release gate matches check names; keep this one distinct from Required / test.
    name: landing-test
    permissions:
      contents: read
      pull-requests: read
    runs-on: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:github-hosted') && 'ubuntu-latest' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    # Bound contention for the complete E2E matrix.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          package_json_file: landing/package.json
          dest: ${{ runner.temp }}/pnpm-landing

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Verify and stage signed registry feeds
        run: |
          go run ./cmd/agentplugins-registry-mirror \
            --registry-repository 777genius/universal-agent-plugins-registry \
            --pages-origin https://777genius.github.io/universal-agent-plugins-registry/ \
            --output "${RUNNER_TEMP}/uap-registry-mirror"
          mkdir -p landing/public
          cp -a "${RUNNER_TEMP}/uap-registry-mirror/." landing/public/
          echo "UAP_VERIFIED_MIRROR=${RUNNER_TEMP}/uap-registry-mirror" >> "$GITHUB_ENV"

      - name: Install landing dependencies
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for static social preview
        working-directory: landing
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Prepare Nuxt tooling
        working-directory: landing
        run: |
          pnpm exec nuxt prepare
          pnpm exec vue-tsc --noEmit

      - name: Check registry, lint, and generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUXT_APP_BASE_URL: /universal-agent-plugins/
          NUXT_PUBLIC_SITE_URL: https://777genius.github.io/universal-agent-plugins
        working-directory: landing
        run: |
          pnpm run test:registry
          pnpm run lint
          pnpm run check:i18n
          pnpm run generate

      - name: Preserve social preview for visual review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: social-preview-1200x630
          path: landing/public/og-image.png
          if-no-files-found: error
          retention-days: 7

      - name: Stage the GitHub Pages base path
        working-directory: landing
        run: |
          mkdir -p .e2e-pages/universal-agent-plugins
          cp -a .output/public/. .e2e-pages/universal-agent-plugins/

      # Docs-only PRs use an existing smoke subset; any unknown path fails open.
      - name: Select browser E2E coverage
        if: github.event_name == 'pull_request'
        id: browser-scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          mode=full
          if [[ "$PR_CHANGED_FILES" =~ ^[0-9]+$ ]] && (( PR_CHANGED_FILES < 3000 )); then
            if paths="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[] | (.filename, (.previous_filename // empty)) | gsub("\n"; "\u0001")')"; then
              if [[ -n "$paths" && "$paths" != *$'\001'* ]]; then
                mode=smoke
                while IFS= read -r path; do
                  # Git allows control bytes in filenames; treat all of them as unsafe.
                  if [[ "$path" =~ [[:cntrl:]] ]]; then mode=full; break; fi
                  case "$path" in
                    README.md|website/README.md|website/source/*.md) ;;
                    *) mode=full; break ;;
                  esac
                done <<< "$paths"
              fi
            fi
          fi
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          echo "Playwright coverage: $mode"

      - name: Run browser E2E
        id: browser-e2e
        env:
          UAP_E2E_REPOSITORY_BASE: universal-agent-plugins
          UAP_E2E_WEB_ROOT: .e2e-pages
        working-directory: landing
        run: |
          if [[ "${{ steps.browser-scope.outputs.mode }}" == "smoke" ]]; then
            pnpm exec playwright test tests/browser/landing.spec.ts tests/browser/i18n-integration.spec.ts tests/browser/release-base.spec.ts tests/browser/locale-install-navigation.spec.ts
          else
            pnpm run test:browser
          fi

      # Capture the first Playwright run's screenshots before the live-API and
      # Mux suites start: each Playwright invocation cleans test-results/.
      - name: Preserve Marketing Kit visual QA evidence
        if: always() && steps.browser-e2e.outcome == 'success' && steps.browser-scope.outputs.mode != 'smoke'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: marketing-kit-visual-evidence
          path: landing/test-results/**/marketing-kit-*.png
          if-no-files-found: error
          retention-days: 7

      # Opt-in real public Skills API payloads exercised by the staged Pages
      # UI. The localhost-only CORS bridge passes through actual response bytes.
      - name: Verify real Skills API against staged install UI
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:live-skills')
        id: live-skills-e2e
        env:
          UAP_E2E_REPOSITORY_BASE: universal-agent-plugins
          UAP_E2E_WEB_ROOT: .e2e-pages
          UAP_E2E_LIVE_SKILLS: '1'
        working-directory: landing
        run: pnpm exec playwright test tests/browser/skills-live-api.spec.ts

      # Explicitly enabled for visual media changes. This checks actual Mux
      # playback progression after one click, not just iframe construction.
      - name: Verify real Mux playback after one click
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:live-demo')
        id: live-demo-e2e
        env:
          UAP_E2E_REPOSITORY_BASE: universal-agent-plugins
          UAP_E2E_WEB_ROOT: .e2e-pages
          UAP_E2E_LIVE_VIDEO: '1'
        working-directory: landing
        run: pnpm exec playwright test tests/browser/hero-demo-video.spec.ts --grep 'owner-uploaded Mux film actually plays'

      - name: Preserve failed browser traces
        if: failure() && (steps.browser-e2e.outcome == 'failure' || steps.live-demo-e2e.outcome == 'failure' || steps.live-skills-e2e.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: landing-browser-failure
          path: landing/test-results/
          retention-days: 7

  combined-pages-validation:
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:github-hosted') && 'ubuntu-latest' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        base: ["/", "/universal-agent-plugins/"]
    env:
      NUXT_APP_BASE_URL: ${{ matrix.base }}
      NUXT_PUBLIC_SITE_URL: https://777genius.github.io${{ matrix.base }}
      NUXT_PUBLIC_DOCS_URL: https://777genius.github.io${{ matrix.base }}docs/en/
      NUXT_PUBLIC_QUICKSTART_URL: https://777genius.github.io${{ matrix.base }}docs/en/guide/quickstart.html
      NUXT_PUBLIC_DOCS_SITEMAP_URL: https://777genius.github.io${{ matrix.base }}docs/sitemap.xml
      DOCS_BASE_PATH: ${{ matrix.base }}docs/
      DOCS_HOSTNAME: https://777genius.github.io
      GOTOOLCHAIN: local
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false

      # Keep docs on its own packageManager; landing uses a newer lockfile format.
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        id: pnpm-docs
        with:
          package_json_file: website/package.json
          dest: ${{ runner.temp }}/pnpm-docs

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          package_json_file: landing/package.json
          dest: ${{ runner.temp }}/pnpm-landing

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"

      - name: Verify and stage signed registry feeds
        run: |
          go run ./cmd/agentplugins-registry-mirror \
            --registry-repository 777genius/universal-agent-plugins-registry \
            --pages-origin https://777genius.github.io/universal-agent-plugins-registry/ \
            --output "${RUNNER_TEMP}/uap-registry-mirror"
          mkdir -p landing/public
          cp -a "${RUNNER_TEMP}/uap-registry-mirror/." landing/public/
          echo "UAP_VERIFIED_MIRROR=${RUNNER_TEMP}/uap-registry-mirror" >> "$GITHUB_ENV"

      - name: Install landing dependencies
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Install docs dependencies
        working-directory: website
        run: |
          export PATH="${{ steps.pnpm-docs.outputs.bin_dest }}:$PATH"
          pnpm install --frozen-lockfile

      - name: Install pinned docs generators
        run: |
          python -m venv "${RUNNER_TEMP}/docs-tools-root/python-venv"
          "${RUNNER_TEMP}/docs-tools-root/python-venv/bin/pip" install --require-hashes -r "${GITHUB_WORKSPACE}/website/tools/pydoc-markdown-requirements.txt"
          mkdir -p "${RUNNER_TEMP}/docs-tools-root/bin"
          GOBIN="${RUNNER_TEMP}/docs-tools-root/bin" go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v1.1.0

      - name: Install browser
        working-directory: landing
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Prepare and validate landing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: landing
        run: |
          pnpm exec nuxt prepare
          pnpm exec vue-tsc --noEmit
          pnpm run test:artifact
          pnpm run test:registry
          pnpm run lint
          pnpm run generate

      - name: Prepare immutable authoring source
        run: |
          source_sha=$(node --input-type=module -e 'import { acceptedAuthoringSHA } from "./website/tools/lib/source-contract.mjs"; process.stdout.write(acceptedAuthoringSHA)')
          git clone --no-local --no-checkout . "${RUNNER_TEMP}/docs-authoring-source"
          git -C "${RUNNER_TEMP}/docs-authoring-source" checkout --quiet --detach "$source_sha"
          chmod -R a-w "${RUNNER_TEMP}/docs-authoring-source"
          echo "DOCS_AUTHORING_CHECKOUT=${RUNNER_TEMP}/docs-authoring-source" >> "$GITHUB_ENV"

      - name: Warm Go module cache for offline docs consumer integration
        env:
          GOCACHE: ${{ runner.temp }}/docs-consumer-gocache
          GOMODCACHE: ${{ runner.temp }}/docs-consumer-gomodcache
        run: |
          cd "$DOCS_AUTHORING_CHECKOUT"
          GOWORK="$DOCS_AUTHORING_CHECKOUT/go.work" go build -p 2 -o "$RUNNER_TEMP/docs-authoring-preflight" ./cli/plugin-kit-ai/tools/authoring-docs

      - name: Validate and build public docs
        working-directory: website
        env:
          GOCACHE: ${{ runner.temp }}/docs-consumer-gocache
          GOMODCACHE: ${{ runner.temp }}/docs-consumer-gomodcache
          DOCS_TOOLS_ROOT: ${{ runner.temp }}/docs-tools-root
          DOCS_GOMARKDOC: ${{ runner.temp }}/docs-tools-root/bin/gomarkdoc
          TMPDIR: ${{ runner.temp }}
          GOWORK: ${{ github.workspace }}/go.work
          GOPROXY: "off"
          GOSUMDB: "off"
          GOENV: "off"
        run: |
          export PATH="${{ steps.pnpm-docs.outputs.bin_dest }}:$PATH"
          pnpm run docs:check

      - name: Assemble and validate exact final Pages artifact
        working-directory: landing
        run: pnpm run build:pages

      - name: Serve assembled artifact at deployment base
        run: |
          mkdir -p .combined-browser${{ matrix.base }}
          cp -a .pages-dist/. .combined-browser${{ matrix.base }}/

      - name: Representative final static integration
        id: browser-e2e
        working-directory: landing
        env:
          UAP_E2E_WEB_ROOT: ../.combined-browser
          UAP_E2E_REPOSITORY_BASE: ${{ matrix.base }}
        run: pnpm exec playwright test tests/browser/i18n-integration.spec.ts tests/browser/payload-scoping.spec.ts tests/browser/i18n-state.spec.ts tests/browser/locale-install-navigation.spec.ts tests/browser/release-base.spec.ts

      - name: Preserve failed browser traces
        if: failure() && steps.browser-e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: landing-combined-browser-failure-${{ strategy.job-index }}
          path: landing/test-results/
          retention-days: 7
