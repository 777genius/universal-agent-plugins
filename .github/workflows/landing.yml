name: Landing

on:
  pull_request:
    paths:
      - "README.md"
      - "landing/**"
      - "website/**"
      - ".github/workflows/docs-pages.yml"
      - ".github/workflows/registry-compatibility-mirror.yml"
      - "cmd/agentplugins-registry-mirror/**"
      - "cli/cmd/genclientcapabilities/**"
      - "install/integrationctl/agentplugins/domain/**"
      - "install/integrationctl/agentplugins/clients/**"
      - "install/integrationctl/agentplugins/installer/engine.go"
      - "scripts/check-generated-sync.sh"
      - "Makefile"
      - ".github/workflows/landing.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "landing/**"
      - "website/**"
      - ".github/workflows/docs-pages.yml"
      - ".github/workflows/registry-compatibility-mirror.yml"
      - "cmd/agentplugins-registry-mirror/**"
      - "cli/cmd/genclientcapabilities/**"
      - "install/integrationctl/agentplugins/domain/**"
      - "install/integrationctl/agentplugins/clients/**"
      - "install/integrationctl/agentplugins/installer/engine.go"
      - "scripts/check-generated-sync.sh"
      - "Makefile"
      - ".github/workflows/landing.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # Full nightly browser matrix

# Replace ordinary CI for the same PR/ref; keep manual runs independent.
concurrency:
  group: landing-${{ github.event_name }}-${{ github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  prepare-browser:
    name: landing-prepare
    permissions:
      contents: read
      pull-requests: read
    runs-on: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:github-hosted') && 'ubuntu-latest' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    outputs:
      scope: ${{ steps.browser-scope.outputs.mode }}
      site-artifact-id: ${{ steps.upload-site.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache: false

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          package_json_file: landing/package.json
          dest: ${{ runner.temp }}/pnpm-landing

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Verify and stage signed registry feeds
        run: |
          go test -count=1 ./cmd/agentplugins-registry-mirror
          go run ./cmd/agentplugins-registry-mirror \
            --registry-repository 777genius/universal-agent-plugins-registry \
            --pages-origin https://777genius.github.io/universal-agent-plugins-registry/ \
            --output "${RUNNER_TEMP}/uap-registry-mirror"
          mkdir -p landing/public
          cp -a "${RUNNER_TEMP}/uap-registry-mirror/." landing/public/
          echo "UAP_VERIFIED_MIRROR=${RUNNER_TEMP}/uap-registry-mirror" >> "$GITHUB_ENV"

      - name: Verify generated agent contract and public presentation
        run: make client-contract-check

      - name: Install landing dependencies
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Prefer configured canonical Ubuntu package mirrors
        working-directory: .
        run: |
          python3 -m unittest discover -s scripts -p 'test_ci_ubuntu_apt_mirrors.py'
          # GitHub-hosted images own their apt mirror configuration. Do not
          # mutate or broaden the strict self-hosted mirror allowlist.
          case "${RUNNER_ENVIRONMENT:-}" in
            github-hosted)
              echo "Using unchanged GitHub-hosted Ubuntu package mirrors"
              ;;
            self-hosted)
              sudo python3 scripts/ci_ubuntu_apt_mirrors.py
              ;;
            *)
              echo "::error::Unknown runner environment; refusing mirror mutation"
              exit 1
              ;;
          esac

      - name: Install Chromium for static social preview
        working-directory: landing
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Prepare Nuxt tooling
        working-directory: landing
        run: |
          node ./scripts/prepare-webp-assets.mjs
          pnpm exec nuxt prepare
          pnpm run check:types

      - name: Check registry, lint, and generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUXT_APP_BASE_URL: /universal-agent-plugins/
          NUXT_PUBLIC_SITE_URL: https://777genius.github.io/universal-agent-plugins
        working-directory: landing
        run: |
          pnpm run check:advisories
          pnpm run test:registry
          pnpm run lint
          pnpm run check:i18n
          pnpm run generate

      - name: Preserve social preview for visual review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: social-preview-1200x630
          path: landing/public/og-image.png
          if-no-files-found: error
          retention-days: 7

      - name: Stage the GitHub Pages base path
        working-directory: landing
        run: |
          mkdir -p .e2e-pages/universal-agent-plugins
          cp -a .output/public/. .e2e-pages/universal-agent-plugins/

      # Docs-only PRs use an existing smoke subset; any unknown path fails open.
      - name: Select browser E2E coverage
        if: github.event_name == 'pull_request'
        id: browser-scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          mode=full
          if [[ "$PR_CHANGED_FILES" =~ ^[0-9]+$ ]] && (( PR_CHANGED_FILES < 3000 )); then
            if paths="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[] | (.filename, (.previous_filename // empty)) | gsub("\n"; "\u0001")')"; then
              if [[ -n "$paths" && "$paths" != *$'\001'* ]]; then
                mode=smoke
                while IFS= read -r path; do
                  # Git allows control bytes in filenames; treat all of them as unsafe.
                  if [[ "$path" =~ [[:cntrl:]] ]]; then mode=full; break; fi
                  case "$path" in
                    README.md|website/README.md|website/source/*.md) ;;
                    *) mode=full; break ;;
                  esac
                done <<< "$paths"
              fi
            fi
          fi
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          echo "Playwright coverage: $mode"


      # Browser work always uses two fixed shards. For docs-only PRs,
      # each shard takes half of the existing smaller smoke suite.
      # One signed, typechecked, generated site for both shards in this exact workflow run.
      - name: Upload verified site and registry inputs for browser shards
        id: upload-site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: landing-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            landing/.e2e-pages/
            landing/public/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  browser-shard:
    name: landing-shard (${{ matrix.index }}/${{ matrix.total }})
    needs: prepare-browser
    if: needs.prepare-browser.result == 'success'
    runs-on: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:github-hosted') && 'ubuntu-latest' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: 1
            total: 2
          - index: 2
            total: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          package_json_file: landing/package.json
          dest: ${{ runner.temp }}/pnpm-landing

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install browser test dependencies
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Download exact-run verified static site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-browser.outputs.site-artifact-id }}
          path: landing

      - name: Check same-run staged inputs
        working-directory: landing
        run: |
          test -s .e2e-pages/universal-agent-plugins/index.html
          test -s public/registry/schemas/1/latest.json

      - name: Prefer configured canonical Ubuntu package mirrors
        working-directory: .
        run: |
          python3 -m unittest discover -s scripts -p 'test_ci_ubuntu_apt_mirrors.py'
          # GitHub-hosted images own their apt mirror configuration. Do not
          # mutate or broaden the strict self-hosted mirror allowlist.
          case "${RUNNER_ENVIRONMENT:-}" in
            github-hosted)
              echo "Using unchanged GitHub-hosted Ubuntu package mirrors"
              ;;
            self-hosted)
              sudo python3 scripts/ci_ubuntu_apt_mirrors.py
              ;;
            *)
              echo "::error::Unknown runner environment; refusing mirror mutation"
              exit 1
              ;;
          esac

      - name: Install Chromium browser
        working-directory: landing
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Run browser E2E shard
        id: browser-e2e
        env:
          UAP_E2E_REPOSITORY_BASE: universal-agent-plugins
          UAP_E2E_WEB_ROOT: .e2e-pages
        working-directory: landing
        run: |
          shard="--shard=${{ matrix.index }}/${{ matrix.total }}"
          if [[ "${{ needs.prepare-browser.outputs.scope }}" == "smoke" ]]; then
            pnpm exec playwright test tests/browser/landing.spec.ts tests/browser/i18n-integration.spec.ts tests/browser/release-base.spec.ts tests/browser/locale-install-navigation.spec.ts "$shard" --reporter=line,blob
          else
            pnpm exec playwright test "$shard" --reporter=line,blob
          fi

      # Preserve evidence before opt-in live suites, which clear test-results/.
      - name: Preserve Marketing Kit and Skills scope screenshots from this shard
        if: always() && steps.browser-e2e.outcome == 'success' && needs.prepare-browser.outputs.scope != 'smoke'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: landing-visual-${{ matrix.index }}
          path: |
            landing/test-results/**/marketing-kit-*.png
            landing/test-results/**/skills-card-project-mobile.png
            landing/test-results/**/skills-detail-project-mobile.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify real Skills API against staged install UI
        if: github.event_name == 'pull_request' && matrix.index == 1 && contains(github.event.pull_request.labels.*.name, 'ci:live-skills')
        id: live-skills-e2e
        env:
          UAP_E2E_REPOSITORY_BASE: universal-agent-plugins
          UAP_E2E_WEB_ROOT: .e2e-pages
          UAP_E2E_LIVE_SKILLS: '1'
        working-directory: landing
        run: pnpm exec playwright test tests/browser/skills-live-api.spec.ts

      - name: Verify real Mux playback after one click
        if: github.event_name == 'pull_request' && matrix.index == 1 && contains(github.event.pull_request.labels.*.name, 'ci:live-demo')
        id: live-demo-e2e
        env:
          UAP_E2E_REPOSITORY_BASE: universal-agent-plugins
          UAP_E2E_WEB_ROOT: .e2e-pages
          UAP_E2E_LIVE_VIDEO: '1'
        working-directory: landing
        run: pnpm exec playwright test tests/browser/hero-demo-video.spec.ts --grep 'owner-uploaded Mux film actually plays'

      - name: Upload isolated Playwright blob report
        if: always() && steps.browser-e2e.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: landing-blob-${{ matrix.index }}
          path: landing/blob-report/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Preserve failed browser traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: landing-browser-failure-${{ matrix.index }}
          path: landing/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Branch protection sees one stable gate, not two independently green partial suites.
  test:
    name: landing-test
    if: ${{ always() && !cancelled() }}
    needs: [prepare-browser, browser-shard]
    runs-on: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:github-hosted') && 'ubuntu-latest' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          package_json_file: landing/package.json
          dest: ${{ runner.temp }}/pnpm-landing

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install report merger dependencies
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Download exact-run shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: landing-blob-*
          merge-multiple: true
          path: landing/merged-blob-reports

      - name: Verify shard report cardinality
        env:
          EXPECTED_SHARDS: '2'
        run: |
          test "$(find landing/merged-blob-reports -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq "$EXPECTED_SHARDS"

      - name: Merge full Playwright report
        working-directory: landing
        run: pnpm exec playwright merge-reports --reporter=line merged-blob-reports

      - name: Download per-shard visual evidence
        if: needs.prepare-browser.outputs.scope != 'smoke'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: landing-visual-*
          merge-multiple: true
          path: landing/marketing-kit-visual-evidence

      - name: Require full-suite Marketing Kit visual evidence
        if: needs.prepare-browser.outputs.scope != 'smoke'
        run: test "$(find landing/marketing-kit-visual-evidence -type f -name 'marketing-kit-*.png' | wc -l)" -gt 0

      - name: Preserve consolidated Marketing Kit visual QA evidence
        if: needs.prepare-browser.outputs.scope != 'smoke'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: marketing-kit-visual-evidence
          path: landing/marketing-kit-visual-evidence/
          if-no-files-found: error
          retention-days: 7

      # Preserve the two existing mobile Skills screenshots from the complete suite.
      - name: Require full-suite Skills scope visual evidence
        if: needs.prepare-browser.outputs.scope != 'smoke'
        run: |
          test "$(find landing/marketing-kit-visual-evidence -type f -name 'skills-card-project-mobile.png' | wc -l)" -gt 0
          test "$(find landing/marketing-kit-visual-evidence -type f -name 'skills-detail-project-mobile.png' | wc -l)" -gt 0

      - name: Preserve consolidated Skills scope visual QA evidence
        if: needs.prepare-browser.outputs.scope != 'smoke'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: skills-scope-visual-evidence
          path: |
            landing/marketing-kit-visual-evidence/**/skills-card-project-mobile.png
            landing/marketing-kit-visual-evidence/**/skills-detail-project-mobile.png
          if-no-files-found: error
          retention-days: 7

      # Cannot mark the required landing-test green if preparation or any shard failed.
      - name: Require complete successful E2E
        if: always()
        env:
          PREP_RESULT: ${{ needs.prepare-browser.result }}
          SHARDS_RESULT: ${{ needs.browser-shard.result }}
        run: |
          test "$PREP_RESULT" = success
          test "$SHARDS_RESULT" = success

  combined-pages-validation:
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:github-hosted') && 'ubuntu-latest' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        base: ["/", "/universal-agent-plugins/"]
    env:
      NUXT_APP_BASE_URL: ${{ matrix.base }}
      NUXT_PUBLIC_SITE_URL: https://777genius.github.io${{ matrix.base }}
      NUXT_PUBLIC_DOCS_URL: https://777genius.github.io${{ matrix.base }}docs/en/
      NUXT_PUBLIC_QUICKSTART_URL: https://777genius.github.io${{ matrix.base }}docs/en/guide/quickstart.html
      NUXT_PUBLIC_DOCS_SITEMAP_URL: https://777genius.github.io${{ matrix.base }}docs/sitemap.xml
      DOCS_BASE_PATH: ${{ matrix.base }}docs/
      DOCS_HOSTNAME: https://777genius.github.io
      GOTOOLCHAIN: local
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache: false

      # Keep docs on its own packageManager; landing uses a newer lockfile format.
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        id: pnpm-docs
        with:
          package_json_file: website/package.json
          dest: ${{ runner.temp }}/pnpm-docs

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          package_json_file: landing/package.json
          dest: ${{ runner.temp }}/pnpm-landing

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"

      - name: Verify and stage signed registry feeds
        run: |
          go run ./cmd/agentplugins-registry-mirror \
            --registry-repository 777genius/universal-agent-plugins-registry \
            --pages-origin https://777genius.github.io/universal-agent-plugins-registry/ \
            --output "${RUNNER_TEMP}/uap-registry-mirror"
          mkdir -p landing/public
          cp -a "${RUNNER_TEMP}/uap-registry-mirror/." landing/public/
          echo "UAP_VERIFIED_MIRROR=${RUNNER_TEMP}/uap-registry-mirror" >> "$GITHUB_ENV"

      - name: Install landing dependencies
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Install docs dependencies
        working-directory: website
        run: |
          export PATH="${{ steps.pnpm-docs.outputs.bin_dest }}:$PATH"
          pnpm install --frozen-lockfile

      - name: Install pinned docs generators
        run: |
          python -m venv "${RUNNER_TEMP}/docs-tools-root/python-venv"
          "${RUNNER_TEMP}/docs-tools-root/python-venv/bin/pip" install --require-hashes -r "${GITHUB_WORKSPACE}/website/tools/pydoc-markdown-requirements.txt"
          mkdir -p "${RUNNER_TEMP}/docs-tools-root/bin"
          GOBIN="${RUNNER_TEMP}/docs-tools-root/bin" go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v1.1.0

      - name: Prefer configured canonical Ubuntu package mirrors
        working-directory: .
        run: |
          python3 -m unittest discover -s scripts -p 'test_ci_ubuntu_apt_mirrors.py'
          # GitHub-hosted images own their apt mirror configuration. Do not
          # mutate or broaden the strict self-hosted mirror allowlist.
          case "${RUNNER_ENVIRONMENT:-}" in
            github-hosted)
              echo "Using unchanged GitHub-hosted Ubuntu package mirrors"
              ;;
            self-hosted)
              sudo python3 scripts/ci_ubuntu_apt_mirrors.py
              ;;
            *)
              echo "::error::Unknown runner environment; refusing mirror mutation"
              exit 1
              ;;
          esac

      - name: Install browser
        working-directory: landing
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Prepare and validate landing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: landing
        run: |
          pnpm exec nuxt prepare
          pnpm exec vue-tsc --noEmit
          pnpm run test:artifact
          pnpm run check:advisories
          pnpm run test:registry
          pnpm run lint
          pnpm run generate

      - name: Prepare immutable authoring source
        run: |
          source_sha=$(node --input-type=module -e 'import { acceptedAuthoringSHA } from "./website/tools/lib/source-contract.mjs"; process.stdout.write(acceptedAuthoringSHA)')
          git clone --no-local --no-checkout . "${RUNNER_TEMP}/docs-authoring-source"
          git -C "${RUNNER_TEMP}/docs-authoring-source" checkout --quiet --detach "$source_sha"
          chmod -R a-w "${RUNNER_TEMP}/docs-authoring-source"
          echo "DOCS_AUTHORING_CHECKOUT=${RUNNER_TEMP}/docs-authoring-source" >> "$GITHUB_ENV"

      - name: Warm Go module cache for offline docs consumer integration
        env:
          GOCACHE: ${{ runner.temp }}/docs-consumer-gocache
          GOMODCACHE: ${{ runner.temp }}/docs-consumer-gomodcache
        run: |
          cd "$DOCS_AUTHORING_CHECKOUT"
          GOWORK="$DOCS_AUTHORING_CHECKOUT/go.work" go build -p 2 -o "$RUNNER_TEMP/docs-authoring-preflight" ./cli/plugin-kit-ai/tools/authoring-docs

      - name: Validate and build public docs
        working-directory: website
        env:
          GOCACHE: ${{ runner.temp }}/docs-consumer-gocache
          GOMODCACHE: ${{ runner.temp }}/docs-consumer-gomodcache
          DOCS_TOOLS_ROOT: ${{ runner.temp }}/docs-tools-root
          DOCS_GOMARKDOC: ${{ runner.temp }}/docs-tools-root/bin/gomarkdoc
          TMPDIR: ${{ runner.temp }}
          GOWORK: ${{ github.workspace }}/go.work
          GOPROXY: "off"
          GOSUMDB: "off"
          GOENV: "off"
        run: |
          export PATH="${{ steps.pnpm-docs.outputs.bin_dest }}:$PATH"
          pnpm run docs:check

      - name: Assemble and validate exact final Pages artifact
        working-directory: landing
        run: pnpm run build:pages

      - name: Serve assembled artifact at deployment base
        run: |
          mkdir -p .combined-browser${{ matrix.base }}
          cp -a .pages-dist/. .combined-browser${{ matrix.base }}/

      - name: Representative final static integration
        id: browser-e2e
        working-directory: landing
        env:
          UAP_E2E_WEB_ROOT: ../.combined-browser
          UAP_E2E_REPOSITORY_BASE: ${{ matrix.base }}
        run: pnpm exec playwright test tests/browser/i18n-integration.spec.ts tests/browser/payload-scoping.spec.ts tests/browser/i18n-state.spec.ts tests/browser/locale-install-navigation.spec.ts tests/browser/release-base.spec.ts

      - name: Preserve failed browser traces
        if: failure() && steps.browser-e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: landing-combined-browser-failure-${{ strategy.job-index }}
          path: landing/test-results/
          retention-days: 7
