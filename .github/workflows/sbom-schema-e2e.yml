name: Dependency SBOM Official Schema E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'cli/internal/agentpluginscli/deps_sbom*.go'
      - '.github/workflows/sbom-schema-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-schema-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  official-schemas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Fetch immutable official CycloneDX and SPDX 2.3 schemas
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sbom-schemas"
          mkdir -p "$root"
          cdx_commit=6470e34ef83f915868ece48934cff52e10c9eb49
          spdx_commit=aadf3b0b8dbbabdb4d880b0fc714255fea436ff7
          for name in bom-1.5.schema.json spdx.schema.json jsf-0.82.schema.json; do
            curl --fail --location --silent --show-error --retry 3 \
              "https://raw.githubusercontent.com/CycloneDX/specification/$cdx_commit/schema/$name" \
              -o "$root/$name"
          done
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/spdx/spdx-spec/$spdx_commit/schemas/spdx-schema.json" \
            -o "$root/spdx-2.3.schema.json"
          python3 - "$root" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          expected = {
              "bom-1.5.schema.json": "http://cyclonedx.org/schema/bom-1.5.schema.json",
              "spdx.schema.json": "http://cyclonedx.org/schema/spdx.schema.json",
              "jsf-0.82.schema.json": "http://cyclonedx.org/schema/jsf-0.82.schema.json",
              "spdx-2.3.schema.json": "http://spdx.org/rdf/terms/2.3",
          }
          for name, uri in expected.items():
              path = root / name
              doc = json.loads(path.read_bytes())
              assert doc["$id"] == uri, f"{name}: unexpected official schema identity"
          PY
          echo "UAP_SBOM_SCHEMA_DIR=$root" >> "$GITHUB_ENV"
      - name: Validate rendered CycloneDX 1.5 and SPDX 2.3 against official schemas
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/agentpluginscli -run '^TestDependencySBOMAgainstOfficialSchemas$' -count=1 -v
