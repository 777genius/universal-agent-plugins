name: UAP vs APM standard comparison (evidence only)

on:
  pull_request:
    paths:
      - "scripts/comparisons/uap_apm_skills_e2e.py"
      - "scripts/comparisons/test_uap_apm_skills_e2e.py"
      - "tests/fixtures/uap_apm/**"
      - ".github/workflows/uap-apm-standard-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uap-apm-evidence-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  skills-protocol:
    # Isolated hosted VM. No repository/vendor secrets passed to the products.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build exact released UAP source
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/uap-release" agentplugins-v0.1.95
          test "$(git -C "$RUNNER_TEMP/uap-release" describe --tags --exact-match)" = agentplugins-v0.1.95
          test "$(git -C "$RUNNER_TEMP/uap-release" rev-parse HEAD)" = ec85ee7d759944b9799e451c96bfc1859f9d5533
          mkdir -p "$RUNNER_TEMP/uap-bin"
          (cd "$RUNNER_TEMP/uap-release/cli" && go build -trimpath -o "$RUNNER_TEMP/uap-bin/agentplugins" ./cmd/agentplugins)
          "$RUNNER_TEMP/uap-bin/agentplugins" version

      - name: Install exact APM 0.35.0 distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/apm-venv"
          mkdir -p "$RUNNER_TEMP/apm-distribution"
          "$RUNNER_TEMP/apm-venv/bin/python" -m pip download --no-deps --dest "$RUNNER_TEMP/apm-distribution" "apm-cli==0.35.0"
          sha256sum "$RUNNER_TEMP"/apm-distribution/* > "$RUNNER_TEMP/apm-distribution-sha256.txt"
          wheel="$(find "$RUNNER_TEMP/apm-distribution" -maxdepth 1 -type f -name 'apm_cli-0.35.0-*.whl' -print -quit)"
          test -n "$wheel"
          "$RUNNER_TEMP/apm-venv/bin/python" -m pip install --disable-pip-version-check \
            --report "$RUNNER_TEMP/apm-pip-install-report.json" "$wheel"
          "$RUNNER_TEMP/apm-venv/bin/apm" --version
          "$RUNNER_TEMP/apm-venv/bin/python" -m pip freeze > "$RUNNER_TEMP/apm-installed-requirements.txt"

      - name: Provision pinned genuine Codex target (no login)
        shell: bash
        run: |
          set -euo pipefail
          # UAP requires detected client authority before preparing a project
          # installation. APM can copy Skills without installed Codex. Compare
          # delivery with the genuine client available to both managers.
          # Prevent vendor package lifecycle scripts from running on the host.
          # Compare the official npm distribution's published integrity with
          # independently retained 2026-10-24 disposable research.
          expected='sha512-TWj7UGyPRe3Pj/A3ddNAxs1te3a/W/xAd+J0LHrrFTmsSfahGMOLF/vn88D3QCIgAT3B1rm1y/Z3NYE0rx6cZQ=='
          actual="$(npm view '@openai/codex@0.164.0' dist.integrity)"
          test "$actual" = "$expected"
          npm install --prefix "$RUNNER_TEMP/codex-runtime" --no-save \
            --ignore-scripts --no-audit --no-fund --no-package-lock '@openai/codex@0.164.0'
          codex="$RUNNER_TEMP/codex-runtime/node_modules/.bin/codex"
          test -x "$codex"
          test "$("$codex" --version)" = "codex-cli 0.164.0"
          printf '%s\n' "$RUNNER_TEMP/codex-runtime/node_modules/.bin" >> "$GITHUB_PATH"
          npm ls --prefix "$RUNNER_TEMP/codex-runtime" --depth=0 --json > "$RUNNER_TEMP/codex-runtime-package.json"

      - name: Validate bounded harness and adversarial classifiers
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/apm-venv/bin/python" -m py_compile scripts/comparisons/uap_apm_skills_e2e.py
          "$RUNNER_TEMP/apm-venv/bin/python" -m unittest discover -s scripts/comparisons -p 'test_uap_apm_skills_e2e.py' -v

      - name: Execute neutral Skill 1.0 receipts from both tools
        id: benchmark
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/uap-apm-results"
          cp "$RUNNER_TEMP/apm-installed-requirements.txt" "$RUNNER_TEMP/uap-apm-results/apm-installed-requirements.txt"
          cp "$RUNNER_TEMP/apm-distribution-sha256.txt" "$RUNNER_TEMP/uap-apm-results/apm-distribution-sha256.txt"
          cp "$RUNNER_TEMP/apm-pip-install-report.json" "$RUNNER_TEMP/uap-apm-results/apm-pip-install-report.json"
          cp "$RUNNER_TEMP/codex-runtime-package.json" "$RUNNER_TEMP/uap-apm-results/codex-runtime-package.json"
          "$RUNNER_TEMP/apm-venv/bin/python" scripts/comparisons/uap_apm_skills_e2e.py \
            --uap "$RUNNER_TEMP/uap-bin/agentplugins" \
            --apm "$RUNNER_TEMP/apm-venv/bin/apm" \
            --fixture-commit a92e2a3c35a08327937b3facbf4b22791ae50eea \
            --uap-source-sha "$(git -C "$RUNNER_TEMP/uap-release" rev-parse HEAD)" \
            --output "$RUNNER_TEMP/uap-apm-results"
          cat "$RUNNER_TEMP/uap-apm-results/report.md" >> "$GITHUB_STEP_SUMMARY"
          # Green workflow means evidence capture, not that either tool won.

      - name: Retain bounded source-pinned evidence for independent review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: uap-apm-skills-evidence
          path: ${{ runner.temp }}/uap-apm-results/
          retention-days: 14
          if-no-files-found: warn
