name: Pi upstream real-source saved install (synthetic TEST-only v1 trust)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pi-upstream-signed-test-only-saved.yml'
      - 'cli/cmd/agentplugins/pi_upstream_signed_saved_test.go'
      - 'cli/cmd/agentplugins/pi_full_modern_signed_v1_test.go'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pi-upstream-signed-test-only-saved.yml'
      - 'cli/cmd/agentplugins/pi_upstream_signed_saved_test.go'
      - 'cli/cmd/agentplugins/pi_full_modern_signed_v1_test.go'

permissions:
  contents: read

concurrency:
  group: pi-upstream-test-only-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  saved-install:
    name: Real Git upstream saved TEST-only / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      UAP_PI_UPSTREAM_TEST_ONLY_SAVED_E2E: '1'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Check immutable HEAD and clean checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
      - name: Install two real Git sources in user/project against artificial signed TEST trust
        shell: bash
        env:
          UAP_PI_UPSTREAM_TEST_ONLY_REPORT: ${{ runner.temp }}/pi-upstream-test-only-${{ matrix.os }}.json
        run: |
          go test -p=2 -count=1 -timeout=35m -v ./cli/cmd/agentplugins \
            -run '^TestPiUpstreamSignedTestOnlyPositiveSaved$'
      - name: Preserve original test-only results (not production receipts)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: pi-upstream-test-only-${{ matrix.os }}
          path: ${{ runner.temp }}/pi-upstream-test-only-${{ matrix.os }}.json
          retention-days: 14
          if-no-files-found: ignore

  aggregate:
    name: Verify 4 real saved journeys per OS under artificial test trust
    runs-on: ubuntu-24.04
    needs: saved-install
    if: ${{ always() }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require all three original OS jobs
        env:
          MATRIX_RESULT: ${{ needs['saved-install'].result }}
        run: test "$MATRIX_RESULT" = success
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pi-upstream-test-only-*
          path: _reports
          merge-multiple: true
      - name: Verify original exact-head 3-OS test-only receipts, never production approval
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          observed = set()
          expected_cases = {
              'github/github/user', 'github/github/project',
              'upstash/context7/user', 'upstash/context7/project',
          }
          for runner, label in [('ubuntu-24.04', 'Linux'), ('macos-15', 'macOS'), ('windows-2025', 'Windows')]:
              path = Path('_reports') / f'pi-upstream-test-only-{runner}.json'
              assert path.is_file(), f'missing original OS report: {runner}'
              report = json.loads(path.read_bytes())
              assert set(report) == {
                  'kind', 'test_head', 'runner_os', 'saved_cases', 'production_published',
                  'production_eligibility', 'synthetic_evidence', 'native_pi_runtime_or_oauth',
              }
              assert report['kind'] == 'pi-upstream-real-source-saved-test-only'
              assert report['test_head'] == os.environ['EXPECTED_HEAD']
              assert report['runner_os'] == label
              assert report['production_published'] is False
              assert report['production_eligibility'] is False
              assert report['synthetic_evidence'] is True
              assert report['native_pi_runtime_or_oauth'] is False
              assert type(report['saved_cases']) is list
              assert len(report['saved_cases']) == 4 and set(report['saved_cases']) == expected_cases
              observed.add(runner)
          assert len(observed) == 3 and len(list(Path('_reports').glob('*.json'))) == 3
          print('TEST ONLY: 12 actual managed saved lifecycle cases across 3 OS; artificial Ed25519 fixture grants')
          print('NOT PROVEN: upstream production evidence, 72/72 published entitlement, live Pi/OAuth, production signer, CLI routing')
          PY
