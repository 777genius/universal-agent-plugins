name: live E2E read-only checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: live-e2e-read-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-read-flows:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Run credential-free public MCP reads
        run: python scripts/run_mcp_e2e.py --profile ci --output /tmp/public-mcp-evidence.json
      - run: (cd /tmp && sha256sum public-mcp-evidence.json > public-mcp-evidence.SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-read-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/public-mcp-evidence.json
            /tmp/public-mcp-evidence.SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  stable-launch-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate fixture-only non-runtime harness
        run: |
          run_root="/tmp/uap-live-contract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/run_launch_evidence_e2e.py --mode fixture-only \
            --consent tests/e2e/fixtures/fixture-only-consent.json \
            --run-root "$run_root" \
            --output "$run_root/evidence/launch-evidence.json"
          python -m unittest tests.test_run_launch_evidence_e2e tests.test_workflow_contracts
