name: CodeQL

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: "20 4 * * 1"
  workflow_dispatch:

# Replace ordinary PR/push CI; isolate manual and scheduled invocations.
# Release validation also accepts checks from the associated merged PR head.
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: analyze (${{ matrix.language }})
    runs-on: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:github-hosted') && 'ubuntu-latest' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v6

      - if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.language == 'go'
        name: Build Go modules for CodeQL
        shell: bash
        run: |
          go build ./...
          (
            cd cli
            export GOWORK=off
            go build ./...
          )
          (
            cd plugininstall
            export GOWORK=off
            go build ./...
          )
          (
            cd install/integrationctl
            export GOWORK=off
            go build ./...
          )
          (
            cd install/integrationctl/agentplugins
            export GOWORK=off
            go build ./...
          )
          (
            cd sdk
            export GOWORK=off
            go build ./...
          )

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
