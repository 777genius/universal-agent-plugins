name: Kiro no-auth installation E2E
on:
  pull_request:
    paths:
      - '.github/workflows/kiro-no-auth-installation.yml'
      - 'scripts/project_native_kiro_no_auth.py'
      - 'scripts/test_project_native_kiro_no_auth.py'
      - 'scripts/project_native_research.py'
      - 'scripts/project_native_collectors/kiro.py'
      - 'scripts/native_client_research.py'
      - 'scripts/native_client_project_artifacts.py'
      - 'scripts/research-grok-native.py'
      - 'scripts/run-native-client-matrix.py'
      - 'scripts/native_client_draft.py'
      - 'scripts/project_native_service.py'
      - 'cli/**'
      - 'install/integrationctl/**'
      - 'go.work*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kiro-no-auth-installation.yml'
      - 'scripts/project_native_kiro_no_auth.py'
      - 'scripts/test_project_native_kiro_no_auth.py'
      - 'scripts/project_native_research.py'
      - 'scripts/project_native_collectors/kiro.py'
      - 'scripts/native_client_research.py'
      - 'scripts/native_client_project_artifacts.py'
      - 'scripts/research-grok-native.py'
      - 'scripts/run-native-client-matrix.py'
      - 'scripts/native_client_draft.py'
      - 'scripts/project_native_service.py'
      - 'cli/**'
      - 'install/integrationctl/**'
      - 'go.work*'
permissions:
  contents: read
concurrency:
  group: kiro-no-auth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  lifecycle:
    name: UAP composed lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Bind exact clean source before execution
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          source = {'commit': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
                    'status': git('status', '--porcelain', '--untracked-files=normal')}
          if source['commit'] != os.environ['EXPECTED_COMMIT'] or source['status'] or not all(re.fullmatch('[0-9a-f]{40}', source[k]) for k in ('commit', 'tree')):
              raise SystemExit('exact clean source required')
          (Path(os.environ['RUNNER_TEMP']) / 'kiro-composed-source-before.json').write_text(json.dumps(source, sort_keys=True) + '\n')
          PYTHON
      - name: Run actual CLI Git/ZIP lifecycle
        shell: bash
        working-directory: cli
        run: |
          go test -json -count=1 -timeout=180s ./cmd/agentplugins -run '^TestProjectKiroComposedSourceLifecycle$' | tee "$RUNNER_TEMP/kiro-composed-cli.log"
      - name: Run SDK repair cold-restart retained-data removal lifecycle
        shell: bash
        working-directory: install/integrationctl/agentplugins
        run: go test -json -count=1 -timeout=180s ./installer -run '^TestProjectKiroPublicSDKStdioDataRepairRestartAndRemove$' | tee "$RUNNER_TEMP/kiro-composed-sdk.log"
      - name: Admit actual named cases and unchanged source
        if: ${{ always() }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          before = json.loads((root / 'kiro-composed-source-before.json').read_text())
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          after = {'commit': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
                   'status': git('status', '--porcelain', '--untracked-files=normal')}
          if before != after or after['status'] or after['commit'] != os.environ['EXPECTED_COMMIT']:
              raise SystemExit('source changed during lifecycle')
          cli = 'TestProjectKiroComposedSourceLifecycle'
          required = {'cli': [cli, cli + '/git', cli + '/zip'],
                      'sdk': ['TestProjectKiroPublicSDKStdioDataRepairRestartAndRemove']}
          receipts = []
          for label, tests in required.items():
              path = root / ('kiro-composed-' + label + '.log')
              if path.stat().st_size > 8 * 1024 * 1024:
                  raise SystemExit('unbounded Go JSON log')
              body = path.read_bytes()
              rows = [json.loads(line) for line in body.splitlines()]
              if not rows or any(row.get('Action') in ('fail', 'skip') for row in rows):
                  raise SystemExit('failed, skipped or empty lifecycle')
              packages = {row.get('Package') for row in rows}
              if len(packages) != 1 or not all(packages) or sum(row.get('Action') == 'pass' and 'Test' not in row for row in rows) != 1:
                  raise SystemExit('exact passing package required')
              observed = {row['Test'] for row in rows if row.get('Action') in ('run', 'pass') and 'Test' in row}
              if observed != set(tests) or any([row['Action'] for row in rows if row.get('Test') == test and row.get('Action') in ('run', 'pass')] != ['run', 'pass'] for test in tests):
                  raise SystemExit('exact named RUN/PASS cases required')
              receipts.append({'log': path.name, 'bytes': len(body), 'sha256': hashlib.sha256(body).hexdigest(),
                               'package': next(iter(packages)), 'tests': tests})
          receipt = {'source_before': before, 'source_after': after, 'logs': receipts,
                     'qualification': 'UAP composed installation only; inert discovery/security/helper seams; no native Kiro loading'}
          (root / 'kiro-composed-admission.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          print('PASS: exact CLI Git/ZIP and SDK lifecycle RUN/PASS cases; clean source preserved')
          PYTHON
      - name: Preserve actual lifecycle logs and source admission
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: kiro-no-auth-uap-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/kiro-composed-*.log
            ${{ runner.temp }}/kiro-composed-source-before.json
            ${{ runner.temp }}/kiro-composed-admission.json
          if-no-files-found: error
          retention-days: 14
  native:
    name: Pinned Kiro no-auth observations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test finite no-auth routes and preservation contracts
        run: python3 -m unittest discover -s scripts -p 'test_project_native_kiro_no_auth.py' -v
      - name: Capture real pinned help validation and expected auth refusals
        env:
          AGENTPLUGINS_NATIVE_DISPOSABLE_HOSTED: '1'
        run: python3 scripts/project_native_kiro_no_auth.py --output "$RUNNER_TEMP/kiro-no-auth-native"
      - name: Preserve original bounded native evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: kiro-no-auth-native-linux-amd64
          path: ${{ runner.temp }}/kiro-no-auth-native/upload/research.zip
          if-no-files-found: error
          retention-days: 14
  acceptance:
    name: Kiro no-auth acceptance
    needs: [lifecycle, native]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require actual completed lifecycle and native contracts
        env:
          LIFECYCLE: ${{ needs.lifecycle.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          test "$LIFECYCLE" = success
          test "$NATIVE" = success
          echo 'PASS: declared no-auth UAP installation and separately admitted native observations only; no authentication, model, native MCP or loaded-client lifecycle qualification.'
