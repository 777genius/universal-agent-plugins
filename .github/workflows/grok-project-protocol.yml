name: Grok Project MCP without model
on:
  pull_request:
    paths:
      - '.github/workflows/grok-project-protocol.yml'
      - 'scripts/grok_project_protocol_*.py'
      - 'scripts/test_grok_project_protocol.py'
      - 'repotests/testdata/agentplugins_native_probe/**'
      - 'install/integrationctl/agentplugins/clients/grok/**'
      - 'cli/**'
      - 'install/integrationctl/agentplugins/clients/shared/**'
      - 'scripts/native_client_research.py'
      - 'scripts/project_native_research.py'
      - 'scripts/project_native_runtime.py'
      - 'scripts/test_project_native_runtime.py'
      - 'scripts/project_native_collectors/grok.py'
      - 'go.work'
      - 'go.work.sum'
  push:
    branches: [main]
    paths:
      - '.github/workflows/grok-project-protocol.yml'
      - 'scripts/grok_project_protocol_*.py'
      - 'scripts/test_grok_project_protocol.py'
      - 'repotests/testdata/agentplugins_native_probe/**'
      - 'install/integrationctl/agentplugins/clients/grok/**'
      - 'cli/**'
      - 'install/integrationctl/agentplugins/clients/shared/**'
      - 'scripts/native_client_research.py'
      - 'scripts/project_native_research.py'
      - 'scripts/project_native_runtime.py'
      - 'scripts/test_project_native_runtime.py'
      - 'scripts/project_native_collectors/grok.py'
      - 'go.work'
      - 'go.work.sum'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grok-project-protocol-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  no-model-mcp:
    name: Installed stdio lifecycle and real native doctor
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      AGENTPLUGINS_NATIVE_DISPOSABLE_HOSTED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source and inert contracts
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=normal)"
          python3 -m unittest discover -s scripts -p 'test_grok_project_protocol.py' -v
          python3 -m unittest discover -s scripts -p 'test_project_native_runtime.py' -v
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Build ordinary installer and existing credential-free probe
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/grok-protocol-tools"
          go build -trimpath -o "$RUNNER_TEMP/grok-protocol-tools/agentplugins" ./cli/cmd/agentplugins
          go build -trimpath -o "$RUNNER_TEMP/grok-protocol-tools/probe" ./repotests/testdata/agentplugins_native_probe
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Verify public saved CLI consent and decline contracts
        run: |
          set -euo pipefail
          go test -json ./cli/cmd/agentplugins -run '^TestProjectGrokCLITLSZipSavedRepairConsentLifecycle$' -count=1 > "$RUNNER_TEMP/grok-consent-contract.jsonl"
          python3 - "$RUNNER_TEMP/grok-consent-contract.jsonl" <<'PY'
          import json, pathlib, sys
          rows = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          assert sum(row.get('Action') == 'pass' and row.get('Test') == 'TestProjectGrokCLITLSZipSavedRepairConsentLifecycle' for row in rows) == 1
          print('Public saved CLI consent, decline and EOF contract passed')
          PY
      - name: Run real MCP without provider credentials or a model
        id: grok_native
        run: |
          /usr/bin/python3 -B scripts/grok_project_protocol_service.py --case grok-protocol \
            --installer "$RUNNER_TEMP/grok-protocol-tools/agentplugins" \
            --probe "$RUNNER_TEMP/grok-protocol-tools/probe" \
            --output "$RUNNER_TEMP/grok-project-no-model-evidence"
      - name: Preserve original bounded protocol evidence
        if: ${{ always() && steps.grok_native.outcome == 'success' && steps.grok_native.outputs.publication == 'admitted' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: grok-project-no-model-${{ github.sha }}
          path: ${{ runner.temp }}/grok-project-no-model-evidence/upload/
          if-no-files-found: error
          retention-days: 14
      - name: Require the original native result to pass
        if: ${{ always() }}
        env:
          GROK_LAUNCH_OUTCOME: ${{ steps.grok_native.outcome }}
          GROK_PUBLICATION: ${{ steps.grok_native.outputs.publication }}
          GROK_NATIVE_PASSED: ${{ steps.grok_native.outputs.native_passed }}
        run: |
          test "$GROK_LAUNCH_OUTCOME" = success
          test "$GROK_PUBLICATION" = admitted
          test "$GROK_NATIVE_PASSED" = true
