name: VS Code Trusted Project Native
on:
  pull_request:
    paths:
      - '.github/workflows/vscode-project-native.yml'
      - 'scripts/research-vscode-project.py'
      - 'scripts/test_vscode_project_research.py'
      - 'scripts/research-vscode-workspace.py'
      - 'scripts/project_native_vscode_toolchain.py'
      - 'scripts/vscode-project-runtime-observer/**'
      - 'repotests/agentplugins_vscode_project_native_gateway_test.go'
      - 'repotests/testdata/agentplugins_native_probe/**'
      - 'install/integrationctl/agentplugins/research/vscodeworkspace/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/vscode-project-native.yml'
      - 'scripts/research-vscode-project.py'
      - 'scripts/test_vscode_project_research.py'
      - 'scripts/research-vscode-workspace.py'
      - 'scripts/project_native_vscode_toolchain.py'
      - 'scripts/vscode-project-runtime-observer/**'
      - 'repotests/agentplugins_vscode_project_native_gateway_test.go'
      - 'repotests/testdata/agentplugins_native_probe/**'
      - 'install/integrationctl/agentplugins/research/vscodeworkspace/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vscode-project-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    name: VS Code 1.143.1 trusted development-host gateway lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      AGENTPLUGINS_NATIVE_DISPOSABLE_HOSTED: '1'
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Admit actual ordinary-user Ubuntu 24 and exact clean source
        run: |
          python3 - <<'PYTHON'
          import importlib.util, os, sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / 'scripts'))
          spec = importlib.util.spec_from_file_location('trusted_frontend_guard', root / 'scripts/research-vscode-project.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.guard()
          env = {'PATH': '/usr/bin:/bin', 'LANG': 'C.UTF-8', 'GIT_CONFIG_NOSYSTEM': '1', 'GIT_CONFIG_GLOBAL': '/dev/null', 'GIT_TERMINAL_PROMPT': '0'}
          def query(*args):
              record, stdout, stderr = module.shared.run_probe(['/usr/bin/git', *args], root, env, Path('/tmp'), 'source-guard', timeout=10, limit=65536, memory_only=True)
              if record['error'] is not None or record['exit'] != 0 or stderr:
                  raise SystemExit('bounded clean source query failed')
              return stdout.decode('ascii', errors='strict').strip()
          commit, tree = query('rev-parse', 'HEAD'), query('rev-parse', 'HEAD^{tree}')
          if commit != os.environ['EXPECTED_COMMIT'] or not module.legacy.SOURCE_RE.fullmatch(tree) or query('status', '--porcelain', '--untracked-files=normal'):
              raise SystemExit('exact clean trusted source required')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('EXPECTED_TREE=' + tree + '\n')
          PYTHON
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Run inert frontend, toolchain, controller and wrapper contracts
        run: |
          python3 - <<'PYTHON'
          import importlib.util, os, shutil, sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / 'scripts'))
          spec = importlib.util.spec_from_file_location('trusted_contracts', root / 'scripts/research-vscode-project.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.guard()
          go = Path(shutil.which('go')).resolve(strict=True)
          home = Path(os.environ['RUNNER_TEMP']) / 'vscode-project-contract-home'
          home.mkdir(mode=0o700)
          env = {'PATH': str(go.parent) + ':/usr/bin:/bin', 'HOME': str(home), 'LANG': 'C.UTF-8', 'GOTOOLCHAIN': 'local', 'GOENV': 'off', 'GOMAXPROCS': '2', 'GOCACHE': str(home / 'cache'), 'GOMODCACHE': str(home / 'modules'), 'GOPROXY': 'https://proxy.golang.org', 'GOSUMDB': 'sum.golang.org'}
          env.update({key: os.environ[key] for key in module.legacy.GUARD_KEYS})
          commands = [(['/usr/bin/python3', 'scripts/research-vscode-project.py', '--contracts'], 10),
                      (['/usr/bin/python3', '-m', 'unittest', 'discover', '-s', 'scripts', '-p', 'test_project_native_vscode_toolchain.py'], 30),
                      (['/usr/bin/python3', '-m', 'unittest', 'discover', '-s', 'scripts', '-p', 'test_vscode_workspace_research.py'], 30),
                      (['/usr/bin/python3', '-m', 'unittest', 'discover', '-s', 'scripts', '-p', 'test_vscode_project_research.py'], 30),
                      ([str(go), 'test', '-p=1', './install/integrationctl/agentplugins/research/vscodeworkspace'], 240),
                      ([str(go), 'test', '-p=1', './repotests', '-run', '^TestVSCodeProjectGatewayEvidence', '-count=1'], 240)]
          for index, (argv, seconds) in enumerate(commands):
              record, stdout, stderr = module.shared.run_probe(argv, root, env, home, 'contract-' + str(index), timeout=seconds, limit=1048576, memory_only=True)
              print(stdout.decode('utf-8', errors='strict'))
              if record['error'] is not None or record['exit'] != 0:
                  print(stderr.decode('utf-8', errors='replace'))
                  raise SystemExit('required inert trusted project contracts failed')
          PYTHON
      - name: Collect exact public-install and native-gateway lifecycle
        id: collection
        env:
          AGENTPLUGINS_VSCODE_PROJECT_NATIVE_E2E: '1'
          AGENTPLUGINS_VSCODE_PROJECT_OUTPUT: ${{ runner.temp }}/vscode-project-native
        run: |
          python3 - <<'PYTHON'
          import importlib.util, os, shutil, sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / 'scripts'))
          spec = importlib.util.spec_from_file_location('trusted_native_wrapper', root / 'scripts/research-vscode-project.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.guard()
          go = Path(shutil.which('go')).resolve(strict=True)
          home = Path(os.environ['RUNNER_TEMP']) / 'vscode-project-test-home'
          home.mkdir(mode=0o700)
          contract = Path(os.environ['RUNNER_TEMP']) / 'vscode-project-contract-home'
          env = {'PATH': str(go.parent) + ':/usr/bin:/bin', 'HOME': str(home), 'LANG': 'C.UTF-8', 'GOTOOLCHAIN': 'local', 'GOENV': 'off', 'GOMAXPROCS': '2', 'GOCACHE': str(contract / 'cache'), 'GOMODCACHE': str(contract / 'modules'), 'GOPROXY': 'https://proxy.golang.org', 'GOSUMDB': 'sum.golang.org', 'PLUGIN_KIT_AI_REPO_ROOT': str(root)}
          for key in ('GITHUB_ACTIONS', 'RUNNER_ENVIRONMENT', 'AGENTPLUGINS_NATIVE_DISPOSABLE_HOSTED', 'EXPECTED_COMMIT', 'EXPECTED_TREE', 'ImageOS', 'ImageVersion', 'AGENTPLUGINS_VSCODE_PROJECT_NATIVE_E2E', 'AGENTPLUGINS_VSCODE_PROJECT_OUTPUT'):
              env[key] = os.environ[key]
          record, stdout, stderr = module.shared.run_probe([str(go), 'test', '-p=1', './repotests', '-run', '^TestAgentpluginsVSCodeNativeProjectGatewayLifecycle$', '-count=1', '-v', '-timeout=16m'], root, env, home, 'gateway-lifecycle', timeout=980, limit=1048576, memory_only=True)
          print(stdout.decode('utf-8', errors='strict'))
          selected = b'=== RUN   TestAgentpluginsVSCodeNativeProjectGatewayLifecycle' in stdout
          passed = b'--- PASS: TestAgentpluginsVSCodeNativeProjectGatewayLifecycle ' in stdout
          skipped = b'--- SKIP: TestAgentpluginsVSCodeNativeProjectGatewayLifecycle' in stdout
          if record['error'] is not None or record['exit'] not in (0, 1) or not selected or skipped:
              raise SystemExit('native wrapper process/capture/selection unproved')
          lines = stdout.decode('utf-8', errors='strict').splitlines()
          frames = [line[len(module.HANDOFF_PREFIX):] for line in lines if line.startswith(module.HANDOFF_PREFIX)]
          if len(frames) != 1 or len(frames[0].encode()) > 16384:
              raise SystemExit('unique complete artifact handoff required')
          import json
          value = json.loads(frames[0], object_pairs_hook=module.publisher.bounds.unique_object,
                             parse_constant=module.publisher.bounds.invalid_constant)
          paths = module.stage_handoff(value, Path(env['AGENTPLUGINS_VSCODE_PROJECT_OUTPUT']),
                                       Path(os.environ['RUNNER_TEMP']), env['EXPECTED_COMMIT'], env['EXPECTED_TREE'])
          native_passed = record['exit'] == 0 and passed and value['collection_complete'] is True
          # Both files are staged before any output exists. Uploads additionally
          # require this collection step to finish successfully.
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for label, path in sorted(paths.items()):
                  output.write(label + '=' + path + '\n')
              output.write('native_passed=' + str(native_passed).lower() + '\n')
          PYTHON
      - name: Upload exact source, compiler and prepared-input receipt
        if: ${{ success() && steps.collection.outcome == 'success' && steps.collection.outputs.frontend != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: vscode-1.143.1-trusted-project-frontend-linux-amd64
          path: ${{ steps.collection.outputs.frontend }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact admitted native lifecycle evidence
        if: ${{ success() && steps.collection.outcome == 'success' && steps.collection.outputs.native != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: vscode-1.143.1-trusted-project-native-linux-amd64
          path: ${{ steps.collection.outputs.native }}
          if-no-files-found: error
          retention-days: 14
      - name: Require actual native lifecycle success after diagnostic uploads
        if: ${{ always() }}
        env:
          NATIVE_PASSED: ${{ steps.collection.outputs.native_passed }}
        run: |
          test "$NATIVE_PASSED" = true
