name: Live installer audit (30 plugins + 30 Skills)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/live-install-audit.py'
      - 'scripts/test_live_install_audit_env.py'
      - 'tests/live-install/fixtures.json'
      - 'install/integrationctl/agentplugins/adapters/securityscan/scanner*.go'
      - '.github/workflows/live-install-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # pull_request runs check out a synthetic merge commit; retain the source branch HEAD too.
  AUDIT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}

concurrency:
  group: live-install-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-pilot:
    name: Real ${{ matrix.target }} / ${{ matrix.kind }} source install (pilot)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [codex]
        kind: [plugin, skill]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install genuine native Codex CLI without model subscription
        id: native-install-pilot
        run: |
          npm install --global @openai/codex@0.153.4
          command -v codex
          codex --version
      # The Go source defaults to 0.1.0-development; signed directory policies
      # require an ordinary release-semver CLI. This is still the PR source
      # binary, NOT the published agentplugins-v0.1.95 release.
      - name: Refuse ambient native-profile and Git configuration leakage
        run: python3 -m unittest discover -s scripts -p 'test_live_install_audit_env.py'
      - name: Verify exact empty-stderr LintAI exit diagnostic
        run: go test ./install/integrationctl/agentplugins/adapters/securityscan -run '^TestCommandScannerIncludesNonzeroExitWhenStderrIsEmpty$' -count=1
      - name: Build actual PR CLI with current eligible directory version policy
        run: go build -trimpath -ldflags='-X main.version=0.1.95' -o "$RUNNER_TEMP/agentplugins-audit" ./cli/cmd/agentplugins
      - name: Run isolated real source install and remove; preserve per-case proof
        env:
          AUDIT_VENDOR_OUTCOME: ${{ steps.native-install-pilot.outcome }}
          AUDIT_REPORT_DIR: ${{ runner.temp }}/live-audit-report
          AUDIT_KIND: ${{ matrix.kind }}
          AUDIT_TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/live-install-audit.py \
            --cli "$RUNNER_TEMP/agentplugins-audit" \
            --target "$AUDIT_TARGET" --kind "$AUDIT_KIND" --limit 2 \
            --report-dir "$AUDIT_REPORT_DIR"
      - name: Upload audit JSON on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: live-install-pilot-${{ matrix.target }}-${{ matrix.kind }}
          path: ${{ runner.temp }}/live-audit-report/
          if-no-files-found: warn
          retention-days: 14


  published-cli-smoke:
    name: Published npm 0.1.95 / Codex CLI parity
    needs: native-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install the actual public npm installer and Codex
        id: published-install
        run: |
          npm install --global universal-agent-plugins@0.1.95 @openai/codex@0.153.4
          agentplugins version
          codex --version
      - name: Real published-package smoke (two sources per kind)
        env:
          AUDIT_VENDOR_OUTCOME: ${{ steps.published-install.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/published-proof"
          result=0
          for kind in plugin skill; do
            python3 scripts/live-install-audit.py --cli "$(command -v agentplugins)" \
              --target codex --kind "$kind" --limit 2 \
              --report-dir "$RUNNER_TEMP/published-proof" || result=1
          done
          exit "$result"
      - name: Upload published CLI source-install proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: live-install-published-codex
          path: ${{ runner.temp }}/published-proof/
          if-no-files-found: warn
          retention-days: 14

  real-native-cli-matrix:
    name: All 30 ${{ matrix.kind }} / native ${{ matrix.target }}
    needs: native-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target: [codex, claude, opencode, gemini, copilot, cline, kimi, qoder, pi]
        kind: [plugin, skill]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install real native client binary, no login or model call
        id: native-install
        env:
          TARGET: ${{ matrix.target }}
          KIND: ${{ matrix.kind }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET" in
            codex) npm install --global @openai/codex@0.153.4 ;;
            claude) npm install --global @anthropic-ai/claude-code@2.1.263 ;;
            opencode) npm install --global opencode-ai@1.18.34 ;;
            gemini) npm install --global @google/gemini-cli@0.66.0 ;;
            copilot) npm install --global @github/copilot@1.0.105 ;;
            cline) npm install --global cline@3.0.74 ;;
            kimi)
              # Project Skills qualify only against observed 2.3.1/2.3.2.
              if [[ "$KIND" == "skill" ]]; then
                npm install --global @moonshot-ai/kimi-code@2.3.2
              else
                npm install --global @moonshot-ai/kimi-code@2.4.1
              fi
              ;;
            qoder) npm install --global @qoder-ai/qodercli@1.1.81 ;;
            pi) npm install --global --ignore-scripts @earendil-works/pi-coding-agent@1.5.0 ;;
            *) exit 2 ;;
          esac
          binary="$TARGET"
          if [[ "$TARGET" == qoder ]]; then binary=qodercli; fi
          command -v "$binary"
          timeout 25s "$binary" --version
      - name: Build PR source CLI with current signed Registry eligibility version
        if: ${{ !cancelled() }} # BUG-010: retain negative evidence after native bootstrap failure
        run: go build -trimpath -ldflags='-X main.version=0.1.95' -o "$RUNNER_TEMP/agentplugins-audit" ./cli/cmd/agentplugins
      - name: Attempt all 30 independent pinned sources in isolated profiles
        if: ${{ !cancelled() }} # Missing client produces explicit non-PASS source rows
        env:
          TARGET: ${{ matrix.target }}
          KIND: ${{ matrix.kind }}
          AUDIT_VENDOR_OUTCOME: ${{ steps.native-install.outcome }}
        run: |
          python3 scripts/live-install-audit.py --cli "$RUNNER_TEMP/agentplugins-audit" \
            --target "$TARGET" --kind "$KIND" --limit 30 \
            --report-dir "$RUNNER_TEMP/full-proof"
      - name: Upload all per-source installation outcomes (even on failures)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: live-install-full-${{ matrix.target }}-${{ matrix.kind }}
          path: ${{ runner.temp }}/full-proof/
          if-no-files-found: warn
          retention-days: 14
