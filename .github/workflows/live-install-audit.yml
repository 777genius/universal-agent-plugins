name: Live installer audit (30 plugins + 30 Skills)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - '.github/workflows/pr-changes.yml'
      - 'scripts/prepare-codex-linux-sandbox.sh'
      - 'scripts/live-install-audit.py'
      - 'scripts/pi_project_skill_audit.py'
      - 'scripts/test_pi_project_skill_audit.py'
      - 'scripts/test_native_client_research.py'
      - 'scripts/qoder_prepared_skill_audit.py'
      - 'scripts/test_qoder_prepared_skill_audit.py'
      - 'scripts/native_client_research.py'
      - 'scripts/published_codex_baseline.py'
      - 'scripts/test_published_codex_baseline.py'
      - 'scripts/test_live_install_audit_env.py'
      - 'scripts/test_live_install_audit_components.py'
      - 'scripts/test_live_install_audit_opencode_negative.py'
      - 'scripts/test_kimi_repeat_log_audit.py'
      - 'scripts/codex_runtime_audit.py'
      - 'scripts/codex_plugin_retention_audit.py'
      - 'scripts/gemini_windows_custody.py'
      - 'scripts/test_gemini_windows_runtime_audit.py'
      - 'scripts/opencode_bootstrap_audit.py'
      - 'scripts/test_opencode_bootstrap_audit.py'
      - 'scripts/test_codex_plugin_retention_audit.py'
      - 'scripts/gemini_runtime_audit.py'
      - 'scripts/claude_cache_retirement_audit.py'
      - 'scripts/windows_owned_job.py'
      - 'scripts/test_codex_runtime_audit.py'
      - 'tests/live-install/fixtures.json'
      - 'install/integrationctl/agentplugins/adapters/securityscan/scanner*.go'
      - '.github/workflows/live-install-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  # pull_request runs check out a synthetic merge commit; retain the source branch HEAD too.
  AUDIT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}

concurrency:
  group: live-install-audit-${{ github.event_name }}-${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || (github.event.label.name == 'ci:full' && github.event.pull_request.draft == true)) && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || (github.event.label.name == 'ci:full' && github.event.pull_request.draft == true)) }}

jobs:
  changes:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'labeled' || (github.event.label.name == 'ci:full' && github.event.pull_request.draft == true)) && (github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
    uses: ./.github/workflows/pr-changes.yml
    permissions:
      pull-requests: read
  native-pilot:
    needs: changes
    name: Real ${{ matrix.target }} / ${{ matrix.kind }} source install (pilot)
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.action != 'labeled' || (github.event.label.name == 'ci:full' && github.event.pull_request.draft == true)) && (github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ci:full'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [codex]
        kind: [plugin, skill]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install native Codex sandbox prerequisite
        shell: bash
        run: bash scripts/prepare-codex-linux-sandbox.sh
      - name: Install genuine native Codex CLI without model subscription
        id: native-install-pilot
        run: |
          npm install --global @openai/codex@0.153.4
          command -v codex
          codex --version
      # The Go source defaults to 0.1.0-development; signed directory policies
      # require an ordinary release-semver CLI. This is still the PR source
      # binary, NOT a published release binary; historical 0.1.95 stays separate.
      - name: Refuse ambient native-profile and Git configuration leakage
        run: |
          python3 -m unittest discover -s scripts -p 'test_live_install_audit_env.py'
          python3 -m unittest discover -s scripts -p 'test_qoder_prepared_skill_audit.py'
          python3 -m unittest discover -s scripts -p 'test_pi_project_skill_audit.py'
          python3 -m unittest discover -s scripts -p 'test_native_client_research.py'
          python3 -m unittest discover -s scripts -p 'test_live_install_audit_components.py'
          python3 -m unittest discover -s scripts -p 'test_live_install_audit_opencode_negative.py'
          python3 -m unittest discover -s scripts -p 'test_kimi_repeat_log_audit.py'
          python3 -m unittest discover -s scripts -p 'test_gemini_windows_runtime_audit.py'
          python3 -m unittest discover -s scripts -p 'test_opencode_bootstrap_audit.py'
          python3 -m unittest discover -s scripts -p 'test_codex_runtime_audit.py'
          python3 -m unittest discover -s scripts -p 'test_codex_plugin_retention_audit.py'
      - name: Verify exact empty-stderr LintAI exit diagnostic
        run: go test ./install/integrationctl/agentplugins/adapters/securityscan -run '^TestCommandScannerIncludesNonzeroExitWhenStderrIsEmpty$' -count=1
      - name: Build actual PR CLI with current eligible directory version policy
        run: go build -trimpath -ldflags='-X main.version=0.1.115' -o "$RUNNER_TEMP/agentplugins-audit" ./cli/cmd/agentplugins
      - name: Run isolated real source install and remove; preserve per-case proof
        env:
          AUDIT_VENDOR_OUTCOME: ${{ steps.native-install-pilot.outcome }}
          AUDIT_REPORT_DIR: ${{ runner.temp }}/live-audit-report
          AUDIT_KIND: ${{ matrix.kind }}
          AUDIT_TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/live-install-audit.py \
            --cli "$RUNNER_TEMP/agentplugins-audit" \
            --target "$AUDIT_TARGET" --kind "$AUDIT_KIND" --limit 2 \
            --report-dir "$AUDIT_REPORT_DIR"
      - name: Upload audit JSON on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: live-install-pilot-${{ matrix.target }}-${{ matrix.kind }}
          path: ${{ runner.temp }}/live-audit-report/
          if-no-files-found: warn
          retention-days: 14


  published-cli-smoke:
    name: Historical npm 0.1.95 / Codex lifecycle and default refusal
    needs: native-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install native Codex sandbox prerequisite
        shell: bash
        run: bash scripts/prepare-codex-linux-sandbox.sh
      - name: Verify historical observer negative controls
        run: python3 -m unittest discover -s scripts -p test_published_codex_baseline.py
      - name: Install the actual public npm installer and Codex
        id: published-install
        run: |
          npm install --global universal-agent-plugins@0.1.95 @openai/codex@0.153.4
          agentplugins version
          codex --version
      - name: Real published-package smoke (two sources per kind)
        env:
          AUDIT_VENDOR_OUTCOME: ${{ steps.published-install.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/published-proof"
          result=0
          for kind in plugin skill; do
            # Keep this immutable release's lifecycle distinct from current Ready.
            # Observe the default feed refusal separately; only the plugin
            # lifecycle uses the unexpired, original-key official sequence 48.
            acceptance=published-0.1.95-codex-plugins-archived-feed
            if [ "$kind" = skill ]; then acceptance=published-0.1.95-codex-skills; fi
            python3 scripts/live-install-audit.py --cli "$(command -v agentplugins)" \
              --target codex --kind "$kind" --limit 2 --acceptance "$acceptance" \
              --report-dir "$RUNNER_TEMP/published-proof" || result=1
          done
          exit "$result"
      - name: Upload published CLI source-install proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: live-install-published-codex
          path: ${{ runner.temp }}/published-proof/
          if-no-files-found: warn
          retention-days: 14

  real-native-cli-matrix:
    name: All 30 ${{ matrix.kind }} / ${{ matrix.target == 'pi' && matrix.kind == 'skill' && 'foreign Prepared + clean native' || matrix.target == 'qoder' && matrix.kind == 'skill' && 'Prepared installation' || 'native' }} ${{ matrix.target }}
    needs: [changes, native-pilot]
    if: ${{ !cancelled() && needs.native-pilot.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.live_clients != '[]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target: ${{ fromJSON(needs.changes.result == 'success' && needs.changes.outputs.live_clients || '["codex","claude","opencode","gemini","copilot","cline","kimi","qoder","pi"]') }}
        kind: [plugin, skill]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install native Codex sandbox prerequisite
        if: ${{ matrix.target == 'codex' }}
        shell: bash
        run: bash scripts/prepare-codex-linux-sandbox.sh
      - name: Install real native client binary, no login or model call
        id: native-install
        env:
          TARGET: ${{ matrix.target }}
          KIND: ${{ matrix.kind }}
          CLINE_NO_AUTO_UPDATE: '1'
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET" in
            codex) npm install --global @openai/codex@0.153.4 ;;
            claude) npm install --global @anthropic-ai/claude-code@2.1.263 ;;
            opencode) npm install --global opencode-ai@1.18.34 ;;
            gemini) npm install --global @google/gemini-cli@0.66.0 ;;
            copilot) npm install --global @github/copilot@1.0.105 ;;
            cline) npm install --global cline@3.0.74 ;;
            kimi)
              # Project Skills qualify only against observed 2.3.1/2.3.2.
              if [[ "$KIND" == "skill" ]]; then
                npm install --global @moonshot-ai/kimi-code@2.3.2
              else
                npm install --global @moonshot-ai/kimi-code@2.4.1
              fi
              ;;
            qoder) npm install --global @qoder-ai/qodercli@1.1.81 ;;
            pi) npm install --global --ignore-scripts @earendil-works/pi-coding-agent@1.5.0 ;;
            *) exit 2 ;;
          esac
          binary="$TARGET"
          if [[ "$TARGET" == qoder ]]; then binary=qodercli; fi
          command -v "$binary"
          native_version=$(timeout 25s "$binary" --version)
          printf '%s\n' "$native_version"
          if [[ "$TARGET" == cline ]]; then [[ "$native_version" == 3.0.74 ]]; fi
      - name: Build PR source CLI with current signed Registry eligibility version
        if: ${{ !cancelled() }} # BUG-010: retain negative evidence after native bootstrap failure
        run: go build -trimpath -ldflags='-X main.version=0.1.115' -o "$RUNNER_TEMP/agentplugins-audit" ./cli/cmd/agentplugins
      - name: Attempt all 30 independent pinned sources in isolated profiles
        if: ${{ !cancelled() }} # Missing client produces explicit non-PASS source rows
        env:
          TARGET: ${{ matrix.target }}
          KIND: ${{ matrix.kind }}
          AUDIT_VENDOR_OUTCOME: ${{ steps.native-install.outcome }}
        run: |
          if [[ "$TARGET" == pi && "$KIND" == skill ]]; then
            # Two independent fresh invocations: never move or remove a foreign
            # Skill to turn an existing Prepared project into a trusted one.
            foreign_status=0
            python3 scripts/live-install-audit.py --cli "$RUNNER_TEMP/agentplugins-audit" \
              --target pi --kind skill --limit 30 --acceptance pi-foreign-prepared-skills-installation \
              --report-dir "$RUNNER_TEMP/full-proof/pi-foreign-prepared" || foreign_status=$?
            native_status=0
            python3 scripts/live-install-audit.py --cli "$RUNNER_TEMP/agentplugins-audit" \
              --target pi --kind skill --limit 30 --acceptance pi-clean-native-skills \
              --report-dir "$RUNNER_TEMP/full-proof/pi-clean-native" || native_status=$?
            [[ "$foreign_status" -eq 0 && "$native_status" -eq 0 ]]
          else
            acceptance=native
            if [[ "$TARGET" == qoder && "$KIND" == skill ]]; then
              acceptance=qoder-prepared-skills-installation
            fi
            python3 scripts/live-install-audit.py --cli "$RUNNER_TEMP/agentplugins-audit" \
              --target "$TARGET" --kind "$KIND" --limit 30 --acceptance "$acceptance" \
              --report-dir "$RUNNER_TEMP/full-proof"
          fi
      - name: Verify the audited Cline version matches this workflow pin
        if: ${{ !cancelled() && matrix.target == 'cline' }}
        env:
          KIND: ${{ matrix.kind }}
        run: |
          python3 - <<'CLINE_PIN'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "full-proof" /
                               ("cline-" + os.environ["KIND"] + ".json")).read_text())
          version = report.get("client_version", {})
          if not (version.get("status") == "reported" and version.get("value") == "3.0.74"
                  and type(version.get("exit_code")) is int and version["exit_code"] == 0):
              raise SystemExit("Cline audit did not observe this workflow's pinned 3.0.74: " + repr(version))
          CLINE_PIN
      - name: Upload all per-source installation outcomes (even on failures)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: live-install-full-${{ matrix.target }}-${{ matrix.kind }}
          path: ${{ runner.temp }}/full-proof/
          if-no-files-found: warn
          retention-days: 14
