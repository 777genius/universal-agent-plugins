name: Hermes permission phase contract

on:
  push:
    branches: [diagnostics/hermes-2b-original-readout-20261115]
    paths:
      - .github/workflows/hermes-2b-original-readout.yml
      - scripts/test_hermes_passive_history_control.py

permissions:
  contents: read

jobs:
  corrected-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Bind the corrected fixture to the completed original run
        run: |
          python3 -B - <<'PY'
          import os, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = 'ce4f11145b062a48faf827584a2617ffcbb1b844'
          head = git('rev-parse', 'HEAD')
          assert head == os.environ['GITHUB_SHA']
          assert git('rev-list', '--parents', '-n', '1', head).split() == [head, base]
          assert git('status', '--porcelain', '--untracked-files=all') == ''
          assert set(git('diff', '--name-status', base, head).splitlines()) == {
              'M\t.github/workflows/hermes-2b-original-readout.yml',
              'M\tscripts/test_hermes_passive_history_control.py'}
          assert git('rev-parse', 'HEAD:scripts/test_hermes_passive_history_control.py') == '1be965bc0a15a9cfcd08f83f0ecef343ea6902ee'
          assert git('rev-parse', 'HEAD:scripts/hermes_passive_history_control.py') == 'f59d4feb9f95a3f3554a4efc32ae3980cae9514a'
          PY
      - name: Execute only the corrected permission phase contract
        working-directory: scripts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest -v test_hermes_passive_history_control.OriginalLedgerCapture.test_private_permission_policy_precedes_capture_and_preserves_original_history
