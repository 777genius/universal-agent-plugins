name: Dependency Review

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Replace ordinary CI for the same PR/ref; keep manual runs independent.
concurrency:
  group: dependency-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:github-hosted') && 'ubuntu-latest' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - name: Refuse an unavailable push comparison base
        if: github.event_name == 'push'
        env:
          BASE: ${{ github.event.before }}
        run: |
          [[ "${BASE}" =~ ^[0-9a-f]{40}$ && "${BASE}" != 0000000000000000000000000000000000000000 ]]

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          config-file: ./.github/dependency-review-config.yml
          base-ref: ${{ github.event_name == 'push' && github.event.before || '' }}
          head-ref: ${{ github.event_name == 'push' && github.sha || '' }}
