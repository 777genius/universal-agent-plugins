name: PR571 profile pin objects

on:
  push:
    branches: [diagnostic/pr571-required-20261030]
    paths: [.github/workflows/pr571-profile-pin-objects.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == '777genius/universal-agent-plugins'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Prepare hash-verified unreferenced objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          repo = 'repos/777genius/universal-agent-plugins/'
          head = '7fea8522f1eb22156d9e069056ff0e5cb6f724f3'
          tree = '3570455acc97139a075b290af2eafd39fa4eaf76'
          old = b'93ebbf02aa70a38b18fdc720ace9e45c8f911b91d94a5c85a26b96c2d69efa46'
          new = b'1b15ef92a8baaa1dbc92b512365cd694e4cc2ba5b24a951cb2c395468d129b09'
          def api(path, payload=None):
              args = ['gh', 'api', repo + path]
              if payload is not None:
                  args += ['--method', 'POST', '--input', '-']
              result = subprocess.run(args, input=None if payload is None else json.dumps(payload), text=True, capture_output=True, check=True, timeout=45)
              return json.loads(result.stdout)
          def blob_id(body):
              return hashlib.sha1(f'blob {len(body)}\0'.encode() + body).hexdigest()
          assert api('git/ref/heads/fix/mcp-opaque-placeholders-20261029')['object']['sha'] == head
          assert api('git/commits/' + head)['tree']['sha'] == tree
          profile = api('contents/install/integrationctl/agentplugins/conformance/profiles/README.md?ref=' + head)
          assert hashlib.sha256(base64.b64decode(profile['content'])).hexdigest().encode() == new
          files = [
              ('npm/agentplugins/scripts/authoring-native-qualification.js', 'f4b3db14df10b0ee538c0d4753678d4053f1e86a', '16198dec07e315c665fe59f5b5db25f803dea489'),
              ('npm/agentplugins/scripts/public-authoring-acceptance.js', '14ea9f85006db2e0a4b5c6d0afa83293e11f4a36', 'b5e40522ef24e5eceae29190db95a769048a1d54'),
              ('npm/agentplugins/test/authoring-native-qualification.test.js', '7f485537b2306c984ef00a8f0c252876d5ffaa07', '3a12fd65bc4a9b066bcff4bb78a5bbdc93f95aa0'),
          ]
          entries = []
          for path, before, after in files:
              value = api('contents/' + path + '?ref=' + head)
              body = base64.b64decode(value['content'])
              assert value['sha'] == before and blob_id(body) == before
              if '/scripts/' in path:
                  assert body.count(old) == 1
                  body = body.replace(old, new)
              else:
                  needle = b'test("fixed profile and schema pins agree with preserved domain contracts", { skip: STAGED_SOURCE_CHECKOUT && "requires the complete repository source tree" }, () => {\n  const n = internal().test, root = path.resolve(__dirname, "../../..");\n'
                  assert body.count(needle) == 1
                  body = body.replace(needle, needle + b'  assert.deepEqual(n.PROFILES, require("../scripts/public-authoring-acceptance").PROFILES);\n')
              assert blob_id(body) == after
              created = api('git/blobs', {'content': base64.b64encode(body).decode(), 'encoding': 'base64'})
              assert created['sha'] == after
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': after})
          result_tree = api('git/trees', {'base_tree': tree, 'tree': entries})
          commit = api('git/commits', {'message': 'fix: align authoring evidence pins with the corrected profile', 'tree': result_tree['sha'], 'parents': [head], 'author': {'name': '777genius', 'email': 'iliyazelenkog@gmail.com'}})
          pathlib.Path('evidence/commit.json').write_text(json.dumps(commit, indent=2))
          pathlib.Path('evidence/changes.json').write_text(json.dumps(entries, indent=2))
          print('Prepared commit ' + commit['sha'] + '; no branch reference changed')
          PY
      - name: Retain preparation receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr571-profile-pin-objects
          path: evidence/
          retention-days: 3
          if-no-files-found: error
