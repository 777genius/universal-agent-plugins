name: PR571 profile pin objects

on:
  push:
    branches: [diagnostic/pr571-required-20261030]
    paths: [.github/workflows/pr571-profile-pin-objects.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == '777genius/universal-agent-plugins'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Prepare one verified fixture blob without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          repo = 'repos/777genius/universal-agent-plugins/'
          head = '583ad8039b7fcc60bde302e5a8f0dd436d621afe'
          tree = '1de4d13f26ab2b97d0b6b216577ae4ac9e57bda2'
          old = b'93ebbf02aa70a38b18fdc720ace9e45c8f911b91d94a5c85a26b96c2d69efa46'
          new = b'1b15ef92a8baaa1dbc92b512365cd694e4cc2ba5b24a951cb2c395468d129b09'
          path = 'npm/agentplugins/test/authoring-native-qualification.test.js'
          before = '3a12fd65bc4a9b066bcff4bb78a5bbdc93f95aa0'
          after = '00f54e125f3921c69ae9ec54f608cd64b36ab7bc'
          def api(path, payload=None):
              args = ['gh', 'api', repo + path]
              if payload is not None:
                  args += ['--method', 'POST', '--input', '-']
              result = subprocess.run(args, input=None if payload is None else json.dumps(payload), text=True, capture_output=True, check=True, timeout=45)
              return json.loads(result.stdout)
          def blob_id(body):
              return hashlib.sha1(f'blob {len(body)}\0'.encode() + body).hexdigest()
          assert api('git/ref/heads/fix/mcp-opaque-placeholders-20261029')['object']['sha'] == head
          assert api('git/commits/' + head)['tree']['sha'] == tree
          profile = api('contents/install/integrationctl/agentplugins/conformance/profiles/README.md?ref=' + head)
          assert hashlib.sha256(base64.b64decode(profile['content'])).hexdigest().encode() == new
          value = api('contents/' + path + '?ref=' + head)
          body = base64.b64decode(value['content'])
          assert value['sha'] == before and blob_id(body) == before
          assert body.count(old) == 1
          body = body.replace(old, new)
          assert blob_id(body) == after
          created = api('git/blobs', {'content': base64.b64encode(body).decode(), 'encoding': 'base64'})
          assert created['sha'] == after
          entries = [{'path': path, 'mode': '100644', 'type': 'blob', 'sha': after}]
          result_tree = api('git/trees', {'base_tree': tree, 'tree': entries})
          commit = api('git/commits', {'message': 'test: align the subprocess fixture with the corrected profile', 'tree': result_tree['sha'], 'parents': [head], 'author': {'name': '777genius', 'email': 'iliyazelenkog@gmail.com'}})
          pathlib.Path('evidence/commit.json').write_text(json.dumps(commit, indent=2))
          pathlib.Path('evidence/changes.json').write_text(json.dumps(entries, indent=2))
          print('Prepared commit ' + commit['sha'] + '; no branch reference changed')
          PY
      - name: Retain preparation receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr571-profile-pin-objects
          path: evidence/
          retention-days: 3
          if-no-files-found: error
