name: OpenCode SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Qualify an immutable opencode-events-vX.Y.Z tag, without publishing
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'sdk/opencode-js/**'
      - 'sdk/opencode/**'
      - '.github/workflows/opencode-sdk.yml'
  pull_request:
    paths:
      - 'sdk/opencode-js/**'
      - 'sdk/opencode/**'
      - '.github/workflows/opencode-sdk.yml'

# Replace ordinary CI for the same PR/ref; keep manual runs independent.
concurrency:
  group: opencode-sdk-${{ github.event_name }}-${{ github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  package-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && matrix.os || startsWith(matrix.os, 'ubuntu-') && (vars.CI_LINUX_RUNNER || matrix.os) || matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Check observer and pack public API
        working-directory: sdk/opencode-js
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run check:packed

  go-contract:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Check neutral wire decoder
        working-directory: sdk
        run: go test -count=1 ./opencode

  native-contract:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Qualify packed SDK through both real native hosts
        working-directory: sdk/opencode-js
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/TEST-opencode-sdk-native"
          mkdir -p "${root}/tmp" "${root}/cache" "${root}/tools" "${root}/package" "${root}/evidence"
          export TMPDIR="${root}/tmp" npm_config_cache="${root}/cache"
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/typescript/bin/tsc -p scripts/native-tsconfig.json
          npm pack --ignore-scripts --json --pack-destination "${root}/package" > "${root}/package/pack.json"
          tarball="${root}/package/$(jq -er '.[0].filename' "${root}/package/pack.json")"
          npm install --prefix "${root}/tools" --registry=https://registry.npmjs.org/ --legacy-peer-deps --ignore-scripts --no-audit --no-fund \
            "${tarball}" opencode-ai@1.19.3 @opencode/cli@2.0.32 @opencode/plugin@2.0.32 @opencode/client@2.0.32
          node "${root}/tools/node_modules/opencode-ai/postinstall.mjs"
          node "${root}/tools/node_modules/@opencode/cli/postinstall.mjs"
          node scripts/native-qualify.ts "${root}" v1 "${tarball}"
          node scripts/native-qualify.ts "${root}" v2 "${tarball}"
          v1_run="$(find "${root}" -maxdepth 1 -type d -name 'run-v1-*')"
          v2_run="$(find "${root}" -maxdepth 1 -type d -name 'run-v2-*')"
          node scripts/native-receipt.ts "${root}" "${GITHUB_SHA}" "${v1_run}" "${v2_run}" "${root}/package/pack.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: ${{ always() }}
        with:
          name: opencode-sdk-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/TEST-opencode-sdk-native/run-*/result.json
            ${{ runner.temp }}/TEST-opencode-sdk-native/run-*/evidence.jsonl
            ${{ runner.temp }}/TEST-opencode-sdk-native/run-*/host.log
            ${{ runner.temp }}/TEST-opencode-sdk-native/package/pack.json
            ${{ runner.temp }}/TEST-opencode-sdk-native/evidence/native-qualification.json
          if-no-files-found: warn
          retention-days: 30

  release-artifact:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [package-contract, go-contract, native-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify immutable SDK tag and pack exact source
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${GITHUB_REF}" = "refs/tags/opencode-events-v${VERSION}"
          test "$(git rev-list -n 1 "${GITHUB_REF}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          cd sdk/opencode-js
          test "$(node -p 'require("./package.json").version')" = "${VERSION}"
          test "$(node -p 'require("./package.json").name')" = universal-agent-plugins-opencode-events
          mkdir -p "${RUNNER_TEMP}/opencode-sdk"
          npm pack --ignore-scripts --json --pack-destination "${RUNNER_TEMP}/opencode-sdk" > "${RUNNER_TEMP}/opencode-sdk/pack.json"
          cd "${RUNNER_TEMP}/opencode-sdk"
          sha256sum *.tgz > checksums.txt
          printf '%s\n' "${GITHUB_SHA}" > source-commit.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/opencode-sdk/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: opencode-events-${{ inputs.version }}
          path: ${{ runner.temp }}/opencode-sdk/
          if-no-files-found: error
          retention-days: 30
