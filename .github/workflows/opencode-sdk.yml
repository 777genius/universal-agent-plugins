name: OpenCode SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdk/opencode-js/**'
      - 'sdk/opencode/**'
      - '.github/workflows/opencode-sdk.yml'
  pull_request:
    paths:
      - 'sdk/opencode-js/**'
      - 'sdk/opencode/**'
      - '.github/workflows/opencode-sdk.yml'

permissions:
  contents: read

jobs:
  package-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Check observer and pack public API
        working-directory: sdk/opencode-js
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run check:packed

  go-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: false
      - name: Check neutral wire decoder
        working-directory: sdk
        run: go test -count=1 ./opencode
