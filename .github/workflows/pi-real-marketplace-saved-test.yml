name: Pi real marketplace four-package saved cohort E2E (test-only)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pi-real-marketplace-saved-test.yml'
      - 'cli/internal/agentpluginscli/pi_real_marketplace_saved_e2e_test.go'
      - 'cli/internal/agentpluginscli/pi_modern_saved_closure_test.go'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-real-saved-test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pinned-saved:
    name: Pi immutable marketplace / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      GOMAXPROCS: '2'
      UAP_PI_REAL_SAVED_E2E: '1'
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Require exact immutable source checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
      - name: Verify real immutable marketplace sources and four-node saved Pi closure
        shell: bash
        run: |
          go test -p=2 -count=1 -timeout=20m -v ./cli/internal/agentpluginscli \
            -run '^TestPiRealMarketplaceSignedTestCohortSavedClosure$'
