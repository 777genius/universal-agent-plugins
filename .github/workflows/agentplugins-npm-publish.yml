name: Agentplugins NPM Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact public Agentplugins release tag (agentplugins-vX.Y.Z)
        required: true
        type: string
      publish:
        description: Publish the verified package to npm with trusted provenance
        required: true
        default: false
        type: boolean
      producer_mode:
        description: Legacy publication or isolated prepublication pair staging
        required: true
        type: choice
        default: legacy
        options: [legacy, paired-stage]
      source_sha:
        description: Exact paired source and workflow SHA
        type: string
        required: false
      plugin_kit_version:
        description: Paired kit version, exactly 2.0.0
        type: string
        required: false
      native_inputs:
        description: Exact retained canonical I UTF-8 bytes including final newline, comparison only
        type: string
        required: false
      input_artifact:
        description: Exact completed I locator JSON, run_id run_attempt artifact_id artifact_sha256
        type: string
        required: false

permissions:
  contents: read
  attestations: read

concurrency:
  group: agentplugins-npm-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  dispatch_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      PRODUCER_MODE: ${{ inputs.producer_mode }}
      TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      KIT_VERSION: ${{ inputs.plugin_kit_version }}
      PUBLISH: ${{ inputs.publish }}
      NATIVE_INPUTS: ${{ inputs.native_inputs }}
      INPUT_ARTIFACT: ${{ inputs.input_artifact }}
    steps:
      - name: C1 preflight
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:${PATH}"
          [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]
          case "${PRODUCER_MODE}" in
            legacy) [[ -z "${SOURCE_SHA}${KIT_VERSION}${NATIVE_INPUTS}${INPUT_ARTIFACT}" ]]; exit 0 ;;
            paired-stage) [[ "${PUBLISH}" == false ]] ;;
            *) exit 1 ;;
          esac
          [[ "${GITHUB_ACTIONS}" == true && "${GITHUB_REPOSITORY}" == 777genius/universal-agent-plugins ]]
          [[ "${TAG}" =~ ^agentplugins-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ && ${#TAG} -le 47 ]]
          [[ "${KIT_VERSION}" == 2.0.0 && "${TAG}" != agentplugins-v2.0.0 ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ && ! "${SOURCE_SHA}" =~ ^0+$ ]]
          [[ "${GITHUB_SHA}" == "${SOURCE_SHA}" && "${GITHUB_WORKFLOW_SHA}" == "${SOURCE_SHA}" ]]
          [[ "${GITHUB_REF}" == "refs/tags/${TAG}" ]]
          [[ "${GITHUB_WORKFLOW_REF}" == "777genius/universal-agent-plugins/.github/workflows/agentplugins-npm-publish.yml@refs/tags/${TAG}" ]]
          positive() { [[ "$1" =~ ^[1-9][0-9]{0,15}$ && "$1" -le 9007199254740991 ]]; }
          positive "${GITHUB_RUN_ID}"
          positive "${GITHUB_RUN_ATTEMPT}"; [[ "${GITHUB_RUN_ATTEMPT}" -le 1000 ]]
          [[ ${#NATIVE_INPUTS} -gt 0 && ${#NATIVE_INPUTS} -le 32768 && "${NATIVE_INPUTS}" == *$'\n' ]]
          locator='^[[:space:]]*\{[[:space:]]*"run_id":[[:space:]]*([1-9][0-9]{0,15}),[[:space:]]*"run_attempt":[[:space:]]*([1-9][0-9]{0,3}),[[:space:]]*"artifact_id":[[:space:]]*([1-9][0-9]{0,15}),[[:space:]]*"artifact_sha256":[[:space:]]*"([0-9a-f]{64})"[[:space:]]*\}[[:space:]]*$'
          [[ "${INPUT_ARTIFACT}" =~ $locator ]]
          run_id="${BASH_REMATCH[1]}"; artifact_id="${BASH_REMATCH[3]}"
          positive "${run_id}"; positive "${artifact_id}"
          [[ "${INPUT_ARTIFACT}" =~ $locator ]]
          [[ "${BASH_REMATCH[2]}" -le 1000 && ! "${BASH_REMATCH[4]}" =~ ^0+$ ]]
  prepare:
    needs: dispatch_contract
    if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.producer_mode == 'legacy' && needs.dispatch_contract.result == 'success' }}
    name: Verify release and stage npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.stage.outputs.version }}
      commit: ${{ steps.stage.outputs.commit }}
      package_name: ${{ steps.stage.outputs.package_name }}
      tarball_file: ${{ steps.stage.outputs.tarball_file }}
      tarball_integrity: ${{ steps.stage.outputs.tarball_integrity }}
      tarball_shasum: ${{ steps.stage.outputs.tarball_shasum }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify exact public release identity and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^agentplugins-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${GITHUB_REF}" = "refs/tags/${TAG}"
          commit="$(git rev-parse HEAD)"
          test "${commit}" = "$(git rev-list -n 1 "refs/tags/${TAG}")"
          git fetch --no-tags --force origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${commit}" refs/remotes/origin/main
          release_json="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,isPrerelease,tagName,assets)"
          version="${TAG#agentplugins-v}"
          expected_names="THIRD_PARTY_NOTICES.txt agentplugins_${version}_darwin_amd64 agentplugins_${version}_darwin_arm64 agentplugins_${version}_linux_amd64 agentplugins_${version}_linux_arm64 agentplugins_${version}_windows_amd64.exe agentplugins_${version}_windows_arm64.exe checksums.txt release-manifest.json"
          actual_names="$(jq -r '.assets[].name' <<<"${release_json}" | sort | tr '\n' ' ' | sed 's/ $//')"
          expected_sorted="$(printf '%s\n' ${expected_names} | sort | tr '\n' ' ' | sed 's/ $//')"
          jq -e --arg tag "${TAG}" '.isDraft == false and .isPrerelease == false and .tagName == $tag' <<<"${release_json}" >/dev/null
          test "${actual_names}" = "${expected_sorted}"
          mkdir -p "${RUNNER_TEMP}/release-assets"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${RUNNER_TEMP}/release-assets"
          node npm/agentplugins/scripts/release-assets.js verify "${RUNNER_TEMP}/release-assets" "${TAG}" "${commit}" > "${RUNNER_TEMP}/verified-release.json"
          for asset in "${RUNNER_TEMP}"/release-assets/agentplugins_* "${RUNNER_TEMP}/release-assets/checksums.txt" "${RUNNER_TEMP}/release-assets/release-manifest.json" "${RUNNER_TEMP}/release-assets/THIRD_PARTY_NOTICES.txt"; do
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}" --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/agentplugins-release.yml" --source-digest "${commit}"
          done
      - name: Stage and pack the exact npm facade
        id: stage
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#agentplugins-v}"
          stage="${RUNNER_TEMP}/agentplugins-npm-stage"
          mkdir -p "${stage}"
          cp -R npm/agentplugins/. "${stage}/"
          node "${stage}/scripts/stage-release.js" "${stage}" "${RUNNER_TEMP}/release-assets" "${version}" "$(git rev-parse HEAD)" --evidence-root "${GITHUB_WORKSPACE}/docs"
          (cd "${stage}" && npm test)
          mkdir -p "${RUNNER_TEMP}/npm-tarball"
          (cd "${stage}" && npm pack --ignore-scripts --json --pack-destination "${RUNNER_TEMP}/npm-tarball" > "${RUNNER_TEMP}/npm-tarball/pack.json")
          tarball_file="$(jq -er 'if length == 1 then .[0].filename else error("expected one tarball") end' "${RUNNER_TEMP}/npm-tarball/pack.json")"
          integrity="$(jq -er '.[0].integrity' "${RUNNER_TEMP}/npm-tarball/pack.json")"
          shasum="$(jq -er '.[0].shasum' "${RUNNER_TEMP}/npm-tarball/pack.json")"
          node npm/agentplugins/scripts/npm-public-contract.js stage-outputs "${RUNNER_TEMP}/npm-tarball/pack.json" "${GITHUB_OUTPUT}" "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "package_name=$(node -p 'require(process.argv[1]).name' "${stage}/package.json")" >> "${GITHUB_OUTPUT}"
          echo "tarball_file=${tarball_file}" >> "${GITHUB_OUTPUT}"
          echo "tarball_integrity=${integrity}" >> "${GITHUB_OUTPUT}"
          echo "tarball_shasum=${shasum}" >> "${GITHUB_OUTPUT}"
          if tar -tzf "${RUNNER_TEMP}/npm-tarball/${tarball_file}" | grep -Eq '(^/|(^|/)\.\.(\/|$))'; then
            echo "unsafe tarball path" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentplugins-npm-${{ steps.stage.outputs.version }}
          path: ${{ runner.temp }}/npm-tarball/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish npm package with trusted provenance
    if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.producer_mode == 'legacy' && inputs.publish == true && needs.prepare.result == 'success' }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-agentplugins
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: Use an empty npm config for OIDC publish
        run: |
          set -euo pipefail
          config="${RUNNER_TEMP}/agentplugins-publish.npmrc"
          printf '%s\n' 'registry=https://registry.npmjs.org/' > "${config}"
          chmod 600 "${config}"
          echo "NPM_CONFIG_USERCONFIG=${config}" >> "${GITHUB_ENV}"
      - name: Install the pinned npm trusted-publisher client
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2
          test "$(npm --version)" = "12.0.2"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agentplugins-npm-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/npm-tarball
      - name: Refuse overwrite and publish the exact staged bytes
        env:
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARBALL: ${{ needs.prepare.outputs.tarball_file }}
        run: |
          set -euo pipefail
          test -z "${NPM_TOKEN:-}"
          test -z "${NODE_AUTH_TOKEN:-}"
          test -s "${NPM_CONFIG_USERCONFIG}"
          grep -Fx 'registry=https://registry.npmjs.org/' "${NPM_CONFIG_USERCONFIG}"
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "npm version already exists and is immutable: ${PACKAGE_NAME}@${VERSION}" >&2
            exit 1
          fi
          test "$(find "${RUNNER_TEMP}/npm-tarball" -maxdepth 1 -name '*.tgz' -type f | wc -l | tr -d ' ')" = 1
          npm publish "${RUNNER_TEMP}/npm-tarball/${TARBALL}" --registry=https://registry.npmjs.org/ --access public --provenance --tag latest

  verify-public:
    name: Verify public npm provenance and lifecycle
    if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.producer_mode == 'legacy' && inputs.publish == true && needs.publish.result == 'success' }}
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify metadata, signatures, provenance, and isolated lifecycle
        env:
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          TARBALL_INTEGRITY: ${{ needs.prepare.outputs.tarball_integrity }}
          TARBALL_SHASUM: ${{ needs.prepare.outputs.tarball_shasum }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2
          test "$(npm --version)" = "12.0.2"
          root="${RUNNER_TEMP}/agentplugins-public-e2e"
          mkdir -p "${root}/project" "${root}/home" "${root}/home/.codex" "${root}/home/.cursor" "${root}/home/.kiro" "${root}/tmp" "${root}/synthetic" "${root}/packed"
          printf '%s\n' '{' '  "$schema": "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json",' '  "name": "npm-public-proof",' '  "version": "1.0.0",' '  "description": "Synthetic package used only by isolated npm release CI"' '}' > "${root}/synthetic/plugin.json"
          printf '%s\n' '{"name":"npm-public-proof-project","version":"1.0.0","private":true}' > "${root}/project/package.json"
          export HOME="${root}/home" USERPROFILE="${root}/home" XDG_CONFIG_HOME="${root}/config" XDG_CACHE_HOME="${root}/cache" AGENTPLUGINS_HOME="${root}/state" AGENTPLUGINS_CACHE_DIR="${root}/binary-cache" NPM_CONFIG_CACHE="${root}/npm-cache" NPM_CONFIG_USERCONFIG="${root}/home/.npmrc" TMPDIR="${root}/tmp" GIT_CONFIG_GLOBAL="${root}/home/.gitconfig" GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0
          printf '%s\n' 'registry=https://registry.npmjs.org/' > "${NPM_CONFIG_USERCONFIG}"
          cd "${root}/project"
          for attempt in 1 2 3 4 5 6 7 8; do
            if npm install --ignore-scripts --no-audit --no-fund --save-exact "${PACKAGE_NAME}@${VERSION}"; then
              break
            fi
            if [[ "${attempt}" == 8 ]]; then
              echo "published npm version was not readable after bounded retries" >&2
              exit 1
            fi
            sleep "$((attempt * 2))"
          done
          npm view "${PACKAGE_NAME}@${VERSION}" --json > "${root}/metadata.json"
          integrity="$(jq -er 'if type == "array" and length == 1 then .[0].dist.integrity elif type == "object" then .dist.integrity else error("expected one metadata record") end' "${root}/metadata.json")"
          shasum="$(jq -er 'if type == "array" and length == 1 then .[0].dist.shasum elif type == "object" then .dist.shasum else error("expected one metadata record") end' "${root}/metadata.json")"
          test "${integrity}" = "${TARBALL_INTEGRITY}"; test "${shasum}" = "${TARBALL_SHASUM}"
          node "${GITHUB_WORKSPACE}/npm/agentplugins/scripts/npm-public-contract.js" metadata "${root}/metadata.json" "${VERSION}" "${integrity}" "${shasum}"
          npm audit signatures --json --include-attestations > "${root}/audit.json"
          jq -e --arg package "${PACKAGE_NAME}" --arg version "${VERSION}" '(.invalid | length) == 0 and (.missing | length) == 0 and ([.verified[] | select(.name == $package and .version == $version)] | length) == 1' "${root}/audit.json" >/dev/null
          jq '{attestations: .verified[0].attestationBundles}' "${root}/audit.json" > "${root}/attestation.json"
          node "${GITHUB_WORKSPACE}/npm/agentplugins/scripts/npm-public-contract.js" audit "${root}/audit.json" "${root}/attestation.json" "${VERSION}"
          node "${GITHUB_WORKSPACE}/npm/agentplugins/scripts/npm-public-contract.js" attestation "${root}/attestation.json" "${VERSION}" "${integrity}" "agentplugins-v${VERSION}" "${COMMIT}"
          npm pack --ignore-scripts --json --pack-destination "${root}/packed" "${PACKAGE_NAME}@${VERSION}" > "${root}/pack.json"
          node "${GITHUB_WORKSPACE}/npm/agentplugins/scripts/npm-public-contract.js" download "${root}/pack.json" "${root}/packed" "${VERSION}" "${integrity}" "${shasum}"
          run_agentplugins() { npm exec --yes --package="${PACKAGE_NAME}@${VERSION}" -- agentplugins "$@"; }
          run_agentplugins version | grep -Fx "agentplugins ${VERSION}"
          run_agentplugins search context7 --format json | jq -e '.result == "success" and ([.data.results[] | select(.product_id == "context7" and .distribution_id == "upstash/context7" and .distribution_kind == "upstream")] | length) == 1' >/dev/null
          run_agentplugins add "${root}/synthetic" --target codex,cursor,kiro --format json > "${root}/add.json"
          jq -e '.result == "success" and .data.batch == true and .data.succeeded == 3 and .data.failed == 0 and ([.data.targets[].target] == ["codex","cursor","kiro"])' "${root}/add.json" >/dev/null
          run_agentplugins info npm-public-proof --format json | jq -e '.result == "success" and ([.data.clients[].client_id] == ["codex","cursor","kiro"])' >/dev/null
          run_agentplugins update npm-public-proof --target codex,cursor,kiro --format json | jq -e '.result == "success" and .data.batch == true and .data.succeeded == 3 and .data.failed == 0' >/dev/null
          run_agentplugins remove npm-public-proof --target codex,cursor,kiro --external-uninstalled --format json | jq -e '.result == "success" and .data.batch == true and .data.succeeded == 3 and .data.failed == 0 and .data.data_retained == true' >/dev/null
          run_agentplugins info npm-public-proof --format json | jq -e '.result == "success" and (.data.clients | length) == 0' >/dev/null
          # Repair is proven against a small immutable package from the public
          # registry. The CLI repo's own Codex example intentionally exercises
          # app metadata and is not a suitable repair fixture.
          repair_source="777genius/universal-agent-plugins-registry@1388c89521bca4b53454776b584ee0c4996b31c0//plugins/context7"
          mkdir -p "${XDG_CONFIG_HOME}/opencode"
          run_agentplugins add "${repair_source}" --target opencode --format json | jq -e '.result == "success" and .data.succeeded == 1 and .data.failed == 0' >/dev/null
          repair_file="$(jq -er '[.installations[] | select(.declared_name == "context7") | .clients[] | select(.client_id == "opencode") | .native_objects[] | select(.kind == "opencode_global_mcp_server") | .path] | if length == 1 and (.[0] | type == "string" and length > 0) then .[0] else error("expected exactly one Context7 OpenCode repair path") end' "${AGENTPLUGINS_HOME}/state-v2.json")"
          test -f "${repair_file}"
          jq -e '.mcp.context7' "${repair_file}" > /dev/null
          jq 'del(.mcp.context7)' "${repair_file}" > "${root}/repair-mutated.json"
          mv "${root}/repair-mutated.json" "${repair_file}"
          run_agentplugins repair context7 --target opencode --format json | jq -e '.result == "success" and .data.succeeded == 1 and .data.failed == 0 and .data.targets[0].target == "opencode" and .data.targets[0].output.result.mutated == true' >/dev/null
          jq -e '.mcp.context7' "${repair_file}" > /dev/null
          run_agentplugins remove context7 --target opencode --external-uninstalled --format json | jq -e '.result == "success" and .data.succeeded == 1 and .data.failed == 0' >/dev/null

  paired_stage:
    name: paired_stage
    needs: dispatch_contract
    if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.producer_mode == 'paired-stage' && inputs.publish == false && needs.dispatch_contract.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      PRODUCER_MODE: ${{ inputs.producer_mode }}
      TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      KIT_VERSION: ${{ inputs.plugin_kit_version }}
      PUBLISH: ${{ inputs.publish }}
      NATIVE_INPUTS: ${{ inputs.native_inputs }}
      INPUT_ARTIFACT: ${{ inputs.input_artifact }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      stage_sha256: ${{ steps.stage.outputs.stage_sha256 }}
      stage_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      stage_artifact_sha256: ${{ steps.upload_evidence.outputs.artifact_sha256 }}
    steps:
      - name: C1 preflight
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:${PATH}"
          [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]
          case "${PRODUCER_MODE}" in
            legacy) [[ -z "${SOURCE_SHA}${KIT_VERSION}${NATIVE_INPUTS}${INPUT_ARTIFACT}" ]]; exit 0 ;;
            paired-stage) [[ "${PUBLISH}" == false ]] ;;
            *) exit 1 ;;
          esac
          [[ "${GITHUB_ACTIONS}" == true && "${GITHUB_REPOSITORY}" == 777genius/universal-agent-plugins ]]
          [[ "${TAG}" =~ ^agentplugins-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ && ${#TAG} -le 47 ]]
          [[ "${KIT_VERSION}" == 2.0.0 && "${TAG}" != agentplugins-v2.0.0 ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ && ! "${SOURCE_SHA}" =~ ^0+$ ]]
          [[ "${GITHUB_SHA}" == "${SOURCE_SHA}" && "${GITHUB_WORKFLOW_SHA}" == "${SOURCE_SHA}" ]]
          [[ "${GITHUB_REF}" == "refs/tags/${TAG}" ]]
          [[ "${GITHUB_WORKFLOW_REF}" == "777genius/universal-agent-plugins/.github/workflows/agentplugins-npm-publish.yml@refs/tags/${TAG}" ]]
          positive() { [[ "$1" =~ ^[1-9][0-9]{0,15}$ && "$1" -le 9007199254740991 ]]; }
          positive "${GITHUB_RUN_ID}"
          positive "${GITHUB_RUN_ATTEMPT}"; [[ "${GITHUB_RUN_ATTEMPT}" -le 1000 ]]
          [[ ${#NATIVE_INPUTS} -gt 0 && ${#NATIVE_INPUTS} -le 32768 && "${NATIVE_INPUTS}" == *$'\n' ]]
          locator='^[[:space:]]*\{[[:space:]]*"run_id":[[:space:]]*([1-9][0-9]{0,15}),[[:space:]]*"run_attempt":[[:space:]]*([1-9][0-9]{0,3}),[[:space:]]*"artifact_id":[[:space:]]*([1-9][0-9]{0,15}),[[:space:]]*"artifact_sha256":[[:space:]]*"([0-9a-f]{64})"[[:space:]]*\}[[:space:]]*$'
          [[ "${INPUT_ARTIFACT}" =~ $locator ]]
          run_id="${BASH_REMATCH[1]}"; artifact_id="${BASH_REMATCH[3]}"
          positive "${run_id}"; positive "${artifact_id}"
          [[ "${INPUT_ARTIFACT}" =~ $locator ]]
          [[ "${BASH_REMATCH[2]}" -le 1000 && ! "${BASH_REMATCH[4]}" =~ ^0+$ ]]
          [[ "${GITHUB_JOB}" == paired_stage ]]
      - name: C1 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: C1 setup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: C1 stage
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), assert = require('node:assert/strict');
          const c = require('./npm/agentplugins/scripts/dual-authoring-candidate');
          const i = require('./npm/agentplugins/scripts/authoring-native-inputs');
          const s = require('./npm/agentplugins/scripts/stage-authoring-npm');
          const e = process.env, selected = {tag: e.TAG, ref: `refs/tags/${e.TAG}`, source: e.SOURCE_SHA,
            versions: {agentplugins: e.TAG.slice('agentplugins-v'.length), 'plugin-kit-ai': e.KIT_VERSION}};
          const root = fs.mkdtempSync(path.join(e.RUNNER_TEMP, 'c1-workflow-'));
          const scratch = path.join(root, 'scratch'); fs.mkdirSync(scratch, {mode: 0o700});
          const options = {selected, workflow_sha: e.SOURCE_SHA};
          const input_file = path.join(root, 'native-inputs.json');
          const input = Buffer.from(e.NATIVE_INPUTS, 'utf8'); assert.ok(input.length <= 32768); i.decodeInputs(input);
          fs.writeFileSync(input_file, input, {flag: 'wx', mode: 0o400});
          const npm = fs.realpathSync(path.join(path.dirname(process.execPath), '../lib/node_modules/npm/bin/npm-cli.js'));
