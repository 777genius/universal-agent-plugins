name: Package manager E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'cli/**'
      - 'install/integrationctl/**'
      - 'sdk/**'
      - 'go.work*'
      - '**/go.mod'
      - '**/go.sum'
      - 'scripts/package-manager-e2e.py'
      - 'scripts/package_manager_binary.py'
      - 'scripts/test_package_manager_e2e.py'
      - 'scripts/test_package_manager_ci_policy.py'
      - '.github/workflows/agentplugins-native-clients.yml'
      - '.github/workflows/package-manager-resilience.yml'
      - '.github/workflows/package-manager-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'install/integrationctl/**'
      - 'sdk/**'
      - 'go.work*'
      - '**/go.mod'
      - '**/go.sum'
      - 'scripts/package-manager-e2e.py'
      - 'scripts/package_manager_binary.py'
      - 'scripts/test_package_manager_e2e.py'
      - 'scripts/test_package_manager_ci_policy.py'
      - '.github/workflows/agentplugins-native-clients.yml'
      - '.github/workflows/package-manager-resilience.yml'
      - '.github/workflows/package-manager-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-manager-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  # Drafts get cheap evidence validation; ready PRs and main get real E2E.
  draft-preflight:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
    name: draft evidence preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'
      - name: Check evidence rejection cases
        run: python -B -m unittest discover -s scripts -p test_package_manager_e2e.py
      - name: Check CI policy rejection cases
        run: python -B -m unittest discover -s scripts -p test_package_manager_ci_policy.py

  package-manager:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: package-manager (${{ matrix.os }})
    # Real Git containment requires a conventional procfs on Linux. This focused
    # qualification uses disposable hosted runners, including both Mac architectures.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    env:
      GOMAXPROCS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'
      - name: Check evidence rejection cases
        run: python -B -m unittest discover -s scripts -p test_package_manager_e2e.py
      - name: Check CI policy rejection cases
        run: python -B -m unittest discover -s scripts -p test_package_manager_ci_policy.py
      - name: Execute the full portable catalog
        run: python -B scripts/package-manager-e2e.py --output "${{ runner.temp }}/package-manager-e2e"
      - name: Verify native Git policy with real Git on each OS
        working-directory: install/integrationctl/agentplugins
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout=3m -json ./adapters/sourceacquisition \
            -run '^TestNativeGit(OptionsRetainMandatoryHardening|HardeningWinsOverInheritedGitSettings)$' | python -c '
          import json, sys
          events = [json.loads(line) for line in sys.stdin if line.strip()]
          tests = ("TestNativeGitOptionsRetainMandatoryHardening", "TestNativeGitHardeningWinsOverInheritedGitSettings")
          for name in tests:
              actions = [e.get("Action") for e in events if e.get("Test") == name]
              if "run" not in actions or "pass" not in actions or "skip" in actions or "fail" in actions:
                  raise SystemExit(f"Git hardening test did not run/pass: {name}: {actions}")
          if not any(e.get("Action") == "pass" and not e.get("Test") for e in events):
              raise SystemExit("Native Git package did not pass")
          print("Native Git bare-repository and noninteractive-credential policies verified")
          '
      - name: Verify actual process crash and durable transaction recovery
        working-directory: install/integrationctl/agentplugins
        shell: bash
        run: |
          set -euo pipefail
          go test -json -count=1 -timeout=5m ./transaction -run TestDirectoryProcessCrashAfterActivationRecovers | python -c '
          import json, sys
          events = [json.loads(line) for line in sys.stdin if line.strip()]
          pkg = "github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/transaction"
          name = "TestDirectoryProcessCrashAfterActivationRecovers"
          matches = lambda action: any(
              e.get("Package") == pkg and e.get("Test") == name and e.get("Action") == action
              for e in events
          )
          package_pass = any(
              e.get("Package") == pkg and e.get("Action") == "pass" and "Test" not in e
              for e in events
          )
          if not (matches("run") and matches("pass") and package_pass) or matches("fail") or matches("skip"):
              for e in events:
                  if e.get("Action") == "output" and e.get("Package") == pkg:
                      sys.stderr.write(e.get("Output", ""))
              print("Exact post-write OS crash/recovery oracle did not run and pass.", file=sys.stderr)
              sys.exit(1)
          print("Confirmed actual crash/recovery run+pass events, package pass, no skip: " + name)
          '
      - name: Verify immutable Git EOL bytes across platforms
        working-directory: install/integrationctl/agentplugins
        shell: bash
        run: |
          set -euo pipefail
          go test -json -count=1 -timeout=5m ./adapters/sourceacquisition -run TestImmutableGitCheckoutStableWithTextAutoAndExplicitEOL | python -c '
          import json, sys
          events = [json.loads(line) for line in sys.stdin if line.strip()]
          pkg = "github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/adapters/sourceacquisition"
          name = "TestImmutableGitCheckoutStableWithTextAutoAndExplicitEOL"
          matches = lambda action, test: any(
              e.get("Package") == pkg and e.get("Test") == test and e.get("Action") == action
              for e in events
          )
          package_pass = any(
              e.get("Package") == pkg and e.get("Action") == "pass" and "Test" not in e
              for e in events
          )
          ok = matches("run", name) and matches("pass", name) and package_pass and not any(
              matches(action, name) for action in ("fail", "skip")
          )
          if not ok:
              for e in events:
                  if e.get("Action") == "output" and e.get("Package") == pkg:
                      sys.stderr.write(e.get("Output", ""))
              print("Exact Git EOL oracle did not run and pass.", file=sys.stderr)
              sys.exit(1)
          print("Confirmed exact Go run+pass events, package pass, no skip: " + name)
          '
      - name: Retain execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-manager-e2e-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/package-manager-e2e/report.json
            ${{ runner.temp }}/package-manager-e2e/*.stdout
            ${{ runner.temp }}/package-manager-e2e/*.stderr
          if-no-files-found: error
          retention-days: 14
