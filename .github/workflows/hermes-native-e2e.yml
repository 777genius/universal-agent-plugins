name: Hermes Native Skills and MCP E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'install/integrationctl/agentplugins/clients/hermes/**'
      - 'install/integrationctl/agentplugins/adapters/nativeconfig/hermes_yaml*'
      - 'scripts/e2e/hermes-native.sh'
      - 'scripts/e2e/hermes-native.py'
      - 'scripts/e2e/hermes-native-lifecycle.py'
      - 'scripts/pi_project_components_native_e2e.py'
      - '.github/workflows/hermes-native-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-native-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-platform:
    name: pinned Hermes 0.23 + UAP lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Build this PR's exact UAP executable
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/agentplugins" ./cmd/agentplugins
          echo "UAP_BIN=$RUNNER_TEMP/agentplugins" >> "$GITHUB_ENV"
      - name: Install pinned Hermes from the official committed source
        shell: bash
        run: |
          set -euo pipefail
          sha=2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
          source="$RUNNER_TEMP/hermes-agent"
          profile_home="$RUNNER_TEMP/hermes-native-home"
          mkdir -p "$profile_home"
          # Fetch the commit graph without executing a mutable remote installer;
          # bootstrap itself lives at this pinned official Hermes tag's commit.
          git clone --filter=blob:none --no-checkout \
            https://github.com/NousResearch/hermes-agent.git "$source"
          git -C "$source" checkout --force --detach "$sha"
          test "$(git -C "$source" rev-parse HEAD)" = "$sha"
          export HOME="$profile_home"
          export HERMES_HOME="$profile_home/selected-profile"
          bash "$source/scripts/install.sh" --commit "$sha" \
            --dir "$source" --hermes-home "$HERMES_HOME" \
            --non-interactive --skip-browser --skip-computer-use
          hermes="$profile_home/.local/bin/hermes"
          test -x "$hermes"
          "$hermes" --version
          echo "HERMES_BIN=$hermes" >> "$GITHUB_ENV"
          echo "HERMES_HOME=$HERMES_HOME" >> "$GITHUB_ENV"
          echo "HOME=$profile_home" >> "$GITHUB_ENV"
      - name: Real Hermes User Skills/MCP and project trust boundary
        shell: bash
        env:
          HERMES_NATIVE_UAP_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/e2e/hermes-native.sh
      - name: Retain native lifecycle and MCP discovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-native-lifecycle-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hermes-native-evidence-*/
          if-no-files-found: warn
          retention-days: 14

  native-windows-x64:
    name: pinned Hermes 0.23 + UAP Windows native lifecycle
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Preserve exact schema bytes in the Windows checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve canonical checkout bytes' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Build this PR's UAP Windows executable
        working-directory: cli
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uapExe = Join-Path $env:RUNNER_TEMP 'agentplugins.exe'
          go build -o $uapExe ./cmd/agentplugins
          if ($LASTEXITCODE -ne 0) { throw 'UAP Windows build failed' }
          "UAP_BIN=$uapExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pinned native Windows Hermes and resolve its real runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hermesPin = '2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19'
          $hermesSource = Join-Path $env:RUNNER_TEMP 'hermes-agent'
          $fixtureHome = Join-Path $env:RUNNER_TEMP 'hermes-native-home'
          $hermesProfile = Join-Path $fixtureHome 'selected-profile'
          $evidenceDir = Join-Path $env:RUNNER_TEMP ('hermes-native-evidence-install-' + [guid]::NewGuid().ToString('N'))
          $profileEnv = @{
            HOME = $fixtureHome
            USERPROFILE = $fixtureHome
            APPDATA = (Join-Path $fixtureHome 'AppData/Roaming')
            LOCALAPPDATA = (Join-Path $fixtureHome 'AppData/Local')
            XDG_CONFIG_HOME = (Join-Path $fixtureHome 'config')
            XDG_CACHE_HOME = (Join-Path $fixtureHome 'cache')
            UV_CACHE_DIR = (Join-Path $fixtureHome 'cache/uv')
            UV_PYTHON_INSTALL_DIR = (Join-Path $fixtureHome 'bootstrap-python')
            TEMP = (Join-Path $fixtureHome 'tmp')
            TMP = (Join-Path $fixtureHome 'tmp')
            HERMES_HOME = $hermesProfile
          }
          foreach ($entry in $profileEnv.GetEnumerator()) {
            New-Item -ItemType Directory -Force -Path $entry.Value | Out-Null
            Set-Item -Path "Env:$($entry.Key)" -Value $entry.Value
          }
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          Remove-Item Env:HERMES_RUNTIME_DIR -ErrorAction SilentlyContinue
          Remove-Item Env:HERMES_INSTALL_CHANNEL -ErrorAction SilentlyContinue
          $env:PYTHONUTF8 = '1'
          git clone --filter=blob:none --no-checkout https://github.com/NousResearch/hermes-agent.git $hermesSource
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Hermes source clone failed' }
          git -C $hermesSource config core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Hermes checkout byte policy failed' }
          git -C $hermesSource checkout --force --detach $hermesPin
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Hermes source checkout failed' }
          $actualPin = (git -C $hermesSource rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualPin -ne $hermesPin) { throw 'Hermes source pin differs' }

          # Run only the installer from the pinned official checkout.
          # NonInteractive skips provider setup and gateway-service installation.
          & pwsh -NoProfile -ExecutionPolicy Bypass -File (Join-Path $hermesSource 'scripts/install.ps1') `
            -Commit $hermesPin -InstallDir $hermesSource -HermesHome $hermesProfile `
            -NonInteractive -SkipBrowser -SkipComputerUse 2>&1 |
            Tee-Object -FilePath (Join-Path $evidenceDir 'install.log')
          if ($LASTEXITCODE -ne 0) { throw 'Pinned native Hermes installation failed' }
          $actualPin = (git -C $hermesSource rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualPin -ne $hermesPin) { throw 'Hermes installer changed the selected source pin' }

          # Both are official outputs; do not invent a wrapper or use an ambient CLI.
          $hermesBinDir = Join-Path $hermesProfile 'bin'
          $hermesBin = $null
          foreach ($name in @('hermes.exe', 'hermes.cmd')) {
            $candidate = Join-Path $hermesBinDir $name
            if (Test-Path -LiteralPath $candidate -PathType Leaf) { $hermesBin = $candidate; break }
          }
          if (-not $hermesBin) { throw 'Official Windows Hermes launcher is missing' }
          # Reuse the vendor's bounded exe/cmd probe and its command-file quoting.
          $runtimeHelper = Join-Path $hermesSource 'scripts/desktop-update/runtime.ps1'
          . ([ScriptBlock]::Create([IO.File]::ReadAllText($runtimeHelper)))
          $version = Invoke-HermesProbe -Exe $hermesBin -Arguments @('--version')
          if ($version.TimedOut -or $version.Code -ne 0 -or -not $version.Output.Trim()) { throw 'Native Hermes version probe failed' }
          $version.Output | Tee-Object -FilePath (Join-Path $evidenceDir 'version.txt')
          $probe = Invoke-HermesProbe -Exe $hermesBin -Arguments @('--print-runtime-command')
          if ($probe.TimedOut -or $probe.Code -ne 0) { throw 'Native Hermes runtime resolution failed' }
          $runtimePath = Join-Path $evidenceDir 'runtime-command.json'
          [IO.File]::WriteAllText($runtimePath, $probe.Output, [Text.UTF8Encoding]::new($false))
          $env:HERMES_NATIVE_RUNTIME_COMMAND_FILE = $runtimePath
          @'
          import json, os
          from pathlib import Path
          argv = json.loads(Path(os.environ['HERMES_NATIVE_RUNTIME_COMMAND_FILE']).read_text(encoding='utf-8'))
          if not isinstance(argv, list) or len(argv) < 4 or not all(isinstance(x, str) and x for x in argv):
              raise SystemExit('Native launcher did not return a list of nonempty strings')
          if not Path(argv[0]).is_absolute() or not Path(argv[0]).is_file() or argv[1:3] != ['-I', '-c']:
              raise SystemExit('Native launcher did not select its real isolated Python runtime')
          print('Official Windows Hermes runtime argv resolved and validated')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime JSON contract failed' }

          foreach ($entry in $profileEnv.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "HERMES_BIN=$hermesBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HERMES_NATIVE_RUNTIME_COMMAND_FILE=$runtimePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'PYTHONUTF8=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $hermesBinDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Real Hermes native Windows lifecycle and trust boundary
        shell: pwsh
        env:
          HERMES_NATIVE_UAP_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/e2e/hermes-native.py run scripts/e2e/hermes-native-lifecycle.py
          if ($LASTEXITCODE -ne 0) { throw 'Native Hermes lifecycle failed' }
      - name: Retain native Windows lifecycle and installation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-native-lifecycle-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hermes-native-evidence-*/
          if-no-files-found: warn
          retention-days: 14
