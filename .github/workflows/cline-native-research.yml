name: Cline Pinned Read-Only Config Research

on:
  pull_request:
    paths:
      - '.github/workflows/cline-native-research.yml'
      - 'scripts/research-cline-native.py'
      - 'scripts/test_cline_native_research.py'
      - 'scripts/native_client_research.py'
      - 'scripts/research-grok-native.py'
      - 'scripts/run-native-client-matrix.py'
      - 'scripts/native_client_draft.py'
  workflow_dispatch:

permissions:
  contents: read

# Replace ordinary CI for the same PR/ref; keep manual runs independent.
concurrency:
  group: cline-native-research-${{ github.event_name }}-${{ github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  research:
    name: Cline 3.0.73 read-only config observations
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify inert research safety contracts
        run: python3 -m unittest discover -s scripts -p 'test_*native_research.py'
      - name: Capture genuine pinned configuration observations
        env:
          AGENTPLUGINS_NATIVE_DISPOSABLE_HOSTED: '1'
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/research-cline-native.py --output '${{ runner.temp }}/cline-native-research'
      - name: Upload research including failed collection
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: cline-3.0.73-precode-config-linux-amd64
          path: ${{ runner.temp }}/cline-native-research/
          if-no-files-found: error
          retention-days: 14
