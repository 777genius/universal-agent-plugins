name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.13"
          cache: false

      - name: Collect Go coverage
        shell: bash
        run: |
          mkdir -p coverage
          mapfile -t root_packages < <(go list ./... | grep -v '/repotests$')
          go test -count=1 -timeout=20m -covermode=atomic -coverprofile=coverage/root.out "${root_packages[@]}"
          # These tests recursively execute the instrumented test binary with an
          # intentionally minimal environment and assert byte-exact stderr. They
          # remain covered by Required; Go's GOCOVERDIR warning makes them
          # incompatible with coverage instrumentation itself.
          go test -count=1 -timeout=20m -skip '^TestReleaseCompletionProcessStderr$' -covermode=atomic -coverprofile=coverage/cli.out ./cli/plugin-kit-ai/...
          go test -count=1 -timeout=20m -skip '^TestExecutableVersionProbeIsSanitizedAndIsolated$' -covermode=atomic -coverprofile=coverage/integrationctl.out ./install/integrationctl/...
          go test -count=1 -timeout=20m -covermode=atomic -coverprofile=coverage/plugininstall.out ./install/plugininstall/...
          go test -count=1 -timeout=20m -covermode=atomic -coverprofile=coverage/sdk.out ./sdk/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          version: v11.3.1
          files: coverage/root.out,coverage/cli.out,coverage/integrationctl.out,coverage/plugininstall.out,coverage/sdk.out
          disable_search: true
          fail_ci_if_error: true
