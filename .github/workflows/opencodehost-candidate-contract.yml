name: OpenCode native observer candidate contract

on:
  pull_request:
    paths:
      - 'install/integrationctl/opencodehost/**'
      - '.github/workflows/opencodehost-candidate-contract.yml'
  push:
    branches: [main]
    paths:
      - 'install/integrationctl/opencodehost/**'
      - '.github/workflows/opencodehost-candidate-contract.yml'

permissions:
  contents: read

concurrency:
  group: opencodehost-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  observer-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Test exact observer source and fail-closed candidate contracts
        working-directory: install/integrationctl
        run: go test -count=1 -race -timeout=8m ./opencodehost
