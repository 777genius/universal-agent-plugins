name: Kimi stable Project native installation E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'install/integrationctl/agentplugins/clients/kimi/**'
      - 'install/integrationctl/agentplugins/providers/project_kimi_*'
      - 'cli/cmd/agentplugins/project_kimi_*'
      - 'scripts/live-install-audit.py'
      - 'scripts/test_kimi_repeat_log_audit.py'
      - 'scripts/test_kimi_stable_project_audit_policy.py'
      - 'scripts/prepared_installation_audit.py'
      - 'scripts/test_prepared_installation_audit.py'
      - 'scripts/windsurf_installation_audit.py'
      - 'scripts/test_windsurf_installation_audit.py'
      - 'scripts/published_codex_baseline.py'
      - 'scripts/test_published_codex_baseline.py'
      - '.github/workflows/kimi-stable-project-native-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kimi-stable-project-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-project:
    name: Official Kimi 2.5.2 / 30 project Skills (no model)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Audit the PR's exact HEAD, never the default synthetic PR merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install genuine pinned stable Kimi and observe version without user profile
        id: native-install
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @moonshot-ai/kimi-code@2.5.2
          command -v kimi
          mkdir -p "$RUNNER_TEMP/kimi-version-home/cache"
          observed="$(KIMI_CODE_HOME="$RUNNER_TEMP/kimi-version-home" \
            KIMI_CODE_CACHE_DIR="$RUNNER_TEMP/kimi-version-home/cache" \
            KIMI_CODE_NO_AUTO_UPDATE=1 timeout 45s kimi --version)"
          test "$observed" = '2.5.2'

      - name: Run the real project admission and ownership regressions
        run: |
          python3 -m unittest discover -s scripts -p 'test_kimi_*audit*.py' -v
          go test ./install/integrationctl/agentplugins/providers -run '^TestProjectKimi' -count=1
          go test ./install/integrationctl/agentplugins/clients/kimi -count=1

      - name: Exercise stable 2.5.2 saved Project Skills/MCP lifecycle (inert client)
        run: |
          go test ./cli/cmd/agentplugins -run '^TestProjectKimi' -count=1

      - name: Build current PR source CLI with published policy version
        run: go build -trimpath -ldflags='-X main.version=0.1.102' -o "$RUNNER_TEMP/agentplugins-kimi-source" ./cli/cmd/agentplugins

      - name: Audit 30 source-backed Project Skills, repeated installs and removal
        if: ${{ !cancelled() }}
        env:
          AUDIT_VENDOR_OUTCOME: ${{ steps.native-install.outcome }}
          AUDIT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUDIT_REPORT_DIR: ${{ runner.temp }}/kimi-stable-project-proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$AUDIT_REPORT_DIR"
          python3 scripts/live-install-audit.py \
            --cli "$RUNNER_TEMP/agentplugins-kimi-source" \
            --target kimi --kind skill --limit 30 \
            --report-dir "$AUDIT_REPORT_DIR"
          # The shared audit accepts documented negative cases as coverage.
          # Stable admission requires 30 genuine positive passes, not 30 attempts.
          python3 - "$AUDIT_REPORT_DIR/kimi-skill.json" "$AUDIT_PR_HEAD_SHA" <<'PY'
          import json, pathlib, re, sys
          evidence = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected_head = sys.argv[2]
          rows = evidence.get("results", [])
          # A summary-only PASS is insufficient: independently require the
          # observable source/owned-byte, pin, repeat, removal and isolation proofs.
          required_positive = (
              "skill_bytes_match", "lock_written", "lock_contains_identity",
              "lock_exact_source_pinned", "listed_identity", "repeat_verified",
              "repeat_lock_unchanged",
              "removal_verified", "sentinels_preserved", "post_list_schema_valid",
          )
          def verified_repeat(row):
              command = row.get("repeat_add")
              if (row.get("target") != "kimi" or row.get("kind") != "skill"
                      or not isinstance(command, dict)
                      or type(command.get("exit_code")) is not int
                      or command.get("exit_code") != 0 or command.get("timeout") is not False):
                  return False
              if row.get("repeat_native_unchanged") is True:
                  return True
              if (row.get("repeat_native_unchanged") is not False
                      or row.get("repeat_native_runtime_only") is not True):
                  return False
              # The producer's held-byte proof admits exactly one bounded log
              # append, with unchanged parents/inode and a closed Ready command.
              # A generic runtime-only flag cannot satisfy this native gate.
              proof = row.get("kimi_repeat_log_proof")
              keys = {"status", "path", "before_bytes", "after_bytes", "before_sha256",
                      "after_sha256", "append_sha256", "same_inode_mode_parents", "post_list_unchanged"}
              if (not isinstance(proof, dict) or set(proof) not in (keys, keys | {"workspace_lock"})
                      or proof.get("status") != "verified-owned-log-append"
                      or proof.get("path") != ".kimi-code/logs/kimi-code.log"
                      or proof.get("same_inode_mode_parents") is not True
                      or proof.get("post_list_unchanged") is not True
                      or ("workspace_lock" in proof
                          and proof["workspace_lock"] != "verified-empty-native-coordinator")
                      or type(proof.get("before_bytes")) is not int
                      or type(proof.get("after_bytes")) is not int
                      or not 0 <= proof["before_bytes"] < proof["after_bytes"] <= 1 << 20
                      or any(not isinstance(proof.get(key), str)
                             or re.fullmatch(r"[0-9a-f]{64}", proof[key]) is None
                             for key in ("before_sha256", "after_sha256", "append_sha256"))
                      or proof["before_sha256"] == proof["after_sha256"]):
                  return False
              changes = row.get("repeat_native_changes")
              if (not isinstance(changes, dict) or set(changes) != {"total", "omitted", "entries"}
                      or type(changes.get("total")) is not int or changes["total"] != 1
                      or type(changes.get("omitted")) is not int or changes["omitted"] != 0
                      or not isinstance(changes.get("entries"), list) or len(changes["entries"]) != 1):
                  return False
              entry = changes["entries"][0]
              if (not isinstance(entry, dict) or entry.get("path_truncated") is not False
                      or entry != {"path": proof["path"], "path_truncated": False,
                                   "before": proof["before_sha256"], "after": proof["after_sha256"]}):
                  return False
              facts = row.get("kimi_repeat_log_facts")
              if (not isinstance(facts, dict) or set(facts) != {"captures", "append"}
                      or facts["append"] != {"reason": "verified-append"}
                      or not isinstance(facts["captures"], dict)
                      or set(facts["captures"]) != {"before", "after-add", "post-list"}):
                  return False
              return all(isinstance(capture := facts["captures"][phase], dict)
                         and type(capture.get("log_bytes")) is int
                         and capture == {"reason": "captured", "log_bytes": proof[size]}
                         for phase, size in (("before", "before_bytes"),
                                             ("after-add", "after_bytes"), ("post-list", "after_bytes")))
          failures = []
          for index, row in enumerate(rows):
              if not isinstance(row, dict):
                  failures.append(f"{index}: malformed evidence")
                  continue
              missing = [key for key in required_positive if row.get(key) is not True]
              if not verified_repeat(row):
                  missing.append("verified_native_repeat")
              states = row.get("public_target_states", {})
              ready = row.get("public_skill_ready")
              exact_state = {"materialization": "materialized", "activation": "active",
                             "authentication": "not_required", "policy": "allowed",
                             "verification": "installation_verified"}
              state_ready = isinstance(states, dict) and all(
                  isinstance(observed := states.get(phase), dict)
                  and observed.get("status") == "observed"
                  and type(observed.get("selected_installations")) is int
                  and observed.get("selected_installations") == 1
                  and type(observed.get("selected_bindings")) is int
                  and observed.get("selected_bindings") == 1
                  and type(observed.get("invalid_rows")) is int
                  and observed.get("invalid_rows") == 0
                  and observed.get("truncated") is False
                  and observed.get("states") == [exact_state]
                  for phase in ("after-add", "repeat-add"))
              if (row.get("status") != "passed"
                      or row.get("post_remove_identity_registered") is not False
                      or not isinstance(ready, dict) or set(ready) != {"after-add", "repeat-add"}
                      or any(value is not True for value in ready.values())
                      or not state_ready
                      or missing):
                  failures.append(
                      f"{index}: status={row.get('status')}, missing={missing}, "
                      f"remaining={row.get('post_remove_identity_registered')}")
          if (evidence.get("pr_head_sha") != expected_head
                  or type(evidence.get("passed")) is not int
                  or evidence.get("passed") != 30
                  or type(evidence.get("verified_negative_coverage")) is not int
                  or evidence.get("verified_negative_coverage") != 0
                  or type(evidence.get("cases_attempted")) is not int
                  or evidence.get("cases_attempted") != 30
                  or evidence.get("full_coverage") is not True
                  or evidence.get("source_selection_complete") is not True
                  or evidence.get("client_version", {}).get("status") != "reported"
                  or evidence.get("client_version", {}).get("value") != "2.5.2"
                  or len(rows) != 30 or failures):
              raise SystemExit(f"Exact-head real native Kimi Skill qualification failed: {failures}")
          # Ready is the production observer contract (exact local catalog and
          # naturally closed finite process); this audit does not retain an
          # independent native shutdown stream or qualify model/MCP activity.
          print(f"QUALIFIED: 30/30 source-backed Kimi 2.5.2 project Skills with public add/repeat Ready at {expected_head}")
          PY

      - name: Preserve exact-head source/native E2E results, even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: kimi-stable-2.5.2-native-project-skills
          path: ${{ runner.temp }}/kimi-stable-project-proof/
          if-no-files-found: warn
          retention-days: 14
