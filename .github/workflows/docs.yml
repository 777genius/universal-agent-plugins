name: Docs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]
    # The docs site reads README.md, docs/ and code, but never the landing app
    # (Landing builds the combined site itself). Pushes to main stay unfiltered.
    paths-ignore:
      - 'landing/**'
  push:
    branches: [main, master]
  workflow_dispatch:

# Replace ordinary PR/push CI; isolate manual and scheduled invocations.
# Release validation also accepts checks from the associated merged PR head.
concurrency:
  group: docs-${{ github.event_name }}-${{ github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  docs-check:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:github-hosted') && 'ubuntu-latest' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: website
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 8.15.1

      - uses: actions/setup-node@v6
        with:
          node-version: "22.21.1"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install docs toolchain
        run: pnpm install --frozen-lockfile

      - name: Install pinned docs generators
        working-directory: .
        run: |
          python -m venv "${RUNNER_TEMP}/docs-tools-root/python-venv"
          "${RUNNER_TEMP}/docs-tools-root/python-venv/bin/pip" install --require-hashes -r "${GITHUB_WORKSPACE}/website/tools/pydoc-markdown-requirements.txt"
          mkdir -p "${RUNNER_TEMP}/docs-tools-root/bin"
          GOBIN="${RUNNER_TEMP}/docs-tools-root/bin" go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v1.1.0

      - name: Prepare immutable authoring source
        working-directory: .
        run: |
          source_sha=$(node --input-type=module -e 'import { acceptedAuthoringSHA } from "./website/tools/lib/source-contract.mjs"; process.stdout.write(acceptedAuthoringSHA)')
          git clone --no-local --no-checkout . "${RUNNER_TEMP}/docs-authoring-source"
          git -C "${RUNNER_TEMP}/docs-authoring-source" checkout --quiet --detach "$source_sha"
          chmod -R a-w "${RUNNER_TEMP}/docs-authoring-source"
          echo "DOCS_AUTHORING_CHECKOUT=${RUNNER_TEMP}/docs-authoring-source" >> "$GITHUB_ENV"

      - name: Warm Go module cache for offline docs consumer integration
        working-directory: .
        env:
          GOCACHE: ${{ runner.temp }}/docs-consumer-gocache
          GOMODCACHE: ${{ runner.temp }}/docs-consumer-gomodcache
        run: |
          cd "$DOCS_AUTHORING_CHECKOUT"
          GOWORK="$DOCS_AUTHORING_CHECKOUT/go.work" go build -p 2 -o "$RUNNER_TEMP/docs-authoring-preflight" ./cli/plugin-kit-ai/tools/authoring-docs

      - name: Run docs checks
        env:
          GOCACHE: ${{ runner.temp }}/docs-consumer-gocache
          GOMODCACHE: ${{ runner.temp }}/docs-consumer-gomodcache
          DOCS_TOOLS_ROOT: ${{ runner.temp }}/docs-tools-root
          DOCS_GOMARKDOC: ${{ runner.temp }}/docs-tools-root/bin/gomarkdoc
          TMPDIR: ${{ runner.temp }}
          GOWORK: ${{ github.workspace }}/go.work
          GOPROXY: "off"
          GOSUMDB: "off"
          GOENV: "off"
        run: pnpm run docs:check

      - name: Install Chromium for docs smoke
        run: pnpm exec playwright install --with-deps chromium

      - name: Run docs UI smoke
        run: pnpm run docs:smoke-ui

      - name: Upload built docs artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: website/dist
          if-no-files-found: error

      - name: Upload docs UI smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-ui-artifacts
          path: website/.playwright-artifacts
          if-no-files-found: ignore
          include-hidden-files: true
