name: Docs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]
    # The docs site reads README.md, docs/ and code, but never the landing app
    # (Landing builds the combined site itself). Pushes to main stay unfiltered.
    paths-ignore:
      - 'landing/**'
  push:
    branches: [main, master]
  workflow_dispatch:

# Release evidence: only a newer push to the same pull request supersedes a
# run. Each push and manual run gets a group of its own, so a later merge
# neither cancels nor replaces the release checks of an earlier merge commit.
# Release validation also accepts the merged PR head's checks.
concurrency:
  group: docs-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-check:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:github-hosted') && 'ubuntu-latest' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: website
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 8.15.1

      - uses: actions/setup-node@v6
        with:
          node-version: "22.21.1"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.11"
          cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install docs toolchain
        run: pnpm install --frozen-lockfile

      - name: Install pinned docs generators
        working-directory: .
        run: |
          python -m venv "${RUNNER_TEMP}/docs-tools-root/python-venv"
          "${RUNNER_TEMP}/docs-tools-root/python-venv/bin/pip" install --require-hashes -r "${GITHUB_WORKSPACE}/website/tools/pydoc-markdown-requirements.txt"
          mkdir -p "${RUNNER_TEMP}/docs-tools-root/bin"
          GOBIN="${RUNNER_TEMP}/docs-tools-root/bin" go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v1.1.0

      - name: Prepare immutable authoring source
        working-directory: .
        run: |
          source_sha=$(node --input-type=module -e 'import { acceptedAuthoringSHA } from "./website/tools/lib/source-contract.mjs"; process.stdout.write(acceptedAuthoringSHA)')
          git clone --no-local --no-checkout . "${RUNNER_TEMP}/docs-authoring-source"
          git -C "${RUNNER_TEMP}/docs-authoring-source" checkout --quiet --detach "$source_sha"
          chmod -R a-w "${RUNNER_TEMP}/docs-authoring-source"
          echo "DOCS_AUTHORING_CHECKOUT=${RUNNER_TEMP}/docs-authoring-source" >> "$GITHUB_ENV"

      - name: Warm Go module cache for offline docs consumer integration
        working-directory: .
        env:
          GOCACHE: ${{ runner.temp }}/docs-consumer-gocache
          GOMODCACHE: ${{ runner.temp }}/docs-consumer-gomodcache
        run: |
          cd "$DOCS_AUTHORING_CHECKOUT"
          GOWORK="$DOCS_AUTHORING_CHECKOUT/go.work" go build -p 2 -o "$RUNNER_TEMP/docs-authoring-preflight" ./cli/plugin-kit-ai/tools/authoring-docs

      - name: Run docs checks
        env:
          GOCACHE: ${{ runner.temp }}/docs-consumer-gocache
          GOMODCACHE: ${{ runner.temp }}/docs-consumer-gomodcache
          DOCS_TOOLS_ROOT: ${{ runner.temp }}/docs-tools-root
          DOCS_GOMARKDOC: ${{ runner.temp }}/docs-tools-root/bin/gomarkdoc
          TMPDIR: ${{ runner.temp }}
          GOWORK: ${{ github.workspace }}/go.work
          GOPROXY: "off"
          GOSUMDB: "off"
          GOENV: "off"
        run: pnpm run docs:check

      - name: Prefer configured canonical Ubuntu package mirrors
        working-directory: .
        run: |
          python3 -m unittest discover -s scripts -p 'test_ci_ubuntu_apt_mirrors.py'
          # GitHub-hosted images own their apt mirror configuration. Do not
          # mutate or broaden the strict self-hosted mirror allowlist.
          case "${RUNNER_ENVIRONMENT:-}" in
            github-hosted)
              echo "Using unchanged GitHub-hosted Ubuntu package mirrors"
              ;;
            self-hosted)
              sudo python3 scripts/ci_ubuntu_apt_mirrors.py
              ;;
            *)
              echo "::error::Unknown runner environment; refusing mirror mutation"
              exit 1
              ;;
          esac

      - name: Install Chromium system dependencies with bounded APT
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          docs_node="$(node -p 'process.execPath')"
          docs_playwright_cli="$(node -e '
            const path = require("node:path");
            const manifestPath = require.resolve("playwright/package.json");
            const manifest = require(manifestPath);
            if (manifest.bin?.playwright !== "cli.js")
              throw new Error("Unexpected Playwright CLI entry");
            console.log(path.join(path.dirname(manifestPath), "cli.js"));
          ')"
          [[ "$docs_node" = /* && "$docs_playwright_cli" = /* ]]
          docs_apt_bin="$(mktemp -d "$RUNNER_TEMP/docs-apt.XXXXXX")"
          docs_apt_cleanup() {
            rm -f -- "$docs_apt_bin/apt-get"
            rmdir -- "$docs_apt_bin"
          }
          trap docs_apt_cleanup EXIT
          [[ "$docs_apt_bin" != *:* ]]
          # Preserve Playwright's complete dependency list and host trust configuration.
          # CLI options bound every APT invocation without modifying system files.
          cat > "$docs_apt_bin/apt-get" <<'APT'
          #!/bin/sh
          exec /usr/bin/apt-get \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=1 -o APT::Update::Error-Mode=any "$@"
          APT
          chmod 0500 "$docs_apt_bin/apt-get"
          docs_root=()
          if [ "$(id -u)" -ne 0 ]; then
            docs_root=(sudo -n)
          fi
          # Run only the installed vendor CLI as root; keep its APT process group bounded.
          "${docs_root[@]}" /usr/bin/timeout --signal=TERM --kill-after=15s 600s \
            /usr/bin/env "PATH=$docs_apt_bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            "$docs_node" "$docs_playwright_cli" install-deps chromium

      - name: Install Chromium for docs smoke
        timeout-minutes: 15
        run: pnpm exec playwright install chromium

      - name: Run docs UI smoke
        run: pnpm run docs:smoke-ui

      - name: Upload built docs artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: website/dist
          if-no-files-found: error

      - name: Upload docs UI smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-ui-artifacts
          path: website/.playwright-artifacts
          if-no-files-found: ignore
          include-hidden-files: true
