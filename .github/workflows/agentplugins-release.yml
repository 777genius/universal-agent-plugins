name: Agentplugins Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact stable tag, for example agentplugins-v0.1.0
        required: true
      auto_publish:
        description: After successful draft qualification, automatically dispatch promotion (environment approvals still apply)
        required: false
        type: boolean
        default: false
      release_notes:
        description: Final release notes prefix, frozen before qualification
        required: false
        type: string
      publish_release:
        description: Explicitly promote after all verification succeeds
        required: false
        type: boolean
        default: false
      qualified_run_id:
        description: Successful draft-only qualification run ID; required for promotion
        required: false
      qualified_run_attempt:
        description: Exact successful draft-only run attempt; required for promotion
        required: false

permissions:
  contents: read

concurrency:
  group: agentplugins-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
      GOFLAGS: -buildvcs=false -p=1
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Verify frozen stable tag and main ancestry
        id: identity
        env:
          TAG: ${{ inputs.tag }}
          WORKFLOW_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ ! "${TAG}" =~ ^agentplugins-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid agentplugins stable tag: ${TAG}" >&2
            exit 1
          fi
          git fetch --force origin main:refs/remotes/origin/main "refs/tags/${TAG}:refs/tags/${TAG}"
          head_commit="$(git rev-parse HEAD)"
          case "${WORKFLOW_REF}" in
            refs/heads/main|"refs/tags/${TAG}") ;;
            *) echo "release must run from main or the exact frozen tag" >&2; exit 1 ;;
          esac
          if [[ "${WORKFLOW_COMMIT}" != "${head_commit}" ]]; then
            echo "release workflow source does not match the exact tagged commit" >&2
            exit 1
          fi
          git merge-base --is-ancestor "${head_commit}" refs/remotes/origin/main
          test "${head_commit}" = "$(git rev-list -n 1 "refs/tags/${TAG}")"
          echo "commit=${head_commit}" >> "${GITHUB_OUTPUT}"
      - name: Verify merged PR and required commit evidence
        env:
          COMMIT: ${{ steps.identity.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pull_requests="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${COMMIT}/pulls")"
          pr_head="$(jq -er \
            '[.[] | select(.merged_at != null and .base.ref == "main")] | sort_by(.merged_at) | last | .head.sha' \
            <<<"${pull_requests}")" || {
              echo "release commit must come from a merged pull request into main" >&2
              exit 1
            }
          commit_checks="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${COMMIT}/check-runs?filter=latest&per_page=100")"
          pr_checks="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${pr_head}/check-runs?filter=latest&per_page=100")"
          has_check() {
            local payload="$1"
            local name="$2"
            jq -e --arg name "${name}" \
              'any(.[]?.check_runs[]?; .name == $name and .status == "completed" and .conclusion == "success")' \
              <<<"${payload}" >/dev/null
          }
          require_check() {
            local name="$1"
            if ! has_check "${commit_checks}" "${name}" && ! has_check "${pr_checks}" "${name}"; then
              echo "required successful check is missing on merge commit and PR head: ${name}" >&2
              exit 1
            fi
          }
          require_check dependency-review
          require_check skills-picker
          for name in \
            test \
            docs-check \
            'polyglot-smoke (ubuntu-latest)' \
            'polyglot-smoke (windows-latest)' \
            'analyze (go)' \
            'analyze (javascript-typescript)' \
            'govulncheck (root)' \
            'govulncheck (cli)' \
            'govulncheck (integrationctl)' \
            'govulncheck (agentplugins)' \
            'govulncheck (plugininstall)' \
            'govulncheck (sdk)'; do
            require_check "${name}"
          done

  qualify-go:
    if: ${{ inputs.publish_release != true }}
    needs: validate
    runs-on: ubuntu-24.04
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
      GOFLAGS: -buildvcs=false -p=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache: true
          cache-dependency-path: |
            cli/go.sum
            install/integrationctl/go.sum
            install/integrationctl/agentplugins/go.sum
      - name: Verify exact release-bound Directory bootstrap
        working-directory: cli
        run: |
          release_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go run ./cmd/agentplugins/bootstrapgen \
            -snapshot cmd/agentplugins/directory_bootstrap_inputs/snapshot.json \
            -envelope cmd/agentplugins/directory_bootstrap_inputs/envelope.json \
            -trust cmd/agentplugins/directory_bootstrap_inputs/trusted-keys.json \
            -check cmd/agentplugins/directory_bootstrap_generated.go \
            -expected-key-id uap-directory-2026-01 \
            -expected-public-key HalXARjat+v3ylTPLMAnvuavRo4ZfrF+DbWwsjlp2bI= \
            -release-at "${release_at}"
      - name: Test standard-first engine and CLI
        run: |
          (cd install/integrationctl/agentplugins && go test -count=1 ./...)
          (cd install/integrationctl && go test -count=1 ./adapters/dirswap ./adapters/source)
          (cd cli && go test -count=1 ./internal/agentpluginscli ./cmd/agentplugins/...)
      - name: Prove production binary excludes Directory conformance overrides
        working-directory: cli
        run: go test ./cmd/agentplugins -run '^TestReleaseBuiltBinaryHasNoConformanceEnvironmentOverride$' -count=1

  qualify-npm:
    if: ${{ inputs.publish_release != true }}
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          package-manager-cache: false
      - name: Test npm bootstrap without install scripts
        working-directory: npm/agentplugins
        run: npm test && npm pack --dry-run --ignore-scripts

  build:
    if: ${{ inputs.publish_release != true }}
    needs: validate
    runs-on: ubuntu-24.04
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
      GOFLAGS: -buildvcs=false -p=1
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: windows
            goarch: arm64
            suffix: .exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/skills-picker/package-lock.json
      - name: Embed production Skills picker assets
        working-directory: ui/skills-picker
        run: |
          npm ci
          npm run bundle:go
      - name: Build exact-version binary
        env:
          TAG: ${{ inputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          SUFFIX: ${{ matrix.suffix }}
        working-directory: cli
        run: |
          version="${TAG#agentplugins-v}"
          asset="agentplugins_${version}_${GOOS}_${GOARCH}${SUFFIX}"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${version}" -o "${RUNNER_TEMP}/${asset}" ./cmd/agentplugins
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: agentplugins-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/agentplugins_*
          if-no-files-found: error
          retention-days: 3

  stage-draft:
    if: ${{ inputs.publish_release != true }}
    needs: [validate, qualify-go, qualify-npm, build]
    runs-on: ubuntu-24.04
    environment: agentplugins-release
    outputs:
      release_id: ${{ steps.release-identity.outputs.release_id }}
      asset_set_digest: ${{ steps.draft.outputs.asset_set_digest }}
      assets_artifact: ${{ steps.draft.outputs.assets_artifact }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agentplugins-*
          merge-multiple: true
          path: ${{ runner.temp }}/agentplugins-assets
      - name: Prepare immutable stable assets
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FROZEN_COMMIT: ${{ needs.validate.outputs.commit }}
        working-directory: ${{ runner.temp }}/agentplugins-assets
        run: |
          git -C "${GITHUB_WORKSPACE}" fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git -C "${GITHUB_WORKSPACE}" rev-list -n 1 "refs/tags/${TAG}")" = "${FROZEN_COMMIT}"
          node "${GITHUB_WORKSPACE}/npm/agentplugins/scripts/release-assets.js" \
            prepare "${PWD}" "${TAG}" "${FROZEN_COMMIT}"
          node "${GITHUB_WORKSPACE}/npm/agentplugins/scripts/release-assets.js" \
            verify "${PWD}" "${TAG}" "${FROZEN_COMMIT}"
          echo "asset_set_digest=$(sha256sum checksums.txt | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"
          echo "assets_artifact=agentplugins-draft-assets-${FROZEN_COMMIT}" >> "${GITHUB_OUTPUT}"
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          release_query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){isDraft isPrerelease tagName}}}'
          release_response="$(gh api graphql -f query="${release_query}" -F owner="${owner}" -F name="${repository}" -F tag="${TAG}")" || {
            echo "failed to look up existing release ${TAG}" >&2
            exit 1
          }
          release_json="$(jq -c '.data.repository.release' <<<"${release_response}")"
          if [[ "${release_json}" != "null" ]]; then
            jq -e --arg tag "${TAG}" \
              '.isDraft == true and .isPrerelease == false and .tagName == $tag' \
              <<<"${release_json}" >/dev/null || {
                echo "release ${TAG} already exists but is not the exact resumable draft; refusing to overwrite immutable assets" >&2
                exit 1
              }
            existing="${RUNNER_TEMP}/existing-agentplugins-assets"
            mkdir -p "${existing}"
            gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${existing}"
            node "${GITHUB_WORKSPACE}/npm/agentplugins/scripts/release-assets.js" \
              verify "${existing}" "${TAG}" "${FROZEN_COMMIT}"
            for asset in agentplugins_* checksums.txt release-manifest.json THIRD_PARTY_NOTICES.txt; do
              cmp -- "${asset}" "${existing}/${asset}" || {
                echo "existing draft asset differs from the frozen build: ${asset}" >&2
                exit 1
              }
            done
            echo "existing=true" >> "${GITHUB_OUTPUT}"
          else
            echo "existing=false" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/agentplugins-assets/agentplugins_*
            ${{ runner.temp }}/agentplugins-assets/checksums.txt
            ${{ runner.temp }}/agentplugins-assets/release-manifest.json
            ${{ runner.temp }}/agentplugins-assets/THIRD_PARTY_NOTICES.txt
      - name: Create non-public immutable draft
        if: ${{ steps.draft.outputs.existing != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        working-directory: ${{ runner.temp }}/agentplugins-assets
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          release_query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){tagName}}}'
          release_response="$(gh api graphql -f query="${release_query}" -F owner="${owner}" -F name="${repository}" -F tag="${TAG}")" || {
            echo "failed to recheck release ${TAG} before creation" >&2
            exit 1
          }
          if [[ "$(jq -c '.data.repository.release' <<<"${release_response}")" != "null" ]]; then
            echo "release ${TAG} appeared concurrently; refusing to overwrite immutable assets" >&2
            exit 1
          fi
          gh release create "${TAG}" agentplugins_* checksums.txt release-manifest.json THIRD_PARTY_NOTICES.txt \
            --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --target "${{ needs.validate.outputs.commit }}" --draft \
            --title "Agentplugins ${TAG#agentplugins-v}" --generate-notes \
            --notes "${RELEASE_NOTES}${RELEASE_NOTES:+$'\n\n'}Native downloads: retain the companion THIRD_PARTY_NOTICES.txt with the binary and include it when redistributing."
      - name: Capture staged release identity
        id: release-identity
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          release_query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){databaseId isDraft isPrerelease tagName}}}'
          release_response="$(gh api graphql -f query="${release_query}" -F owner="${GITHUB_REPOSITORY%%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F tag="${TAG}")"
          release_id="$(jq -er --arg tag "${TAG}" '.data.repository.release | select(.isDraft == true and .isPrerelease == false and .tagName == $tag) | .databaseId | select(type == "number" and . > 0)' <<<"${release_response}")"
          echo "release_id=${release_id}" >> "${GITHUB_OUTPUT}"
      - name: Share frozen draft assets with the read-only proof workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ steps.draft.outputs.assets_artifact }}
          path: |
            ${{ runner.temp }}/agentplugins-assets/agentplugins_*
            ${{ runner.temp }}/agentplugins-assets/checksums.txt
            ${{ runner.temp }}/agentplugins-assets/release-manifest.json
            ${{ runner.temp }}/agentplugins-assets/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 7

  platform-proof:
    if: ${{ inputs.publish_release != true }}
    needs: [validate, stage-draft]
    uses: ./.github/workflows/agentplugins-platform-proof.yml
    permissions:
      contents: read
      attestations: read
    with:
      tag: ${{ inputs.tag }}
      expected_commit: ${{ needs.validate.outputs.commit }}
      allow_legacy_manifest: false
      require_draft: true
      expected_asset_set_digest: ${{ needs.stage-draft.outputs.asset_set_digest }}
      release_assets_artifact: ${{ needs.stage-draft.outputs.assets_artifact }}

  verified-draft:
    if: ${{ inputs.publish_release != true }}
    needs: [validate, stage-draft, platform-proof]
    runs-on: ubuntu-24.04
    permissions:
      # GitHub draft visibility requires push capability; contents: read can return null.
      # This trusted producer verifier still only reads APIs/assets and verifies attestations.
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          package-manager-cache: false
      - name: Verify live draft after successful platform proofs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FROZEN_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_ID: ${{ needs.stage-draft.outputs.release_id }}
          EXPECTED_ASSET_SET_DIGEST: ${{ needs.stage-draft.outputs.asset_set_digest }}
          NPM_TARBALL_FILE: ${{ needs.platform-proof.outputs.tarball_file }}
        run: |
          python3 scripts/verify-agentplugins-draft.py \
            --repository "${GITHUB_REPOSITORY}" --tag "${TAG}" \
            --commit "${FROZEN_COMMIT}" --release-id "${RELEASE_ID}" \
            --asset-set-digest "${EXPECTED_ASSET_SET_DIGEST}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --source "${GITHUB_WORKSPACE}" --receipt "${RUNNER_TEMP}/verified-draft.json" \
            --npm-tarball-file "${NPM_TARBALL_FILE}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: agentplugins-verified-draft-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-draft.json
          if-no-files-found: error
          retention-days: 7

  reuse-verified-draft:
    if: ${{ inputs.publish_release == true }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      # Draft release API visibility requires write capability; this job only reads.
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          package-manager-cache: false
      - name: Authenticate qualification and reverify live draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FROZEN_COMMIT: ${{ needs.validate.outputs.commit }}
          QUALIFIED_RUN_ID: ${{ inputs.qualified_run_id }}
          QUALIFIED_RUN_ATTEMPT: ${{ inputs.qualified_run_attempt }}
        run: |
          [[ "${QUALIFIED_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          test "${QUALIFIED_RUN_ID}" != "${GITHUB_RUN_ID}"
          gh run watch "${QUALIFIED_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 10
          python3 scripts/reuse-agentplugins-verified-draft.py \
            --repository "${GITHUB_REPOSITORY}" --tag "${TAG}" --commit "${FROZEN_COMMIT}" \
            --run-id "${QUALIFIED_RUN_ID}" --run-attempt "${QUALIFIED_RUN_ATTEMPT}" \
            --source "${GITHUB_WORKSPACE}"

  promote-release:
    if: ${{ inputs.publish_release == true }}
    needs: [validate, reuse-verified-draft]
    runs-on: ubuntu-24.04
    environment: agentplugins-release
    permissions:
      contents: write
      actions: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          package-manager-cache: false
      - name: Reverify exact draft and promote only after all native proofs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FROZEN_COMMIT: ${{ needs.validate.outputs.commit }}
          QUALIFIED_RUN_ID: ${{ inputs.qualified_run_id }}
          QUALIFIED_RUN_ATTEMPT: ${{ inputs.qualified_run_attempt }}
        run: |
          release_id="$(python3 scripts/reuse-agentplugins-verified-draft.py \
            --repository "${GITHUB_REPOSITORY}" --tag "${TAG}" --commit "${FROZEN_COMMIT}" \
            --run-id "${QUALIFIED_RUN_ID}" --run-attempt "${QUALIFIED_RUN_ATTEMPT}" \
            --source "${GITHUB_WORKSPACE}")"
          [[ "${release_id}" =~ ^[1-9][0-9]*$ ]]
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false | jq -e --arg tag "${TAG}" --argjson id "${release_id}" \
            '.id == $id and .tag_name == $tag and .draft == false and .prerelease == false'
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" | \
            jq -e --arg tag "${TAG}" --argjson id "${release_id}" \
            '.id == $id and .tag_name == $tag and .draft == false and .prerelease == false'
      - name: Dispatch trusted npm publish for the promoted release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          QUALIFIED_RUN_ID: ${{ inputs.qualified_run_id }}
          QUALIFIED_RUN_ATTEMPT: ${{ inputs.qualified_run_attempt }}
        run: |
          set -euo pipefail
          # npm publication is not optional bookkeeping: the public npx
          # entrypoint installs dist-tags.latest, so a skipped publish is
          # user-visible drift. The npm-agentplugins environment approval
          # remains the human gate before anything reaches the registry.
          gh workflow run agentplugins-npm-publish.yml \
            --repo "${GITHUB_REPOSITORY}" --ref "${TAG}" \
            -f "tag=${TAG}" -f publish=true \
            -f "qualified_run_id=${QUALIFIED_RUN_ID}" -f "qualified_run_attempt=${QUALIFIED_RUN_ATTEMPT}"

  dispatch-promotion:
    if: ${{ inputs.publish_release != true && inputs.auto_publish == true }}
    needs: [validate, verified-draft]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch promotion of this exact qualification
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh workflow run agentplugins-release.yml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}" \
            -f "tag=${TAG}" -f publish_release=true \
            -f "qualified_run_id=${GITHUB_RUN_ID}" -f "qualified_run_attempt=${GITHUB_RUN_ATTEMPT}"
