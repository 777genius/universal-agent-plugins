name: Agentplugins Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact stable tag, for example agentplugins-v0.1.0
        required: true
      producer_mode:
        description: Binary-only publication, read-only paired preparation, or explicit promotion
        required: true
        default: binary-only
        type: choice
        options:
          - binary-only
          - paired-preparation
          - paired-promotion
          - paired-input-provenance
      source_sha:
        description: Exact source and workflow SHA (required for paired preparation)
        required: false
      plugin_kit_version:
        description: Explicit plugin-kit version (paired first cut requires 2.0.0)
        required: false
      preparation_run:
        description: Exact completed preparation run ID (promotion or input provenance)
        required: false
      preparation_attempt:
        description: Exact preparation run attempt (promotion or input provenance)
        required: false
      preparation_artifact:
        description: Exact preparation artifact ID (promotion or input provenance)
        required: false
      preparation_digest:
        description: Independently selected preparation ZIP SHA256 (promotion or input provenance)
        required: false
      promotion_operation:
        description: Promote exact drafts or reconcile interrupted drafts/partial publication
        required: true
        default: promote
        type: choice
        options:
          - promote
          - reconcile
      promotion_record:
        description: Fixed canonical promotion record bindings; unsupported native contracts reject
        required: false

permissions:
  contents: read

concurrency:
  group: agentplugins-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  dispatch_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      PRODUCER_MODE: ${{ inputs.producer_mode }}
      TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      KIT_VERSION: ${{ inputs.plugin_kit_version }}
      PREPARATION_RUN: ${{ inputs.preparation_run }}
      PREPARATION_ATTEMPT: ${{ inputs.preparation_attempt }}
      PREPARATION_ARTIFACT: ${{ inputs.preparation_artifact }}
      PREPARATION_DIGEST: ${{ inputs.preparation_digest }}
      PROMOTION_OPERATION: ${{ inputs.promotion_operation }}
      PROMOTION_RECORD: ${{ inputs.promotion_record }}
    steps:
      - name: C1 preflight
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:${PATH}"
          [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]
          case "${PRODUCER_MODE}" in
            binary-only|paired-preparation|paired-promotion) exit 0 ;;
            paired-input-provenance) [[ -z "${PROMOTION_RECORD}" && "${PROMOTION_OPERATION}" == promote ]] ;;
            *) exit 1 ;;
          esac
          [[ "${GITHUB_ACTIONS}" == true && "${GITHUB_REPOSITORY}" == 777genius/universal-agent-plugins ]]
          [[ "${TAG}" =~ ^agentplugins-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ && ${#TAG} -le 47 ]]
          [[ "${KIT_VERSION}" == 2.0.0 && "${TAG}" != agentplugins-v2.0.0 ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ && ! "${SOURCE_SHA}" =~ ^0+$ ]]
          [[ "${GITHUB_SHA}" == "${SOURCE_SHA}" && "${GITHUB_WORKFLOW_SHA}" == "${SOURCE_SHA}" ]]
          [[ "${GITHUB_REF}" == "refs/tags/${TAG}" ]]
          [[ "${GITHUB_WORKFLOW_REF}" == "777genius/universal-agent-plugins/.github/workflows/agentplugins-release.yml@refs/tags/${TAG}" ]]
          positive() { [[ "$1" =~ ^[1-9][0-9]{0,15}$ && "$1" -le 9007199254740991 ]]; }
          positive "${GITHUB_RUN_ID}"
          positive "${GITHUB_RUN_ATTEMPT}"; [[ "${GITHUB_RUN_ATTEMPT}" -le 1000 ]]
          positive "${PREPARATION_RUN}"; positive "${PREPARATION_ARTIFACT}"
          positive "${PREPARATION_ATTEMPT}"; [[ "${PREPARATION_ATTEMPT}" -le 1000 ]]
          [[ "${PREPARATION_DIGEST}" =~ ^[0-9a-f]{64}$ && ! "${PREPARATION_DIGEST}" =~ ^0+$ ]]
  validate:
    if: ${{ inputs.producer_mode == 'binary-only' }}
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
      GOFLAGS: -buildvcs=false -p=1
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Verify exact stable tag and current main
        id: identity
        env:
          TAG: ${{ inputs.tag }}
          PRODUCER_MODE: ${{ inputs.producer_mode }}
          WORKFLOW_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "${PRODUCER_MODE}" != "binary-only" ]]; then
            echo "unsupported agentplugins producer mode: ${PRODUCER_MODE}" >&2
            exit 1
          fi
          if [[ ! "${TAG}" =~ ^agentplugins-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid agentplugins stable tag: ${TAG}" >&2
            exit 1
          fi
          git fetch --force origin main:refs/remotes/origin/main "refs/tags/${TAG}:refs/tags/${TAG}"
          head_commit="$(git rev-parse HEAD)"
          test "${WORKFLOW_REF}" = "refs/heads/main"
          if [[ "${WORKFLOW_COMMIT}" != "${head_commit}" ]]; then
            echo "release workflow source does not match the exact tagged main commit" >&2
            exit 1
          fi
          test "${head_commit}" = "$(git rev-parse refs/remotes/origin/main)"
          test "${head_commit}" = "$(git rev-list -n 1 "refs/tags/${TAG}")"
          echo "commit=${head_commit}" >> "${GITHUB_OUTPUT}"
      - name: Verify merged PR and required commit evidence
        env:
          COMMIT: ${{ steps.identity.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pull_requests="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${COMMIT}/pulls")"
          pr_head="$(jq -er \
            '[.[] | select(.merged_at != null and .base.ref == "main")] | sort_by(.merged_at) | last | .head.sha' \
            <<<"${pull_requests}")" || {
              echo "release commit must come from a merged pull request into main" >&2
              exit 1
            }
          commit_checks="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${COMMIT}/check-runs?filter=latest&per_page=100")"
          pr_checks="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${pr_head}/check-runs?filter=latest&per_page=100")"
          has_check() {
            local payload="$1"
            local name="$2"
            jq -e --arg name "${name}" \
              'any(.[]?.check_runs[]?; .name == $name and .status == "completed" and .conclusion == "success")' \
              <<<"${payload}" >/dev/null
          }
          require_check() {
            local name="$1"
            if ! has_check "${commit_checks}" "${name}" && ! has_check "${pr_checks}" "${name}"; then
              echo "required successful check is missing on merge commit and PR head: ${name}" >&2
              exit 1
            fi
          }
          require_check dependency-review
          for name in \
            test \
            docs-check \
            'polyglot-smoke (ubuntu-latest)' \
            'polyglot-smoke (windows-latest)' \
            'analyze (go)' \
            'analyze (javascript-typescript)' \
            'govulncheck (root)' \
            'govulncheck (cli)' \
            'govulncheck (integrationctl)' \
            'govulncheck (plugininstall)' \
            'govulncheck (sdk)'; do
            require_check "${name}"
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.13
          cache: false
      - name: Verify exact release-bound Directory bootstrap
        working-directory: cli/plugin-kit-ai
        run: |
          release_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go run ./cmd/agentplugins/bootstrapgen \
            -snapshot cmd/agentplugins/directory_bootstrap_inputs/snapshot.json \
            -envelope cmd/agentplugins/directory_bootstrap_inputs/envelope.json \
            -trust cmd/agentplugins/directory_bootstrap_inputs/trusted-keys.json \
            -check cmd/agentplugins/directory_bootstrap_generated.go \
            -expected-key-id uap-directory-2026-01 \
            -expected-public-key HalXARjat+v3ylTPLMAnvuavRo4ZfrF+DbWwsjlp2bI= \
            -release-at "${release_at}"
      - name: Test standard-first engine and CLI
        run: |
          (cd install/integrationctl && go test ./agentplugins/... ./adapters/dirswap ./adapters/source)
          (cd cli/plugin-kit-ai && go test ./internal/agentpluginscli ./cmd/agentplugins/...)
      - name: Prove production binary excludes Directory conformance overrides
        working-directory: cli/plugin-kit-ai
        run: go test ./cmd/agentplugins -run '^TestReleaseBuiltBinaryHasNoConformanceEnvironmentOverride$' -count=1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Test npm bootstrap without install scripts
        working-directory: npm/agentplugins
        run: npm test && npm pack --dry-run --ignore-scripts

  build:
    if: ${{ inputs.producer_mode == 'binary-only' }}
    needs: validate
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
      GOFLAGS: -buildvcs=false -p=1
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: windows
            goarch: arm64
            suffix: .exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.13
          cache: false
      - name: Build exact-version binary
        env:
          TAG: ${{ inputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          SUFFIX: ${{ matrix.suffix }}
        working-directory: cli/plugin-kit-ai
        run: |
          version="${TAG#agentplugins-v}"
          asset="agentplugins_${version}_${GOOS}_${GOARCH}${SUFFIX}"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${version}" -o "${RUNNER_TEMP}/${asset}" ./cmd/agentplugins
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: agentplugins-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/agentplugins_*
          if-no-files-found: error
          retention-days: 3

  stage-draft:
    if: ${{ inputs.producer_mode == 'binary-only' }}
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: agentplugins-release
    outputs:
      asset_set_digest: ${{ steps.draft.outputs.asset_set_digest }}
      assets_artifact: ${{ steps.draft.outputs.assets_artifact }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agentplugins-*
          merge-multiple: true
          path: ${{ runner.temp }}/agentplugins-assets
      - name: Prepare immutable stable assets
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FROZEN_COMMIT: ${{ needs.validate.outputs.commit }}
        working-directory: ${{ runner.temp }}/agentplugins-assets
        run: |
          git -C "${GITHUB_WORKSPACE}" fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git -C "${GITHUB_WORKSPACE}" rev-list -n 1 "refs/tags/${TAG}")" = "${FROZEN_COMMIT}"
          node "${GITHUB_WORKSPACE}/npm/agentplugins/scripts/release-assets.js" \
            prepare "${PWD}" "${TAG}" "${FROZEN_COMMIT}"
          node "${GITHUB_WORKSPACE}/npm/agentplugins/scripts/release-assets.js" \
            verify "${PWD}" "${TAG}" "${FROZEN_COMMIT}"
          echo "asset_set_digest=$(sha256sum checksums.txt | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"
          echo "assets_artifact=agentplugins-draft-assets-${FROZEN_COMMIT}" >> "${GITHUB_OUTPUT}"
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          release_query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){isDraft isPrerelease tagName}}}'
          release_response="$(gh api graphql -f query="${release_query}" -F owner="${owner}" -F name="${repository}" -F tag="${TAG}")" || {
            echo "failed to look up existing release ${TAG}" >&2
            exit 1
          }
          release_json="$(jq -c '.data.repository.release' <<<"${release_response}")"
          if [[ "${release_json}" != "null" ]]; then
            jq -e --arg tag "${TAG}" \
              '.isDraft == true and .isPrerelease == false and .tagName == $tag' \
              <<<"${release_json}" >/dev/null || {
                echo "release ${TAG} already exists but is not the exact resumable draft; refusing to overwrite immutable assets" >&2
                exit 1
              }
            existing="${RUNNER_TEMP}/existing-agentplugins-assets"
            mkdir -p "${existing}"
            gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${existing}"
            node "${GITHUB_WORKSPACE}/npm/agentplugins/scripts/release-assets.js" \
              verify "${existing}" "${TAG}" "${FROZEN_COMMIT}"
            for asset in agentplugins_* checksums.txt release-manifest.json; do
              cmp -- "${asset}" "${existing}/${asset}" || {
                echo "existing draft asset differs from the frozen build: ${asset}" >&2
                exit 1
              }
            done
            echo "existing=true" >> "${GITHUB_OUTPUT}"
          else
            echo "existing=false" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/agentplugins-assets/agentplugins_*
            ${{ runner.temp }}/agentplugins-assets/checksums.txt
            ${{ runner.temp }}/agentplugins-assets/release-manifest.json
      - name: Create non-public immutable draft
        if: ${{ steps.draft.outputs.existing != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        working-directory: ${{ runner.temp }}/agentplugins-assets
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          release_query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){tagName}}}'
          release_response="$(gh api graphql -f query="${release_query}" -F owner="${owner}" -F name="${repository}" -F tag="${TAG}")" || {
            echo "failed to recheck release ${TAG} before creation" >&2
            exit 1
          }
          if [[ "$(jq -c '.data.repository.release' <<<"${release_response}")" != "null" ]]; then
            echo "release ${TAG} appeared concurrently; refusing to overwrite immutable assets" >&2
            exit 1
          fi
          gh release create "${TAG}" agentplugins_* checksums.txt release-manifest.json \
            --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --target "${{ needs.validate.outputs.commit }}" --draft \
            --title "Agentplugins ${TAG#agentplugins-v}" --generate-notes
      - name: Share frozen draft assets with the read-only proof workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ steps.draft.outputs.assets_artifact }}
          path: |
            ${{ runner.temp }}/agentplugins-assets/agentplugins_*
            ${{ runner.temp }}/agentplugins-assets/checksums.txt
            ${{ runner.temp }}/agentplugins-assets/release-manifest.json
          if-no-files-found: error
          retention-days: 7

  platform-proof:
    if: ${{ inputs.producer_mode == 'binary-only' }}
    needs: [validate, stage-draft]
    uses: ./.github/workflows/agentplugins-platform-proof.yml
    permissions:
      contents: read
      attestations: read
    with:
      tag: ${{ inputs.tag }}
      expected_commit: ${{ needs.validate.outputs.commit }}
      allow_legacy_manifest: false
      require_draft: true
      expected_asset_set_digest: ${{ needs.stage-draft.outputs.asset_set_digest }}
      release_assets_artifact: ${{ needs.stage-draft.outputs.assets_artifact }}

  promote-release:
    if: ${{ inputs.producer_mode == 'binary-only' }}
    needs: [validate, stage-draft, platform-proof]
    runs-on: ubuntu-latest
    environment: agentplugins-release
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Reverify exact draft and promote only after all native proofs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FROZEN_COMMIT: ${{ needs.validate.outputs.commit }}
          EXPECTED_ASSET_SET_DIGEST: ${{ needs.stage-draft.outputs.asset_set_digest }}
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git rev-list -n 1 "refs/tags/${TAG}")" = "${FROZEN_COMMIT}"
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          release_query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){isDraft isPrerelease tagName}}}'
          release_response="$(gh api graphql -f query="${release_query}" -F owner="${owner}" -F name="${repository}" -F tag="${TAG}")" || {
            echo "failed to look up release ${TAG} immediately before promotion" >&2
            exit 1
          }
          release_json="$(jq -c '.data.repository.release' <<<"${release_response}")"
          [[ "${release_json}" != "null" ]] || {
            echo "release ${TAG} was not found immediately before promotion" >&2
            exit 1
          }
          jq -e --arg tag "${TAG}" \
            '.isDraft == true and .isPrerelease == false and .tagName == $tag' \
            <<<"${release_json}" >/dev/null || {
              echo "release is no longer the exact non-public draft proven by this run" >&2
              exit 1
            }
          assets="${RUNNER_TEMP}/agentplugins-promote-assets"
          mkdir -p "${assets}"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${assets}"
          node npm/agentplugins/scripts/release-assets.js verify "${assets}" "${TAG}" "${FROZEN_COMMIT}"
          test "$(sha256sum "${assets}/checksums.txt" | cut -d ' ' -f 1)" = "${EXPECTED_ASSET_SET_DIGEST}"
          for asset in "${assets}"/agentplugins_* "${assets}/checksums.txt" "${assets}/release-manifest.json"; do
            gh attestation verify "${asset}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/agentplugins-release.yml" \
              --source-digest "${FROZEN_COMMIT}"
          done
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name' | grep -Fx -- "${TAG}"

  paired-preparation:
    if: ${{ inputs.producer_mode == 'paired-preparation' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      WORKFLOW_SHA: ${{ github.sha }}
      TAG: ${{ inputs.tag }}
      KIT_VERSION: ${{ inputs.plugin_kit_version }}
      GOTOOLCHAIN: local
      GOMAXPROCS: "2"
    steps:
      - name: Validate explicit paired identity before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ && ! "${SOURCE_SHA}" =~ ^0{40}$ ]]
          test "${SOURCE_SHA}" = "${WORKFLOW_SHA}"
          [[ "${TAG}" =~ ^agentplugins-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "${KIT_VERSION}" = "2.0.0"
          test "${TAG#agentplugins-v}" != "${KIT_VERSION}"
          test "${GITHUB_REPOSITORY}" = "777genius/universal-agent-plugins"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Check exact checkout
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.13
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Provision declared Go modules for offline producer
        env:
          GOMODCACHE: ${{ runner.temp }}/paired-modules
          GOCACHE: ${{ runner.temp }}/paired-cache
        run: go mod download
      - name: Freeze one full release-contract pair and project verified bytes
        shell: bash
        env:
          GOMODCACHE: ${{ runner.temp }}/paired-modules
          GOCACHE: ${{ runner.temp }}/paired-cache
        run: |
          set -euo pipefail
          export TRUSTED_GO="$(command -v go)"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { stageCandidate } = require('./npm/agentplugins/scripts/stage-dual-authoring-candidate');
          const { prepareAuthoringRelease, verifyAuthoringRelease } = require('./npm/agentplugins/scripts/release-assets');
          const root = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'authoring-preparation-'));
          const workParent = path.join(root, 'work');
          fs.mkdirSync(workParent, { mode: 0o700 });
          const identity = { repository: '777genius/universal-agent-plugins',
            commit: process.env.SOURCE_SHA, engine_revision: process.env.SOURCE_SHA,
            versions: { agentplugins: process.env.TAG.slice('agentplugins-v'.length), 'plugin-kit-ai': process.env.KIT_VERSION } };
          const common = { candidate: true, identity, go: process.env.TRUSTED_GO, workParent,
            assetScope: 'six-platform-pair', authoringMode: 'release-cli-contract-v1' };
          // stageCandidate builds once and independently verifies before sealing.
          const candidate = path.join(root, 'candidate');
          const staged = stageCandidate({ ...common, repo: process.env.GITHUB_WORKSPACE,
            modCache: process.env.GOMODCACHE, output: candidate });
          fs.writeFileSync(path.join(root, 'candidate-identity.json'), JSON.stringify({ identity, ...staged }, null, 2) + '\n', { flag: 'wx' });
          const options = { ...common, root: candidate, manifestDigest: staged.manifest_sha256,
            outputs: { agentplugins: path.join(root, 'agentplugins'), 'plugin-kit-ai': path.join(root, 'plugin-kit-ai') },
            pairMarker: path.join(root, 'pair-prepared.json') };
          prepareAuthoringRelease(options);
          verifyAuthoringRelease(options);
          fs.appendFileSync(process.env.GITHUB_ENV, `PAIRED_OUTPUT=${root}\n`);
          NODE
      - name: Bind preparation invocation outside unchanged frozen input bytes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const c = require('./npm/agentplugins/scripts/dual-authoring-candidate');
          const n = require('./npm/agentplugins/scripts/authoring-native-qualification');
          const root = process.env.PAIRED_OUTPUT;
          const pairBody = c.readFile(path.join(root, 'pair-prepared.json'));
          const pair = JSON.parse(pairBody);
          const pins = { identity: pair.identity, candidate_sha256: pair.candidate_sha256,
            pair_marker_sha256: c.digest(pairBody), products: pair.products };
          // Input provenance only: no future qualification or npm tarball hash.
          // The external provider artifact ID/digest is acquired after upload.
          // Keep candidate-identity.json and all eighteen input subjects intact.
          const before = require('./npm/agentplugins/scripts/authoring-release')
            .verifyProjectedPair(root, pins).subjects.map(x => [x.file, x.sha256]);
          n.writePreparation(root, pins, {
            repository: process.env.GITHUB_REPOSITORY,
            workflow: '.github/workflows/agentplugins-release.yml',
            source: process.env.SOURCE_SHA,
            workflow_sha: process.env.WORKFLOW_SHA,
            run_id: Number(process.env.GITHUB_RUN_ID),
            run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT)
          });
          const after = require('./npm/agentplugins/scripts/authoring-release')
            .verifyProjectedPair(root, pins).subjects.map(x => [x.file, x.sha256]);
          require('node:assert/strict').deepEqual(after, before);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            'Preparation receipt binds input provenance only. Native and public acceptance remain required.\n');
