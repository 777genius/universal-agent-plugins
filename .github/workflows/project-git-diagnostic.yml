name: Project Git Fixture Diagnostic

on:
  push:
    branches: [fix/project-git-diagnostic-20261025]
  workflow_dispatch:

# Replace ordinary CI for the same PR/ref; keep manual runs independent.
concurrency:
  group: project-git-diagnostic-${{ github.event_name }}-${{ github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  git-fixtures:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Observe bounded local Git cleanup once
        env:
          AGENTPLUGINS_GIT_CLEANUP_DIAGNOSTIC: '1'
        run: go test -count=1 -timeout=7m -v -run '^TestOSRunnerLocalGitFetchCleanupObservation$' ./install/integrationctl/adapters/process
