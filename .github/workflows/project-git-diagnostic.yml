name: Project Git Fixture Diagnostic

on:
  push:
    branches: [fix/project-git-diagnostic-20261025]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  git-fixtures:
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Observe the two existing Git lifecycle fixtures once
        run: go test -count=1 -timeout=10m -run '^(TestDependencyEnvironmentCLIEndToEnd|TestInstallDependencyGraphLifecycle)$' ./cli/internal/agentpluginscli
