name: SkillSpector production acceptance

on:
  workflow_run:
    workflows: [Pages]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the latest deployed version needs a live acceptance run.
concurrency:
  group: skillspector-production-acceptance
  cancel-in-progress: true

jobs:
  live:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          package_json_file: landing/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install pinned landing dependencies
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: landing
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Verify live reports and browser UX
        working-directory: landing
        timeout-minutes: 20
        env:
          UAP_E2E_LIVE_SKILLSPECTOR: "1"
          UAP_LANDING_DEPLOYMENT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          UAP_LANDING_SCREENSHOT_DIR: ${{ runner.temp }}/uap-skillspector-live
        run: node --experimental-strip-types scripts/skillspector-live-smoke.mjs

      - name: Retain evidence and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: skillspector-production-acceptance
          path: ${{ runner.temp }}/uap-skillspector-live/
          if-no-files-found: warn
          retention-days: 7
