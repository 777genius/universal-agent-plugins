name: SkillSpector production acceptance

on:
  pull_request:
    # A draft PR skips the publication gate; rerun it when the PR becomes reviewable.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "landing/components/registry/SkillSpectorAssessment.vue"
      - "landing/features/skillspector/**"
      - "landing/utils/skillSpector*.ts"
      - "landing/scripts/skillspector-live-smoke.mjs"
      - "landing/types/skillSpector.ts"
      - ".github/workflows/skillspector-live-acceptance.yml"
  workflow_run:
    workflows: [Pages]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the latest deployed version needs a live acceptance run.
concurrency:
  group: skillspector-production-acceptance-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  publication-contract:
    name: skillspector-publication-contract
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Evaluate the actual PR HEAD, not the synthetic pull/merge ref.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          package_json_file: landing/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml
      - name: Install pinned landing dependencies
        working-directory: landing
        run: pnpm install --frozen-lockfile
      - name: Verify every published v3 shard using the PR consumer
        working-directory: landing
        timeout-minutes: 20
        env:
          UAP_E2E_LIVE_SKILLSPECTOR: "1"
          UAP_SKILLSPECTOR_PUBLICATION_ONLY: "1"
          UAP_LANDING_SCREENSHOT_DIR: ${{ runner.temp }}/uap-skillspector-publication
        run: node --experimental-strip-types scripts/skillspector-live-smoke.mjs
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: skillspector-premerge-publication
          path: ${{ runner.temp }}/uap-skillspector-publication/
          if-no-files-found: warn
          retention-days: 7

  live:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Select the source actually published by Pages
        id: production-source
        env:
          EXPECTED_CONTROL_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          python3 scripts/production_site_source.py select "$GITHUB_WORKSPACE" "$RUNNER_TEMP/production-site-control" --expected-control "$EXPECTED_CONTROL_SHA"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          package_json_file: landing/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install pinned landing dependencies
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: landing
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Verify live reports and browser UX
        working-directory: landing
        timeout-minutes: 20
        env:
          UAP_E2E_LIVE_SKILLSPECTOR: "1"
          UAP_LANDING_DEPLOYMENT_SHA: ${{ steps.production-source.outputs.commit }}
          UAP_LANDING_SCREENSHOT_DIR: ${{ runner.temp }}/uap-skillspector-live
        run: node --experimental-strip-types scripts/skillspector-live-smoke.mjs

      - name: Verify actual public Skills install actions and API
        working-directory: landing
        timeout-minutes: 10
        env:
          UAP_E2E_LIVE_SKILLS: '1'
          UAP_LANDING_DEPLOYMENT_SHA: ${{ steps.production-source.outputs.commit }}
          UAP_SKILLS_INSTALL_REPORT_DIR: ${{ runner.temp }}/uap-skills-install-live
          UAP_GITHUB_READ_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/skills-install-live-smoke.ts

      - name: Retain evidence and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: skillspector-production-acceptance
          path: |
            ${{ runner.temp }}/uap-skillspector-live/
            ${{ runner.temp }}/uap-skills-install-live/
            ${{ runner.temp }}/production-site-control/receipt.json
          if-no-files-found: warn
          retention-days: 7
