name: Agentplugins NPM Drift Guard

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Manual audits are independent; scheduled latest-state audits retain their queue.
  group: agentplugins-npm-drift-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  npm-drift:
    name: Verify npm latest tracks the newest public release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: Fail on npm/public release drift
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: universal-agent-plugins
        run: |
          set -euo pipefail
          # Newest stable public release wins; drafts and prereleases never do.
          # Consume the full sorted list before reading: `head` would close the
          # pipe early and `pipefail` turns the resulting SIGPIPE into a false
          # failure once the release list outgrows the pipe buffer.
          sorted_releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^agentplugins-v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | [.published_at, .tag_name] | @tsv' \
            | sort -r)"
          test -n "${sorted_releases}"
          newest_line="${sorted_releases%%$'\n'*}"
          newest_at="${newest_line%%$'\t'*}"
          newest_tag="${newest_line#*$'\t'}"
          expected="${newest_tag#agentplugins-v}"
          actual="$(npm view "${PACKAGE_NAME}" dist-tags.latest)"
          expected_on_npm="$(npm view "${PACKAGE_NAME}@${expected}" version 2>/dev/null || true)"
          echo "newest public release: ${newest_tag} (published ${newest_at})"
          echo "npm dist-tags.latest: ${actual}"
          if [[ "${actual}" == "${expected}" && "${expected_on_npm}" == "${expected}" ]]; then
            echo "npm registry is in sync with the public release"
            exit 0
          fi
          newest_epoch="$(node -e 'process.stdout.write(String(Math.floor(Date.parse(process.argv[1]) / 1000)))' "${newest_at}")"
          age_minutes=$(( ( $(date -u +%s) - newest_epoch ) / 60 ))
          # The npm publish pauses for the human npm-agentplugins approval, so
          # tolerate a release sitting unpublished for six hours before
          # calling it drift.
          if (( age_minutes < 360 )); then
            echo "::warning::npm latest ${actual} does not match ${expected} yet; release is only ${age_minutes} minutes old, inside the publication window"
            exit 0
          fi
          echo "::error::npm drift: dist-tags.latest=${actual}, newest public release is ${newest_tag} (published ${newest_at}); expected ${PACKAGE_NAME}@${expected} on npm with dist-tag latest"
          exit 1
