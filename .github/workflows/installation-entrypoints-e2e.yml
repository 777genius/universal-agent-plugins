name: Installation entrypoints E2E

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/installation-entrypoints-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-and-npx:
    name: Linux / npx and global npm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.1'
          package-manager-cache: false
      - name: Install the published CLI through npx and add Context7
        shell: bash
        run: |
          set -euo pipefail
          test "$(npx --yes universal-agent-plugins@0.1.95 version)" = 'agentplugins 0.1.95'
          mkdir -p "$RUNNER_TEMP/npx-profile"
          HOME="$RUNNER_TEMP/npx-profile" npx --yes universal-agent-plugins@0.1.95 add context7 --target codex --no-save --format json
      - name: Install published CLI globally through npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --prefix "$RUNNER_TEMP/npm-global" universal-agent-plugins@0.1.95
          test "$("$RUNNER_TEMP/npm-global/bin/agentplugins" version)" = 'agentplugins 0.1.95'
          mkdir -p "$RUNNER_TEMP/npm-profile"
          HOME="$RUNNER_TEMP/npm-profile" "$RUNNER_TEMP/npm-global/bin/agentplugins" add context7 --target codex --no-save --format json

  native-linux-project:
    name: Linux / native installer and locked project restore
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AGENTPLUGINS_VERSION: '0.1.95'
      AGENTPLUGINS_BIN_DIR: ${{ runner.temp }}/native-bin
    steps:
      - name: Install published binary using the README shell entrypoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/777genius/universal-agent-plugins/main/install.sh | sh -s -- version
          test "$("$AGENTPLUGINS_BIN_DIR/agentplugins" version)" = 'agentplugins 0.1.95'
      - name: Add a pinned package, lock it, and restore it in another directory
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/isolated-home"
          mkdir -p "$HOME" "$RUNNER_TEMP/project-a" "$RUNNER_TEMP/project-b"
          cli="$AGENTPLUGINS_BIN_DIR/agentplugins"
          source='github:777genius/universal-agent-plugins@2ddbb99dd190c1792b79904f9875e6322bccd243//plugins/gitlab'
          "$cli" add "$source" --target codex --scope project --project-root "$RUNNER_TEMP/project-a" --format json
          test -s "$RUNNER_TEMP/project-a/uap.toml"
          test -s "$RUNNER_TEMP/project-a/uap.lock"
          test -s "$RUNNER_TEMP/project-a/.codex/config.toml"
          cp "$RUNNER_TEMP/project-a/uap.toml" "$RUNNER_TEMP/project-a/uap.lock" "$RUNNER_TEMP/project-b/"
          "$cli" install --locked --scope project --project-root "$RUNNER_TEMP/project-b" --format json
          test -s "$RUNNER_TEMP/project-b/.codex/config.toml"
          cmp "$RUNNER_TEMP/project-a/uap.toml" "$RUNNER_TEMP/project-b/uap.toml"
          cmp "$RUNNER_TEMP/project-a/uap.lock" "$RUNNER_TEMP/project-b/uap.lock"
          "$cli" install --locked --scope project --project-root "$RUNNER_TEMP/project-b" --format json

  homebrew-macos:
    name: macOS / Homebrew
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Install published CLI through its Homebrew tap
        shell: bash
        run: |
          set -euo pipefail
          brew install 777genius/agentplugins/agentplugins
          agentplugins version
          mkdir -p "$RUNNER_TEMP/brew-profile"
          HOME="$RUNNER_TEMP/brew-profile" agentplugins add context7 --target codex --no-save --format json

  powershell-windows:
    name: Windows / PowerShell and Context7
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Install published CLI with the README PowerShell entrypoint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          irm https://raw.githubusercontent.com/777genius/universal-agent-plugins/main/install.ps1 | iex
          $cli = Join-Path $HOME '.local\bin\agentplugins.exe'
          if (-not (Test-Path -LiteralPath $cli)) { throw 'installer did not create agentplugins.exe' }
          $version = (& $cli version | Out-String).Trim()
          if ($version -notmatch '^agentplugins 0\.1\.\d+$') { throw "unexpected version: $version" }
          $env:HOME = Join-Path $env:RUNNER_TEMP 'windows-profile'
          New-Item -ItemType Directory -Path $env:HOME -Force | Out-Null
          & $cli add context7 --target codex --no-save --format json
          if ($LASTEXITCODE -ne 0) { throw "Context7 install failed: $LASTEXITCODE" }
