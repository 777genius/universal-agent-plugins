name: Website reviewed plugins live installation audit

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'landing/data/catalogCuration.ts'
      - 'landing/scripts/website-reviewed-install-e2e.ts'
      - '.github/workflows/website-reviewed-plugins-e2e.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * 5'

permissions:
  contents: read

concurrency:
  group: website-reviewed-plugins-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reviewed-live:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'ci:live-skills')) }}
    name: Live signed website reviewed plugins / shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify authentic signed Registry mirror used by public website
        run: |
          go run ./cmd/agentplugins-registry-mirror \
            --registry-repository 777genius/universal-agent-plugins-registry \
            --pages-origin https://777genius.github.io/universal-agent-plugins-registry/ \
            --output "${{ runner.temp }}/uap-registry-mirror"
          cp -a "${{ runner.temp }}/uap-registry-mirror/." landing/public/
          test -s landing/public/registry/schemas/1/latest.json
      - name: Install real released CLI and genuine local agent CLIs
        run: |
          npm install --global universal-agent-plugins@latest \
            @anthropic-ai/claude-code@2.1.263 @openai/codex@0.153.4 opencode-ai@1.18.34
          agentplugins version
          claude --version
          codex --version
          opencode --version
      - name: Check each reviewed website card using real install, list, repeat and remove
        env:
          UAP_REVIEWED_SHARD: ${{ matrix.shard }}
          UAP_REVIEWED_REPORT_DIR: ${{ runner.temp }}/reviewed-plugin-receipts
        run: node --experimental-strip-types landing/scripts/website-reviewed-install-e2e.ts
      - name: Retain complete original per-card evidence even on error
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: website-reviewed-plugins-${{ matrix.shard }}
          path: ${{ runner.temp }}/reviewed-plugin-receipts/
          if-no-files-found: warn
          retention-days: 14
