name: Antigravity Native Plugin E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'install/integrationctl/agentplugins/clients/antigravity/**'
      - 'install/integrationctl/agentplugins/domain/clients_catalog.go'
      - 'scripts/e2e/antigravity-native.sh'
      - 'scripts/e2e/antigravity-native-cross.py'
      - 'install/integrationctl/research/antigravityinventory/**'
      - 'docs/ANTIGRAVITY_NATIVE_PLUGINS.md'
      - 'scripts/e2e/released-native-proof.py'
      - 'scripts/test_released_native_proof.py'
      - 'npm/agentplugins/scripts/release-assets.js'
      - '.github/workflows/agentplugins-release.yml'
      - '.github/workflows/antigravity-native-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'install/integrationctl/agentplugins/clients/antigravity/**'
      - 'install/integrationctl/agentplugins/domain/clients_catalog.go'
      - 'scripts/e2e/antigravity-native.sh'
      - 'scripts/e2e/antigravity-native-cross.py'
      - 'install/integrationctl/research/antigravityinventory/**'
      - 'docs/ANTIGRAVITY_NATIVE_PLUGINS.md'
      - 'scripts/e2e/released-native-proof.py'
      - 'scripts/test_released_native_proof.py'
      - 'npm/agentplugins/scripts/release-assets.js'
      - '.github/workflows/agentplugins-release.yml'
      - '.github/workflows/antigravity-native-e2e.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      frozen_commit:
        required: true
        type: string
      release_assets_artifact:
        required: true
        type: string
      expected_checksums_sha256:
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  FROZEN_COMMIT: ${{ inputs.frozen_commit }}
  RELEASE_ASSETS_ARTIFACT: ${{ inputs.release_assets_artifact }}
  EXPECTED_CHECKSUMS_SHA256: ${{ inputs.expected_checksums_sha256 }}

permissions:
  contents: read

concurrency:
  group: antigravity-native-e2e-${{ github.event.pull_request.number || github.ref }}-${{ inputs.release_tag || 'source' }}
  cancel-in-progress: false

jobs:
  native-linux-x64:
    name: pinned agy + UAP project plugin lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.frozen_commit || github.event.pull_request.head.sha || github.sha }}
      - name: Test release proof boundaries
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/test_released_native_proof.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ inputs.release_tag != '' }}
        with:
          node-version: '22.21.1'
          package-manager-cache: false
      - name: Acquire the complete same-run frozen release bundle
        if: ${{ inputs.release_tag != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.release_assets_artifact }}
          path: ${{ runner.temp }}/released-native-assets
      - if: ${{ inputs.release_tag == '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Download exact real Antigravity CLI (SHA-256 verified)
        shell: bash
        run: |
          set -euo pipefail
          version=1.5.3
          archive="$RUNNER_TEMP/agy_cli_linux_x64.tar.gz"
          expected=1b4850599cce73a17f94ffb422df3bf9531531b77dbddc40c1a435e0c2c16807
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            "https://github.com/google-antigravity/antigravity-cli/releases/download/$version/agy_cli_linux_x64.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/agy-cli"
          tar -xzf "$archive" -C "$RUNNER_TEMP/agy-cli"
          # GitHub's archive names the payload by release/platform; it is not
          # guaranteed to contain a literal file named "agy". Find the single
          # Linux x86-64 ELF, rather than assuming an archive member filename.
          mapfile -t candidates < <(
            find "$RUNNER_TEMP/agy-cli" -type f -print | while IFS= read -r item; do
              if readelf -h "$item" 2>/dev/null | grep -q 'Machine:.*Advanced Micro Devices X86-64'; then
                printf '%s\n' "$item"
              fi
            done
          )
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "Expected exactly one x86-64 ELF executable in the digest-verified agy archive" >&2
            find "$RUNNER_TEMP/agy-cli" -maxdepth 4 -type f -printf '%P\n' >&2
            exit 1
          fi
          agy="${candidates[0]}"
          chmod u+x "$agy"
          "$agy" --version
          echo "AGY_BIN=$agy" >> "$GITHUB_ENV"
      - name: Build the exact UAP pull-request CLI
        if: ${{ inputs.release_tag == '' }}
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/agentplugins" ./cmd/agentplugins
          echo "UAP_BIN=$RUNNER_TEMP/agentplugins" >> "$GITHUB_ENV"
      - name: Build fixed disposable User admission bridge and run inert contracts
        if: ${{ inputs.release_tag == '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          $nativeSHA = (Get-FileHash -LiteralPath $env:AGY_BIN -Algorithm SHA256).Hash.ToLowerInvariant()
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $helper = Join-Path $env:RUNNER_TEMP ('agy-user-admission' + $suffix)
          go -C install/integrationctl test ./research/antigravityinventory -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Antigravity bridge contracts failed' }
          go -C install/integrationctl build -ldflags "-X main.sourceCommit=$commit -X main.sourceTree=$tree -X main.nativeSHA=$nativeSHA" -o $helper ./research/antigravityinventory
          if ($LASTEXITCODE -ne 0) { throw 'Antigravity bridge build failed' }
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python scripts/e2e/antigravity-native-cross.py --contracts
          if ($LASTEXITCODE -ne 0) { throw 'Antigravity ledger contracts failed' }
          "AGY_ADMISSION_HELPER=$helper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGY_ADMISSION_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGY_ADMISSION_TREE=$tree" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Real native plugin strict validation, discovery and scoped removal
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            python3 scripts/e2e/released-native-proof.py run --client antigravity --target "linux-amd64" --tag "$RELEASE_TAG" --commit "$FROZEN_COMMIT" --checksums-sha256 "$EXPECTED_CHECKSUMS_SHA256" --assets-artifact "$RELEASE_ASSETS_ARTIFACT" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source "$GITHUB_WORKSPACE" --assets "$RUNNER_TEMP/released-native-assets" --proofs "$RUNNER_TEMP/released-native-proof"
          else
            bash scripts/e2e/antigravity-native.sh
            python3 scripts/e2e/antigravity-native-cross.py
          fi
      - name: Retain release-native receipt and transcript
        if: ${{ always() && inputs.release_tag != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: antigravity-release-native-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/released-native-proof/
          if-no-files-found: error
          retention-days: 14

  native-macos:
    name: pinned agy 1.5.3 + UAP macOS native lifecycle
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.frozen_commit || github.event.pull_request.head.sha || github.sha }}
      - name: Test release proof boundaries
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/test_released_native_proof.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ inputs.release_tag != '' }}
        with:
          node-version: '22.21.1'
          package-manager-cache: false
      - name: Acquire the complete same-run frozen release bundle
        if: ${{ inputs.release_tag != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.release_assets_artifact }}
          path: ${{ runner.temp }}/released-native-assets
      - if: ${{ inputs.release_tag == '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Download pinned real macOS agy and verify vendor SHA256
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              arch=x64
              expected=f0470eac7fb2f98886e1210457531bf1883c439ffa9e99d730388a1ff3dfeef5
              ;;
            arm64)
              arch=arm64
              expected=b47034e1367fc3c9f2856f1e1ae30bf12819a7213821ba3cce2123b090f2df8a
              ;;
            *) echo "Unsupported macOS architecture" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/agy_cli_mac_$arch.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/google-antigravity/antigravity-cli/releases/download/1.5.3/agy_cli_mac_$arch.tar.gz" \
            -o "$archive"
          actual="$(shasum -a 256 "$archive" | cut -d ' ' -f1)"
          test "$actual" = "$expected"
          mkdir -p "$RUNNER_TEMP/agy-unpacked"
          tar -xzf "$archive" -C "$RUNNER_TEMP/agy-unpacked"
          agy="$(python3 - "$RUNNER_TEMP/agy-unpacked" <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          matches = []
          for path in Path(sys.argv[1]).rglob("*"):
              if path.is_file() and not path.is_symlink():
                  description = subprocess.check_output(["file", "-b", str(path)], text=True)
                  if "Mach-O" in description and "executable" in description:
                      matches.append(path)
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one Mach-O executable, got {len(matches)}")
          print(matches[0])
          PY
          )"
          test -n "$agy"
          chmod u+x "$agy"
          "$agy" --version
          echo "AGY_BIN=$agy" >> "$GITHUB_ENV"
      - name: Build UAP CLI from exact PR commit
        if: ${{ inputs.release_tag == '' }}
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/agentplugins" ./cmd/agentplugins
          echo "UAP_BIN=$RUNNER_TEMP/agentplugins" >> "$GITHUB_ENV"
      - name: Build fixed disposable User admission bridge and run inert contracts
        if: ${{ inputs.release_tag == '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          $nativeSHA = (Get-FileHash -LiteralPath $env:AGY_BIN -Algorithm SHA256).Hash.ToLowerInvariant()
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $helper = Join-Path $env:RUNNER_TEMP ('agy-user-admission' + $suffix)
          go -C install/integrationctl test ./research/antigravityinventory -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Antigravity bridge contracts failed' }
          go -C install/integrationctl build -ldflags "-X main.sourceCommit=$commit -X main.sourceTree=$tree -X main.nativeSHA=$nativeSHA" -o $helper ./research/antigravityinventory
          if ($LASTEXITCODE -ne 0) { throw 'Antigravity bridge build failed' }
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python scripts/e2e/antigravity-native-cross.py --contracts
          if ($LASTEXITCODE -ne 0) { throw 'Antigravity ledger contracts failed' }
          "AGY_ADMISSION_HELPER=$helper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGY_ADMISSION_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGY_ADMISSION_TREE=$tree" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Cross-platform native macOS lifecycle
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            python3 scripts/e2e/released-native-proof.py run --client antigravity --target "darwin-arm64" --tag "$RELEASE_TAG" --commit "$FROZEN_COMMIT" --checksums-sha256 "$EXPECTED_CHECKSUMS_SHA256" --assets-artifact "$RELEASE_ASSETS_ARTIFACT" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source "$GITHUB_WORKSPACE" --assets "$RUNNER_TEMP/released-native-assets" --proofs "$RUNNER_TEMP/released-native-proof"
          else
            python3 scripts/e2e/antigravity-native-cross.py
          fi
      - name: Retain release-native receipt and transcript
        if: ${{ always() && inputs.release_tag != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: antigravity-release-native-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/released-native-proof/
          if-no-files-found: error
          retention-days: 14

  native-windows:
    name: pinned agy 1.5.3 + UAP Windows x64 native lifecycle
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Preserve exact harness and schema bytes in the Windows checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve canonical checkout bytes' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.frozen_commit || github.event.pull_request.head.sha || github.sha }}
      - name: Test release proof boundaries
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/test_released_native_proof.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ inputs.release_tag != '' }}
        with:
          node-version: '22.21.1'
          package-manager-cache: false
      - name: Acquire the complete same-run frozen release bundle
        if: ${{ inputs.release_tag != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.release_assets_artifact }}
          path: ${{ runner.temp }}/released-native-assets
      - if: ${{ inputs.release_tag == '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Verify pinned embedded schema bytes survive Windows checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'install/integrationctl/agentplugins/adapters/specregistry/schemas/1.0.0'
          $digests = @{
            'plugin.schema.json' = '0a4aad95ce337878ad38802ebf0daa3fde76abe3f65400c86bcbb1ec0b3ab883'
            'mcp.schema.json' = '6539175bfcdf43085855183e86da40ea94b166547a72b47ae9a0a390516d3acb'
          }
          foreach ($name in $digests.Keys) {
            $path = Join-Path $root $name
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $digests[$name]) { throw "Embedded $name changed during Windows checkout" }
          }
      - name: Download pinned Windows x64 agy and verify vendor SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'agy_cli_windows_x64.zip'
          $url = 'https://github.com/google-antigravity/antigravity-cli/releases/download/1.5.3/agy_cli_windows_x64.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = '9419c970c7988b33a3b61ce0c83ad0fdfb4c254103694ad9f1f565afe43f56aa'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Pinned Windows archive SHA256 differs" }
          $folder = Join-Path $env:RUNNER_TEMP 'agy-unpacked'
          Expand-Archive -LiteralPath $archive -DestinationPath $folder
          $candidates = @(Get-ChildItem -LiteralPath $folder -Recurse -File -Filter '*.exe')
          if ($candidates.Count -ne 1) {
            throw "Expected exactly one native Windows executable, got $($candidates.Count)"
          }
          $agy = $candidates[0].FullName
          & $agy --version
          if ($LASTEXITCODE -ne 0) { throw "Pinned agy failed to start" }
          "AGY_BIN=$agy" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build UAP CLI from exact PR commit
        if: ${{ inputs.release_tag == '' }}
        working-directory: cli
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP/agentplugins.exe" ./cmd/agentplugins
          if ($LASTEXITCODE -ne 0) { throw "UAP Windows build failed" }
          "UAP_BIN=$env:RUNNER_TEMP/agentplugins.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build fixed disposable User admission bridge and run inert contracts
        if: ${{ inputs.release_tag == '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          $nativeSHA = (Get-FileHash -LiteralPath $env:AGY_BIN -Algorithm SHA256).Hash.ToLowerInvariant()
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $helper = Join-Path $env:RUNNER_TEMP ('agy-user-admission' + $suffix)
          go -C install/integrationctl test ./research/antigravityinventory -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Antigravity bridge contracts failed' }
          go -C install/integrationctl build -ldflags "-X main.sourceCommit=$commit -X main.sourceTree=$tree -X main.nativeSHA=$nativeSHA" -o $helper ./research/antigravityinventory
          if ($LASTEXITCODE -ne 0) { throw 'Antigravity bridge build failed' }
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python scripts/e2e/antigravity-native-cross.py --contracts
          if ($LASTEXITCODE -ne 0) { throw 'Antigravity ledger contracts failed' }
          "AGY_ADMISSION_HELPER=$helper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGY_ADMISSION_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGY_ADMISSION_TREE=$tree" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Cross-platform native Windows lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG) {
            python scripts/e2e/released-native-proof.py run --client antigravity --target "windows-amd64" --tag "$env:RELEASE_TAG" --commit "$env:FROZEN_COMMIT" --checksums-sha256 "$env:EXPECTED_CHECKSUMS_SHA256" --assets-artifact "$env:RELEASE_ASSETS_ARTIFACT" --run-id "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT" --source "$env:GITHUB_WORKSPACE" --assets "$env:RUNNER_TEMP/released-native-assets" --proofs "$env:RUNNER_TEMP/released-native-proof"
          } else {
            python scripts/e2e/antigravity-native-cross.py
          }
          if ($LASTEXITCODE -ne 0) { throw 'Native lifecycle failed' }
      - name: Retain release-native receipt and transcript
        if: ${{ always() && inputs.release_tag != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: antigravity-release-native-windows-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/released-native-proof/
          if-no-files-found: error
          retention-days: 14

  aggregate-release-native:
    name: Aggregate antigravity release-native proofs
    if: ${{ always() && inputs.release_tag != '' }}
    needs: [native-linux-x64, native-macos, native-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native lane to succeed
        env:
          NATIVE_LANES_PASSED: ${{ needs.native-linux-x64.result == 'success' && needs.native-macos.result == 'success' && needs.native-windows.result == 'success' }}
        run: test "$NATIVE_LANES_PASSED" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.frozen_commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.1'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.release_assets_artifact }}
          path: ${{ runner.temp }}/released-native-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: antigravity-release-native-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/released-native-receipts
      - name: Verify exactly three artifact-bound native receipts
        run: |
          python3 scripts/e2e/released-native-proof.py aggregate \
            --client antigravity --tag "$RELEASE_TAG" --commit "$FROZEN_COMMIT" \
            --checksums-sha256 "$EXPECTED_CHECKSUMS_SHA256" --assets-artifact "$RELEASE_ASSETS_ARTIFACT" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source "$GITHUB_WORKSPACE" --assets "$RUNNER_TEMP/released-native-assets" \
            --proofs "$RUNNER_TEMP/released-native-receipts"
