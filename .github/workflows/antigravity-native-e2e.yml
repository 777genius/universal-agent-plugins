name: Antigravity Native Plugin E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'install/integrationctl/agentplugins/clients/antigravity/**'
      - 'install/integrationctl/agentplugins/domain/clients_catalog.go'
      - 'scripts/e2e/antigravity-native.sh'
      - 'scripts/e2e/antigravity-native-cross.py'
      - '.github/workflows/antigravity-native-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antigravity-native-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-linux-x64:
    name: pinned agy + UAP project plugin lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Download exact real Antigravity CLI (SHA-256 verified)
        shell: bash
        run: |
          set -euo pipefail
          version=1.5.3
          archive="$RUNNER_TEMP/agy_cli_linux_x64.tar.gz"
          expected=1b4850599cce73a17f94ffb422df3bf9531531b77dbddc40c1a435e0c2c16807
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            "https://github.com/google-antigravity/antigravity-cli/releases/download/$version/agy_cli_linux_x64.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/agy-cli"
          tar -xzf "$archive" -C "$RUNNER_TEMP/agy-cli"
          # GitHub's archive names the payload by release/platform; it is not
          # guaranteed to contain a literal file named "agy". Find the single
          # Linux x86-64 ELF, rather than assuming an archive member filename.
          mapfile -t candidates < <(
            find "$RUNNER_TEMP/agy-cli" -type f -print | while IFS= read -r item; do
              if readelf -h "$item" 2>/dev/null | grep -q 'Machine:.*Advanced Micro Devices X86-64'; then
                printf '%s\n' "$item"
              fi
            done
          )
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "Expected exactly one x86-64 ELF executable in the digest-verified agy archive" >&2
            find "$RUNNER_TEMP/agy-cli" -maxdepth 4 -type f -printf '%P\n' >&2
            exit 1
          fi
          agy="${candidates[0]}"
          chmod u+x "$agy"
          "$agy" --version
          echo "AGY_BIN=$agy" >> "$GITHUB_ENV"
      - name: Build the exact UAP pull-request CLI
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/agentplugins" ./cmd/agentplugins
          echo "UAP_BIN=$RUNNER_TEMP/agentplugins" >> "$GITHUB_ENV"
      - name: Real native plugin strict validation, discovery and scoped removal
        shell: bash
        run: bash scripts/e2e/antigravity-native.sh

  native-macos:
    name: pinned agy 1.5.3 + UAP macOS native lifecycle
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Download pinned real macOS agy and verify vendor SHA256
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              arch=x64
              expected=f0470eac7fb2f98886e1210457531bf1883c439ffa9e99d730388a1ff3dfeef5
              ;;
            arm64)
              arch=arm64
              expected=b47034e1367fc3c9f2856f1e1ae30bf12819a7213821ba3cce2123b090f2df8a
              ;;
            *) echo "Unsupported macOS architecture" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/agy_cli_mac_$arch.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/google-antigravity/antigravity-cli/releases/download/1.5.3/agy_cli_mac_$arch.tar.gz" \
            -o "$archive"
          actual="$(shasum -a 256 "$archive" | cut -d ' ' -f1)"
          test "$actual" = "$expected"
          mkdir -p "$RUNNER_TEMP/agy-unpacked"
          tar -xzf "$archive" -C "$RUNNER_TEMP/agy-unpacked"
          agy="$(python3 - "$RUNNER_TEMP/agy-unpacked" <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          matches = []
          for path in Path(sys.argv[1]).rglob("*"):
              if path.is_file() and not path.is_symlink():
                  description = subprocess.check_output(["file", "-b", str(path)], text=True)
                  if "Mach-O" in description and "executable" in description:
                      matches.append(path)
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one Mach-O executable, got {len(matches)}")
          print(matches[0])
          PY
          )"
          test -n "$agy"
          chmod u+x "$agy"
          "$agy" --version
          echo "AGY_BIN=$agy" >> "$GITHUB_ENV"
      - name: Build UAP CLI from exact PR commit
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/agentplugins" ./cmd/agentplugins
          echo "UAP_BIN=$RUNNER_TEMP/agentplugins" >> "$GITHUB_ENV"
      - name: Cross-platform native macOS lifecycle
        shell: bash
        run: python3 scripts/e2e/antigravity-native-cross.py

  native-windows:
    name: pinned agy 1.5.3 + UAP Windows x64 native lifecycle
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Verify pinned embedded schema bytes survive Windows checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'install/integrationctl/agentplugins/adapters/specregistry/schemas/1.0.0'
          $digests = @{
            'plugin.schema.json' = '0a4aad95ce337878ad38802ebf0daa3fde76abe3f65400c86bcbb1ec0b3ab883'
            'mcp.schema.json' = '6539175bfcdf43085855183e86da40ea94b166547a72b47ae9a0a390516d3acb'
          }
          foreach ($name in $digests.Keys) {
            $path = Join-Path $root $name
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $digests[$name]) { throw "Embedded $name changed during Windows checkout" }
          }
      - name: Download pinned Windows x64 agy and verify vendor SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'agy_cli_windows_x64.zip'
          $url = 'https://github.com/google-antigravity/antigravity-cli/releases/download/1.5.3/agy_cli_windows_x64.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = '9419c970c7988b33a3b61ce0c83ad0fdfb4c254103694ad9f1f565afe43f56aa'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Pinned Windows archive SHA256 differs" }
          $folder = Join-Path $env:RUNNER_TEMP 'agy-unpacked'
          Expand-Archive -LiteralPath $archive -DestinationPath $folder
          $candidates = @(Get-ChildItem -LiteralPath $folder -Recurse -File -Filter '*.exe')
          if ($candidates.Count -ne 1) {
            throw "Expected exactly one native Windows executable, got $($candidates.Count)"
          }
          $agy = $candidates[0].FullName
          & $agy --version
          if ($LASTEXITCODE -ne 0) { throw "Pinned agy failed to start" }
          "AGY_BIN=$agy" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build UAP CLI from exact PR commit
        working-directory: cli
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP/agentplugins.exe" ./cmd/agentplugins
          if ($LASTEXITCODE -ne 0) { throw "UAP Windows build failed" }
          "UAP_BIN=$env:RUNNER_TEMP/agentplugins.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Cross-platform native Windows lifecycle
        shell: pwsh
        run: python scripts/e2e/antigravity-native-cross.py
