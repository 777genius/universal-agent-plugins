name: UAP1130 R39 selected artifact byte verification
on:
  push:
    branches: [codex/uap1130-r35-artifact-audit]
    paths:
      - '.github/r39-selected-byte-audit/**'
      - '.github/workflows/uap1130-r39-selected-byte-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  native-all-six:
    if: github.repository == '777genius/universal-agent-plugins' && github.ref == 'refs/heads/codex/uap1130-r35-artifact-audit'
    runs-on: ${{ vars.CI_CORE_TEST_RUNNER || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out immutable reviewed auditor revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out fixed R39 source as read-only authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fccd72199a1eedc12e3828cf2fdc2f10a2f418f7
          path: source
          persist-credentials: false
      - name: Provision Python for independent byte analysis
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify six original Claude and Codex native archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/r39-selected-byte-audit/native_closed_cohort_runner.py \
            --manifest .github/r39-selected-byte-audit/native-all-six.json \
            --manifest-sha256 f2d4cb1c6361236855ae2b40a83ace403ef120f7eae9f9f9cf32d6c92d44c5aa \
            --source source \
            --core .github/r39-selected-byte-audit/native_audit.py
