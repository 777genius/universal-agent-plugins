name: PR 1130 prefetch failure regression

on:
  push:
    branches: [codex/uap1130-r35-artifact-audit]
    paths:
      - '.github/prefetch-regression/**'
      - '.github/workflows/uap1130-r35-prefetch-regression.yml'

permissions:
  contents: read

jobs:
  prefetch-race:
    name: Prefetch failure race regression (20 repetitions)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '3'
      CGO_ENABLED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact corrected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6b6a59142742f7f38455e6b9b33da04742e3c89d
          persist-credentials: false

      - name: Verify immutable source and clean tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6b6a59142742f7f38455e6b9b33da04742e3c89d
          test "$(git rev-parse 'HEAD^{tree}')" = 9fabab41bb86cc682ece89c498d9f189811524d8
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git rev-parse HEAD 'HEAD^{tree}'
          git ls-tree HEAD cli/internal/agentpluginscli/deps_root_prefetch_test.go

      - name: Provision pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false

      - name: Verify Go workspace and fixture formatting
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.26.11
          test "$(go env GOTOOLCHAIN)" = local
          test "$(go env GOWORK)" = "$PWD/go.work"
          test "$(go env GOMOD)" = "$PWD/go.mod"
          go version
          go env GOTOOLCHAIN GOWORK GOMOD CGO_ENABLED
          formatted="$(gofmt -l cli/internal/agentpluginscli/deps_root_prefetch_test.go)"
          if test -n "$formatted"; then
            printf '%s\n' "$formatted"
            exit 1
          fi

      - name: Run exact failure and cancellation regression under race detector
        run: |
          set -euo pipefail
          go test -race -p=2 -count=20 -timeout=12m -json -run '^(TestGitRootPrefetch(FailingSourceReturnsTheSerialError|CanceledRootStopsAfterItsRef|CancellationLeavesNoAcquisitions)|TestOrderedPrefetch(ServesFailureOnceAndStopsStartingNewWork|FailureCancelsOnlyLaterKeys))$' ./cli/internal/agentpluginscli
