name: Signed Directory publication

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "registry/directory.json"
      - "registry/publication/**"
      - "schemas/directory-*.schema.json"
      - "scripts/directory_publication.py"
      - "scripts/prepare_directory_publication.py"
      - "scripts/sign_directory_publication.py"
      - ".github/workflows/directory-publication.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: directory-publication-schema-1
  cancel-in-progress: false

env:
  LEDGER_BRANCH: directory-publication-ledger

jobs:
  prepare:
    name: Prepare canonical candidate (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      candidate_digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.LEDGER_BRANCH }}
          path: _publication-ledger
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install no-secret validation dependencies
        run: python3 -m pip install --disable-pip-version-check check-jsonschema==0.37.4 cryptography==46.0.3 jsonschema==4.25.1
      - name: Prepare and bind exact post-merge source
        id: candidate
        env:
          PUBLICATION_ID: ${{ github.run_id }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/prepare_directory_publication.py \
            --directory registry/directory.json \
            --config registry/publication/config.json \
            --source-commit "${SOURCE_COMMIT}" \
            --publication-id "${PUBLICATION_ID}" \
            --ledger _publication-ledger \
            --trusted-keys registry/publication/trusted-keys.json \
            --output candidate.json \
            --digest-output candidate.digest
          digest="$(tr -d '\n' < candidate.digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          test "$(wc -c < candidate.json)" -le 4194304
          check-jsonschema --schemafile schemas/directory-publication-candidate.schema.json candidate.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: directory-candidate-${{ github.run_id }}
          path: |
            candidate.json
            candidate.digest
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Minimal privileged signer and ledger append
    if: github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: directory-publication
    permissions:
      actions: read
      contents: write
    outputs:
      ledger_commit: ${{ steps.commit.outputs.ledger_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.LEDGER_BRANCH }}
          path: ledger
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@b14cf4c92620c250e1c0745ffefa574f1c4531a9 # v8.0.1
        with:
          name: directory-candidate-${{ github.run_id }}
          path: candidate
      - name: Install signer-only dependencies
        working-directory: trusted-source
        run: python3 -m pip install --disable-pip-version-check cryptography==46.0.3 jsonschema==4.25.1
      - name: Validate candidate digest, sequence, and sign
        working-directory: trusted-source
        env:
          DIRECTORY_ED25519_PRIVATE_KEY: ${{ secrets.DIRECTORY_ED25519_PRIVATE_KEY }}
          DIRECTORY_SIGNING_KEY_ID: ${{ vars.DIRECTORY_SIGNING_KEY_ID }}
          EXPECTED_CANDIDATE_DIGEST: ${{ needs.prepare.outputs.candidate_digest }}
        run: |
          test "$(tr -d '\n' < ../candidate/candidate.digest)" = "${EXPECTED_CANDIDATE_DIGEST}"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/sign_directory_publication.py \
            --candidate ../candidate/candidate.json \
            --candidate-digest "${EXPECTED_CANDIDATE_DIGEST}" \
            --ledger ../ledger \
            --trusted-keys registry/publication/trusted-keys.json \
            --key-id "${DIRECTORY_SIGNING_KEY_ID}" \
            --now "${now}" \
            --result ../publication-result.json
      - name: Enforce append-only diff and commit atomically
        id: commit
        working-directory: ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -N registry/schemas/1
          if git diff --name-status -- registry/schemas/1/snapshots | awk '$1 != "A" { exit 1 }'; then :; else
            echo "Historical snapshot or envelope was modified" >&2
            exit 1
          fi
          git diff --exit-code -- . ':!registry/schemas/1/latest.json' ':!registry/schemas/1/snapshots/**' || {
            echo "Signer changed a path outside the schema-1 ledger" >&2
            exit 1
          }
          if test -n "$(git status --porcelain)"; then
            git config user.name "uap-directory-publisher[bot]"
            git config user.email "uap-directory-publisher[bot]@users.noreply.github.com"
            git add registry/schemas/1/latest.json registry/schemas/1/snapshots
            git commit -m "chore(directory): publish signed snapshot"
            pushed=false
            for attempt in 1 2 3; do
              if git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)" push origin "HEAD:${LEDGER_BRANCH}"; then
                pushed=true
                break
              fi
            done
            test "${pushed}" = true
          fi
          echo "ledger_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  materialize_site:
    name: Materialize exact-sequence production site
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      ledger_commit: ${{ steps.commit.outputs.ledger_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sign.outputs.ledger_commit }}
          path: ledger
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted-source
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: trusted-source/site/pnpm-lock.yaml
      - name: Generate from the exact signed snapshot
        working-directory: trusted-source/site
        env:
          NUXT_APP_BASE_URL: /universal-agent-plugins/
          NUXT_PUBLIC_SITE_URL: https://777genius.github.io/universal-agent-plugins
        run: |
          test "$(git -C ../../ledger rev-parse HEAD)" = "${{ needs.sign.outputs.ledger_commit }}"
          snapshot_path="$(python3 -c 'import json; p=json.load(open("../../ledger/registry/schemas/1/latest.json")); print(p["snapshot_path"])')"
          export UAP_SIGNED_SNAPSHOT_PATH="../../ledger/registry/schemas/1/${snapshot_path}"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm generate
          pnpm check:generated
      - name: Commit the exact production tree without touching the ledger
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rsync -a --delete --exclude=.git --exclude=registry trusted-source/site/.output/public/ ledger/
          git -C ledger diff --exit-code -- registry
          if test -n "$(git -C ledger status --porcelain)"; then
            git -C ledger config user.name "uap-directory-publisher[bot]"
            git -C ledger config user.email "uap-directory-publisher[bot]@users.noreply.github.com"
            git -C ledger add -A
            git -C ledger commit -m "chore(directory): materialize signed production site"
            pushed=false
            for attempt in 1 2 3; do
              if git -C ledger -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)" push origin "HEAD:${LEDGER_BRANCH}"; then
                pushed=true
                break
              fi
            done
            test "${pushed}" = true
          fi
          echo "ledger_commit=$(git -C ledger rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy exact committed Pages tree
    needs: materialize_site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.materialize_site.outputs.ledger_commit }}
          path: exact-pages-tree
          persist-credentials: false
      - name: Archive exact ledger commit
        run: |
          test "$(git -C exact-pages-tree rev-parse HEAD)" = "${{ needs.materialize_site.outputs.ledger_commit }}"
          tar --directory exact-pages-tree -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1
      - name: Deploy exact ledger tree
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
