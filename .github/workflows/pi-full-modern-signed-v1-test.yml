name: Pi signed TEST - 68 saved and 4 expected-denied scopes

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pi-full-modern-signed-v1-test.yml'
      - 'cli/cmd/agentplugins/pi_full_modern_signed_v1_test.go'
      - 'cli/cmd/agentplugins/testdata/pi-full-modern-v1-test-only-snapshot.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pi-full-modern-signed-v1-test.yml'
      - 'cli/cmd/agentplugins/pi_full_modern_signed_v1_test.go'
      - 'cli/cmd/agentplugins/testdata/pi-full-modern-v1-test-only-snapshot.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-72-test-only-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  saved-scope:
    name: Pi signed-TEST saved and denied scopes / ${{ matrix.os }} / shard ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        shard: [0, 1, 2]
    env:
      GOMAXPROCS: '2'
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      UAP_PI_FULL_REAL_SOURCE_E2E: '1'
      UAP_PI_FULL_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Verify exact immutable workflow HEAD
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
      # Docker Hub's real immutable MCP package invokes the Docker CLI.
      # Hosted macOS does not ship it; provide the genuine client binary only,
      # never a mock executable, disable the preflight, or start Docker daemon.
      - name: Provide genuine Docker CLI when the Docker Hub shard needs it
        if: ${{ matrix.shard == 0 }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            case "${{ runner.os }}" in
              macOS)
                brew install docker
                ;;
              Windows)
                choco install docker-cli --version=29.8.0 --yes --no-progress
                export PATH="/c/ProgramData/chocolatey/bin:$PATH"
                printf '%s\n' 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"
                ;;
              *)
                echo 'Docker Hub real MCP source requires an installed Docker CLI on this runner' >&2
                exit 1
                ;;
            esac
          fi
          command -v docker
          docker --version
      - name: Observe pinned Pi saved lifecycles and exact upstream refusals
        shell: bash
        env:
          UAP_PI_FULL_REPORT: ${{ runner.temp }}/pi-full-report-${{ matrix.os }}-${{ matrix.shard }}.json
        run: |
          go test -p=2 -count=1 -timeout=48m -v ./cli/cmd/agentplugins \
            -run '^TestPiFullModernSignedTestOnlyMarketplace$'
      - name: Upload separate saved and expected-denied observations or retain failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: pi-full-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/pi-full-report-${{ matrix.os }}-${{ matrix.shard }}.json
          retention-days: 14
          if-no-files-found: ignore

  aggregate:
    name: Verify 68 saved and 4 expected-denied scopes per OS (TEST only)
    needs: saved-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require all nine saved and expected-denied matrix jobs successful
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs['saved-scope'].result }}
        run: |
          test "$MATRIX_RESULT" = "success"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pi-full-*
          path: _reports
          merge-multiple: true
      - name: Verify 9 original reports and separate 204 saved from 12 denied observations
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import hashlib, json
          from os import environ
          from pathlib import Path
          source = Path('cli/cmd/agentplugins/testdata/pi-full-modern-v1-test-only-snapshot.json').read_bytes()
          snapshot = json.loads(source)
          assert snapshot['source_commit'] == '32b6c48d071aceadf90a030c9d69477fe1a6a65a'
          assert len(snapshot['distributions']) == 36
          assert snapshot['evidence'] == []
          upstream_ids = {d['id'] for d in snapshot['distributions'] if d['kind'] == 'upstream'}
          assert upstream_ids == {'github/github', 'upstash/context7'}
          wanted_digest = 'sha256:' + hashlib.sha256(source).hexdigest()
          expected_saved = {
              (d['id'] + '@' + str(d['releases'][0]['sequence']) + '/' + scope, index % 3)
              for index, d in enumerate(snapshot['distributions'])
              if d['kind'] != 'upstream'
              for scope in ('user', 'project')
          }
          expected_denied = {
              (d['id'] + '@' + str(d['releases'][0]['sequence']) + '/' + scope, index % 3):
              f'no eligible directory release in "{d["id"]}": upstream release lacks current passed materialization evidence for pi'
              for index, d in enumerate(snapshot['distributions'])
              if d['kind'] == 'upstream'
              for scope in ('user', 'project')
          }
          assert len(expected_saved) == 68 and len(expected_denied) == 4
          paths = list(Path('_reports').glob('pi-full-report-*.json'))
          assert len(paths) == 9, f'expected 9 independent original receipts, got {len(paths)}'
          expected_os = {'ubuntu-24.04':'linux','macos-15':'darwin','windows-2025':'windows'}
          seen_jobs, seen_saved, seen_denied = set(), set(), set()
          for path in paths:
              report = json.loads(path.read_bytes())
              assert set(report) == {'kind','test_commit','source_commit','snapshot_sha256','runner_os','shard','saved_cases','expected_denied_cases','production_published'}
              assert report['kind'] == 'pi-signed-v1-test-only-saved-and-denied'
              assert report['test_commit'] == environ['EXPECTED_HEAD']
              assert report['production_published'] is False
              assert report['source_commit'] == snapshot['source_commit']
              assert report['snapshot_sha256'] == wanted_digest
              name = path.name
              matched = [(os, idx) for os in expected_os for idx in range(3)
                         if name == f'pi-full-report-{os}-{idx}.json']
              assert len(matched) == 1, f'invalid OS/shard identity {name}'
              os, idx = matched[0]
              assert report['runner_os'] == expected_os[os] and type(report['shard']) is int and report['shard'] == idx
              assert (os, idx) not in seen_jobs
              seen_jobs.add((os, idx))
              wanted_saved = {case for case, shard in expected_saved if shard == idx}
              wanted_denied = {case: reason for (case, shard), reason in expected_denied.items() if shard == idx}
              assert isinstance(report['saved_cases'], list)
              assert len(report['saved_cases']) == len(wanted_saved)
              assert set(report['saved_cases']) == wanted_saved, f'{name}: missing or extra saved lifecycle'
              denials = report['expected_denied_cases']
              assert isinstance(denials, list) and len(denials) == len(wanted_denied)
              observed_denied = {}
              for denial in denials:
                  assert isinstance(denial, dict) and set(denial) == {'case','refusal'}
                  case, refusal = denial['case'], denial['refusal']
                  assert isinstance(case, str) and case not in observed_denied
                  assert case in wanted_denied and refusal == wanted_denied[case]
                  observed_denied[case] = refusal
              assert observed_denied == wanted_denied, f'{name}: missing or altered upstream denial'
              for case in report['saved_cases']:
                  assert (os, case) not in seen_saved and (os, case) not in seen_denied
                  seen_saved.add((os, case))
              for case in observed_denied:
                  assert (os, case) not in seen_saved and (os, case) not in seen_denied
                  seen_denied.add((os, case))
          assert len(seen_jobs) == 9 and len(seen_saved) == 204 and len(seen_denied) == 12
          print('PASS: each OS observed 68 saved lifecycles and 4 exact expected-denied upstream scopes in the signed TEST fixture')
          print('NOT CLAIMED: 72 positive lifecycles, upstream materialization evidence, production trust, released CLI routing or native Pi/model/OAuth runtime')
          PY
