name: Required

on:
  # The refactor base branch is listed by name, not as refactor/**: the part
  # branches stacked on it are gated by core-fast.yml, and a glob would run this
  # 12-17 minute lane again on every push to every part, which is the double
  # spend the plan set out to avoid. The full lane belongs after a part merges
  # into the base branch.
  push:
    branches: [main, master, refactor/installer-core-clean-architecture]
  pull_request:
    branches: [main, master]

jobs:
  # Separate job rather than a step in `test`: `test` is the 9-27 min critical
  # path, while the three lint matrix legs finish in a few minutes in parallel.
  lint:
    # The repository default is contents:read only. lint.yml asks for
    # pull-requests:read (only-new-issues reads the PR diff), and a called
    # workflow cannot request more than its caller holds, so the caller has to
    # grant it here or the run fails at startup.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/lint.yml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.13"
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          package-manager-cache: false

      - name: Run required lane
        run: make test-required

      - name: Plugin Manifest Workflow
        run: make test-plugin-manifest-workflow

      - name: Check generated artifacts
        run: make generated-check

      - name: Run vet (all workspace modules)
        run: make vet

      # The proposal discussed in agentplugins/agent-plugins-spec#81 is not a
      # normative part of the specification. Pinning the exact revision keeps
      # this interoperability contract reproducible until a new revision is
      # reviewed deliberately.
      - name: Check out pinned Agent Plugins conformance corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Booyaka101/agent-plugins-conformance-kit
          ref: 4d163c6281a9b4929f482f387efe340b4dc175a1
          path: .ci/agent-plugins-conformance-kit
          persist-credentials: false

      - name: Build pinned conformance corpus
        working-directory: .ci/agent-plugins-conformance-kit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Run Agent Plugins loader conformance
        run: |
          go build -o "$RUNNER_TEMP/agentplugins-conformance-adapter" ./cli/plugin-kit-ai/cmd/agentplugins-conformance-adapter
          node .ci/agent-plugins-conformance-kit/dist/cli.js verify
          node .ci/agent-plugins-conformance-kit/dist/cli.js run \
            --adapter "$RUNNER_TEMP/agentplugins-conformance-adapter" \
            --strict-reporting \
            --quiet \
            --json "$RUNNER_TEMP/agentplugins-conformance.json"
