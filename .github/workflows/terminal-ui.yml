name: Terminal UI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-amd64
            archive: lintai-v0.1.3-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-15
            target: darwin-arm64
            archive: lintai-v0.1.3-aarch64-apple-darwin.tar.gz
          - os: windows-2025
            target: windows-amd64
            archive: lintai-v0.1.3-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      # Embedded schemas are digest-pinned to repository bytes.
      - name: Preserve repository line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.13'
          cache: false
      - name: Focused contracts and frozen release build
        id: build
        working-directory: cli/plugin-kit-ai
        run: |
          go test ./internal/agentpluginscli/prompt ./internal/promptio ./internal/terminalprompts
          go build -o "$RUNNER_TEMP/agentplugins.exe" ./cmd/agentplugins
      - name: Provision only pinned lintai
        run: python scripts/terminal-ui/provision_scanner.py --target '${{ matrix.target }}' --output "$RUNNER_TEMP/scanner"
      - name: Unix PTY matrix
        if: runner.os != 'Windows'
        run: |
          python3 -m unittest discover -s scripts/terminal-ui -p 'test_*.py'
          python3 scripts/terminal-ui/harness.py --binary "$RUNNER_TEMP/agentplugins.exe" --scanner-archive "$RUNNER_TEMP/scanner/${{ matrix.archive }}" --artifacts "$RUNNER_TEMP/terminal-evidence" --timeout 15
      - name: Unix selection combinations (synthetic client and scanner protocols)
        if: runner.os != 'Windows'
        run: |
          python3 scripts/terminal-ui/selection_matrix.py --build-go "$(command -v go)" --artifacts "$RUNNER_TEMP/selection-evidence" --timeout 15 > "$RUNNER_TEMP/selection-matrix.log" 2>&1 || { tail -c 6000 "$RUNNER_TEMP/selection-matrix.log"; exit 1; }
      - name: Unix npm inherited terminal routes
        if: runner.os != 'Windows'
        run: python3 scripts/terminal-ui/harness.py --binary "$RUNNER_TEMP/agentplugins.exe" --scanner-archive "$RUNNER_TEMP/scanner/${{ matrix.archive }}" --npm-launcher --case escape --case json-tty --case json-explicit --artifacts "$RUNNER_TEMP/npm-terminal-evidence" --timeout 15
      - name: Windows cleanup fault injection
        if: runner.os == 'Windows'
        run: python -m unittest discover -s scripts/terminal-ui -p 'test_windows_cleanup.py'
      - name: Windows ConPTY Plain matrix
        if: runner.os == 'Windows'
        run: python scripts/terminal-ui/windows_conpty.py --binary "$RUNNER_TEMP/agentplugins.exe" --scanner-archive "$RUNNER_TEMP/scanner/${{ matrix.archive }}" --artifacts "$RUNNER_TEMP/terminal-evidence" --timeout 15
      - name: Windows native console cancellation entry and reuse
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build.outcome == 'success' }}
        run: python scripts/terminal-ui/qualification_faults.py --case windows-console-cancel --artifacts "$RUNNER_TEMP/windows-fault-evidence" --timeout 15
      - name: Windows PowerShell ConPTY default No and Ctrl+C
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $shellPath = (Get-Command pwsh -CommandType Application).Source
          python scripts/terminal-ui/windows_conpty.py --binary "$env:RUNNER_TEMP/agentplugins.exe" --scanner-archive "$env:RUNNER_TEMP/scanner/${{ matrix.archive }}" --powershell "$shellPath" --case default-no --case no --case yes-lifecycle --case ctrl-c --case confirm-ctrl-c --case eof --case resize --artifacts "$env:RUNNER_TEMP/powershell-terminal-evidence" --timeout 15
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Keep the broad gate required, including when a console case fails.
      # Run it after console proof so legacy fixture failures cannot hide ConPTY.
      - name: Broad existing CLI contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: cli/plugin-kit-ai
        run: go test ./internal/agentpluginscli ./cmd/agentplugins/...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: terminal-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/selection-evidence
            ${{ runner.temp }}/selection-matrix.log
            ${{ runner.temp }}/terminal-evidence
            ${{ runner.temp }}/npm-terminal-evidence
            ${{ runner.temp }}/windows-fault-evidence
            ${{ runner.temp }}/powershell-terminal-evidence
            ${{ runner.temp }}/scanner/scanner.json
          if-no-files-found: warn
