name: Grok Enablement Native Admission
on:
  pull_request:
    paths:
      - 'install/integrationctl/adapters/process/**'
      - 'install/integrationctl/agentplugins/clients/grok/**'
      - 'scripts/e2e/grok-enable-readonly.py'
      - '.github/workflows/grok-enable-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'install/integrationctl/adapters/process/**'
      - 'install/integrationctl/agentplugins/clients/grok/**'
      - 'scripts/e2e/grok-enable-readonly.py'
      - '.github/workflows/grok-enable-readonly.yml'
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Provision the existing readonly containment primitive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          /usr/bin/bwrap --version
      - name: Prepare the observed non-writable runtime fixture
        run: |
          sudo -n /usr/bin/python3 -I -B - <<'PY' > "$RUNNER_TEMP/grok-readonly-runtime.json"
          import json, os, stat
          paths = ('/usr/share', '/usr/share/applications')
          report = dict(kind='ci-runtime-permission-preparation', prepared=False, paths=[])
          held = []
          def facts(value):
              return dict(device=value.st_dev, inode=value.st_ino, uid=value.st_uid,
                          gid=value.st_gid, mode=oct(value.st_mode), links=value.st_nlink)
          def identity(value):
              return value.st_dev, value.st_ino, value.st_uid, value.st_gid, value.st_nlink
          def named(index):
              return os.stat(paths[0], follow_symlinks=False) if index == 0 else os.stat('applications', dir_fd=held[0], follow_symlinks=False)
          try:
              flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
              held.append(os.open(paths[0], flags))
              held.append(os.open('applications', flags, dir_fd=held[0]))
              originals = [os.fstat(fd) for fd in held]
              for index, before in enumerate(originals):
                  report['paths'].append(dict(path=paths[index], before=facts(before)))
                  if before.st_uid != 0 or stat.S_IMODE(before.st_mode) not in (0o755, 0o777):
                      raise ValueError('unexpected runtime fixture owner or permissions')
                  if identity(before) != identity(named(index)):
                      raise ValueError('original runtime fixture named identity changed')
              for index, (fd, before) in enumerate(zip(held, originals)):
                  expected = before.st_mode & ~0o022
                  if before.st_mode != expected:
                      os.fchmod(fd, stat.S_IMODE(expected))
                  after, current = os.fstat(fd), named(index)
                  report['paths'][index].update(after=facts(after), named_after=facts(current))
                  if identity(before) != identity(after) or identity(after) != identity(current):
                      raise ValueError('runtime fixture identity or ownership changed')
                  if after.st_mode != expected or current.st_mode != expected:
                      raise ValueError('runtime fixture changed beyond the two write bits')
              for index, fd in enumerate(held):
                  if facts(os.fstat(fd)) != facts(named(index)):
                      raise ValueError('settled runtime fixture named identity changed')
              report['prepared'] = True
          except Exception as error:
              report['error'] = type(error).__name__ + ': ' + str(error)
              raise
          finally:
              print(json.dumps(report, sort_keys=True))
              for fd in reversed(held):
                  os.close(fd)
          PY
      - name: Build the genuine tagged metadata test
        run: |
          go test -tags=grokreadonlynative -c -o "$RUNNER_TEMP/grok-readonly-test" ./install/integrationctl/agentplugins/clients/grok
          go test -tags=grokreadonlynative -c -o "$RUNNER_TEMP/grok-runtime-metadata-test" ./install/integrationctl/adapters/process
      - name: Collect bounded runtime metadata without qualification
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/grok-runtime-metadata-test" -test.run='^TestReadonlyRuntimeMetadataDiagnostic$' \
            -test.count=1 -test.v -test.timeout=40s \
            -runtime-metadata-output="$RUNNER_TEMP/grok-runtime-metadata.json"
      - name: Run exact native gate in a delegated ordinary-user service
        run: |
          mkdir -m 700 "$RUNNER_TEMP/grok-readonly-evidence"
          sudo -n /usr/bin/systemd-run --unit="uap-grok-readonly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --wait --pipe --collect --quiet --service-type=exec --expand-environment=no \
            --uid="$(id -u)" --gid="$(id -g)" --property=Delegate=yes \
            --property=NoNewPrivileges=yes --property=KillMode=control-group \
            --property=RuntimeMaxSec=180s --property=TimeoutStopSec=15s \
            /usr/bin/env -i PATH=/usr/bin:/bin \
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/e2e/grok-enable-readonly.py" \
            --test "$RUNNER_TEMP/grok-readonly-test" --output "$RUNNER_TEMP/grok-readonly-evidence"
      - name: Retain the actual native verdict and bounded diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: grok-readonly-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/grok-readonly-evidence/evidence.json
            ${{ runner.temp }}/grok-readonly-runtime.json
            ${{ runner.temp }}/grok-runtime-metadata.json
          if-no-files-found: error
          retention-days: 14
