name: Grok Enablement Native Admission
on:
  pull_request:
    paths:
      - 'install/integrationctl/adapters/process/**'
      - 'install/integrationctl/agentplugins/clients/grok/**'
      - 'scripts/e2e/grok-enable-readonly.py'
      - '.github/workflows/grok-enable-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'install/integrationctl/adapters/process/**'
      - 'install/integrationctl/agentplugins/clients/grok/**'
      - 'scripts/e2e/grok-enable-readonly.py'
      - '.github/workflows/grok-enable-readonly.yml'
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Provision the existing readonly containment primitive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          /usr/bin/bwrap --version
      - name: Build the genuine tagged metadata test
        run: go test -tags=grokreadonlynative -c -o "$RUNNER_TEMP/grok-readonly-test" ./install/integrationctl/agentplugins/clients/grok
      - name: Run exact native gate in a delegated ordinary-user service
        run: |
          mkdir -m 700 "$RUNNER_TEMP/grok-readonly-evidence"
          sudo -n /usr/bin/systemd-run --unit="uap-grok-readonly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --wait --pipe --collect --quiet --service-type=exec --expand-environment=no \
            --uid="$(id -u)" --gid="$(id -g)" --property=Delegate=yes \
            --property=NoNewPrivileges=yes --property=KillMode=control-group \
            --property=RuntimeMaxSec=180s --property=TimeoutStopSec=15s \
            /usr/bin/env -i PATH=/usr/bin:/bin \
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/e2e/grok-enable-readonly.py" \
            --test "$RUNNER_TEMP/grok-readonly-test" --output "$RUNNER_TEMP/grok-readonly-evidence"
      - name: Retain the actual native verdict and bounded diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: grok-readonly-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/grok-readonly-evidence/evidence.json
          if-no-files-found: error
          retention-days: 14
