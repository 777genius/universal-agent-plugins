name: Remaining client live installation audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/live-install-remaining-clients.yml'
      - 'scripts/live-install-audit.py'
      - 'scripts/test_live_install_audit_env.py'
      - 'tests/live-install/fixtures.json'
      - 'install/integrationctl/agentplugins/**'
      - 'cli/cmd/agentplugins/**'
      - 'cli/internal/agentpluginscli/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  # pull_request runs check out a synthetic merge commit; retain the source branch HEAD too.
  AUDIT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}

concurrency:
  group: remaining-client-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  remaining-client-install:
    name: Full 30 ${{ matrix.kind }} / ${{ matrix.target }} (report even if blocked)
    # Darwin refuses Kiro's automatic MCP duplex containment. This lane can
    # measure the real native CLI and owned Prepared lifecycle, while keeping
    # native activation incomplete until a contained host route is qualified.
    runs-on: ${{ matrix.target == 'kiro' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: [cursor, kiro, windsurf, grok, vscode, chatgpt]
        kind: [plugin, skill]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: host-go
        with:
          go-version: '1.26.11'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: host-node
        with:
          node-version: '24'
      - name: Retain the selected Node runtime for Kiro
        if: matrix.target == 'kiro'
        id: kiro-node
        env:
          KIRO_NODE_VERSION: ${{ steps.host-node.outputs.node-version }}
        shell: bash
        run: |
          python3 - <<'KIRO_NODE'
          import json, os, re, shutil, stat
          from pathlib import Path
          version = os.environ['KIRO_NODE_VERSION']
          arch = {'ARM64': 'arm64', 'X64': 'x64'}.get(os.environ['RUNNER_ARCH'])
          if not re.fullmatch(r'v24\.\d+\.\d+', version) or arch is None:
              raise SystemExit('unexpected setup-node version or architecture')
          cache = Path(os.environ['RUNNER_TOOL_CACHE']).resolve(strict=True)
          binary = cache / 'node' / version[1:] / arch / 'bin/node'
          selected = shutil.which('node')
          if (selected is None or Path(selected).resolve(strict=True) != binary
                  or not stat.S_ISREG(binary.lstat().st_mode) or not os.access(binary, os.X_OK)
                  or any(char in str(binary.parent) for char in '\r\n' + os.pathsep)):
              raise SystemExit('unverified setup-node PATH executable')
          proof = dict(schema_version=1, setup_action='820762786026740c76f36085b0efc47a31fe5020',
                       version=version, architecture=arch, executable=str(binary), bin=str(binary.parent))
          body = json.dumps(proof, sort_keys=True) + '\n'
          if len(body.encode()) > 4096:
              raise SystemExit('setup-node proof exceeds bound')
          destination = Path(os.environ['RUNNER_TEMP']) / 'vendor-proof'
          destination.mkdir(exist_ok=True)
          with (destination / 'node-runtime.json').open('x') as stream:
              stream.write(body)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('bin=' + str(binary.parent) + '\n')
          KIRO_NODE
      - name: Refuse inherited real client profile overrides before live cases
        run: python3 -m unittest discover -s scripts -p 'test_live_install_audit_env.py'
      - name: Acquire actual public vendor client where a headless Linux build exists
        id: vendor-install
        # Preserve a complete explicit client-unavailable record even when a
        # genuine vendor installer needs login (e.g. Devin). The audit itself
        # still exits nonzero: a vendor failure cannot be a successful install.
        continue-on-error: true
        env:
          TARGET: ${{ matrix.target }}
          KIND: ${{ matrix.kind }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vendor-proof" "$HOME/.local/bin"
          # Runner toolchain must precede any vendor-controlled executable.
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$HOME/.local/bin"
          case "$TARGET" in
            cursor)
              if [[ "$KIND" == skill ]]; then
                # Homebrew/homebrew-cask Casks/c/cursor-cli.rb @ 5815fd3716b83066412887902c6dd4bf92e4d7ad
                URL="https://downloads.cursor.com/lab/2026.10.22-27dcf5f/linux/x64/agent-cli-package.tar.gz"
                BIN="cursor-agent"
              else
                # User-scope Plugins require the editor; its .deb has no reviewed digest.
                URL="https://downloads.cursor.com/production/25b52e7d03ebf2d5608914158e119f7992432a34/linux/x64/deb/amd64/deb/cursor_3.28.7_amd64.deb"
                BIN="cursor"
              fi
              ;;
            kiro) URL="https://desktop-release.q.us-east-1.amazonaws.com/3.0.0/kirocli-universal-darwin.zip"; BIN="kiro-cli" ;;
            windsurf)
              if [[ "$KIND" == skill ]]; then
                # Project Skills require exactly 3000.11.205 in requireCurrentDevin.
                # Homebrew/homebrew-cask Casks/d/devin-cli.rb @ b0b0899868cd5816cfc754d2461a50920af612e0
                URL="https://static.devin.ai/cli/3000.11.205/devin-3000.11.205-x86_64-unknown-linux.tar.gz"
              else
                # Preserve the independently reviewed user/plugin version.
                # Homebrew/homebrew-cask Casks/d/devin-cli.rb @ c9adad21951a075e35556930e7396a87818f8980
                URL="https://static.devin.ai/cli/3000.11.234/devin-3000.11.234-x86_64-unknown-linux.tar.gz"
              fi
              BIN="devin"
              ;;
            grok)
              # Homebrew/homebrew-cask Casks/g/grok-build.rb @ b75a8e94456970fa349c75b59ca5e4183dde8e28
              URL="https://x.ai/cli/grok-1.0.70-linux-x86_64"
              BIN="grok"
              ;;
            vscode)
              # Official VS Code 1.144.0 Linux x64 .deb, never a mutable "latest".
              URL="https://update.code.visualstudio.com/1.144.0/linux-deb-x64/stable"
              BIN="code"
              ;;
            chatgpt)
              echo "ChatGPT is a remote/manual app target; no Linux agent executable" \
                | tee "$RUNNER_TEMP/vendor-proof/manual-client.txt"
              exit 0
              ;;
          esac
          printf '%s\n' "$URL" > "$RUNNER_TEMP/vendor-proof/source.txt"
          # BUG-012: download, fingerprint, and preserve proposed vendor bytes;
          # never execute without a separately reviewed immutable digest pin.
          case "$TARGET" in
            cursor)
              if [[ "$KIND" == skill ]]; then
                SHA256="85296944e4600a83c4b764f578d1502bf9c416db200d33a593e8f3ecabfdc294"
              else
                SHA256="" # No independent digest for the editor .deb; fail closed.
              fi
              ;;
            vscode) SHA256="b8fbff92d8d95908990eed0acf004c980f29003725469e794ddbd017ea511a20" ;; # Microsoft official SHA-256 for Linux .deb x64 1.144.0
            kiro) SHA256="0a8f067c4fe6a23a231aa3a18e3e4332120ef9ed3d2d7b6eea907beb8b4cdd8b" ;; # Homebrew/homebrew-cask Casks/k/kiro-cli.rb @ 7191fc89
            windsurf)
              if [[ "$KIND" == skill ]]; then
                SHA256="2e65c8b93682258fc91f5e4cead92e3698338cebf1b31dbc32a3201cb63705c4" # Cask b0b08998, project 3000.11.205
              else
                SHA256="201370cddd2924294e3ca6b46fd8ece49b5763953b644a1dd823fce5490cb41a" # Cask c9adad21, user 3000.11.234
              fi
              ;;
            grok) SHA256="22d281c5964c5444147328096ba2a221f3f0874c6858e27c825656a80f6e58e9" ;; # Homebrew Cask grok-build 1.0.70, Linux x86_64
          esac
          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$@"
            else
              shasum -a 256 "$@" # macOS runner
            fi
          }
          if [[ "$TARGET" == cursor && "$KIND" == skill ]]; then
            artifact="$RUNNER_TEMP/cursor-agent.tar.gz"
          elif [[ "$TARGET" == windsurf ]]; then
            artifact="$RUNNER_TEMP/devin-cli.tar.gz"
          elif [[ "$TARGET" == vscode || "$TARGET" == cursor ]]; then
            artifact="$RUNNER_TEMP/$TARGET.deb"
          elif [[ "$TARGET" == kiro ]]; then
            artifact="$RUNNER_TEMP/kirocli-universal-darwin.zip"
          elif [[ "$TARGET" == grok ]]; then
            artifact="$RUNNER_TEMP/grok-1.0.70-linux-x86_64"
          else
            echo "Unsupported vendor artifact format: $TARGET" >&2
            exit 4
          fi
          curl -fsSL --retry 2 "$URL" -o "$artifact"
          sha256_file "$artifact" > "$RUNNER_TEMP/vendor-proof/observed-untrusted.sha256"
          if [[ ! "${SHA256:-}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Missing reviewed SHA-256 for $TARGET: downloaded bytes are NOT approved to execute" \
              | tee "$RUNNER_TEMP/vendor-proof/verification-blocked.txt"
            exit 3
          fi
          printf '%s  %s\n' "$SHA256" "$artifact" | sha256_file -c -
          if [[ ( "$TARGET" == cursor && "$KIND" == skill ) || "$TARGET" == windsurf ]]; then
            mkdir -p "$RUNNER_TEMP/vendor-root"
            # Both official archives are independently digest-pinned above.
            # Python 3.12's data filter rejects archive entries escaping this root.
            python3 - "$artifact" "$RUNNER_TEMP/vendor-root" <<'PY'
          import sys
          import tarfile
          with tarfile.open(sys.argv[1], "r:gz") as archive:
              archive.extractall(path=sys.argv[2], filter="data")
          PY
            if [[ "$TARGET" == windsurf ]]; then
              executable="$RUNNER_TEMP/vendor-root/bin/devin"
              target_binary="devin"
            else
              executable="$RUNNER_TEMP/vendor-root/dist-package/cursor-agent"
              target_binary="cursor-agent"
            fi
            test -f "$executable" && test -x "$executable" && test ! -L "$executable"
            ln -s "$executable" "$HOME/.local/bin/$target_binary"
          elif [[ "$TARGET" == vscode || "$TARGET" == cursor ]]; then
            mkdir -p "$RUNNER_TEMP/vendor-root"
            dpkg-deb --extract "$artifact" "$RUNNER_TEMP/vendor-root"
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$RUNNER_TEMP/vendor-root/usr/bin:$HOME/.local/bin"
            if [[ "$TARGET" == vscode ]]; then
              # A staged .deb may carry /usr/bin/code as an absolute symlink:
              # bind its verified editor launcher explicitly, not the host CLI.
              executable="$RUNNER_TEMP/vendor-root/usr/share/code/bin/code"
              test -f "$executable" && test -x "$executable" && test ! -L "$executable"
              test "$(readlink -f "$executable")" = "$executable"
              ln -s "$executable" "$HOME/.local/bin/code"
            fi
          elif [[ "$TARGET" == kiro ]]; then
            # This archive is verified above against the independently pinned
            # Homebrew Cask release, not a mutable vendor installer script.
            mkdir -p "$RUNNER_TEMP/vendor-root"
            ditto -x -k "$artifact" "$RUNNER_TEMP/vendor-root"
            executable="$RUNNER_TEMP/vendor-root/kirocli/bin/kiro-cli"
            test -f "$executable" && test -x "$executable" && test ! -L "$executable"
            ln -s "$executable" "$HOME/.local/bin/kiro-cli"
          elif [[ "$TARGET" == grok ]]; then
            # Independent Homebrew SHA is checked above before any native run.
            mkdir -p "$RUNNER_TEMP/vendor-root"
            executable="$RUNNER_TEMP/vendor-root/grok"
            install -m 0755 "$artifact" "$executable"
            test -f "$executable" && test -x "$executable" && test ! -L "$executable"
            ln -s "$executable" "$HOME/.local/bin/grok"
          else
            echo "Unsupported verified vendor format: $TARGET" >&2
            exit 4
          fi
          hash -r
          command -v "$BIN" | tee "$RUNNER_TEMP/vendor-proof/executable.txt"
          # The reviewed bytes must be the native CLI actually selected by PATH,
          # not an unrelated binary preinstalled on a runner.
          python3 - "$BIN" "$executable" <<'PY'
          from pathlib import Path
          import shutil
          import sys
          selected = shutil.which(sys.argv[1])
          if not selected or Path(selected).resolve(strict=True) != Path(sys.argv[2]).resolve(strict=True):
              raise SystemExit(f"unverified native PATH executable: {sys.argv[1]}")
          PY
          # No ambient CI credentials or native profile overrides reach vendor --version.
          probe_home="$(mktemp -d "$RUNNER_TEMP/vendor-probe.XXXXXX")"
          env -i PATH="$PATH" HOME="$probe_home" USERPROFILE="$probe_home" \
            XDG_CONFIG_HOME="$probe_home/config" XDG_CACHE_HOME="$probe_home/cache" \
            XDG_DATA_HOME="$probe_home/data" TMPDIR="$probe_home" \
            LANG="${LANG:-C.UTF-8}" CI=true DO_NOT_TRACK=1 \
            python3 -c 'import subprocess,sys;sys.exit(subprocess.run([sys.argv[1],"--version"], timeout=30).returncode)' "$BIN" \
            | tee "$RUNNER_TEMP/vendor-proof/version.txt"
      - name: Build stable Docker CLI for Kiro preparation
        if: matrix.target == 'kiro' && matrix.kind == 'plugin'
        env:
          KIRO_GO_VERSION: ${{ steps.host-go.outputs.go-version }}
          KIRO_NODE_BIN: ${{ steps.kiro-node.outputs.bin }}
        shell: bash
        run: |
          python3 - <<'KIRO_DOCKER'
          import hashlib, json, os, shutil, stat, sys, tempfile, time
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / 'scripts'))
          from native_client_research import run_probe

          PIN = dict(repo='https://github.com/docker/cli.git', version='29.9.3',
                     tag='5e262e04a65822eb2673011d866b422c8ce62595',
                     commit='5457199aa57c45e990c59c89cab5f02b817238d7',
                     tree='0b51e2783286962254ec5071e664e62646f5f4dc',
                     homebrew='438d8fa5300704f11678319950d3d06163c5b966')
          GIT = ['/usr/bin/git', '-c', 'core.hooksPath=/dev/null', '-c', 'core.autocrlf=false',
                 '-c', 'credential.helper=', '-c', 'protocol.file.allow=never']

          def require(value, message):
              if not value:
                  raise ValueError(message)

          def identity(info):
              return [info.st_dev, info.st_ino, info.st_mode, info.st_uid, info.st_gid,
                      info.st_nlink, info.st_size, info.st_mtime_ns, info.st_ctime_ns]

          def executable(path):
              before = path.lstat()
              require(path.resolve(strict=True) == path and stat.S_ISREG(before.st_mode)
                      and before.st_nlink == 1 and before.st_uid == os.getuid()
                      and not before.st_mode & 0o022 and before.st_mode & 0o111
                      and 0 < before.st_size <= 128 << 20, 'Docker build executable authority')
              digest = hashlib.sha256()
              with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW), 'rb') as stream:
                  require(identity(os.fstat(stream.fileno())) == identity(before), 'Docker build executable changed at open')
                  remaining = before.st_size
                  while remaining:
                      chunk = stream.read(min(1 << 20, remaining))
                      require(chunk, 'Docker build executable truncated')
                      digest.update(chunk)
                      remaining -= len(chunk)
                  require(identity(os.fstat(stream.fileno())) == identity(before) and identity(path.lstat()) == identity(before),
                          'Docker build executable changed during hash')
              return dict(path=str(path), bytes=before.st_size, sha256=digest.hexdigest(),
                          identity=identity(before))

          def directory(path):
              info = path.lstat()
              require(path.resolve(strict=True) == path and stat.S_ISDIR(info.st_mode)
                      and info.st_uid == os.getuid() and not info.st_mode & 0o022, 'Docker build directory authority')
              return identity(info)[:6]

          def output_membership(destination, expected):
              found = set()
              with os.scandir(destination) as entries:
                  for entry in entries:
                      require(entry.name in expected and entry.name not in found, 'Docker output membership differs')
                      found.add(entry.name)
              require(found == expected, 'Docker output membership differs')

          def capture(context, label, argv, cwd, environment, maximum):
              remaining = context['deadline'] - time.monotonic()
              require(remaining > 0, 'Docker build original deadline')
              record, stdout, stderr = run_probe(argv, cwd, environment, context['proof'], label,
                                                min(maximum, remaining), 64 << 10, memory_only=True)
              context['commands'].append(record)
              for name, body in ((record['stdout_file'], stdout), (record['stderr_file'], stderr)):
                  with (context['proof'] / name).open('xb') as output:
                      output.write(body)
              require(record['exit'] == 0 and record['error'] is None, 'Docker source/build command refused: ' + label)
              return stdout

          def source_state(context, source, environment, phase):
              require(phase in ('before', 'after'), 'unknown Docker source phase')
              actual = capture(context, 'docker-' + phase + '-identity',
                               GIT + ['rev-parse', 'refs/tags/v' + PIN['version'] + '^{tag}',
                                      'HEAD^{commit}', 'HEAD^{tree}'], source, environment, 10)
              expected = ''.join(PIN[key] + '\n' for key in ('tag', 'commit', 'tree')).encode()
              require(actual == expected, 'Docker source ref/tree differs')
              status = capture(context, 'docker-' + phase + '-clean',
                               GIT + ['status', '--porcelain=v1', '--untracked-files=all', '--ignored=matching'],
                               source, environment, 10)
              require(status == b'', 'Docker source is not the original clean tree')

          def setup_inputs():
              require(sys.platform == 'darwin' and os.environ['RUNNER_OS'] == 'macOS'
                      and os.environ['KIRO_GO_VERSION'] == '1.26.11', 'Docker build host/toolchain version')
              arch = {'ARM64': ('arm64', 'arm64'), 'X64': ('x64', 'amd64')}.get(os.environ['RUNNER_ARCH'])
              require(arch is not None, 'Docker build architecture')
              runner = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
              cache = Path(os.environ['RUNNER_TOOL_CACHE']).resolve(strict=True)
              go = cache / 'go/1.26.11' / arch[0] / 'bin/go'
              selected = shutil.which('go')
              require(selected is not None and Path(selected).resolve(strict=True) == go,
                      'unverified setup-go PATH executable')
              node = os.environ['KIRO_NODE_BIN']
              require(node and Path(node).is_absolute() and not any(c in node for c in '\r\n:'),
                      'unverified setup-node bin')
              return runner, go, arch[1], node, executable(go)

          def output_cli(destination, arch, search):
              binary, selected = destination / ('docker-darwin-' + arch), destination / 'docker'
              require(selected.is_symlink() and os.readlink(selected) == binary.name,
                      'Docker build output alias differs')
              proof = executable(binary)
              found = shutil.which('docker', path=search)
              require(found is not None and Path(found).resolve(strict=True) == binary,
                      'Docker build output is shadowed on audit PATH')
              return dict(**proof, selected=str(selected))

          def provision():
              os.umask(0o077)
              runner, go, arch, node, original_go = setup_inputs()
              workspace = Path(tempfile.mkdtemp(prefix='kiro-docker-', dir=runner))
              proof_root = runner / 'vendor-proof'
              proof_root.mkdir(exist_ok=True)
              directory(proof_root)
              context = dict(deadline=time.monotonic() + 420, proof=proof_root, commands=[])
              proof = dict(schema_version=1, kind='source-built-docker-cli', source=PIN,
                           toolchain=original_go, version=PIN['version'], architecture=arch,
                           status='failed', native_activation=False, daemon_started=False,
                           commands=context['commands'])
              try:
                  build(context, proof, workspace, runner, go, arch, node, original_go)
              finally:
                  body = (json.dumps(proof, sort_keys=True) + '\n').encode()
                  require(len(body) <= 64 << 10, 'Docker build receipt bound')
                  with (proof_root / 'docker-runtime.json').open('xb') as output:
                      output.write(body)

          def build(context, proof, workspace, runner, go, arch, node, original_go):
              source = workspace / 'gopath/src/github.com/docker/cli'
              source.parent.mkdir(parents=True)
              destination = runner / 'vendor-root/usr/bin'
              destination.mkdir(parents=True, exist_ok=True)
              parents = {path: directory(path) for path in (runner, runner / 'vendor-root', destination.parent, destination)}
              for name in ('docker', 'docker-darwin-' + arch):
                  require(not os.path.lexists(destination / name), 'Docker output must be absent')
              output_membership(destination, set())
              for name in ('home', 'tmp', 'cache'):
                  (workspace / name).mkdir()
              environment = dict(PATH=str(go.parent) + ':/usr/bin:/bin:/usr/sbin:/sbin',
                                 HOME=str(workspace / 'home'), TMPDIR=str(workspace / 'tmp'), LANG='C',
                                 GOPATH=str(workspace / 'gopath'), GOCACHE=str(workspace / 'cache'),
                                 GOENV='off', GOTOOLCHAIN='local', GOPROXY='off', GOSUMDB='off',
                                 GO111MODULE='auto', GOFLAGS='-p=1', GOMAXPROCS='2', CGO_ENABLED='0',
                                 GOOS='darwin', GOARCH=arch, GO_LINKMODE='static', TARGET=str(destination),
                                 VERSION=PIN['version'], GITCOMMIT=PIN['commit'], SOURCE_DATE_EPOCH='1793741702',
                                 GIT_CONFIG_NOSYSTEM='1', GIT_CONFIG_GLOBAL='/dev/null', GIT_TERMINAL_PROMPT='0')
              version = capture(context, 'docker-go-version', [str(go), 'version'], workspace, environment, 10)
              require(version == ('go version go1.26.11 darwin/' + arch + '\n').encode(), 'Docker actual Go version differs')
              capture(context, 'docker-source-clone', GIT + ['clone', '--no-checkout', '--depth=1', '--single-branch',
                      '--branch', 'v' + PIN['version'], PIN['repo'], str(source)], workspace, environment, 120)
              capture(context, 'docker-source-checkout', GIT + ['checkout', '--detach', PIN['commit']], source, environment, 20)
              source_state(context, source, environment, 'before')
              capture(context, 'docker-source-build', ['/bin/sh', str(source / 'scripts/build/binary')],
                      source, environment, 240)
              source_state(context, source, environment, 'after')
              require(executable(go) == original_go, 'Docker original Go executable changed')
              require(all(directory(path) == original for path, original in parents.items() if path != destination)
                      and directory(destination)[:5] == parents[destination][:5], 'Docker original output parents changed')
              output_membership(destination, {'docker', 'docker-darwin-' + arch})
              search = ':'.join((node, '/usr/local/sbin', '/usr/local/bin', '/usr/sbin', '/usr/bin',
                                '/sbin', '/bin', str(destination), str(Path(os.environ['HOME']) / '.local/bin')))
              result = output_cli(destination, arch, search)
              require(len(context['commands']) == 8 and time.monotonic() < context['deadline'], 'Docker build completion bound')
              proof.update(status='source-built', executable=result, source_unchanged=True,
                           build_environment=environment, setup_go='b7ad1dad31e06c5925ef5d2fc7ad053ef454303e')

          if __name__ == '__main__':
              provision()
          KIRO_DOCKER
      - name: Build CLI under test (not the already-published binary)
        run: go build -trimpath -ldflags='-X main.version=0.1.95' -o "$RUNNER_TEMP/agentplugins-audit" ./cli/cmd/agentplugins
      - name: Run real acquisitions and report every source and outcome
        env:
          AUDIT_KIND: ${{ matrix.kind }}
          AUDIT_TARGET: ${{ matrix.target }}
          AUDIT_VENDOR_OUTCOME: ${{ steps.vendor-install.outcome }}
          KIRO_NODE_BIN: ${{ steps.kiro-node.outputs.bin }}
        shell: bash
        run: |
          if [[ "$AUDIT_TARGET" == kiro ]]; then
            test -n "$KIRO_NODE_BIN"
            export PATH="$KIRO_NODE_BIN:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$RUNNER_TEMP/vendor-root/usr/bin:$HOME/.local/bin"
          else
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$RUNNER_TEMP/vendor-root/usr/bin:$HOME/.local/bin"
          fi
          python3 scripts/live-install-audit.py \
            --cli "$RUNNER_TEMP/agentplugins-audit" \
            --target "$AUDIT_TARGET" --kind "$AUDIT_KIND" --limit 30 \
            --report-dir "$RUNNER_TEMP/live-audit-report"
      - name: Preserve exact per-case evidence, even if vendor install or CLI fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: remaining-client-${{ matrix.target }}-${{ matrix.kind }}
          path: |
            ${{ runner.temp }}/live-audit-report/
            ${{ runner.temp }}/vendor-proof/
          if-no-files-found: warn
          retention-days: 14
