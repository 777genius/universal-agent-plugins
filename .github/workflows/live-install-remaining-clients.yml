name: Remaining client live installation audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - '.github/workflows/live-install-remaining-clients.yml'
      - 'scripts/live-install-audit.py'
      - 'scripts/prepared_installation_audit.py'
      - 'scripts/test_prepared_installation_audit.py'
      - 'scripts/test_kiro_installation_audit.py'
      - 'scripts/windsurf_global_skill_audit.py'
      - 'scripts/windsurf_installation_audit.py'
      - 'scripts/test_windsurf_global_skill_audit.py'
      - 'scripts/test_windsurf_installation_audit.py'
      - 'scripts/testdata/windsurf_projection_oracle/**'
      - 'scripts/test_live_install_audit_env.py'
      - 'scripts/test_kimi_repeat_log_audit.py'
      - 'scripts/devin_project_auto_install_e2e.py'
      - 'scripts/test_devin_project_auto_install_e2e.py'
      - 'scripts/prepare-codex-linux-sandbox.sh'
      - 'scripts/run-native-client-matrix.py'
      - 'tests/live-install/fixtures.json'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  # pull_request runs check out a synthetic merge commit; retain the source branch HEAD too.
  AUDIT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}

concurrency:
  group: remaining-client-audit-${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || (github.event.label.name == 'ci:full' && github.event.pull_request.draft == true)) && github.event.pull_request.number || github.event_name == 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || (github.event.label.name == 'ci:full' && github.event.pull_request.draft == true)) }}

jobs:
  changes:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'labeled' || (github.event.label.name == 'ci:full' && github.event.pull_request.draft == true)) && (github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
    uses: ./.github/workflows/pr-changes.yml
    permissions:
      pull-requests: read
  remaining-client-install:
    needs: changes
    name: Full 30 ${{ matrix.kind }} / ${{ matrix.target }} (separate installation and native verdicts)
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'labeled' || (github.event.label.name == 'ci:full' && github.event.pull_request.draft == true)) && (github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
    # Linux hosted runners do not delegate cgroup v2 for Kiro's required
    # duplex MCP containment. Test the real native client on macOS instead
    # of weakening that security guard or labelling a blocked Linux run green.
    runs-on: ${{ matrix.target == 'kiro' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.remaining_clients || '["cursor","kiro","windsurf","grok","chatgpt"]') }}
        kind: [plugin, skill]
        # Desktop exposes User scope; Project Skills are a documented refusal.
        exclude:
          - target: chatgpt
            kind: skill
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Refuse inherited real client profile overrides before live cases
        run: |
          python3 -m unittest discover -s scripts -p 'test_live_install_audit_env.py'
          python3 -m unittest discover -s scripts -p 'test_kimi_repeat_log_audit.py'
      - name: Verify source-bound Cursor and cold Grok installation contracts
        if: ${{ matrix.target == 'cursor' || matrix.target == 'grok' && matrix.kind == 'skill' }}
        run: python3 -m unittest discover -s scripts -p 'test_prepared_installation_audit.py'
      - name: Verify Kiro installation custody and exact refusals
        if: ${{ matrix.target == 'kiro' }}
        run: python3 -m unittest discover -s scripts -p 'test_kiro_installation_audit.py'
      - name: Verify Devin Global installation and independent native custody
        if: ${{ matrix.target == 'windsurf' && matrix.kind == 'plugin' }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_windsurf_global_skill_audit.py'
          python3 -m unittest discover -s scripts -p 'test_windsurf_installation_audit.py'
      - name: Acquire actual public vendor client where a headless Linux build exists
        id: vendor-install
        # Preserve a complete explicit client-unavailable record even when a
        # genuine vendor installer needs login (e.g. Devin). The audit itself
        # still exits nonzero: a vendor failure cannot be a successful install.
        continue-on-error: true
        env:
          TARGET: ${{ matrix.target }}
          KIND: ${{ matrix.kind }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET" == chatgpt && "$KIND" == plugin ]]; then
            bash scripts/prepare-codex-linux-sandbox.sh
          fi
          mkdir -p "$RUNNER_TEMP/vendor-proof" "$HOME/.local/bin"
          # Runner toolchain must precede any vendor-controlled executable.
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$HOME/.local/bin"
          case "$TARGET" in
            cursor)
              if [[ "$KIND" == skill ]]; then
                # Homebrew/homebrew-cask Casks/c/cursor-cli.rb @ 5815fd3716b83066412887902c6dd4bf92e4d7ad
                URL="https://downloads.cursor.com/lab/2026.10.22-27dcf5f/linux/x64/agent-cli-package.tar.gz"
                BIN="cursor-agent"
              else
                # User-scope Plugins require the editor. #931 hosted E2E
                # has checked this exact official APT .deb SHA-256.
                # This qualifies acquisition, not native plugin activation.
                URL="https://downloads.cursor.com/aptrepo/pool/stable/c/cu/cursor_3.30.14_amd64.deb"
                BIN="cursor"
              fi
              ;;
            kiro) URL="https://desktop-release.q.us-east-1.amazonaws.com/3.0.0/kirocli-universal-darwin.zip"; BIN="kiro-cli" ;;
            windsurf)
              # Both Project and User admit this reviewed official npm version.
              URL="https://registry.npmjs.org/devin/-/devin-3000.12.57-linux-x64.tgz"
              BIN="devin"
              ;;
            grok)
              # Homebrew/homebrew-cask Casks/g/grok-build.rb @ b75a8e94456970fa349c75b59ca5e4183dde8e28
              URL="https://x.ai/cli/grok-1.0.70-linux-x86_64"
              BIN="grok"
              ;;
            vscode)
              # Official VS Code 1.144.0 Linux x64 .deb, never a mutable "latest".
              URL="https://update.code.visualstudio.com/1.144.0/linux-deb-x64/stable"
              BIN="code"
              ;;
            chatgpt)
              test "$KIND" = plugin
              # Desktop uses the same backend as the existing Codex catalog lane.
              # Reuse that immutable pin and the bounded regular-member installer.
              python3 - "$RUNNER_TEMP" <<'CHATGPT_CODEX'
          import importlib.util, json, os, platform, stat, sys
          from pathlib import Path
          if sys.platform != "linux" or platform.machine() != "x86_64":
              raise SystemExit("ChatGPT Desktop bootstrap requires Linux amd64")
          root = Path(sys.argv[1]).resolve(strict=True)
          directory = root / "vendor-root"
          directory.mkdir()
          source = Path.cwd() / "scripts/run-native-client-matrix.py"
          spec = importlib.util.spec_from_file_location("chatgpt_codex_matrix", source)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          pin = module.PINS["linux-amd64"]["codex"]
          binary, proof = module.provision(pin, directory, "codex")
          if (binary != directory / "codex" or binary.is_symlink()
                  or not stat.S_ISREG(binary.lstat().st_mode)
                  or not os.access(binary, os.X_OK)
                  or binary.resolve(strict=True) != binary):
              raise SystemExit("unverified staged Codex executable")
          proof.update(public_target="chatgpt", canonical_client_id="codex",
                       pin_family="full-catalog", executable=str(binary))
          with (root / "vendor-proof/codex-runtime.json").open("x") as stream:
              stream.write(json.dumps(proof, sort_keys=True) + "\n")
          (root / "vendor-proof/source.txt").write_text(proof["source"] + "\n")
          CHATGPT_CODEX
              BIN="codex"
              executable="$RUNNER_TEMP/vendor-root/codex"
              ln -s "$executable" "$HOME/.local/bin/codex"
              ;;
          esac
          if [[ "$TARGET" != chatgpt ]]; then
          printf '%s\n' "$URL" > "$RUNNER_TEMP/vendor-proof/source.txt"
          # BUG-012: download, fingerprint, and preserve proposed vendor bytes;
          # never execute without a separately reviewed immutable digest pin.
          case "$TARGET" in
            cursor)
              if [[ "$KIND" == skill ]]; then
                SHA256="85296944e4600a83c4b764f578d1502bf9c416db200d33a593e8f3ecabfdc294"
              else
                SHA256="c8003e009f96a6e4fd7185f7016c66d7e36e03d8fa2e2394197511907bcd8226" # Official Cursor 3.30.14 APT amd64 .deb; verified #931
              fi
              ;;
            vscode) SHA256="b8fbff92d8d95908990eed0acf004c980f29003725469e794ddbd017ea511a20" ;; # Microsoft official SHA-256 for Linux .deb x64 1.144.0
            kiro) SHA256="0a8f067c4fe6a23a231aa3a18e3e4332120ef9ed3d2d7b6eea907beb8b4cdd8b" ;; # Homebrew/homebrew-cask Casks/k/kiro-cli.rb @ 7191fc89
            grok) SHA256="22d281c5964c5444147328096ba2a221f3f0874c6858e27c825656a80f6e58e9" ;; # Homebrew Cask grok-build 1.0.70, Linux x86_64
          esac
          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$@"
            else
              shasum -a 256 "$@" # macOS runner
            fi
          }
          if [[ "$TARGET" == windsurf ]]; then
            # Existing bounded official npm acquisition validates metadata, SRI,
            # safe regular members, package authority and the fixed binary SHA.
            # No npm install hooks or vendor installer scripts are executed.
            PYTHONPATH=scripts python3 - "$RUNNER_TEMP" "$URL" <<'PY_DEVIN'
          import json
          from pathlib import Path
          import sys
          import devin_project_auto_install_e2e as devin
          root = Path(sys.argv[1]).resolve(strict=True)
          reviewed = "sha512-SZhb9rrYghHvOh0PRpZT1GpNPMMo+7P9VH6t6ZNMrBmyVX3x3XflPvCv8yomx/i7vnvf64bdFR++cRRg/c8mLQ=="
          proof = dict(schema_version=1, version=devin.VERSION, tarball_url=sys.argv[2],
                       reviewed_integrity=reviewed, binary_sha256=devin.BINARY_SHA,
                       acquisition_verified=False)
          try:
              if (devin.VERSION != "3000.12.57" or devin.TARBALL_URL != sys.argv[2]
                      or devin.BINARY_SHA != "3f3fb99f472d92f7852be3775ac2b66b5d60baf26f3441b02d54c56b160bc30d"):
                  raise RuntimeError("Devin helper differs from reviewed acquisition")
              executable, integrity = devin.install_genuine_devin(root)
              if executable != root / "vendor-devin/bin/devin":
                  raise RuntimeError("Devin executable differs from reviewed package path")
              proof["observed_integrity"] = integrity
              if integrity != reviewed:
                  raise RuntimeError("Devin npm archive differs from reviewed acquisition")
              proof["acquisition_verified"] = True
          finally:
              (root / "vendor-proof" / "devin-npm.json").write_text(
                  json.dumps(proof, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY_DEVIN
            executable="$RUNNER_TEMP/vendor-devin/bin/devin"
            test -f "$executable" && test -x "$executable" && test ! -L "$executable" || exit 4
            ln -s "$executable" "$HOME/.local/bin/devin"
          else
          if [[ "$TARGET" == cursor && "$KIND" == skill ]]; then
            artifact="$RUNNER_TEMP/cursor-agent.tar.gz"
          elif [[ "$TARGET" == vscode || "$TARGET" == cursor ]]; then
            artifact="$RUNNER_TEMP/$TARGET.deb"
          elif [[ "$TARGET" == kiro ]]; then
            artifact="$RUNNER_TEMP/kirocli-universal-darwin.zip"
          elif [[ "$TARGET" == grok ]]; then
            artifact="$RUNNER_TEMP/grok-1.0.70-linux-x86_64"
          else
            echo "Unsupported vendor artifact format: $TARGET" >&2
            exit 4
          fi
          curl -fsSL --retry 2 "$URL" -o "$artifact"
          sha256_file "$artifact" > "$RUNNER_TEMP/vendor-proof/observed-untrusted.sha256"
          if [[ ! "${SHA256:-}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Missing reviewed SHA-256 for $TARGET: downloaded bytes are NOT approved to execute" \
              | tee "$RUNNER_TEMP/vendor-proof/verification-blocked.txt"
            exit 3
          fi
          printf '%s  %s\n' "$SHA256" "$artifact" | sha256_file -c -
          if [[ "$TARGET" == cursor && "$KIND" == skill ]]; then
            mkdir -p "$RUNNER_TEMP/vendor-root"
            # This official archive is independently digest-pinned above.
            # Python 3.12's data filter rejects archive entries escaping this root.
            python3 - "$artifact" "$RUNNER_TEMP/vendor-root" <<'PY'
          import sys
          import tarfile
          with tarfile.open(sys.argv[1], "r:gz") as archive:
              archive.extractall(path=sys.argv[2], filter="data")
          PY
            executable="$RUNNER_TEMP/vendor-root/dist-package/cursor-agent"
            target_binary="cursor-agent"
            test -f "$executable" && test -x "$executable" && test ! -L "$executable"
            ln -s "$executable" "$HOME/.local/bin/$target_binary"
          elif [[ "$TARGET" == vscode || "$TARGET" == cursor ]]; then
            mkdir -p "$RUNNER_TEMP/vendor-root"
            dpkg-deb --extract "$artifact" "$RUNNER_TEMP/vendor-root"
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$RUNNER_TEMP/vendor-root/usr/bin:$HOME/.local/bin"
            if [[ "$TARGET" == vscode ]]; then
              # A staged .deb may carry /usr/bin/code as an absolute symlink:
              # bind its verified editor launcher explicitly, not the host CLI.
              executable="$RUNNER_TEMP/vendor-root/usr/share/code/bin/code"
              test -f "$executable" && test -x "$executable" && test ! -L "$executable"
              test "$(readlink -f "$executable")" = "$executable"
              ln -s "$executable" "$HOME/.local/bin/code"
            fi
            if [[ "$TARGET" == cursor ]]; then
              # The signed .deb normally registers /usr/bin/cursor in postinst.
              # Select the reviewed extracted binary without running scripts.
              executable="$RUNNER_TEMP/vendor-root/usr/share/cursor/bin/cursor"
              test -f "$executable" && test -x "$executable" && test ! -L "$executable"
              test "$(readlink -f "$executable")" = "$executable"
              ln -s "$executable" "$HOME/.local/bin/cursor"
            fi
          elif [[ "$TARGET" == kiro ]]; then
            # This archive is verified above against the independently pinned
            # Homebrew Cask release, not a mutable vendor installer script.
            mkdir -p "$RUNNER_TEMP/vendor-root"
            ditto -x -k "$artifact" "$RUNNER_TEMP/vendor-root"
            executable="$RUNNER_TEMP/vendor-root/kirocli/bin/kiro-cli"
            test -f "$executable" && test -x "$executable" && test ! -L "$executable"
            ln -s "$executable" "$HOME/.local/bin/kiro-cli"
          elif [[ "$TARGET" == grok ]]; then
            # Independent Homebrew SHA is checked above before any native run.
            mkdir -p "$RUNNER_TEMP/vendor-root"
            executable="$RUNNER_TEMP/vendor-root/grok"
            install -m 0755 "$artifact" "$executable"
            test -f "$executable" && test -x "$executable" && test ! -L "$executable"
            ln -s "$executable" "$HOME/.local/bin/grok"
          else
            echo "Unsupported verified vendor format: $TARGET" >&2
            exit 4
          fi
          fi
          fi
          hash -r
          command -v "$BIN" | tee "$RUNNER_TEMP/vendor-proof/executable.txt"
          # The reviewed bytes must be the native CLI actually selected by PATH,
          # not an unrelated binary preinstalled on a runner.
          python3 - "$BIN" "$executable" <<'PY'
          from pathlib import Path
          import shutil
          import sys
          selected = shutil.which(sys.argv[1])
          if not selected or Path(selected).resolve(strict=True) != Path(sys.argv[2]).resolve(strict=True):
              raise SystemExit(f"unverified native PATH executable: {sys.argv[1]}")
          PY
          # No ambient CI credentials or native profile overrides reach vendor --version.
          probe_home="$(mktemp -d "$RUNNER_TEMP/vendor-probe.XXXXXX")"
          env -i PATH="$PATH" HOME="$probe_home" USERPROFILE="$probe_home" \
            XDG_CONFIG_HOME="$probe_home/config" XDG_CACHE_HOME="$probe_home/cache" \
            XDG_DATA_HOME="$probe_home/data" TMPDIR="$probe_home" \
            LANG="${LANG:-C.UTF-8}" CI=true DO_NOT_TRACK=1 \
            python3 -c 'import subprocess,sys;sys.exit(subprocess.run([sys.argv[1],"--version"], timeout=30).returncode)' "$BIN" \
            | tee "$RUNNER_TEMP/vendor-proof/version.txt"
      - name: Install real Docker CLI for Kiro plugin sources
        if: ${{ matrix.target == 'kiro' && matrix.kind == 'plugin' }}
        id: kiro-docker
        shell: bash
        run: |
          set -euo pipefail
          # Docker Hub is in the frozen positive source set. Qualify only the
          # real CLI prerequisite; no daemon or authenticated MCP is started.
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install docker
          audit_docker="$(brew --prefix docker)/bin/docker"
          [[ "$audit_docker" == /* && -f "$audit_docker" && -x "$audit_docker" ]]
          printf 'executable=%s\n' "$audit_docker" | tee "$RUNNER_TEMP/vendor-proof/docker-cli.txt"
          "$audit_docker" --version | tee -a "$RUNNER_TEMP/vendor-proof/docker-cli.txt"
          printf 'executable=%s\n' "$audit_docker" >> "$GITHUB_OUTPUT"
      - name: Build CLI under test (not the already-published binary)
        run: go build -trimpath -ldflags='-X main.version=0.1.115' -o "$RUNNER_TEMP/agentplugins-audit" ./cli/cmd/agentplugins
      - name: Run explicit installation contracts and preserve native outcomes
        env:
          AUDIT_KIND: ${{ matrix.kind }}
          AUDIT_TARGET: ${{ matrix.target }}
          AUDIT_VENDOR_OUTCOME: ${{ steps.vendor-install.outcome }}
          AUDIT_DOCKER_EXECUTABLE: ${{ steps.kiro-docker.outputs.executable }}
        shell: bash
        run: |
          audit_go_bin=""
          if [[ "$AUDIT_TARGET" == windsurf && "$AUDIT_KIND" == plugin ]]; then
            # The independent projection uses the same pinned compiler as the CLI.
            audit_go="$(command -v go)"
            [[ "$audit_go" == /* && -f "$audit_go" && -x "$audit_go" ]]
            [[ "$(GOTOOLCHAIN=local "$audit_go" version)" == 'go version go1.26.11 linux/amd64' ]]
            audit_go_bin="${audit_go%/*}:"
          fi
          audit_node_bin=""
          if [[ "$AUDIT_TARGET" == kiro ]]; then
            # Preserve setup-node's selected runtime before narrowing Kiro's PATH.
            audit_node="$(command -v node)"
            [[ "$audit_node" == /* && -x "$audit_node" ]]
            audit_node_bin="${audit_node%/*}:"
          fi
          audit_docker_bin=""
          if [[ "$AUDIT_TARGET" == kiro && "$AUDIT_KIND" == plugin ]]; then
            [[ "$AUDIT_DOCKER_EXECUTABLE" == /* && -f "$AUDIT_DOCKER_EXECUTABLE" && -x "$AUDIT_DOCKER_EXECUTABLE" ]]
            audit_docker_bin="${AUDIT_DOCKER_EXECUTABLE%/*}:"
          fi
          export PATH="${audit_go_bin}${audit_node_bin}${audit_docker_bin}/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$RUNNER_TEMP/vendor-root/usr/bin:$HOME/.local/bin"
          if [[ "$AUDIT_TARGET" == windsurf && "$AUDIT_KIND" == plugin ]]; then
            [[ "$(command -v go)" == "$audit_go" ]]
          fi
          if [[ "$AUDIT_TARGET" == kiro && "$AUDIT_KIND" == plugin ]]; then
            [[ "$(command -v docker)" == "$AUDIT_DOCKER_EXECUTABLE" ]]
          fi
          # Keep installation and native verdicts explicit; Windsurf retains its four native cases.
          audit_acceptance=native
          case "$AUDIT_TARGET:$AUDIT_KIND" in
            cursor:plugin) audit_acceptance=cursor-prepared-installation ;;
            cursor:skill) audit_acceptance=cursor-prepared-skills-installation ;;
            grok:skill) audit_acceptance=grok-prepared-skills-installation ;;
            kiro:plugin) audit_acceptance=kiro-installation ;;
            kiro:skill) audit_acceptance=kiro-skills-installation ;;
            windsurf:plugin) audit_acceptance=windsurf-global-installation ;;
          esac
          python3 scripts/live-install-audit.py \
            --cli "$RUNNER_TEMP/agentplugins-audit" \
            --target "$AUDIT_TARGET" --kind "$AUDIT_KIND" --limit 30 \
            --acceptance "$audit_acceptance" \
            --report-dir "$RUNNER_TEMP/live-audit-report"
      - name: Preserve exact per-case evidence, even if vendor install or CLI fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: remaining-client-${{ matrix.target }}-${{ matrix.kind }}
          path: |
            ${{ runner.temp }}/live-audit-report/
            ${{ runner.temp }}/vendor-proof/
          if-no-files-found: warn
          retention-days: 14
