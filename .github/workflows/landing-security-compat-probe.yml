name: Temporary landing dependency compatibility proof

on:
  push:
    branches:
      - test/landing-security-major-compat-20261110
    paths:
      - landing/pnpm-workspace.yaml
      - .github/workflows/landing-security-compat-probe.yml

permissions:
  contents: write

jobs:
  resolve-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          package_json_file: landing/package.json
          dest: ${{ runner.temp }}/pnpm-landing
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.1'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Stage genuinely verified signed registry mirror
        run: |
          go run ./cmd/agentplugins-registry-mirror \
            --registry-repository 777genius/universal-agent-plugins-registry \
            --pages-origin https://777genius.github.io/universal-agent-plugins-registry/ \
            --output "${RUNNER_TEMP}/uap-registry-mirror"
          mkdir -p landing/public
          cp -a "${RUNNER_TEMP}/uap-registry-mirror/." landing/public/
      - name: Generate real pnpm lockfile for compatibility test
        working-directory: landing
        run: |
          pnpm --version
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Verify frozen install of generated lockfile
        working-directory: landing
        run: pnpm install --frozen-lockfile
      - name: Record actual resolved dependency graph
        working-directory: landing
        run: pnpm why glob minimatch > dependency-why.txt
      - name: Record complete audit and gate only glob/minimatch advisories
        working-directory: landing
        run: |
          set +e
          pnpm audit --json > dependency-audit.json
          result=$?
          set -e
          echo "$result" > dependency-audit.exit
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const audit = JSON.parse(readFileSync('dependency-audit.json', 'utf8'));
          const advisories = Object.values(audit.advisories || {});
          const tracked = advisories.filter(v => ['glob', 'minimatch'].includes(v.module_name));
          const other = advisories.length - tracked.length;
          console.log(JSON.stringify({glob_minimatch_advisories: tracked.length, other_unrelated_advisories: other, full_audit_exit: readFileSync('dependency-audit.exit', 'utf8').trim()}));
          if (tracked.length) { console.error(JSON.stringify(tracked)); process.exit(1); }
          NODE
      - name: Install Chromium and qualify source site
        working-directory: landing
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Run site static type and lint checks
        working-directory: landing
        run: |
          pnpm exec nuxt prepare
          pnpm exec vue-tsc --noEmit
          pnpm run lint
          pnpm run test:registry
          pnpm run check:i18n
          pnpm run generate
      - name: Commit generated and fully checked pnpm lock to this isolated proof branch
        run: |
          set -euo pipefail
          git add landing/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile change; resolution did not replace vulnerable tree" >&2
            exit 1
          fi
          git config user.name "uap-security-proof[bot]"
          git config user.email "uap-security-proof@users.noreply.github.com"
          git commit -m "fix(security): generate tested glob 14 and minimatch 11 lockfile"
          git push origin HEAD:refs/heads/test/landing-security-major-compat-20261110
      - name: Preserve original lockfile and proof for independent audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: landing-security-compat-lock-and-audit
          path: |
            landing/pnpm-lock.yaml
            landing/pnpm-workspace.yaml
            landing/dependency-why.txt
            landing/dependency-audit.json
            landing/dependency-audit.exit
          if-no-files-found: warn
          retention-days: 7
