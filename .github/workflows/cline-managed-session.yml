name: Cline managed project session
on:
  pull_request:
    paths:
      - 'install/integrationctl/agentplugins/clients/cline/**'
      - 'install/integrationctl/agentplugins/clients/session.go'
      - 'install/integrationctl/agentplugins/managedstdio/**'
      - 'cli/internal/agentpluginscli/**'
      - 'cli/cmd/agentplugins/**'
      - 'scripts/grok_project_protocol_client.py'
      - 'scripts/grok_project_protocol_e2e.py'
      - 'scripts/native_client_research.py'
      - 'scripts/project_native_research.py'
      - 'scripts/project_native_collectors/cline.py'
      - 'repotests/testdata/agentplugins_native_probe/**'
      - 'go.work'
      - 'go.work.sum'
      - 'scripts/cline_managed_session_e2e.py'
      - 'scripts/test_cline_managed_session_e2e.py'
      - '.github/workflows/cline-managed-session.yml'
  push:
    branches: [main]
    paths:
      - 'install/integrationctl/agentplugins/clients/cline/**'
      - 'install/integrationctl/agentplugins/clients/session.go'
      - 'install/integrationctl/agentplugins/managedstdio/**'
      - 'cli/internal/agentpluginscli/**'
      - 'cli/cmd/agentplugins/**'
      - 'scripts/grok_project_protocol_client.py'
      - 'scripts/grok_project_protocol_e2e.py'
      - 'scripts/native_client_research.py'
      - 'scripts/project_native_research.py'
      - 'scripts/project_native_collectors/cline.py'
      - 'repotests/testdata/agentplugins_native_probe/**'
      - 'go.work'
      - 'go.work.sum'
      - 'scripts/cline_managed_session_e2e.py'
      - 'scripts/test_cline_managed_session_e2e.py'
      - '.github/workflows/cline-managed-session.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cline-managed-session-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache: false
      - name: Test composed lifecycle and inherited process I/O
        run: |
          go test -count=1 ./install/integrationctl/agentplugins/clients/cline ./install/integrationctl/agentplugins/managedstdio ./cli/internal/agentpluginscli ./cli/cmd/agentplugins -run 'Test(ClineProjectSession|Session)'
      - name: Verify Cline native transport readback rejects flat/foreign entries
        run: python3 -m unittest discover -s scripts -p 'test_cline_managed_session_e2e.py' -v
      - name: Build ordinary UAP and credential-free MCP fixture
        run: |
          go build -trimpath -o "$RUNNER_TEMP/agentplugins" ./cli/cmd/agentplugins
          go build -trimpath -o "$RUNNER_TEMP/probe" ./repotests/testdata/agentplugins_native_probe
      - name: Verify actual installed Cline selection and MCP lifecycle without model
        run: |
          python3 scripts/cline_managed_session_e2e.py \
            --installer "$RUNNER_TEMP/agentplugins" --probe "$RUNNER_TEMP/probe" \
            --output "$RUNNER_TEMP/cline-session-evidence"
      - name: Retain original evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cline-managed-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cline-session-evidence/evidence.json
          if-no-files-found: error
          retention-days: 14
