name: Govulncheck

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  govulncheck:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            dir: .
          - name: cli
            dir: cli
          - name: plugininstall
            dir: plugininstall
          - name: integrationctl
            dir: install/integrationctl
          - name: agentplugins
            dir: install/integrationctl/agentplugins
          - name: sdk
            dir: sdk

    name: govulncheck (${{ matrix.name }})
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
          cache: false

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
