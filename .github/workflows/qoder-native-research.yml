name: Qoder Pinned Native Research

on:
  pull_request:
    paths:
      - '.github/workflows/qoder-native-research.yml'
      - 'scripts/research-qoder-native.py'
      - 'scripts/native_client_research.py'
      - 'scripts/test_qoder_native_research.py'
      - 'scripts/native_client_research.py'
      - 'scripts/test_native_client_research.py'
      - 'scripts/run-native-client-matrix.py'
      - 'scripts/native_client_draft.py'
  workflow_dispatch:

permissions:
  contents: read

# Replace ordinary CI for the same PR/ref; keep manual runs independent.
concurrency:
  group: qoder-native-research-${{ github.event_name }}-${{ github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  research:
    name: Qoder 1.1.78 version help and empty list
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify inert research safety contracts
        run: |
          python3 -m unittest discover -s scripts -p 'test_native_client_research.py'
          python3 -m unittest discover -s scripts -p 'test_qoder_native_research.py'
      - name: Capture pinned genuine research in a fresh credential-free profile
        env:
          AGENTPLUGINS_NATIVE_DISPOSABLE_HOSTED: '1'
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/research-qoder-native.py --output '${{ runner.temp }}/qoder-native-research'
      - name: Upload research including failed probes
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: qoder-1.1.78-precode-research-linux-amd64
          path: ${{ runner.temp }}/qoder-native-research/
          if-no-files-found: error
          retention-days: 14
