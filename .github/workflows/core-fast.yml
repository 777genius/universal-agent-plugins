name: Core fast

# Merge gate for the stacked installer-core refactor parts. The full Required
# lane runs on push to the base branch afterwards, so this one only has to be
# fast enough to keep a part from waiting 10-27 minutes.
on:
  pull_request:
    branches: [main, 'refactor/**', 'feat/project-*', feat/source-transports-e2e]
    paths:
      - 'install/integrationctl/agentplugins/**'
      - 'repotests/agentplugins_codex_claude_directory_plugin_native_e2e_test.go'
      - 'repotests/agentplugins_codex_directory_inventory_native_test.go'
      # The only ports.PathPolicy implementation lives here.
      - 'install/integrationctl/adapters/pathpolicy/**'
      - 'cli/internal/agentpluginscli/**'
      - 'cli/cmd/agentplugins/**'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - '.golangci.yml'
      - 'Makefile'
      - 'scripts/check-lint-baseline.sh'
      - 'scripts/live-install-audit.py'
      - 'scripts/prepared_installation_audit.py'
      - 'scripts/test_prepared_installation_audit.py'
      - 'scripts/windsurf_installation_audit.py'
      - 'scripts/test_windsurf_installation_audit.py'
      - 'scripts/published_codex_baseline.py'
      - 'scripts/test_published_codex_baseline.py'
      - 'scripts/test_live_install_audit_env.py'
      - 'scripts/gemini_runtime_audit.py'
      - 'scripts/gemini_windows_custody.py'
      - 'scripts/test_gemini_windows_runtime_audit.py'
      - 'scripts/native_client_project_artifacts.py'
      - '.github/workflows/core-fast.yml'
      - '.github/workflows/lint.yml'

permissions:
  contents: read

# Replace ordinary CI for the same PR/ref; keep manual runs independent.
concurrency:
  group: core-fast-${{ github.event_name }}-${{ github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  project-contracts:
    name: project-contracts (${{ matrix.os }})
    runs-on: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:github-hosted') && matrix.os == 'ubuntu-24.04' && matrix.os || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && matrix.os || startsWith(matrix.os, 'ubuntu-') && (vars.CI_LINUX_RUNNER || matrix.os) || matrix.os }}
    # The full combined project and legacy-lock E2E must retain all tests.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      GOMAXPROCS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Embedded schema digests bind exact Git bytes on every platform.
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache: false
      - name: Verify scoped ownership, project lifecycle and legacy lock safety
        run: go test -p=2 -count=1 -timeout=12m ./install/integrationctl/agentplugins/domain ./install/integrationctl/agentplugins/adapters/statev2 ./install/integrationctl/agentplugins/adapters/nativeconfig ./install/integrationctl/agentplugins/adapters/legacylock ./install/integrationctl/agentplugins/clients/... ./install/integrationctl/agentplugins/providers ./install/integrationctl/agentplugins/planner ./install/integrationctl/agentplugins/installer ./install/integrationctl/agentplugins/environment ./install/integrationctl/agentplugins/usecase ./cli/internal/agentpluginscli ./cli/cmd/agentplugins -run 'Test(TargetContext|Project|PrepareRejectsCrossEnvironmentContext|StateLockSharesPhysicalLegacyFileLock|RemoveLegacyAbortsReconcileWhenLegacyStateReappears|RemoveLegacyDelegatesThenReconcilesStateV2|LegacyControllerRejectsForeignHomeBeforeLegacyEngine|LegacyControllerAcceptsOriginalUserHome|LegacyRemovalRequiresExplicitAllTargetAndReconcilesV2|MigrateStateIsExplicitPlanFirstAndPathRedacted|MigrateStateExplicitlyMigratesAuthoritativeSchemaTwoThroughFour)'
      - name: Verify Cursor scoped tool approval and public CLI on each OS
        run: go test -p=2 -count=1 -timeout=3m -v ./install/integrationctl/agentplugins/clients/cursor ./cli/internal/agentpluginscli -run '^TestCursor'
      - name: Verify Devin User installation and original profile authority
        shell: bash
        run: |
          set -euo pipefail
          go test -p=2 -count=1 -timeout=3m -v \
            ./install/integrationctl/agentplugins/clients/windsurf ./install/integrationctl/agentplugins/installer ./cli/internal/agentpluginscli \
            -run '^(TestDevinGlobal.*|TestFacadeDevinGlobal.*|TestUserDevin.*|TestRecordedCascadeMCPReplaysThroughSelectedDevinWithoutMigration|TestRecordedPackageOnlyCascadeDoesNotAdoptSelectedDevinGlobal|TestRecordedMixedOrRetargetedUserReceiptFailsClosed|TestWindsurfRemoveDeletesExactlyManagedObjects)$'

  opencode-transition-windows:
    name: opencode-transition-windows
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache: false
      - name: Qualify native Windows transition privacy and durable recovery
        working-directory: install/integrationctl/agentplugins
        run: go test -count=1 -timeout=3m -v ./clients/opencode -run '^(TestNativeTransitionPrivacyReopensDurableJournal|TestWindowsNativeTransitionRejectsUnsafePrivacy|TestWindowsNativeTransitionSyncPreservesBytes)$'

  managed-stdio-windows:
    name: managed-stdio-windows
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache: false
      - name: Qualify native Windows managed stdio process-tree ownership
        working-directory: install/integrationctl/agentplugins
        run: go test -count=1 -timeout=3m -v ./managedstdio -run '^TestWindows(JobTreeCleanup|AssignFailureKillsSuspendedProcessBeforeWait)$'
      - name: Qualify Agent Plugins reserved MCP environment rules on Windows
        working-directory: install/integrationctl/agentplugins
        run: >-
          go test -count=1 -timeout=4m ./domain ./conformance ./adapters/loader ./clients/shared ./usecase
          -run '^(TestReservedStdioEnvKeyPlatformRules|TestApplyStdioDataContractRejectsPlatformReservedAliases|TestStdioPreflightReservedEnvironmentPlatformAliases|TestStdioReservedAliasPreservesHealthySkillEndToEnd|TestMCPReservedEnvironmentPlatformAdmission|TestStdioReservedEnvironmentTypedMaps|TestPortableMCPReservedAliasKeepsHealthyComponents)$'
      - name: Qualify global dependency transfer and rollback on Windows
        working-directory: cli
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
          GIT_CONFIG_KEY_1: core.autocrlf
          GIT_CONFIG_VALUE_1: 'false'
        run: go test -count=1 -timeout=5m -v ./internal/agentpluginscli -run '^TestDependencyTransfer'

  gemini-observer-windows:
    name: gemini-observer-windows
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'
      - name: Qualify PowerShell 7 and Windows PowerShell 5.1 observer contracts
        working-directory: install/integrationctl/agentplugins
        shell: pwsh
        run: |
          foreach ($shell in @('pwsh.exe', 'powershell.exe')) {
            Get-Command $shell -ErrorAction Stop | Out-Null
          }
          go test -count=1 -timeout=3m -v ./geminihooks/...
          exit $LASTEXITCODE
      - name: Qualify native Windows Gemini journal custody
        shell: pwsh
        run: |
          python -m unittest discover -s scripts -p test_gemini_windows_runtime_audit.py -v
          exit $LASTEXITCODE

  lint:
    uses: ./.github/workflows/lint.yml
    with:
      lint-base: origin/${{ github.base_ref || 'main' }}

  test-core:
    name: test-core
    runs-on: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:github-hosted') && 'ubuntu-latest' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_CORE_TEST_RUNNER || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          package-manager-cache: false

      # Same target as the local preflight, so a green run here means the same
      # packages a contributor ran locally.
      - name: Run install core tests
        run: make test-core

      # Informational, never a gate, and a second pass on purpose:
      # adapters/clientdetect re-executes its own test binary to probe a client
      # version, and under -cover the child prints a GOCOVERDIR warning into the
      # output that probe parses. Excluding it from the instrumented run keeps
      # the gate above identical to `make test-core`.
      - name: Report core coverage
        continue-on-error: true
        run: |
          (cd install/integrationctl/agentplugins && go list ./... \
            | grep -v '/adapters/clientdetect$' \
            | xargs go test -count=1 -cover) > core-cover.log 2>&1 || true
          (cd cli && go test -count=1 -cover ./internal/agentpluginscli/... ./cmd/agentplugins/...) >> core-cover.log 2>&1 || true
          cat core-cover.log
          {
            echo '### Install core coverage'
            echo
            echo '```'
            grep -E 'coverage:' core-cover.log || echo 'no coverage lines produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  cross-build:
    name: cross-build (${{ matrix.goos }})
    runs-on: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:github-hosted') && 'ubuntu-latest' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_CORE_TEST_RUNNER || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache: false

      # The core carries 39 platform-tagged files; only a real cross build
      # catches a Windows-only or darwin-only file that stopped compiling.
      - name: Build every core module for ${{ matrix.goos }}
        env:
          GOOS: ${{ matrix.goos }}
        run: |
          set -e
          for module in install/integrationctl install/integrationctl/agentplugins cli; do
            echo "==> $module"
            (cd "$module" && go build ./...)
          done

  vet-all:
    name: vet-all
    runs-on: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:github-hosted') && 'ubuntu-latest' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_CORE_TEST_RUNNER || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache: false

      # test-core does not compile the authoring commands, terminal prompts,
      # conformance adapter, registry mirror or repotests, and all of them
      # depend on core APIs the refactor changes. go vet compiles packages
      # together with their tests across all six go.work modules.
      - name: Vet every workspace module
        run: make vet
