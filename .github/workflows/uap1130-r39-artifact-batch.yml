name: UAP1130 R39 artifact batch verification
on:
  push:
    branches: [codex/uap1130-r35-artifact-audit]
    paths:
      - '.github/r39-artifact-manifests/**'
      - '.github/r39-pm-audit/**'
      - '.github/workflows/uap1130-r39-artifact-batch.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify-current-pm-pi:
    if: github.repository == '777genius/universal-agent-plugins' && github.ref == 'refs/heads/codex/uap1130-r35-artifact-audit'
    runs-on: ${{ vars.CI_CORE_TEST_RUNNER || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out immutable reviewed auditor revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out fixed R39 source once
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fccd72199a1eedc12e3828cf2fdc2f10a2f418f7
          path: source
          persist-credentials: false
      - name: Fetch exact PM synthetic object once
        run: git -C source fetch --no-tags --depth=1 origin 8a1f7d8c87f467e98ca8bfb2ba57fc2a5a16a221
      - name: Provision Python for independent byte analysis
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify PM macOS ARM original archive and canonical evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/r39-pm-audit/pm_readonly_runner.py \
            --manifest .github/r39-artifact-manifests/pm-macos-arm64.json \
            --manifest-sha256 cf206cc3a0c9b8caafc4c2410191a6390dbe2d303d129916a17c579ac0144960 \
            --source source \
            --core .github/r39-pm-audit/pm_audit.py
