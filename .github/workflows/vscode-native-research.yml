name: VS Code Pinned Publisher Research

on:
  pull_request:
    paths:
      - '.github/workflows/vscode-native-research.yml'
      - 'scripts/research-vscode-native.py'
      - 'scripts/test_vscode_native_research.py'
      - 'scripts/native_client_research.py'
      - 'scripts/test_native_client_research.py'
      - 'scripts/research-grok-native.py'
      - 'scripts/run-native-client-matrix.py'
      - 'scripts/native_client_draft.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-native-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    name: VS Code 1.143.1 help and version only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify inert archive and collector safety contracts
        run: |
          python3 -m unittest discover -s scripts -p 'test_vscode_native_research.py'
          python3 -m unittest discover -s scripts -p 'test_native_client_research.py'
      - name: Capture exact publisher help and version in isolated disposable processes
        env:
          AGENTPLUGINS_NATIVE_DISPOSABLE_HOSTED: '1'
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/research-vscode-native.py --output '${{ runner.temp }}/vscode-native-research'
      - name: Upload bounded research including failed stages
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: vscode-1.143.1-precode-publisher-linux-amd64
          path: ${{ runner.temp }}/vscode-native-research/
          if-no-files-found: error
          retention-days: 14
