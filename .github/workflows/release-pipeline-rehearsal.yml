name: Release pipeline rehearsal

on:
  pull_request:
    paths:
      - '.github/workflows/agentplugins-release.yml'
      - '.github/workflows/agentplugins-platform-proof.yml'
      - '.github/workflows/agentplugins-npm-publish.yml'
      - '.github/workflows/release-pipeline-rehearsal.yml'
      - 'scripts/*agentplugins*draft*.py'
      - 'scripts/*agentplugins*npm_artifact.py'
      - 'scripts/reuse-agentplugins-npm-artifact.py'
      - 'scripts/test_release_pipeline_e2e.py'
      - 'repotests/agentplugins_release_contract_test.go'
      - 'docs/agentplugins-release.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.1'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: go.sum
      - name: Exercise frozen candidate, receipt and exact npm archive handoff
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_*agentplugins*draft.py'
          python3 -B -m unittest discover -s scripts -p 'test_reuse_agentplugins_npm_artifact.py'
          python3 -B -m unittest discover -s scripts -p 'test_release_pipeline_e2e.py'
      - name: Check release workflow gate contracts
        run: go test -count=1 ./repotests -run '^TestAgentpluginsReleaseContractsStayFailClosed$'
