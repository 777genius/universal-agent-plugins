name: Milestone A public channels
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14, windows-2022]
        channel: [npm, pypi, github, brew]
        exclude:
          - runner: windows-2022
            channel: brew
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Verify real public packages in disposable roots
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/public-channel-e2e.py '${{ matrix.channel }}' > "$RUNNER_TEMP/public-channel-evidence.json"
      - name: Retain success or failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-channel-${{ matrix.runner }}-${{ matrix.channel }}
          path: ${{ runner.temp }}/public-channel-evidence.json
          if-no-files-found: error
          retention-days: 14
