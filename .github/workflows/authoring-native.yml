name: Authoring bounded concurrent-init diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, arch: amd64}
          - {runner: windows-11-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.13'
          architecture: ${{ matrix.arch == 'amd64' && 'x64' || matrix.arch }}
          cache: false
      - name: Capture 32 independent concurrent-init scenarios
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: python scripts/authoring-concurrent-diagnostic.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: concurrent-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/authoring-concurrent/evidence
          if-no-files-found: error
