name: Authoring native offline

on:
  pull_request:
  workflow_dispatch:
    inputs:
      windows_diagnostics:
        description: Capture same-invocation native errors (diagnostic builds cannot qualify as release proof)
        type: boolean
        default: true

permissions:
  contents: read

# Bounded pre-release checkpoint: Linux + Windows only. Writable macOS APFS
# remains an UNPROVEN release gate; the preserved read-only research profile
# does not establish authoring support or full MVP acceptance. No Mac provisioning.
jobs:
  native:
    name: Authoring / ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: windows-2022, os: windows, arch: amd64}
          # github/docs ec3629a841129ae28189d7bb2274a7b3d40c5095:
          # data/reusables/actions/supported-github-runners.md (standard public runners).
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: windows-11-arm, os: windows, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_OS: ${{ matrix.os }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      GOTOOLCHAIN: local
      GOMAXPROCS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ci.yml
        # Preserve exact Git bytes for embedded template golden hashes.
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ci.yml
        with:
          go-version: '1.25.13'
          architecture: ${{ matrix.arch == 'amd64' && 'x64' || matrix.arch }}
          cache: false
      - name: Prepare disposable second NTFS filesystem on Windows ARM64
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: ./cli/plugin-kit-ai/internal/authoring/commands/testdata/windows_arm64_volume.ps1 -Mode Setup
      - name: Native offline tests and actual entrypoint builds
        run: |
          set -euo pipefail
          export NATIVE_ROOT="$RUNNER_TEMP/authoring-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ "$EXPECTED_OS" == windows ]]; then
            NATIVE_ROOT="$(cygpath -m "$NATIVE_ROOT")"
            export NATIVE_ROOT
          fi
          printf 'NATIVE_ROOT=%s\n' "$NATIVE_ROOT" >> "$GITHUB_ENV"
          mkdir "$NATIVE_ROOT"
          mkdir -p "$NATIVE_ROOT"/{evidence,home,tmp,config,cache,appdata,localappdata,hooks,bin}
          # Tool setup is finished. All test subprocesses inherit disposable profiles.
          export HOME="$NATIVE_ROOT/home" USERPROFILE="$NATIVE_ROOT/home"
          if [[ "$EXPECTED_OS" == windows ]]; then
            profile="$(cygpath -w "$HOME")"
            export HOMEDRIVE="${profile:0:2}" HOMEPATH="${profile:2}"
          fi
          export XDG_CONFIG_HOME="$NATIVE_ROOT/config" XDG_CACHE_HOME="$NATIVE_ROOT/cache"
          export XDG_DATA_HOME="$NATIVE_ROOT/home/data" XDG_STATE_HOME="$NATIVE_ROOT/home/state"
          export APPDATA="$NATIVE_ROOT/appdata" LOCALAPPDATA="$NATIVE_ROOT/localappdata"
          export TMPDIR="$NATIVE_ROOT/tmp" TMP="$NATIVE_ROOT/tmp" TEMP="$NATIVE_ROOT/tmp"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL="$NATIVE_ROOT/config/gitconfig"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0="$NATIVE_ROOT/hooks"
          export GIT_TERMINAL_PROMPT=0 GCM_INTERACTIVE=never TZ=UTC LC_ALL=C
          export GOENV=off GOWORK="$GITHUB_WORKSPACE/go.work"
          export GOCACHE="$NATIVE_ROOT/cache/go-build" GOMODCACHE="$NATIVE_ROOT/cache/go-modules"
          if [[ "$EXPECTED_OS" == windows ]]; then
            GOWORK="$(cygpath -m "$GOWORK")"
            export GOWORK
          fi
          export AUTHORING_NATIVE_BIN_DIR="$NATIVE_ROOT/bin"
          git rev-parse HEAD > "$NATIVE_ROOT/evidence/head.txt"
          test "$(cat "$NATIVE_ROOT/evidence/head.txt")" = "$EXPECTED_HEAD"
          go env -json GOOS GOARCH GOHOSTOS GOHOSTARCH GOVERSION GOROOT > "$NATIVE_ROOT/evidence/go-env.json"
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$EXPECTED_OS/$EXPECTED_ARCH"
          test "$(go env GOOS)/$(go env GOARCH)" = "$EXPECTED_OS/$EXPECTED_ARCH"
          test "$(go env GOVERSION)" = go1.25.13
          # Node is used only for generated JavaScript syntax checks (--check).
          unset NODE_OPTIONS NODE_PATH
          node --version > "$NATIVE_ROOT/evidence/node-version.txt"
          packages=(./install/integrationctl/agentplugins/adapters/packageview
            ./install/integrationctl/agentplugins/adapters/packagedigest
            ./install/integrationctl/agentplugins/conformance
            ./install/integrationctl/agentplugins/adapters/loader
            ./cli/plugin-kit-ai/internal/authoringcli
            ./cli/plugin-kit-ai/internal/authoring/...)
          go list -p 2 "${packages[@]}" > "$NATIVE_ROOT/evidence/packages.txt"
          # Resolve only lane/build Go dependencies before offline execution.
          go list -p 2 -deps -test "${packages[@]}" ./cli/plugin-kit-ai/cmd/{agentplugins,plugin-kit-ai} > "$NATIVE_ROOT/evidence/dependencies.txt"
          export GOPROXY=off GOSUMDB=off
          suffix=""; if [[ "$EXPECTED_OS" == windows ]]; then suffix=.exe; fi
          build_vcs=true
          if [[ "$EXPECTED_OS" == windows && "${{ github.event_name == 'pull_request' || inputs.windows_diagnostics }}" == true ]]; then
            # Generate outside checkout; apply to these actual binaries and tests,
            # never to a post-failure rerun. Preserve exact overlay with evidence.
            go run ./cli/plugin-kit-ai/internal/authoring/commands/testdata/native_diagnostics.go "$GITHUB_WORKSPACE" "$NATIVE_ROOT/evidence/diagnostics"
            export GOFLAGS="-overlay=$NATIVE_ROOT/evidence/diagnostics/overlay.json"
            # Fail the existing clean-VCS proof gate transparently for diagnostic
            # builds; an overlay must never masquerade as clean production proof.
            build_vcs=false
          fi
          command_package=github.com/777genius/plugin-kit-ai/cli/internal/authoring/commands
          for entry in agentplugins plugin-kit-ai; do
            go build -p 2 -buildvcs="$build_vcs" -trimpath -ldflags "-X $command_package.Enabled=vertical-slice-v1 -X $command_package.Revision=$EXPECTED_HEAD" \
              -o "$AUTHORING_NATIVE_BIN_DIR/$entry$suffix" "./cli/plugin-kit-ai/cmd/$entry"
            go version -m -json "$AUTHORING_NATIVE_BIN_DIR/$entry$suffix" > "$NATIVE_ROOT/evidence/$entry-build.json"
          done
          go test -p 2 -json -list '^Test' "${packages[@]}" > "$NATIVE_ROOT/evidence/test-discovery.json"
          # Only packageview's owned disposable filesystem fixtures run privileged
          # on Linux: CAP_MKNOD is required for three mandatory device gates.
          # Build unprivileged, then execute that single test binary with env -i.
          # No package/device payload is executed/opened; no real project is used.
          # All other suites stay unprivileged, preserving the permission-denial gate.
          if [[ "$EXPECTED_OS" == linux ]]; then
            go test -p 2 -c -o "$NATIVE_ROOT/bin/packageview.test" "${packages[0]}"
            selected=("${packages[@]:1}")
          else
            selected=("${packages[@]}")
          fi
          set +e
          go test -p 2 -json -count=1 -timeout=12m "${selected[@]}" > "$NATIVE_ROOT/evidence/go-test.json" 2> "$NATIVE_ROOT/evidence/go-test.stderr"
          result=$?
          if [[ "$EXPECTED_OS" == linux ]]; then
            go tool test2json -p github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/adapters/packageview \
              sudo -n env -i HOME="$HOME" USERPROFILE="$USERPROFILE" APPDATA="$APPDATA" LOCALAPPDATA="$LOCALAPPDATA" \
              XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" XDG_DATA_HOME="$XDG_DATA_HOME" XDG_STATE_HOME="$XDG_STATE_HOME" \
              TMPDIR="$TMPDIR" TMP="$TMP" TEMP="$TEMP" PATH=/usr/bin:/bin GOMAXPROCS=2 \
              "$NATIVE_ROOT/bin/packageview.test" -test.v=test2json -test.count=1 -test.timeout=3m \
              >> "$NATIVE_ROOT/evidence/go-test.json" 2>> "$NATIVE_ROOT/evidence/go-test.stderr"
            privileged_result=$?
            printf '%s\n' "$privileged_result" > "$NATIVE_ROOT/evidence/packageview-exit.txt"
            if [[ "$privileged_result" != 0 ]]; then result=$privileged_result; fi
          fi
          printf '%s\n' "$result" > "$NATIVE_ROOT/evidence/test-exit.txt"
          exit "$result"
      - name: Detach and remove only the owned Windows ARM64 VHDX
        if: always() && matrix.os == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: ./cli/plugin-kit-ai/internal/authoring/commands/testdata/windows_arm64_volume.ps1 -Mode Cleanup
      - name: Preserve disposable volume setup and cleanup evidence
        if: always() && matrix.os == 'windows' && matrix.arch == 'arm64' && env.AUTHORING_VOLUME_FIXTURE != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: authoring-volume-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.AUTHORING_VOLUME_FIXTURE }}/*.json
            ${{ env.AUTHORING_VOLUME_FIXTURE }}/*.txt
            ${{ env.AUTHORING_VOLUME_FIXTURE }}/*.log
          if-no-files-found: error
          retention-days: 14
      - name: Require structured native evidence (including skips and offline E2E)
        if: always()
        run: python scripts/check-authoring-native-results.py "$NATIVE_ROOT"
      - name: Preserve each host's evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # existing platform-proof pin
        with:
          name: authoring-native-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.NATIVE_ROOT }}/evidence
          if-no-files-found: error
          retention-days: 14
