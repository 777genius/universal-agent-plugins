name: PyPI Runtime Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact vX.Y.Z source tag for the retained PyPI runtime helper"
        required: true

jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == '777genius/universal-agent-plugins' && github.ref == 'refs/heads/main' && github.workflow_ref == '777genius/universal-agent-plugins/.github/workflows/pypi-runtime-publish.yml@refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Verify approved runtime tag and workflow source
        id: release
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          WORKFLOW_PATH: .github/workflows/pypi-runtime-publish.yml
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid retained runtime helper v1 tag: ${TAG}" >&2
            exit 1
          fi
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REPOSITORY}" = 777genius/universal-agent-plugins
          test "${GITHUB_REF}" = refs/heads/main
          test "${WORKFLOW_REF}" = "${GITHUB_REPOSITORY}/${WORKFLOW_PATH}@refs/heads/main"
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${WORKFLOW_SHA}"
          git fetch --no-tags --force origin \
            main:refs/remotes/origin/main \
            "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_commit="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main
          git merge-base --is-ancestor "${WORKFLOW_SHA}" refs/remotes/origin/main
          if ! git diff --quiet "${WORKFLOW_SHA}" "${tag_commit}" -- "${WORKFLOW_PATH}"; then
            echo "Runtime publish workflow content differs between the approved workflow revision and tag ${TAG}." >&2
            exit 1
          fi
          echo "commit=${tag_commit}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  publish-pypi-runtime:
    if: ${{ success() && github.event_name == 'workflow_dispatch' && needs.preflight.result == 'success' }}
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.commit }}

      - name: Revalidate approved revision before effects
        shell: bash
        env:
          COMMIT: ${{ needs.preflight.outputs.commit }}
          TAG: ${{ needs.preflight.outputs.tag }}
          WORKFLOW_PATH: .github/workflows/pypi-runtime-publish.yml
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin \
            main:refs/remotes/origin/main \
            "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_commit="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "${COMMIT}"
          test "${tag_commit}" = "${COMMIT}"
          git merge-base --is-ancestor "${COMMIT}" refs/remotes/origin/main
          git merge-base --is-ancestor "${WORKFLOW_SHA}" refs/remotes/origin/main
          git diff --quiet "${WORKFLOW_SHA}" "${COMMIT}" -- "${WORKFLOW_PATH}"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check PyPI trusted publishing readiness
        shell: bash
        env:
          PYPI_TRUSTED_PUBLISHING_READY: ${{ vars.PYPI_TRUSTED_PUBLISHING_READY }}
        run: |
          if [ "${PYPI_TRUSTED_PUBLISHING_READY}" != "true" ]; then
            echo "PYPI_TRUSTED_PUBLISHING_READY must be true before publishing plugin-kit-ai-runtime to PyPI." >&2
            exit 1
          fi

      - name: Stage PyPI runtime package
        shell: bash
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          version="${TAG#v}"
          stage="${RUNNER_TEMP}/plugin-kit-ai-runtime-pypi"
          rm -rf "${stage}"
          mkdir -p "${stage}"
          cp -R python/plugin-kit-ai-runtime/. "${stage}/"
          python3 - "$stage/src/plugin_kit_ai_runtime/__init__.py" "$version" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          version = sys.argv[2]
          body = path.read_text()
          updated = re.sub(r'__version__ = ".*"', f'__version__ = "{version}"', body, count=1)
          if updated == body:
              raise SystemExit(f"failed to rewrite version in {path}")
          path.write_text(updated)
          PY

      - name: Build PyPI runtime package
        shell: bash
        working-directory: ${{ runner.temp }}/plugin-kit-ai-runtime-pypi
        run: |
          python3 -m pip install --upgrade build
          python3 -m build

      - name: Smoke built PyPI runtime package as a consumer
        shell: bash
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          version="${TAG#v}"
          stage="${RUNNER_TEMP}/plugin-kit-ai-runtime-pypi"
          wheel="$(find "${stage}/dist" -name '*.whl' | head -n 1)"
          test -n "${wheel}"
          python3 -m venv "${RUNNER_TEMP}/plugin-kit-ai-runtime-pypi-smoke"
          source "${RUNNER_TEMP}/plugin-kit-ai-runtime-pypi-smoke/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install "${wheel}"
          RUNTIME_VERSION="${version}" python - <<'PY'
          import importlib.metadata
          import os
          from plugin_kit_ai_runtime import CLAUDE_STABLE_HOOKS, CodexApp, continue_

          assert importlib.metadata.version("plugin-kit-ai-runtime") == os.environ["RUNTIME_VERSION"]
          assert CLAUDE_STABLE_HOOKS
          app = CodexApp()
          app.on_notify(lambda event: continue_())
          assert callable(app.run)
          print("plugin-kit-ai-runtime PyPI prepublish smoke ok")
          PY

      - name: Publish runtime package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ runner.temp }}/plugin-kit-ai-runtime-pypi/dist
