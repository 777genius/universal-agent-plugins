name: Temporary Pi generated capabilities qualification 718
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  generate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/pi-user-native-attempt-regression-20261105' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: false
      - name: Generate canonical Pi capability output and record bytes
        shell: bash
        run: |
          set -euo pipefail
          cd cli
          go run ./cmd/genclientcapabilities
          go test ./cmd/genclientcapabilities -run '^TestGeneratedCapabilitiesAreCurrent$' -count=1
          cd ..
          echo "BEGIN_GENERATED_CAPABILITIES_B64"
          base64 -w0 landing/data/clientCapabilities.generated.json
          printf '\n'
          echo "END_GENERATED_CAPABILITIES_B64"
          echo "BEGIN_GENERATED_CAPABILITIES_DIFF"
          git diff -- landing/data/clientCapabilities.generated.json
          echo "END_GENERATED_CAPABILITIES_DIFF"
