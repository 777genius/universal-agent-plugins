name: Kimi 2.5.2 Project MCP preparation (no trust or model)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/kimi_stable_project_mcp_smoke.py'
      - 'scripts/test_kimi_stable_project_mcp_smoke.py'
      - '.github/workflows/kimi-stable-project-mcp-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kimi-252-mcp-prepared-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-prepared:
    name: Pinned Kimi 2.5.2 project MCP-only add/repeat/remove (Prepared)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify inert validation contracts
        run: python3 -m unittest discover -s scripts -p 'test_kimi_stable_project_mcp_smoke.py'
      - name: Install genuine publisher stable 2.5.2 and source-built UAP
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @moonshot-ai/kimi-code@2.5.2
          go build -trimpath -ldflags='-X main.version=0.1.102' -o "$RUNNER_TEMP/agentplugins-source" ./cli/cmd/agentplugins
      - name: Observe owned project MCP preparation without activation
        env:
          REPORT_DIR: ${{ runner.temp }}/kimi-mcp-prepared-proof
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          mkdir -p "$REPORT_DIR"
          python3 scripts/kimi_stable_project_mcp_smoke.py \
            --cli "$RUNNER_TEMP/agentplugins-source" \
            --client "$(command -v kimi)" \
            --report-dir "$REPORT_DIR"
      - name: Retain original prepared-only evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: kimi-stable-252-project-mcp-prepared
          path: ${{ runner.temp }}/kimi-mcp-prepared-proof/
          if-no-files-found: warn
          retention-days: 14
