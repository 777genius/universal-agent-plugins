name: Kimi 2.5.2 native MCP call without vendor auth
on:
  pull_request:
    paths:
      - '.github/workflows/kimi252-noauth-call.yml'
      - 'scripts/kimi252_noauth_*.py'
      - 'scripts/test_kimi252_noauth_call.py'
      - 'docs/plans/2026-11-12-kimi252-noauth-native-call.md'
      - 'scripts/kimi_252_native_web_mcp_probe.py'
      - 'scripts/kimi_stable_project_mcp_smoke.py'
      - 'scripts/grok_project_protocol_*.py'
      - 'scripts/native_client_research.py'
      - 'scripts/project_native_research.py'
      - 'repotests/testdata/agentplugins_native_probe/**'
      - 'install/integrationctl/agentplugins/clients/kimi/**'
      - 'install/integrationctl/agentplugins/clients/shared/**'
      - 'install/integrationctl/agentplugins/managedstdio/**'
      - 'cli/**'
      - 'go.work'
      - 'go.work.sum'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kimi252-noauth-call.yml'
      - 'scripts/kimi252_noauth_*.py'
      - 'scripts/test_kimi252_noauth_call.py'
      - 'docs/plans/2026-11-12-kimi252-noauth-native-call.md'
      - 'scripts/kimi_252_native_web_mcp_probe.py'
      - 'scripts/kimi_stable_project_mcp_smoke.py'
      - 'scripts/grok_project_protocol_*.py'
      - 'scripts/native_client_research.py'
      - 'scripts/project_native_research.py'
      - 'repotests/testdata/agentplugins_native_probe/**'
      - 'install/integrationctl/agentplugins/clients/kimi/**'
      - 'install/integrationctl/agentplugins/clients/shared/**'
      - 'install/integrationctl/agentplugins/managedstdio/**'
      - 'cli/**'
      - 'go.work'
      - 'go.work.sum'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kimi252-noauth-call-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-call:
    name: Genuine Kimi manual one-shot call and App lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    timeout-minutes: 30
    env:
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and inert contracts
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=normal)"
          python3 -m unittest discover -s scripts -p 'test_kimi252_noauth_call.py' -v
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build ordinary source App and existing Go MCP probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/kimi252-call-tools"
          go build -trimpath -ldflags='-X main.version=0.1.102' -o "$RUNNER_TEMP/kimi252-call-tools/agentplugins" ./cli/cmd/agentplugins
          go build -trimpath -o "$RUNNER_TEMP/kimi252-call-tools/probe" ./repotests/testdata/agentplugins_native_probe
          cp "$(command -v node)" "$RUNNER_TEMP/kimi252-call-tools/node"
          chmod 700 "$RUNNER_TEMP/kimi252-call-tools/node"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Run pinned native call and complete installed lifecycle without vendor auth
        run: |
          python3 scripts/kimi252_noauth_call_e2e.py \
            --installer "$RUNNER_TEMP/kimi252-call-tools/agentplugins" \
            --probe "$RUNNER_TEMP/kimi252-call-tools/probe" \
            --node "$RUNNER_TEMP/kimi252-call-tools/node" \
            --output "$RUNNER_TEMP/kimi252-native-call-evidence"
      - name: Retain original bounded native proof even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: kimi252-native-noauth-call-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/kimi252-native-call-evidence/evidence.json
          if-no-files-found: error
          retention-days: 14
