name: Skills picker

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: skills-picker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills-picker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/skills-picker/package-lock.json
      - name: Install reproducible UI tooling
        working-directory: ui/skills-picker
        run: npm ci
      - name: Verify generated transport contract
        run: node contracts/skills-picker/generate.mts --check
      - name: Check critical selection policy
        working-directory: ui/skills-picker
        run: npm run test:model
      - name: Build production assets into Go package
        working-directory: ui/skills-picker
        run: npm run bundle:go
      - name: Install browser
        working-directory: ui/skills-picker
        run: npx playwright install --with-deps chromium
      - name: Verify browser UX and real Go bridge lifecycle
        working-directory: ui/skills-picker
        env:
          UAP_SKILLS_LIVE: '1'
          GIT_CONFIG_NOSYSTEM: '1'
        run: npm test
      - name: Verify concurrent transport and public CLI
        working-directory: cli
        run: |
          go test -race -count=1 -timeout=3m ./internal/agentpluginscli/skillspicker
          go test -count=1 -timeout=3m ./internal/agentpluginscli -run '^TestSkills(FullCLIEndToEnd|Batch)'
