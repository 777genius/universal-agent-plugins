name: Temporary Windows console diagnostics
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Temporary investigation: remove or convert after the root cause is proven.
# Diagnostic evidence does not qualify a standard authoring release.
jobs:
  diagnostics:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve repository line endings before checkout
        run: |
          git config --global core.autocrlf false
          exit $LASTEXITCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.13'
          cache: false
      - name: Create disposable build profile and evidence directory
        run: |
          $root = Join-Path $env:RUNNER_TEMP ("console-diagnostic-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Force $root | Out-Null
          foreach ($key in @('HOME', 'USERPROFILE', 'APPDATA', 'LOCALAPPDATA', 'XDG_CONFIG_HOME', 'XDG_CACHE_HOME', 'XDG_DATA_HOME', 'XDG_STATE_HOME', 'XDG_RUNTIME_DIR', 'TMP', 'TEMP', 'GOCACHE', 'GOMODCACHE')) {
            $dir = Join-Path $root $key
            New-Item -ItemType Directory -Force $dir | Out-Null
            "$key=$dir" >> $env:GITHUB_ENV
          }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/windows-diagnostic-evidence" | Out-Null
      - name: Build tagged diagnostic test binary
        id: build
        timeout-minutes: 3
        working-directory: cli/plugin-kit-ai
        run: |
          go test -c -tags terminaldiagnostic -o "$env:RUNNER_TEMP/windows-console-diagnostic.test.exe" ./internal/promptio 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-diagnostic-evidence/build.log"
          $code = $LASTEXITCODE
          @{ exit = $code } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/windows-diagnostic-evidence/build-status.json"
          exit $code
      - name: Run all five isolated controls
        timeout-minutes: 5
        run: |
          python scripts/terminal-ui/windows_cancel_diagnostic.py --repo "$env:GITHUB_WORKSPACE" --binary "$env:RUNNER_TEMP/windows-console-diagnostic.test.exe" --artifacts "$env:RUNNER_TEMP/windows-diagnostic-evidence/controls" --control consecutive --control pre-canceled --control timed-cancel --control native-inherited --control native-duplicate 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-diagnostic-evidence/driver.log"
          $code = $LASTEXITCODE
          @{ exit = $code } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/windows-diagnostic-evidence/driver-status.json"
          exit $code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-console-diagnostics
          path: ${{ runner.temp }}/windows-diagnostic-evidence
          if-no-files-found: warn
