name: Windows atomic publication diagnostic

on:
  push:
    branches: [fix/project-windows-atomic-20261025]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.10'
          cache: false
      - name: Record exact source and toolchain
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/windows-atomic-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/windows-atomic-evidence/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/windows-atomic-evidence/tree.txt"
          go version > "$RUNNER_TEMP/windows-atomic-evidence/go-version.txt"
      - name: Qualify exact publication and refusal contracts once
        shell: bash
        run: |
          go test -count=1 -timeout=2m -v ./install/integrationctl/adapters/atomicfile ./install/integrationctl/agentplugins/adapters/securityscan -run '^(TestWindowsAtomicPublicationHeldReaders|TestWindowsAtomicPublicationRefusals|TestWindowsAtomicPublicationUnicodeLongPath|TestWindowsAtomicPublicationSecurityCache)$' 2>&1 | tee "$RUNNER_TEMP/windows-atomic-evidence/tests.log"
          python - "$RUNNER_TEMP/windows-atomic-evidence/tests.log" <<'PY'
          import pathlib, re, sys
          body = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          expected = {
              "TestWindowsAtomicPublicationHeldReaders",
              "TestWindowsAtomicPublicationRefusals",
              "TestWindowsAtomicPublicationUnicodeLongPath",
              "TestWindowsAtomicPublicationSecurityCache",
          }
          passed = re.findall(r"^--- PASS: (\w+) \(", body, re.MULTILINE)
          if set(passed) != expected or len(passed) != len(expected) or re.search(r"--- (SKIP|FAIL):", body):
              raise SystemExit("all four exact publication contracts must pass without skips")
          PY
      - name: Preserve raw observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-atomic-publication
          path: ${{ runner.temp }}/windows-atomic-evidence
          if-no-files-found: error
