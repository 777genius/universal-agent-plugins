name: Skills source resolution

on:
  pull_request:
    paths:
      - 'internal/skillsresolve/**'
      - 'internal/skillscatalog/**'
      - 'cmd/skills-catalog-api/**'
      - 'install/integrationctl/agentplugins/adapters/skillsource/**'
      - 'install/integrationctl/agentplugins/adapters/sourceacquisition/**'
      - 'install/integrationctl/adapters/process/**'
      - 'deploy/skills-catalog-api/**'
      - 'docs/contracts/skills-resolve.openapi.yaml'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/skills-resolve.yml'
  push:
    branches: [main]
    paths:
      - 'internal/skillsresolve/**'
      - 'internal/skillscatalog/**'
      - 'cmd/skills-catalog-api/**'
      - 'install/integrationctl/agentplugins/adapters/skillsource/**'
      - 'install/integrationctl/agentplugins/adapters/sourceacquisition/**'
      - 'install/integrationctl/adapters/process/**'
      - 'deploy/skills-catalog-api/**'
      - 'docs/contracts/skills-resolve.openapi.yaml'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/skills-resolve.yml'

permissions:
  contents: read

concurrency:
  # PR checks replace superseded work; each main run retains exact-commit activation evidence.
  group: skills-resolve-${{ github.event_name }}-${{ github.event_name == 'pull_request' && (github.event.pull_request.number || github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-and-runtime:
    # The deployment probe requires a VM booted with systemd as PID 1.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Qualify source adapter and anonymous catalog
        run: |
          go test -race -count=1 ./internal/skillsresolve/... ./internal/skillscatalog
          go test -count=1 ./install/integrationctl/agentplugins/adapters/skillsource
          go test -count=1 ./install/integrationctl/agentplugins/adapters/sourceacquisition -run '^TestGitCleanupEvidence'
          GOWORK=off CGO_ENABLED=0 go build -mod=readonly -trimpath -buildvcs=false -o "$RUNNER_TEMP/skills-catalog-api" ./cmd/skills-catalog-api
          sha256sum "$RUNNER_TEMP/skills-catalog-api"
      - name: Verify real runtime envelope and disk exhaustion
        run: |
          set -eu
          RUNTIME_PROBE_DIR=$(mktemp -d "$RUNNER_TEMP/skills-resolve-runtime.XXXXXX")
          trap 'docker image rm uap-resolve-runtime-probe >/dev/null 2>&1 || true; rm -rf "$RUNTIME_PROBE_DIR"' EXIT
          CGO_ENABLED=0 go test -c -o "$RUNTIME_PROBE_DIR/probe" ./internal/skillsresolve/gitsource
          cat > "$RUNTIME_PROBE_DIR/Dockerfile" <<'DOCKERFILE'
          FROM scratch
          COPY probe /probe
          USER 65532:65532
          ENTRYPOINT ["/probe", "-test.v", "-test.run=^TestHostedRuntimeEnvelopeAndDiskExhaustion$"]
          DOCKERFILE
          docker build --network=none -t uap-resolve-runtime-probe "$RUNTIME_PROBE_DIR"
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --memory=512m --memory-swap=512m --pids-limit=64 --cpus=1 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777 \
            -e UAP_RESOLVE_RUNTIME_PROBE=1 uap-resolve-runtime-probe
      - name: Verify deployment unit with real systemd and bounded scratch
        run: |
          set -eu
          SYSTEMD_PROBE_NAME="uap-rp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SYSTEMD_PROBE_DIR="/opt/$SYSTEMD_PROBE_NAME"
          SYSTEMD_PROBE_UNIT="/run/systemd/system/$SYSTEMD_PROBE_NAME.service"
          cleanup() {
            sudo systemctl stop "$SYSTEMD_PROBE_NAME.service" || true
            sudo rm -f "$SYSTEMD_PROBE_UNIT"
            sudo rm -rf "$SYSTEMD_PROBE_DIR"
            sudo systemctl daemon-reload
          }
          trap cleanup EXIT
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/systemd-resolver-probe" ./internal/skillsresolve/gitsource
          sudo install -d -m 0755 "$SYSTEMD_PROBE_DIR"
          sudo install -m 0755 "$RUNNER_TEMP/systemd-resolver-probe" "$SYSTEMD_PROBE_DIR/probe"
          sed \
            -e "s|^WorkingDirectory=.*|WorkingDirectory=$SYSTEMD_PROBE_DIR|" \
            -e "s|^ExecStart=.*|ExecStart=$SYSTEMD_PROBE_DIR/probe -test.v -test.run=^TestHostedRuntimeEnvelopeAndDiskExhaustion$|" \
            -e "s|^User=.*|User=$SYSTEMD_PROBE_NAME|" \
            -e '/^StateDirectory=/d' \
            -e '/^EnvironmentFile=/d' \
            -e 's/^Restart=.*/Restart=no/' \
            deploy/skills-catalog-api/uap-skills-catalog.service > "$RUNNER_TEMP/systemd-resolver-probe.service"
          printf '\n[Service]\nEnvironment=UAP_RESOLVE_RUNTIME_PROBE=1\n' >> "$RUNNER_TEMP/systemd-resolver-probe.service"
          sudo install -m 0644 "$RUNNER_TEMP/systemd-resolver-probe.service" "$SYSTEMD_PROBE_UNIT"
          sudo systemctl daemon-reload
          if ! sudo systemctl start --wait "$SYSTEMD_PROBE_NAME.service"; then
            sudo journalctl -u "$SYSTEMD_PROBE_NAME.service" --no-pager
            exit 1
          fi
          sudo journalctl -u "$SYSTEMD_PROBE_NAME.service" --no-pager
