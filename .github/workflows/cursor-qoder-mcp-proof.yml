name: Cursor Qoder MCP call proof contracts

on:
  pull_request:
    paths:
      - 'scripts/project_native_missing_call_proof.py'
      - 'scripts/project_native_missing_call_runner.py'
      - 'scripts/test_project_native_missing_call_proof.py'
      - 'scripts/test_project_native_missing_call_runner.py'
      - '.github/workflows/cursor-qoder-mcp-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cursor-qoder-mcp-proof-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server-receipts:
    name: Reject missing or synthetic server-side MCP receipts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run fail-closed receipt contract tests
        run: python3 -m unittest discover -s scripts -p 'test_project_native_missing_call_*.py' -v
