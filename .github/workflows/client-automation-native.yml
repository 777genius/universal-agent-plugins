name: Client automation native admission
on:
  pull_request:
    paths:
      - 'scripts/client_automation_native_probe.py'
      - 'scripts/test_client_automation_native_probe.py'
      - 'scripts/grok_acp_inventory_admission.py'
      - 'scripts/grok_acp_bootstrap.py'
      - 'scripts/test_grok_acp_inventory_admission.py'
      - 'install/integrationctl/research/grokacpinventory/**'
      - 'scripts/devin_structured_inventory_admission.py'
      - 'scripts/test_devin_structured_inventory_admission.py'
      - 'scripts/devin_ordinary_metadata_admission.py'
      - 'scripts/test_devin_ordinary_metadata_admission.py'
      - 'scripts/devin_global_lifecycle_admission.py'
      - 'scripts/test_devin_global_lifecycle_admission.py'
      - '.github/workflows/client-automation-native.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/client_automation_native_probe.py'
      - 'scripts/test_client_automation_native_probe.py'
      - 'scripts/grok_acp_inventory_admission.py'
      - 'scripts/grok_acp_bootstrap.py'
      - 'scripts/test_grok_acp_inventory_admission.py'
      - 'install/integrationctl/research/grokacpinventory/**'
      - 'scripts/devin_structured_inventory_admission.py'
      - 'scripts/test_devin_structured_inventory_admission.py'
      - 'scripts/devin_ordinary_metadata_admission.py'
      - 'scripts/test_devin_ordinary_metadata_admission.py'
      - 'scripts/devin_global_lifecycle_admission.py'
      - 'scripts/test_devin_global_lifecycle_admission.py'
      - '.github/workflows/client-automation-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-automation-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  native-api:
    name: Native API research (${{ matrix.client }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        client: [cline, grok]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test native identity decoder and no-alias fixture contracts
        run: python3 -m unittest discover -s scripts -p 'test_client_automation_native_probe.py' -v
      - name: Capture pinned official CLI behavior in disposable profiles
        run: |
          python3 scripts/client_automation_native_probe.py \
            --client '${{ matrix.client }}' \
            --output "$RUNNER_TEMP/native-api-${{ matrix.client }}"
      - name: Preserve original research evidence (not product acceptance)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: automation-native-${{ matrix.client }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-api-${{ matrix.client }}/native-api.json
          if-no-files-found: error
          retention-days: 14
  devin-inventory:
    name: Devin 3000.12.57 structured inventory research
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AGENTPLUGINS_NATIVE_DISPOSABLE_HOSTED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test bounded metadata capture and preservation contracts
        run: python3 -m unittest discover -s scripts -p 'test_devin_structured_inventory_admission.py' -v
      - name: Capture pinned official JSON inventory without authentication
        run: |
          python3 scripts/devin_structured_inventory_admission.py \
            --output "$RUNNER_TEMP/devin-structured-inventory"
      - name: Preserve original metadata research evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: devin-structured-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/devin-structured-inventory/upload/research.zip
          if-no-files-found: error
          retention-days: 14

  devin-ordinary-inventory:
    name: Devin 3000.12.57 ordinary local-policy metadata research
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AGENTPLUGINS_NATIVE_DISPOSABLE_HOSTED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test private and ordinary metadata preservation contracts
        run: python3 -m unittest discover -s scripts -p 'test_devin_*admission.py' -v
      - name: Capture pinned ordinary inventory in an authored local-policy profile
        run: |
          python3 scripts/devin_ordinary_metadata_admission.py \
            --output "$RUNNER_TEMP/devin-ordinary-inventory"
      - name: Preserve original ordinary metadata research evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: devin-ordinary-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/devin-ordinary-inventory/upload/research.zip
          if-no-files-found: error
          retention-days: 14

  devin-global-lifecycle:
    name: Devin ordinary Global public CLI lifecycle (research)
    needs: devin-ordinary-inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AGENTPLUGINS_NATIVE_DISPOSABLE_HOSTED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache: false
      - name: Test Global lifecycle contracts
        run: python3 -m unittest discover -s scripts -p 'test_devin_*admission.py' -v
      - name: Build with bounded original receipts and observe public Global lifecycle
        run: |
          python3 scripts/devin_global_lifecycle_admission.py \
            --installer "$RUNNER_TEMP/devin-uap" --output "$RUNNER_TEMP/devin-global-lifecycle"
      - name: Preserve original Global lifecycle evidence without runtime qualification
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: devin-global-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/devin-global-lifecycle/upload/research.zip
          if-no-files-found: error
          retention-days: 14

  grok-acp-inventory:
    name: Grok 1.0.70 isolated ACP metadata research
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AGENTPLUGINS_NATIVE_DISPOSABLE_HOSTED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.11
          cache: false
      - name: Inert ACP framing, ownership and strict helper contracts
        run: |
          python3 -m unittest discover -s scripts -p 'test_grok_acp_inventory_admission.py' -v
          cd install/integrationctl
          go test ./research/grokacpinventory -count=1
      - name: Capture only pinned isolated metadata with native syntax admission
        id: grok_capture
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess, sys, tempfile
          sys.path.insert(0, str(pathlib.Path.cwd() / 'scripts'))
          import grok_acp_inventory_admission as capture
          from native_client_research import run_probe
          temporary = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          output = temporary / 'grok-acp-inventory'
          diagnostic_deadline = __import__('time').monotonic() + 180
          record, stdout, stderr = run_probe([sys.executable, 'scripts/grok_acp_inventory_admission.py', '--output', str(output)],
              pathlib.Path.cwd(), dict(os.environ), temporary, 'grok-acp-frontend', timeout=180, limit=1 << 20, memory_only=True)
          if record['error'] is not None or record['exit'] not in (0, 1):
              raise SystemExit('Frontend did not prove bounded completion; no upload admitted')
          packet = capture.frontend_packet(stdout, record['exit'])
          destination = pathlib.Path(tempfile.mkdtemp(prefix='grok-acp-admitted-', dir=temporary))
          destination.rmdir()
          expected_tree = subprocess.check_output(['/usr/bin/git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          diagnostics = []
          admitted = capture.admit_publication(output, packet, os.environ['EXPECTED_COMMIT'], expected_tree, destination,
              diagnostics=diagnostics, diagnostic_deadline=diagnostic_deadline)
          print('GROK_READOUT=' + __import__('json').dumps(diagnostics[0], separators=(',', ':')))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('admitted=' + str(admitted) + '\n' + 'observation_exit=' + str(record['exit']) + '\n')
          PYTHON
      - name: Require complete native metadata observation
        if: ${{ steps.grok_capture.conclusion == 'success' }}
        env:
          OBSERVATION_EXIT: ${{ steps.grok_capture.outputs.observation_exit }}
        run: python3 -c "import os; raise SystemExit(0 if os.environ['OBSERVATION_EXIT'] == '0' else 1)"
      - name: Preserve closed original metadata evidence without qualification
        if: ${{ always() && steps.grok_capture.conclusion == 'success' && steps.grok_capture.outputs.admitted != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: grok-acp-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.grok_capture.outputs.admitted }}
          if-no-files-found: error
          retention-days: 14

  grok-acp-session:
    needs: grok-acp-inventory
    name: Grok 1.0.70 session-only effect measurement
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AGENTPLUGINS_NATIVE_DISPOSABLE_HOSTED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.11
          cache: false
      - name: Inert ACP framing, ownership and strict helper contracts
        run: |
          python3 -m unittest discover -s scripts -p 'test_grok_acp_inventory_admission.py' -v
          cd install/integrationctl
          go test ./research/grokacpinventory -count=1
      - name: Measure one native session without prompt, action or trust
        id: session_capture
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess, sys, tempfile
          sys.path.insert(0, str(pathlib.Path.cwd() / 'scripts'))
          import grok_acp_inventory_admission as capture
          from native_client_research import run_probe
          temporary = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          output = temporary / 'grok-acp-session'
          diagnostic_deadline = __import__('time').monotonic() + 180
          record, stdout, stderr = run_probe([sys.executable, 'scripts/grok_acp_inventory_admission.py', '--output', str(output), '--session-only'],
              pathlib.Path.cwd(), dict(os.environ), temporary, 'grok-session-frontend', timeout=180, limit=1 << 20, memory_only=True)
          if record['error'] is not None or record['exit'] not in (0, 1):
              raise SystemExit('Frontend did not prove bounded completion; no upload admitted')
          packet = capture.frontend_packet(stdout, record['exit'])
          destination = pathlib.Path(tempfile.mkdtemp(prefix='grok-session-admitted-', dir=temporary))
          destination.rmdir()
          expected_tree = subprocess.check_output(['/usr/bin/git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          diagnostics = []
          admitted = capture.admit_publication(output, packet, os.environ['EXPECTED_COMMIT'], expected_tree, destination,
              diagnostics=diagnostics, diagnostic_deadline=diagnostic_deadline, mode=capture.SESSION_MODE)
          print('GROK_SESSION_READOUT=' + __import__('json').dumps(diagnostics[0], separators=(',', ':')))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('admitted=' + str(admitted) + '\n' + 'observation_exit=' + str(record['exit']) + '\n')
          PYTHON
      - name: Keep first session measurement unqualified
        if: ${{ steps.session_capture.conclusion == 'success' }}
        env:
          OBSERVATION_EXIT: ${{ steps.session_capture.outputs.observation_exit }}
        run: python3 -c "import os; raise SystemExit(0 if os.environ['OBSERVATION_EXIT'] == '0' else 1)"
      - name: Preserve closed original session measurement without qualification
        if: ${{ always() && steps.session_capture.conclusion == 'success' && steps.session_capture.outputs.admitted != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: grok-acp-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.session_capture.outputs.admitted }}
          if-no-files-found: error
          retention-days: 14

  grok-config-lock:
    needs: grok-acp-inventory
    name: Grok 1.0.70 native config lock qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AGENTPLUGINS_NATIVE_DISPOSABLE_HOSTED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.11
          cache: false
      - name: Inert ACP framing, ownership and strict helper contracts
        run: |
          python3 -m unittest discover -s scripts -p 'test_grok_acp_inventory_admission.py' -v
          cd install/integrationctl
          go test ./research/grokacpinventory -count=1
      - name: Measure held and released native config writer without plugin enable
        id: lock_capture
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess, sys, tempfile
          sys.path.insert(0, str(pathlib.Path.cwd() / 'scripts'))
          import grok_acp_inventory_admission as capture
          from native_client_research import run_probe
          temporary = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          output = temporary / 'grok-config-lock'
          diagnostic_deadline = __import__('time').monotonic() + 180
          record, stdout, stderr = run_probe([sys.executable, 'scripts/grok_acp_inventory_admission.py', '--output', str(output), '--lock-qualification'],
              pathlib.Path.cwd(), dict(os.environ), temporary, 'grok-lock-frontend', timeout=180, limit=1 << 20, memory_only=True)
          if record['error'] is not None or record['exit'] not in (0, 1):
              raise SystemExit('Frontend did not prove bounded completion; no upload admitted')
          packet = capture.frontend_packet(stdout, record['exit'])
          destination = pathlib.Path(tempfile.mkdtemp(prefix='grok-lock-admitted-', dir=temporary))
          destination.rmdir()
          expected_tree = subprocess.check_output(['/usr/bin/git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          diagnostics = []
          admitted = capture.admit_publication(output, packet, os.environ['EXPECTED_COMMIT'], expected_tree, destination,
              diagnostics=diagnostics, diagnostic_deadline=diagnostic_deadline, mode=capture.LOCK_MODE)
          print('GROK_LOCK_READOUT=' + __import__('json').dumps(diagnostics[0], separators=(',', ':')))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('admitted=' + str(admitted) + '\n' + 'observation_exit=' + str(record['exit']) + '\n')
          PYTHON
      - name: Keep first lock measurement unqualified
        if: ${{ steps.lock_capture.conclusion == 'success' }}
        env:
          OBSERVATION_EXIT: ${{ steps.lock_capture.outputs.observation_exit }}
        run: python3 -c "import os; raise SystemExit(0 if os.environ['OBSERVATION_EXIT'] == '0' else 1)"
      - name: Preserve closed original lock measurement without qualification
        if: ${{ always() && steps.lock_capture.conclusion == 'success' && steps.lock_capture.outputs.admitted != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: grok-config-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.lock_capture.outputs.admitted }}
          if-no-files-found: error
          retention-days: 14
