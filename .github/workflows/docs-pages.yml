name: Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Keep docs on its own packageManager; landing uses a newer lockfile format.
      - uses: pnpm/action-setup@v5
        id: pnpm-docs
        with:
          package_json_file: website/package.json
          dest: ${{ runner.temp }}/pnpm-docs

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: landing/package.json
          dest: ${{ runner.temp }}/pnpm-landing

      - uses: actions/setup-node@v6
        with:
          node-version: "22.21.1"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
          cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install landing toolchain
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Install docs toolchain
        working-directory: website
        run: |
          export PATH="${{ steps.pnpm-docs.outputs.bin_dest }}:$PATH"
          pnpm install --frozen-lockfile

      - name: Install pinned docs generators
        run: |
          python -m venv "${RUNNER_TEMP}/docs-tools-root/python-venv"
          "${RUNNER_TEMP}/docs-tools-root/python-venv/bin/pip" install --require-hashes -r "${GITHUB_WORKSPACE}/website/tools/pydoc-markdown-requirements.txt"
          mkdir -p "${RUNNER_TEMP}/docs-tools-root/bin"
          GOBIN="${RUNNER_TEMP}/docs-tools-root/bin" go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v1.1.0

      - name: Prepare immutable authoring source
        run: |
          source_sha=$(node --input-type=module -e 'import { acceptedAuthoringSHA } from "./website/tools/lib/source-contract.mjs"; process.stdout.write(acceptedAuthoringSHA)')
          git clone --no-local --no-checkout . "${RUNNER_TEMP}/docs-authoring-source"
          git -C "${RUNNER_TEMP}/docs-authoring-source" checkout --quiet --detach "$source_sha"
          chmod -R a-w "${RUNNER_TEMP}/docs-authoring-source"
          echo "DOCS_AUTHORING_CHECKOUT=${RUNNER_TEMP}/docs-authoring-source" >> "$GITHUB_ENV"

      - name: Warm Go module cache for offline docs generation
        env:
          GOCACHE: ${{ runner.temp }}/docs-consumer-gocache
          GOMODCACHE: ${{ runner.temp }}/docs-consumer-gomodcache
        run: |
          cd "$DOCS_AUTHORING_CHECKOUT"
          GOWORK="$DOCS_AUTHORING_CHECKOUT/go.work" go build -p 2 -o "$RUNNER_TEMP/docs-authoring-preflight" ./cli/plugin-kit-ai/tools/authoring-docs

      # Keep the renamed CLI Pages site self-contained: every deployment carries
      # a verified, byte-exact compatibility copy of the registry feeds. This
      # prevents the normal Pages workflow from overwriting a previous mirror
      # deployment with a site that only contains the landing page and docs.
      - name: Verify and stage signed registry feeds
        env:
          REGISTRY_REPOSITORY: 777genius/universal-agent-plugins-registry
          PAGES_ORIGIN: https://777genius.github.io/universal-agent-plugins-registry/
        run: |
          previous="${RUNNER_TEMP}/uap-previous-mirror.json"
          if ! curl --fail --silent --show-error --location --max-time 30 \
            "${PAGES_ORIGIN%/}/MIRROR_METADATA.json" > "$previous"; then
            rm -f "$previous"
          fi
          go run ./cmd/agentplugins-registry-mirror \
            --registry-repository "$REGISTRY_REPOSITORY" \
            --pages-origin "$PAGES_ORIGIN" \
            --previous-marker "$previous" \
            --output "${RUNNER_TEMP}/uap-registry-mirror"
          mkdir -p landing/public
          cp -a "${RUNNER_TEMP}/uap-registry-mirror/." landing/public/

      - name: Build landing
        env:
          NUXT_APP_BASE_URL: /universal-agent-plugins/
          NUXT_PUBLIC_SITE_URL: https://777genius.github.io/universal-agent-plugins
          NUXT_PUBLIC_GITHUB_REPO: 777genius/universal-agent-plugins
          NUXT_PUBLIC_DOCS_URL: https://777genius.github.io/universal-agent-plugins/docs/en/
          NUXT_PUBLIC_QUICKSTART_URL: https://777genius.github.io/universal-agent-plugins/docs/en/guide/quickstart.html
          NUXT_PUBLIC_DOCS_SITEMAP_URL: https://777genius.github.io/universal-agent-plugins/docs/sitemap.xml
        working-directory: landing
        run: pnpm generate

      - name: Build public docs under /docs
        env:
          DOCS_BASE_PATH: /universal-agent-plugins/docs/
          DOCS_HOSTNAME: https://777genius.github.io
          GOCACHE: ${{ runner.temp }}/docs-consumer-gocache
          GOMODCACHE: ${{ runner.temp }}/docs-consumer-gomodcache
          DOCS_TOOLS_ROOT: ${{ runner.temp }}/docs-tools-root
          DOCS_GOMARKDOC: ${{ runner.temp }}/docs-tools-root/bin/gomarkdoc
          TMPDIR: ${{ runner.temp }}
          GOWORK: ${{ github.workspace }}/go.work
          GOPROXY: "off"
          GOSUMDB: "off"
          GOENV: "off"
          GOTOOLCHAIN: "local"
          GOMAXPROCS: "2"
        working-directory: website
        run: |
          export PATH="${{ steps.pnpm-docs.outputs.bin_dest }}:$PATH"
          pnpm run docs:build

      - name: Assemble GitHub Pages artifact
        env:
          UAP_VERIFIED_MIRROR: ${{ runner.temp }}/uap-registry-mirror
          NUXT_APP_BASE_URL: /universal-agent-plugins/
          NUXT_PUBLIC_SITE_URL: https://777genius.github.io/universal-agent-plugins
        working-directory: landing
        run: pnpm run build:pages

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
