name: Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      github_hosted:
        description: Use the original GitHub-hosted Ubuntu runners for this manual run
        type: boolean
        required: false
        default: false
      expected_sha:
        description: Exact workflow/control commit; required with github_hosted
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # A new production push supersedes stale queued releases on the same Pages environment.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ${{ (github.event_name == 'push' || inputs.github_hosted) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Validate requested source commit before checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          HOSTED_FALLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.github_hosted }}
        run: |
          set -euo pipefail
          if [[ "$HOSTED_FALLBACK" == true && -z "$EXPECTED_SHA" ]]; then
            echo "github_hosted requires expected_sha" >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_SHA" ]]; then
            if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "expected_sha must be a full lowercase 40-character commit SHA" >&2
              exit 1
            fi
            if [[ "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
              echo "expected_sha does not match the workflow source commit" >&2
              exit 1
            fi
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select immutable accepted production site source
        run: python3 scripts/production_site_source.py select "$GITHUB_WORKSPACE" "$RUNNER_TEMP/production-site-control"

      # Network-facing feed verification uses the patched control compiler.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.11"
          cache: false

      # Keep the renamed CLI Pages site self-contained: every deployment carries
      # a verified, byte-exact compatibility copy of the registry feeds. This
      # prevents the normal Pages workflow from overwriting a previous mirror
      # deployment with a site that only contains the landing page and docs.
      - name: Verify and stage signed registry feeds
        env:
          GOTOOLCHAIN: local
          REGISTRY_REPOSITORY: 777genius/universal-agent-plugins-registry
          PAGES_ORIGIN: https://777genius.github.io/universal-agent-plugins-registry/
          PRODUCT_PAGES_ORIGIN: https://universal-agent-plugins.com/
        run: |
          go version
          test "$(go env GOVERSION)" = go1.26.11
          previous="${RUNNER_TEMP}/uap-previous-mirror.json"
          if ! curl --fail --silent --show-error --location --max-time 30 \
            "${PRODUCT_PAGES_ORIGIN%/}/MIRROR_METADATA.json" > "$previous"; then
            rm -f "$previous"
          fi
          go run ./cmd/agentplugins-registry-mirror \
            --registry-repository "$REGISTRY_REPOSITORY" \
            --pages-origin "$PAGES_ORIGIN" \
            --previous-marker "$previous" \
            --output "${RUNNER_TEMP}/uap-registry-mirror"
          mkdir -p landing/public
          cp -a "${RUNNER_TEMP}/uap-registry-mirror/." landing/public/

      # Offline docs retain the compiler declared by the accepted site source.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # Keep docs on its own packageManager; landing uses a newer lockfile format.
      - uses: pnpm/action-setup@v5
        id: pnpm-docs
        with:
          package_json_file: website/package.json
          dest: ${{ runner.temp }}/pnpm-docs

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: landing/package.json
          dest: ${{ runner.temp }}/pnpm-landing

      - uses: actions/setup-node@v6
        with:
          node-version: "22.21.1"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install landing toolchain
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Install docs toolchain
        working-directory: website
        run: |
          export PATH="${{ steps.pnpm-docs.outputs.bin_dest }}:$PATH"
          pnpm install --frozen-lockfile

      - name: Install pinned docs generators
        run: |
          python -m venv "${RUNNER_TEMP}/docs-tools-root/python-venv"
          "${RUNNER_TEMP}/docs-tools-root/python-venv/bin/pip" install --require-hashes -r "${GITHUB_WORKSPACE}/website/tools/pydoc-markdown-requirements.txt"
          mkdir -p "${RUNNER_TEMP}/docs-tools-root/bin"
          GOBIN="${RUNNER_TEMP}/docs-tools-root/bin" go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v1.1.0

      - name: Prepare immutable authoring source
        run: |
          source_sha=$(node --input-type=module -e 'import { acceptedAuthoringSHA } from "./website/tools/lib/source-contract.mjs"; process.stdout.write(acceptedAuthoringSHA)')
          git clone --no-local --no-checkout . "${RUNNER_TEMP}/docs-authoring-source"
          git -C "${RUNNER_TEMP}/docs-authoring-source" checkout --quiet --detach "$source_sha"
          chmod -R a-w "${RUNNER_TEMP}/docs-authoring-source"
          echo "DOCS_AUTHORING_CHECKOUT=${RUNNER_TEMP}/docs-authoring-source" >> "$GITHUB_ENV"

      - name: Warm Go module cache for offline docs generation
        env:
          GOCACHE: ${{ runner.temp }}/docs-consumer-gocache
          GOMODCACHE: ${{ runner.temp }}/docs-consumer-gomodcache
        run: |
          cd "$DOCS_AUTHORING_CHECKOUT"
          GOWORK="$DOCS_AUTHORING_CHECKOUT/go.work" go build -p 2 -o "$RUNNER_TEMP/docs-authoring-preflight" ./cli/plugin-kit-ai/tools/authoring-docs

      - name: Install Chromium for static social preview
        working-directory: landing
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Build landing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUXT_APP_BASE_URL: /
          NUXT_PUBLIC_SITE_URL: https://universal-agent-plugins.com
          NUXT_PUBLIC_GITHUB_REPO: 777genius/universal-agent-plugins
          NUXT_PUBLIC_DOCS_URL: https://universal-agent-plugins.com/docs/en/
          NUXT_PUBLIC_QUICKSTART_URL: https://universal-agent-plugins.com/docs/en/guide/quickstart.html
          NUXT_PUBLIC_DOCS_SITEMAP_URL: https://universal-agent-plugins.com/docs/sitemap.xml
          NUXT_PUBLIC_REGISTRY_PAGES_ORIGIN: https://777genius.github.io/universal-agent-plugins-registry/
        working-directory: landing
        run: pnpm generate

      - name: Build public docs under /docs
        env:
          DOCS_BASE_PATH: /docs/
          DOCS_HOSTNAME: https://universal-agent-plugins.com
          GOCACHE: ${{ runner.temp }}/docs-consumer-gocache
          GOMODCACHE: ${{ runner.temp }}/docs-consumer-gomodcache
          DOCS_TOOLS_ROOT: ${{ runner.temp }}/docs-tools-root
          DOCS_GOMARKDOC: ${{ runner.temp }}/docs-tools-root/bin/gomarkdoc
          TMPDIR: ${{ runner.temp }}
          GOWORK: ${{ github.workspace }}/go.work
          GOPROXY: "off"
          GOSUMDB: "off"
          GOENV: "off"
          GOTOOLCHAIN: "local"
          GOMAXPROCS: "2"
        working-directory: website
        run: |
          export PATH="${{ steps.pnpm-docs.outputs.bin_dest }}:$PATH"
          pnpm run docs:build

      - name: Assemble GitHub Pages artifact
        env:
          UAP_VERIFIED_MIRROR: ${{ runner.temp }}/uap-registry-mirror
          NUXT_APP_BASE_URL: /
          NUXT_PUBLIC_SITE_URL: https://universal-agent-plugins.com
        working-directory: landing
        run: pnpm run build:pages

      - name: Require published npm CLI to cover advertised capabilities
        run: node --experimental-strip-types "$RUNNER_TEMP/production-site-control/check-published-capabilities.mjs" "$GITHUB_WORKSPACE"

      - name: Seal actual production source and signed-feed provenance
        run: python3 "$RUNNER_TEMP/production-site-control/production_site_source.py" seal "$GITHUB_WORKSPACE" "$RUNNER_TEMP/production-site-control"

      - uses: actions/configure-pages@v6

      # Only vetted .well-known AI discovery files and .nojekyll may be hidden (artifact gate).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ (github.event_name == 'push' || inputs.github_hosted) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Confirm requested deployment commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$EXPECTED_SHA" && "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "expected_sha does not match the deployment source commit" >&2
            exit 1
          fi

      # Pages can remain in backend file-sync after a successful 115 MB artifact build.
      # Leave a bounded completion window longer than deploy-pages' 10 minute default.
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1200000

      - name: Verify live SEO routes after deploy
        run: |
          set -euo pipefail
          site=https://universal-agent-plugins.com
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          for pair in \
            "/ root.html" \
            "/agent-skills/ skills.html" \
            "/plugins/ plugins.html" \
            "/logo-192.webp logo-192.webp" \
            "/showcase/agent-notifications.webp showcase.webp" \
            "/BUILD_PROVENANCE.json provenance.json" \
            "/llms.txt llms.txt" \
            "/.well-known/ai-catalog.json ai-catalog.json" \
            "/.well-known/ard.json ard.json" \
            "/sitemap.xml sitemap.xml"; do
            read -r route name <<< "$pair"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 \
              "$site$route" --output "$tmp/$name"
            test -s "$tmp/$name"
          done
          python3 - "$tmp" <<'PY'
          import json
          import os
          import sys
          from html.parser import HTMLParser
          from pathlib import Path
          from xml.etree import ElementTree

          root = Path(sys.argv[1])
          site = "https://universal-agent-plugins.com"

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.robots = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "link":
                      self.links.append(values)
                  elif tag == "meta" and values.get("name") == "robots":
                      self.robots.append(values.get("content", ""))

          for name, path in [("root.html", "/"), ("skills.html", "/agent-skills/")]:
              html = (root / name).read_text(encoding="utf-8")
              head = Links()
              head.feed(html)
              expected = site + path
              assert [tag.get("href") for tag in head.links if tag.get("rel") == "canonical"] == [expected], f"{path}: canonical"
              assert any(tag.get("hreflang") == "x-default" for tag in head.links), f"{path}: hreflang"
              assert all("noindex" not in value for value in head.robots), f"{path}: noindex"

          plugins = (root / "plugins.html").read_text(encoding="utf-8")
          assert 'data-count-scope="initial-reviewed-subset-not-full-directory"' in plugins
          assert "The static page starts with reviewed plugins." not in plugins
          assert "How standalone Skills work" not in plugins
          for name in ("logo-192.webp", "showcase.webp"):
              image = (root / name).read_bytes()
              assert image[:4] == b"RIFF" and image[8:12] == b"WEBP", f"{name}: not WebP"
          provenance = json.loads((root / "provenance.json").read_text(encoding="utf-8"))
          assert provenance.get("workflow_commit") == os.environ["GITHUB_SHA"], "deployed source differs from control commit"
          assert len(provenance.get("source_commit", "")) == 40, "missing accepted source identity"
          pinned = json.loads(Path("website/production-source.json").read_text(encoding="utf-8"))
          assert provenance.get("source_commit") == pinned["source_commit"], "live source commit differs from production pin"
          assert provenance.get("source_tree") == pinned["source_tree"], "live source tree differs from production pin"

          llms = (root / "llms.txt").read_text(encoding="utf-8")
          assert llms.startswith("# Universal Agent Plugins\n")
          assert "independent SKILL.md Skills" in llms
          catalog = json.loads((root / "ai-catalog.json").read_text(encoding="utf-8"))
          assert catalog == json.loads((root / "ard.json").read_text(encoding="utf-8"))
          assert catalog.get("specVersion") == "1.0" and len(catalog.get("entries", [])) >= 2
          locs = {loc.text for loc in ElementTree.parse(root / "sitemap.xml").getroot().findall(".//{*}loc")}
          assert site + "/" in locs and site + "/agent-skills/" in locs
          assert len(locs) >= 100, f"Unexpectedly small sitemap: {len(locs)}"
          print(f"Live Pages SEO acceptance passed: canonical/hreflang, catalogs, llms.txt, sitemap ({len(locs)} URLs).")
          PY
