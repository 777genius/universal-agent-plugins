name: Codex MCP env-name native secrecy spike

on:
  push:
    branches:
      - feat/codex-mcp-env-names-safe-20261110
    paths:
      - scripts/codex_env_names_native_spike.py
      - .github/workflows/codex-env-names-spike.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-linux-spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified official Codex 0.167.0 executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codex-native"
          curl -fSL --retry 3 --connect-timeout 15 --max-time 200 \
            https://github.com/openai/codex/releases/download/rust-v0.167.0/codex-x86_64-unknown-linux-musl.tar.gz \
            -o "$RUNNER_TEMP/codex-native/codex.tar.gz"
          printf '%s  %s\n' \
            '9d64836106d5b374e90ee4454c7ebcde7ca7106558bd7e41a34b9f26ebda251a' \
            "$RUNNER_TEMP/codex-native/codex.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/codex-native/codex.tar.gz" -C "$RUNNER_TEMP/codex-native"
          test -s "$RUNNER_TEMP/codex-native/codex-x86_64-unknown-linux-musl"
          chmod 0755 "$RUNNER_TEMP/codex-native/codex-x86_64-unknown-linux-musl"
          echo "CODEX_BINARY=$RUNNER_TEMP/codex-native/codex-x86_64-unknown-linux-musl" >> "$GITHUB_ENV"
      - name: Run genuine native Codex shell plus MCP canary / nonpersistence E2E
        shell: bash
        run: |
          python3 -m py_compile scripts/codex_env_names_native_spike.py
          python3 scripts/codex_env_names_native_spike.py "$CODEX_BINARY" "$RUNNER_TEMP/codex-env-spike-report.json"
      - name: Preserve only bounded, redacted proof (no native home or child output)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: codex-env-name-native-linux-synthetic-proof
          path: ${{ runner.temp }}/codex-env-spike-report.json
          if-no-files-found: warn
          retention-days: 7
