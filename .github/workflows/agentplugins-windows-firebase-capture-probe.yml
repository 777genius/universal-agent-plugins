name: Windows published Firebase native capture probe

on:
  pull_request:
    paths:
      - '.github/workflows/agentplugins-windows-firebase-capture-probe.yml'
      - 'scripts/live-install-audit.py'
      - 'scripts/test_live_install_audit_env.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firebase-claude:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Focused output capture regression
        shell: pwsh
        run: |
          python -m unittest scripts.test_live_install_audit_env.CrossPlatformPublishedProofRegressions.test_scoped_file_capture_reads_native_json_without_pipe_wait -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact published UAP 0.1.101 and genuine Claude 2.1.263
        shell: pwsh
        run: |
          npm.cmd install --global universal-agent-plugins@0.1.101
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd install --global '@anthropic-ai/claude-code@2.1.263'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $v = (agentplugins version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $v -ne 'agentplugins 0.1.101') { throw "Wrong UAP release" }
          claude --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Genuine pinned Firebase add, repeat, native attribution and remove
        shell: pwsh
        env:
          AUDIT_VENDOR_OUTCOME: success
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          @'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import shutil
          import tempfile

          source = Path('scripts/live-install-audit.py').resolve()
          spec = importlib.util.spec_from_file_location('published_firebase', source)
          audit = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(audit)
          doc = json.loads(Path('tests/live-install/fixtures.json').read_text(encoding='utf-8'))
          audit.validate_fixtures(doc)
          assert doc['plugin_aliases'][6] == 'firebase'
          cli = shutil.which('agentplugins.cmd')
          assert cli is not None
          report = Path(os.environ['RUNNER_TEMP']) / 'published-firebase-claude.json'
          # Reproduce the original long Windows TEMP profile, unlike the
          # shorter RUNNER_TEMP positive control from the previous run.
          with tempfile.TemporaryDirectory(prefix='uap-live-30x30-') as root:
              case_root_chars = len(str(Path(root) / 'plugin-06'))
              assert case_root_chars >= 65, 'Original Windows TEMP profile was not reproduced'
              row = audit.do_case(str(Path(cli).resolve()), 'claude', 'plugin', 'firebase',
                                  6, Path(root), doc['plugin_declared_names'],
                                  doc['signed_release_pins'])
              report.write_text(json.dumps({
                  'source_sha': os.environ.get('GITHUB_SHA'),
                  'published_cli': 'agentplugins 0.1.101',
                  'target': 'claude', 'kind': 'plugin', 'case_index': 6,
                  'temp_profile': 'original-windows-default', 'case_root_chars': case_root_chars,
                  'case': row
              }, indent=2) + '\n', encoding='utf-8')
              print(json.dumps({'status': row.get('status'),
                                'repeat_verified': row.get('repeat_verified'),
                                'removal_verified': row.get('removal_verified'),
                                'sentinels_preserved': row.get('sentinels_preserved')}))
              if (row.get('status') != 'passed'
                      or row.get('repeat_verified') is not True
                      or row.get('removal_verified') is not True
                      or row.get('sentinels_preserved') is not True
                      or row.get('native_residuals') != []):
                  raise SystemExit('Published Windows Firebase native lifecycle unqualified')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve exact-source evidence on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: published-firebase-claude
          path: ${{ runner.temp }}/published-firebase-claude.json
          if-no-files-found: warn
          retention-days: 7
