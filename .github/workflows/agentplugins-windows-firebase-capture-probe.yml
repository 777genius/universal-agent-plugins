name: Windows published Firebase native capture probe

on:
  # Legacy published UAP 0.1.101 diagnostic only. Current-source
  # Firebase PR acceptance is separate (#990) and must survive integration.
  workflow_dispatch:

# Independent manual diagnostics must never cancel one another.
concurrency:
  group: firebase-capture-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  firebase-claude:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Focused output capture regression
        shell: pwsh
        run: |
          python -m unittest scripts.test_live_install_audit_env.CrossPlatformPublishedProofRegressions.test_scoped_file_capture_reads_native_json_without_pipe_wait -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest scripts.test_windows_firebase_probe -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact published UAP 0.1.101 and genuine Claude 2.1.263
        shell: pwsh
        run: |
          npm.cmd install --global universal-agent-plugins@0.1.101
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd install --global '@anthropic-ai/claude-code@2.1.263'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $v = (agentplugins version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $v -ne 'agentplugins 0.1.101') { throw "Wrong UAP release" }
          claude --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Genuine pinned Firebase add, repeat, native attribution and remove
        shell: pwsh
        env:
          AUDIT_VENDOR_OUTCOME: success
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/windows_firebase_capture_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve exact-source evidence on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: published-firebase-claude
          path: |
            ${{ runner.temp }}/published-firebase-claude.json
            ${{ runner.temp }}/published-firebase-process-family.json
          if-no-files-found: warn
          retention-days: 7
