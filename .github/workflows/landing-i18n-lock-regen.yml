# Temporary branch-only migration tool. Remove after committing the generated lockfile.
name: Nuxt i18n 10 lock refresh

on:
  push:
    branches:
      - fix/nuxt-i18n10-landing-20261031
    paths:
      - landing/package.json
      - landing/pnpm-workspace.yaml
      - .github/workflows/landing-i18n-lock-regen.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          package_json_file: landing/package.json
          dest: ${{ runner.temp }}/pnpm-i18n-migration

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.1'
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      # No lifecycle scripts run while resolving untrusted npm metadata.
      - name: Resolve real npm graph and prove frozen install
        working-directory: landing
        run: |
          pnpm --version
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify only the lockfile changed
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'landing/pnpm-lock.yaml'
          git diff --check
          grep -q '10.6.0' landing/pnpm-lock.yaml
          grep -q '11.4.14' landing/pnpm-lock.yaml
          # Reject a split module pin: the Nuxt i18n snapshot must use
          # the exact targeted Intlify patch and Vue I18n 11.4.14.
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const lock = fs.readFileSync('landing/pnpm-lock.yaml', 'utf8');
          // pnpm 12 includes a bootstrap tool lock as the first YAML document.
          const snapshots = lock.split('\nsnapshots:\n').at(-1);
          if (!snapshots) throw Error('pnpm snapshots section missing');
          const snapshot = snapshots.match(/^  '@nuxtjs\/i18n@10\.6\.0[^\n]*\n(?:    [^\n]*\n|      [^\n]*\n)+/m)?.[0];
          if (!snapshot) throw Error('Nuxt i18n snapshot missing');
          for (const line of [
            "'@intlify/core': 11.4.14",
            "'@intlify/message-compiler': 11.4.14",
            "'@intlify/shared': 11.4.14",
            'vue-i18n: 11.4.14('
          ]) {
            if (!snapshot.includes(line)) throw Error('Nuxt i18n incompatible runtime dependency: ' + line);
          }
          NODE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: nuxt-i18n10-validated-pnpm-lock
          path: landing/pnpm-lock.yaml
          retention-days: 7

      # Push only the byte-exact resolver output to this dedicated branch.
      # This workflow is push-only and never executes in pull_request_target.
      - name: Commit resolved lockfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- landing/pnpm-lock.yaml
          git commit -m 'chore(landing): generate v10 pnpm 12 frozen lockfile'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/fix/nuxt-i18n10-landing-20261031
