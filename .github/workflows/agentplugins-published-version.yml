name: Resolve published UAP stable version

on:
  workflow_call:
    inputs:
      version:
        description: Exact public release version, or empty for latest stable
        type: string
        required: false
        default: ''
      require_trusted_publish:
        description: Verify the triggering run actually published and qualified npm bytes
        type: boolean
        required: false
        default: false
    outputs:
      version:
        description: Verified exact npm/GitHub stable release version
        value: ${{ jobs.resolve.outputs.version }}

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    name: Verify matching public release and published npm version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Bind exactly one public stable version
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUIRE_TRUSTED_PUBLISH: ${{ inputs.require_trusted_publish }}
          PUBLISH_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          PUBLISH_HEAD_REF: ${{ github.event.workflow_run.head_branch || '' }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_VERSION:-}"
          # A successful prepare-only workflow is NOT a published npm release.
          # The complete run must contain successful publish and verify-public jobs,
          # and the tested version is bound to that run's immutable release tag.
          if [[ "${REQUIRE_TRUSTED_PUBLISH}" == "true" && "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            [[ -z "$requested" && "${PUBLISH_RUN_ID}" =~ ^[0-9]+$ && "${PUBLISH_HEAD_REF}" =~ ^agentplugins-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::Trusted publisher identity missing or ambiguous" >&2
              exit 2
            }
            jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PUBLISH_RUN_ID}/jobs?per_page=100")"
            if ! jq -e '
              ([.jobs[] | select(.name == "Publish npm package with trusted provenance" and .conclusion == "success")] | length) == 1
              and ([.jobs[] | select(.name == "Verify public npm provenance and lifecycle" and .conclusion == "success")] | length) == 1
            ' <<< "$jobs" >/dev/null; then
              echo "::error::Triggering workflow did not complete trusted npm publish AND public verification" >&2
              exit 2
            fi
            requested="${PUBLISH_HEAD_REF#agentplugins-v}"
          fi
          if [[ -n "$requested" && ! "$requested" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only an exact stable version is allowed" >&2
            exit 1
          fi
          if [[ -z "$requested" ]]; then
            tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          else
            tag="agentplugins-v$requested"
          fi
          [[ "$tag" =~ ^agentplugins-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Public release tag '$tag' is not an agentplugins stable tag" >&2
            exit 2
          }
          visibility="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq 'if .draft == false and .prerelease == false then "public" else "private" end')"
          [[ "$visibility" == "public" ]] || { echo "::error::Release is not public stable" >&2; exit 2; }
          version="${tag#agentplugins-v}"
          # npm publication and CDN metadata may lag GitHub Actions by seconds.
          # Bound retries; a mismatch is NEVER treated as a qualified release.
          published=""
          current=""
          for attempt in 1 2 3 4 5 6; do
            published="$(npm view "universal-agent-plugins@$version" version 2>/dev/null || true)"
            if [[ -n "$requested" ]]; then
              [[ "$published" == "$version" ]] && break
            else
              current="$(npm view universal-agent-plugins dist-tags.latest 2>/dev/null || true)"
              [[ "$published" == "$version" && "$current" == "$version" ]] && break
            fi
            if [[ "$attempt" != 6 ]]; then sleep 10; fi
          done
          [[ "$published" == "$version" ]] || {
            echo "::error::Published npm package '$version' missing or stale (got '$published')" >&2
            exit 2
          }
          if [[ -z "$requested" && "$current" != "$version" ]]; then
            echo "::error::npm latest '$current' differs from public release '$version'" >&2
            exit 2
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          echo "Qualified UAP npm @$version / $tag"
