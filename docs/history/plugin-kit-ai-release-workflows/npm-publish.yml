name: NPM Publish

on:
  workflow_run:
    workflows: ["Release Assets"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published stable tag to publish to npm"
        required: true

jobs:
  publish-npm:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && vars.NPM_PUBLISH_READY == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22.21.1"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm CLI with trusted publishing support
        shell: bash
        run: |
          npm install -g 'npm@^11.5.1'
          node --version
          npm --version

      - name: Resolve stable tag
        id: release
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
            if [[ ! "${tag}" =~ ^(plugin-kit-ai-)?v ]]; then
              tag="plugin-kit-ai-v${tag}"
            fi
          else
            git fetch --force --tags origin
            mapfile -t tags < <(git tag --points-at HEAD --list 'plugin-kit-ai-v*')
            if [ "${#tags[@]}" -eq 0 ]; then mapfile -t tags < <(git tag --points-at HEAD --list 'v*'); fi
            if [ "${#tags[@]}" -ne 1 ]; then
              echo "Expected exactly one plugin-kit-ai tag at $(git rev-parse HEAD), found ${#tags[@]}." >&2
              exit 1
            fi
            tag="${tags[0]}"
          fi
          if [[ ! "${tag}" =~ ^(plugin-kit-ai-)?v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid plugin-kit-ai release tag: ${tag}" >&2
            exit 1
          fi
          version="${tag#plugin-kit-ai-v}"
          if [ "${version}" = "${tag}" ]; then version="${tag#v}"; fi
          if [ "${version%%.*}" -ge 2 ]; then
            echo "Major 2+ requires the protected paired authoring publisher." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Configure npm publish authentication
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PUBLISH_AUTH: ${{ vars.NPM_PUBLISH_AUTH }}
        run: |
          auth="${NPM_PUBLISH_AUTH:-trusted}"
          case "${auth}" in
            trusted)
              echo "Using npm trusted publishing through GitHub OIDC."
              ;;
            token)
              if [ -z "${NPM_TOKEN:-}" ]; then
                echo "NPM_TOKEN is required when NPM_PUBLISH_AUTH=token." >&2
                exit 1
              fi
              printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "${HOME}/.npmrc"
              echo "Using npm token authentication from GitHub Actions secret."
              ;;
            *)
              echo "Unsupported NPM_PUBLISH_AUTH=${auth}; use trusted or token." >&2
              exit 1
              ;;
          esac

      - name: Validate published release assets
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          tag="${TAG}"
          version="${tag#plugin-kit-ai-v}"
          if [ "${version}" = "${tag}" ]; then version="${tag#v}"; fi
          base="https://github.com/777genius/plugin-kit-ai/releases/download/${tag}"
          curl -fsSL "${base}/checksums.txt" -o checksums.txt
          for asset in \
            "plugin-kit-ai_${version}_darwin_amd64.tar.gz" \
            "plugin-kit-ai_${version}_darwin_arm64.tar.gz" \
            "plugin-kit-ai_${version}_linux_amd64.tar.gz" \
            "plugin-kit-ai_${version}_linux_arm64.tar.gz" \
            "plugin-kit-ai_${version}_windows_amd64.tar.gz" \
            "plugin-kit-ai_${version}_windows_arm64.tar.gz"
          do
            grep -q " ${asset}\$" checksums.txt || {
              echo "checksums.txt missing ${asset}" >&2
              exit 1
            }
          done

      - name: Stage npm package
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${TAG#plugin-kit-ai-v}"
          if [ "${version}" = "${TAG}" ]; then version="${TAG#v}"; fi
          stage="${RUNNER_TEMP}/plugin-kit-ai-npm"
          rm -rf "${stage}"
          mkdir -p "${stage}"
          cp -R npm/plugin-kit-ai/. "${stage}/"
          node -e 'const fs=require("fs"); const file=process.argv[1]; const version=process.argv[2]; const pkg=JSON.parse(fs.readFileSync(file,"utf8")); pkg.version=version; fs.writeFileSync(file, JSON.stringify(pkg, null, 2)+"\n");' "${stage}/package.json" "${version}"
          cat "${stage}/package.json"

      - name: Publish npm package
        shell: bash
        working-directory: ${{ runner.temp }}/plugin-kit-ai-npm
        run: npm publish --access public
