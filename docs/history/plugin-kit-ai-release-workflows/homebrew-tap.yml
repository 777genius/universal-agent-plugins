name: Homebrew Tap

on:
  workflow_run:
    workflows: ["Release Assets"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published stable tag to sync into the Homebrew tap"
        required: true

jobs:
  update-homebrew-tap:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
          cache: false

      - name: Resolve stable tag
        id: release
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
            if [[ ! "${tag}" =~ ^(plugin-kit-ai-)?v ]]; then
              tag="plugin-kit-ai-v${tag}"
            fi
          else
            git fetch --force --tags origin
            mapfile -t tags < <(git tag --points-at HEAD --list 'plugin-kit-ai-v*')
            if [ "${#tags[@]}" -eq 0 ]; then mapfile -t tags < <(git tag --points-at HEAD --list 'v*'); fi
            if [ "${#tags[@]}" -ne 1 ]; then
              echo "Expected exactly one plugin-kit-ai tag at $(git rev-parse HEAD), found ${#tags[@]}." >&2
              exit 1
            fi
            tag="${tags[0]}"
          fi
          if [[ ! "${tag}" =~ ^(plugin-kit-ai-)?v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid plugin-kit-ai release tag: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Check tap token
        shell: bash
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN is required to update 777genius/homebrew-plugin-kit-ai." >&2
            echo "Manual fallback: TAG=${TAG} HOMEBREW_TAP_TOKEN=<token> ./scripts/update-homebrew-tap.sh" >&2
            exit 1
          fi
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}

      - name: Update Homebrew tap
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ./scripts/update-homebrew-tap.sh
