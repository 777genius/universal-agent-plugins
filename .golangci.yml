version: "2"

run:
  timeout: 6m
  tests: true
  # Paths in exclusions are matched from the git root: the linter runs once per
  # module (".", "cli/plugin-kit-ai", "install/integrationctl") and without this
  # the same file would need a different pattern in every module.
  relative-path-mode: gitroot

linters:
  default: none
  enable:
    # correctness
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errorlint
    - nilerr
    - bodyclose
    - noctx
    - copyloopvar
    - intrange
    - wastedassign
    - unconvert
    - unparam
    - prealloc
    - gosec
    - nolintlint
    # style
    - gocritic
    - misspell
    - revive
    # size / complexity / duplication (size gate)
    - funlen
    - gocyclo
    - gocognit
    - dupl
    # architecture
    - depguard
  settings:
    revive:
      rules:
        # The maximum key is `max`, NOT `maxLines`. revive normalizes argument
        # names as ToLower(ReplaceAll(name, "-", "")), so `maxLines`/`max-lines`
        # normalize to `maxlines`, never match `max`, and the limit is silently
        # skipped.
        - name: file-length-limit
          arguments: [{ max: 500, skipComments: true, skipBlankLines: true }]
        # Only rules with zero or cheap legacy noise, so revive can run in
        # full-file mode together with the size gate.
        - name: var-naming
        - name: receiver-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: unreachable-code
        - name: superfluous-else
        - name: indent-error-flow
        - name: context-as-argument
        - name: redundant-import-alias
        # `exported` (godoc on every export) is deliberately off: the project
        # does not document that way and the rule would be pure noise.
        # `unused-parameter` is off too: the first full run produced 172 hits,
        # almost all of them interface implementations and test seams that must
        # keep the parameter name for readability.
    funlen:
      lines: 60
      statements: 40
      ignore-comments: true
    gocyclo:
      min-complexity: 20
    gocognit:
      min-complexity: 25
    dupl:
      # 120 tokens. Lowering it does not buy the duplicate `*NativeComponents`
      # predicates: they stay undetected even at 70, so DRY there is enforced by
      # review and by the dedup parts of the refactor, not by dupl.
      threshold: 120
    gocritic:
      enabled-tags: [diagnostic, style]
      # Measured on the first full run (799 findings before exclusions). The six
      # checks below account for 699 of them and each is a style preference this
      # codebase deliberately does not share.
      disabled-checks:
        - octalLiteral # file modes are written as 0o644/0755 on purpose
        - unnamedResult # multi-result helpers read fine unnamed here
        - paramTypeCombine # signatures are kept one-type-per-parameter for diffability
        - sloppyReassign # `if err = f(); err != nil` is used consistently
        - filepathJoin # "plugin/plugin.yaml" as a single Join argument is intentional
        - ifElseChain # explicit if/else ladders over client ids are intentional
    gosec:
      # Measured: 273 findings before exclusions, 266 of them in the six rules
      # below. The remainder (G103, G118, G404, G703) stays enabled on purpose.
      excludes:
        - G104 # unhandled errors - already covered by errcheck, duplicate reports
        - G204 # launching client CLIs with computed args is the product
        - G301 # 0o755 for created directories is intentional
        - G302
        - G304 # reading/writing files by computed path is the product; pathpolicy provides containment
        - G306 # 0o644 for generated config files is intentional
    misspell:
      locale: US
    errorlint:
      errorf: true
    depguard:
      rules:
        domain-stdlib-only: # already satisfied today - locked in by Part 0a
          files: ["**/install/integrationctl/agentplugins/domain/**", "!$test"]
          allow: ["$gostd"]
        ports-only-domain: # already satisfied today - locked in by Part 0a
          files: ["**/install/integrationctl/agentplugins/ports/**"]
          allow:
            - "$gostd"
            - "github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/domain"
            # DELIBERATE EXCEPTION. install/integrationctl/ports holds Command and
            # CommandResult: plain data types with no behavior and no I/O, already
            # the basis of providers.CommandRunner (activator.go) and
            # treeCommandRunner (native_identity.go). Their runtime implementation
            # (adapters/process.OS) stays an adapter and never lands here.
            # Duplicating the types into domain would create two sources of truth
            # and a conversion on every call. See docs/ARCHITECTURE.md.
            - "github.com/777genius/plugin-kit-ai/install/integrationctl/ports"
        usecase-through-ports: # deny list grows as violations are removed
          files: ["**/install/integrationctl/agentplugins/usecase/**", "!$test"]
          deny:
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/adapters
              desc: usecase depends on ports, not adapters
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/providers
              desc: usecase depends on ports, not providers
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/clients
              desc: usecase never sees client adapters
  exclusions:
    generated: lax
    paths:
      - "docs/generated"
      - ".*_gen\\.go$"
      - "website/"
    rules:
      - path: _test\.go
        linters: [funlen, gocyclo, gocognit, dupl, gosec]
      - path: _test\.go
        linters: [revive]
        text: "file length is"
      # BEGIN LEGACY SIZE BASELINE (shrink-only; scripts/check-lint-baseline.sh)
      # Generated by the first full-file run of the size gate on golangci-lint v2.13.2.
      # A file leaves this block in the refactor part that splits it. Entries are never
      # added by hand: check-lint-baseline.sh fails the build if the block grows.
      #
      # Size and complexity of legacy files (163 files).
      - path: ^cli/plugin-kit-ai/cmd/agentplugins/bootstrapgen/main\.go$
        linters: [revive, funlen, gocyclo, gocognit, dupl]
