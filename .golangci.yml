formatters:
  # gofumpt is deliberately absent: it would reformat many untouched files.
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/777genius/plugin-kit-ai]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # gocognit and gocyclo both report on the function declaration line, and the
  # default one-issue-per-line collapse hides the second one. That would make the
  # baseline look complete while exempting a file from gocognit silently
  # un-hides its gocyclo finding on the next run.
  uniq-by-line: false
