version: "2"

run:
  timeout: 6m
  tests: true
  # Paths in exclusions are matched from the git root: the linter runs once per
  # module (".", "cli/plugin-kit-ai", "install/integrationctl") and without this
  # the same file would need a different pattern in every module.
  relative-path-mode: gitroot

linters:
  default: none
  enable:
    # correctness
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errorlint
    - nilerr
    - bodyclose
    - noctx
    - copyloopvar
    - intrange
    - wastedassign
    - unconvert
    - unparam
    - prealloc
    - gosec
    - nolintlint
    # style
    - gocritic
    - misspell
    - revive
    # size / complexity / duplication (size gate)
    - funlen
    - gocyclo
    - gocognit
    - dupl
    # architecture
    - depguard
  settings:
    revive:
      rules:
        # The maximum key is `max`, NOT `maxLines`. revive normalizes argument
        # names as ToLower(ReplaceAll(name, "-", "")), so `maxLines`/`max-lines`
        # normalize to `maxlines`, never match `max`, and the limit is silently
        # skipped.
        - name: file-length-limit
          arguments: [{ max: 500, skipComments: true, skipBlankLines: true }]
        # Only rules with zero or cheap legacy noise, so revive can run in
        # full-file mode together with the size gate.
        - name: var-naming
        - name: receiver-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: unreachable-code
        - name: superfluous-else
        - name: indent-error-flow
        - name: context-as-argument
        - name: redundant-import-alias
        # `exported` (godoc on every export) is deliberately off: the project
        # does not document that way and the rule would be pure noise.
        # `unused-parameter` is off too: the first full run produced 172 hits,
        # almost all of them interface implementations and test seams that must
        # keep the parameter name for readability.
    funlen:
      lines: 60
      statements: 40
      ignore-comments: true
    gocyclo:
      min-complexity: 20
    gocognit:
      min-complexity: 25
    dupl:
      # 120 tokens. Lowering it does not buy the duplicate `*NativeComponents`
      # predicates: they stay undetected even at 70, so DRY there is enforced by
      # review and by the dedup parts of the refactor, not by dupl.
      threshold: 120
    gocritic:
      enabled-tags: [diagnostic, style]
      # Measured on the first full run (846 findings before exclusions, 100
      # after). The six checks below account for 746 of them and each is a style
      # preference this codebase deliberately does not share.
      disabled-checks:
        - octalLiteral # file modes are written as 0o644/0755 on purpose
        - unnamedResult # multi-result helpers read fine unnamed here
        - paramTypeCombine # signatures are kept one-type-per-parameter for diffability
        - sloppyReassign # `if err = f(); err != nil` is used consistently
        - filepathJoin # "plugin/plugin.yaml" as a single Join argument is intentional
        - ifElseChain # explicit if/else ladders over client ids are intentional
    gosec:
      # Measured: 285 findings before exclusions, 263 of them in the six rules
      # below. The remaining 22 stay enabled on purpose: G122 (8), G115 (4),
      # G103 (4), G703 (3), G118, G404, G702.
      excludes:
        - G104 # unhandled errors - already covered by errcheck, duplicate reports
        - G204 # launching client CLIs with computed args is the product
        - G301 # 0o755 for created directories is intentional
        - G302
        - G304 # reading/writing files by computed path is the product; pathpolicy provides containment
        - G306 # 0o644 for generated config files is intentional
    misspell:
      locale: US
    errorlint:
      errorf: true
    nolintlint:
      # The tree currently has no //nolint directives, so this costs nothing and
      # keeps CONTRIBUTING.md honest: a suppression has to name its linter and
      # say why.
      require-explanation: true
      require-specific: true
    depguard:
      rules:
        domain-stdlib-only: # already satisfied today - locked in by Part 0a
          files: ["**/install/integrationctl/agentplugins/domain/**", "!$test"]
          allow: ["$gostd"]
        ports-only-domain: # already satisfied today - locked in by Part 0a
          files: ["**/install/integrationctl/agentplugins/ports/**"]
          allow:
            - "$gostd"
            - "github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/domain"
            # ports/contracttest holds the executable port contracts, so it has
            # to name the interfaces it verifies. The rule still covers it: it
            # may not reach for an adapter or a use case.
            - "github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/ports"
            # DELIBERATE EXCEPTION. install/integrationctl/ports holds Command and
            # CommandResult: plain data types with no behavior and no I/O, already
            # the basis of providers.CommandRunner (activator.go) and
            # treeCommandRunner (native_identity.go). Their runtime implementation
            # (adapters/process.OS) stays an adapter and never lands here.
            # Duplicating the types into domain would create two sources of truth
            # and a conversion on every call. See docs/ARCHITECTURE.md.
            - "github.com/777genius/plugin-kit-ai/install/integrationctl/ports"
        usecase-through-ports: # deny list grows as violations are removed
          files: ["**/install/integrationctl/agentplugins/usecase/**", "!$test"]
          # Deny list, not allow list: adding an `allow` key here would turn the
          # rule into a whitelist and reject every import not named in it,
          # including the standard library. agentplugins/pathcontract is a
          # legitimate use case dependency and stays permitted because no deny
          # prefix covers it.
          deny:
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/adapters
              desc: usecase reaches the path policy through ports.PathPolicy, not the adapter
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/adapters
              desc: usecase depends on ports, not adapters
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/planner
              desc: usecase plans through ports.DeliveryPlanner, not the planner package
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/providers
              desc: usecase depends on ports, not providers
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/clients
              desc: usecase never sees client adapters
        clients-no-upward:
          # The client contract and its adapters are the extension point: they
          # are depended upon, never depend back. Tests are covered too - a test
          # that reaches for the planner would make the package impossible to
          # build standalone just as surely as production code would.
          files: ["**/install/integrationctl/agentplugins/clients/**"]
          deny:
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/providers
              desc: providers dispatches into clients, never the other way round
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/planner
              desc: planning reaches clients through clients.PlanRefiner, so a client never imports the planner
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/usecase
              desc: the use case sits above the ports; a client adapter is below them
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/adapters/clientdetect
              desc: detection calls clients.HostDetector, so a client never imports the detector
        clients-no-concrete-clients:
          # The contract, its shared helpers and every client package are peers:
          # none of them may reach for another client or for the assembled
          # registry. Without this, the first shared helper a client package
          # needs would invert the dependency and close an import cycle.
          # clients/all is the one place that names them all, so it is excluded.
          # These packages arrive in Parts 3-5; the rule is declared now so the
          # parts that create them cannot get this wrong.
          files:
            - "**/install/integrationctl/agentplugins/clients/**"
            - "!**/install/integrationctl/agentplugins/clients/all/**"
          deny:
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/clients/all
              desc: the default registry is assembled in the composition root, never inside a helper
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/clients/claude
              desc: shared helpers are used by client packages and never use one
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/clients/codex
              desc: shared helpers are used by client packages and never use one
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/clients/chatgpt
              desc: shared helpers are used by client packages and never use one
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/clients/copilot
              desc: shared helpers are used by client packages and never use one
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/clients/cursor
              desc: shared helpers are used by client packages and never use one
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/clients/kiro
              desc: shared helpers are used by client packages and never use one
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/clients/gemini
              desc: shared helpers are used by client packages and never use one
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/clients/opencode
              desc: shared helpers are used by client packages and never use one
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/clients/cline
              desc: shared helpers are used by client packages and never use one
            - pkg: github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins/clients/windsurf
              desc: shared helpers are used by client packages and never use one
  exclusions:
    generated: lax
    paths:
      - "docs/generated"
      - ".*_gen\\.go$"
      - "website/"
    rules:
      - path: _test\.go
        linters: [funlen, gocyclo, gocognit, dupl, gosec]
      - path: _test\.go
        linters: [revive]
        text: "file length is"
      # BEGIN LEGACY SIZE BASELINE (shrink-only; scripts/check-lint-baseline.sh)
      # Generated from the first full-file run of the size gate on golangci-lint
      # v2.13.2. Each entry names only the linters and the message shapes that file
      # actually trips, so a file exempt from gocognit is still checked by funlen,
      # gocyclo, dupl and revive.
      #
      # A file leaves this block in the refactor part that splits it. Entries are
      # never added by hand: check-lint-baseline.sh fails the build if the block
      # grows or if an existing entry is widened.
      #
      # REGENERATING: run the size gate under GOOS=linux and GOOS=windows in
      # addition to the native OS. golangci-lint only analyses files whose build
      # tags match the target, so a run on one OS silently omits every *_linux.go
      # and *_windows.go file. The first generation happened on macOS and missed
      # six of them; CI lints on ubuntu and went red on the linux one.
      # 176 files.
      - path: ^cli/plugin-kit-ai/cmd/agentplugins/bootstrapgen/main\.go$
        linters: [funlen, gocyclo, gocognit]
        text: 'too many statements|cyclomatic complexity|cognitive complexity'
      - path: ^cli/plugin-kit-ai/cmd/agentplugins/main\.go$
