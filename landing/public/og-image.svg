<title id="og-title">Universal Agent Plugins: one plugin, all your agents</title>
<desc id="og-desc">Install and manage Agent Plugins 1.0, Agent Skills, and MCP tools with one CLI. Supported agents: Codex, ChatGPT, Cursor, GitHub Copilot CLI, Kiro, Claude Code, Gemini CLI, OpenCode, Cline, Windsurf, Grok Build, Kimi Code, Qoder, Hermes Agent, Google Antigravity, Pi.</desc>
